<style>

<script>
// ================= I18N (shared by Lost Aura Games titles) =================

// Missing translations fall back to English and are logged once (console.info + I18N_MISS) so tests can catch them.
const LAG_LANGS=[['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português'],['it','Italiano']];
const LAG_LANG_KEY='lag.lang';
const LAG_LANG_CODES=LAG_LANGS.map(l=>l[0]);
function lagDetectLang(){let v=null;try{v=localStorage.getItem(LAG_LANG_KEY);}catch(e){}if(v&&LAG_LANG_CODES.includes(v))return v;
 const navs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(const n of navs){const c=String(n||'').toLowerCase().slice(0,2);if(LAG_LANG_CODES.includes(c))return c;}return'en';}
let LANG=lagDetectLang();
const I18N={};for(const c of LAG_LANG_CODES)I18N[c]={};
const I18N_MISS=new Set();
// rows: [english, es, fr, de, pt, it]
function i18nRows(rows){for(const r of rows){for(let i=1;i<LAG_LANG_CODES.length;i++){if(r[i]!=null)I18N[LAG_LANG_CODES[i]][r[0]]=r[i];}}}
function t(key,vars){let s=key;if(LANG!=='en'){const d=I18N[LANG];if(d&&Object.prototype.hasOwnProperty.call(d,key))s=d[key];else if(!I18N_MISS.has(LANG+'|'+key)){I18N_MISS.add(LANG+'|'+key);try{console.info('[i18n] missing '+LANG+': '+key);}catch(e){}}}
 if(vars)s=String(s).replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);return s;}
const I18N_HOOKS=[];
function langName(c){const l=LAG_LANGS.find(x=>x[0]===c);return l?l[1]:c;}
function setLang(c,fromStorage){if(!LAG_LANG_CODES.includes(c))return;const changed=c!==LANG;LANG=c;try{document.documentElement.lang=c;}catch(e){}
 if(!fromStorage){try{localStorage.setItem(LAG_LANG_KEY,c);}catch(e){}}
 if(changed)for(const f of I18N_HOOKS){try{f(c);}catch(e){console.error(e);}}}
addEventListener('storage',e=>{if(e.key===LAG_LANG_KEY&&e.newValue&&e.newValue!==LANG)setLang(e.newValue,true);});
try{document.documentElement.lang=LANG;}catch(e){}
// Accented capitals for 5x7 bitmap fonts. Accented glyphs have 9 rows: row 0 is drawn one pixel row ABOVE the
// normal cell, rows 1..7 are the normal 7 rows, row 8 is one row below (for the cedilla).
function i18nFontExt(F){const sq=(g,drop)=>g.filter((_,i)=>i!==drop);
 const AC={acute:[2,4],grave:[8,4],circ:[4,10],tilde:[13,22],uml:[10,0],ring:[4,10]};
 const mk=(base,acc,drop)=>{const g=F[base];if(!g)return;const s=sq(g,drop==null?2:drop);return[AC[acc][0],AC[acc][1],...s,0];};
 const map={'Á':['A','acute'],'À':['A','grave'],'Â':['A','circ'],'Ã':['A','tilde'],'Ä':['A','uml'],'É':['E','acute'],'È':['E','grave'],'Ê':['E','circ'],'Ë':['E','uml'],
  'Í':['I','acute'],'Ì':['I','grave'],'Î':['I','circ'],'Ï':['I','uml'],'Ó':['O','acute'],'Ò':['O','grave'],'Ô':['O','circ'],'Õ':['O','tilde'],'Ö':['O','uml'],
  'Ú':['U','acute'],'Ù':['U','grave'],'Û':['U','circ'],'Ü':['U','uml'],'Ñ':['N','tilde',1]};
 for(const k in map){if(F[k])continue;const v=map[k];const g=mk(v[0],v[1],v[2]);if(g)F[k]=g;}
 if(!F['Ç']&&F.C)F['Ç']=[0,...F.C,4];
 if(!F['¿'])F['¿']=[4,0,4,8,16,17,14];if(!F['¡'])F['¡']=[4,0,4,4,4,4,4];
 if(!F[','])F[',']=[0,0,0,0,0,4,8];if(!F['/'])F['/']=[1,1,2,4,8,16,16];if(!F['('])F['(']=[2,4,8,8,8,4,2];if(!F[')'])F[')']=[8,4,2,2,2,4,8];
 if(!F['%'])F['%']=[24,25,2,4,8,19,3];if(!F['+'])F['+']=[0,4,4,31,4,4,0];if(!F['"'])F['"']=[10,10,0,0,0,0,0];if(!F['«'])F['«']=[0,5,10,20,10,5,0];if(!F['»'])F['»']=[0,20,10,5,10,20,0];
 if(!F['Œ']&&F.O)F['Œ']=[15,20,20,23,20,20,15];return F;}
// glyph row helper for font renderers: returns [rows, yOffset]
function glyphRows(g){return g&&g.length===9?[g,-1]:[g,0];}
// Upper-case for the pixel fonts: keep ß as SS (toUpperCase does that) and fold anything unknown to its base letter.
function pixUpper(s,F){s=String(s).toUpperCase();if(!F)return s;let o='';for(const ch of s){if(F[ch]){o+=ch;continue;}const b=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');o+=F[b]?b:ch;}return o;}
// tiny pixel globe icon (12x12, scaled) for the language buttons

 const R=['....####....','..##.#..##..','.#..#..#..#.','.#..#..#..#.','############','#...#..#...#','#...#..#...#','############','.#..#..#..#.','.#..#..#..#.','..##.#..##..','....####....'];
 for(let j=0;j<12;j++)for(let i=0;i<12;i++)if(R[j][i]==='#')x.fillRect(i*px,j*px,px,px);c.style.verticalAlign='middle';return c;}

["Weather. Frog +2 attack. Frog becomes Wet every turn. Ends Drought.", "Clima. Rana +2 de ataque. La rana queda Mojada cada turno. Termina la Sequía.", "Météo. Grenouille +2 d'attaque. Elle devient Mouillée à chaque tour. Met fin à la Sécheresse.", "Wetter. Frosch +2 Angriff. Der Frosch wird jede Runde Nass. Beendet Dürre.", "Clima. Sapo +2 de ataque. O sapo fica Molhado todo turno. Encerra a Seca.", "Meteo. Rana +2 attacco. La rana diventa Bagnata ogni turno. Termina la Siccità."],
["Weather. Frog -2 attack, loses 3 HP and becomes Dry every turn. Fire +50%. Ends Rain/Snow.", "Clima. Rana -2 de ataque, pierde 3 PV y queda Seca cada turno. Fuego +50%. Termina Lluvia/Nieve.", "Météo. Grenouille -2 d'attaque, perd 3 PV et devient Sèche à chaque tour. Feu +50 %. Met fin à Pluie/Neige.", "Wetter. Frosch -2 Angriff, verliert jede Runde 3 LP und wird Trocken. Feuer +50%. Beendet Regen/Schnee.", "Clima. Sapo -2 de ataque, perde 3 PV e fica Seco todo turno. Fogo +50%. Encerra Chuva/Neve.", "Meteo. Rana -2 attacco, perde 3 PV e diventa Secca ogni turno. Fuoco +50%. Termina Pioggia/Neve."],
["Weather. Frog is Slowed every turn. Frost on a Wet frog Freezes it (Stun).", "Clima. La rana queda Lenta cada turno. La Escarcha sobre una rana Mojada la Congela (Aturdir).", "Météo. La grenouille est Ralentie à chaque tour. Le Givre sur une grenouille Mouillée la Gèle (Étourdie).", "Wetter. Der Frosch wird jede Runde Verlangsamt. Frost auf nassem Frosch friert ihn ein (Betäubung).", "Clima. O sapo fica Lento todo turno. Gelo num sapo Molhado o Congela (Atordoa).", "Meteo. La rana è Rallentata ogni turno. Il Gelo su una rana Bagnata la Congela (Stordita)."],
["All attacks - yours AND the frog's - have a 35% chance to miss.", "Todos los ataques, los tuyos Y los de la rana, tienen un 35% de fallar.", "Toutes les attaques, les tiennes ET celles de la grenouille, ont 35 % de chances de rater.", "Alle Angriffe – deine UND die des Froschs – verfehlen zu 35%.", "Todos os ataques, os seus E os do sapo, têm 35% de chance de errar.", "Tutti gli attacchi, i tuoi E quelli della rana, hanno il 35% di mancare."],
["Boring Lecture, Tickle and Wisp effects grow stronger. Frog regenerates 1 HP per turn.", "Charla aburrida, Cosquillas y Fuego fatuo se potencian. La rana regenera 1 PV por turno.", "Cours soporifique, Chatouilles et Feu follet sont renforcés. La grenouille régénère 1 PV par tour.", "Langweiliger Vortrag, Kitzeln und Irrlicht werden stärker. Der Frosch regeneriert 1 LP pro Runde.", "Palestra chata, Cócegas e Fogo-fátuo ficam mais fortes. O sapo regenera 1 PV por turno.", "Lezione noiosa, Solletico e Fuoco fatuo si potenziano. La rana rigenera 1 PV a turno."],
["Lightning deals double damage (or more). Fire deals half. Frost can Freeze.", "El Rayo hace daño doble (o más). El Fuego hace la mitad. La Escarcha puede Congelar.", "La Foudre inflige double dégâts (ou plus). Le Feu, moitié moins. Le Givre peut Geler.", "Blitz macht doppelten Schaden (oder mehr). Feuer nur halben. Frost kann einfrieren.", "Raio causa dano dobrado (ou mais). Fogo causa metade. Gelo pode Congelar.", "Il Fulmine fa danni doppi (o più). Il Fuoco la metà. Il Gelo può Congelare."],
["Takes +2 damage from every hit and cannot heal. Fire +50%.", "Recibe +2 de daño por golpe y no puede curarse. Fuego +50%.", "Subit +2 dégâts par coup et ne peut pas se soigner. Feu +50 %.", "Nimmt +2 Schaden pro Treffer und kann nicht heilen. Feuer +50%.", "Sofre +2 de dano por golpe e não pode se curar. Fogo +50%.", "Subisce +2 danni a colpo e non può curarsi. Fuoco +50%."],
["Loses HP equal to Poison each turn, then Poison drops by 1.", "Pierde PV igual al Veneno cada turno; luego el Veneno baja 1.", "Perd autant de PV que son Poison à chaque tour, puis le Poison baisse de 1.", "Verliert jede Runde LP in Höhe des Gifts, dann sinkt Gift um 1.", "Perde PV igual ao Veneno a cada turno; depois o Veneno cai 1.", "Perde PV pari al Veleno ogni turno, poi il Veleno cala di 1."],
["Takes 2 damage per stack each turn, then halves. Rain extinguishes.", "Recibe 2 de daño por acumulación cada turno y luego se reduce a la mitad. La Lluvia la apaga.", "Subit 2 dégâts par cumul à chaque tour, puis se divise par deux. La Pluie l'éteint.", "Nimmt pro Stapel 2 Schaden jede Runde, dann halbiert. Regen löscht.", "Sofre 2 de dano por acúmulo a cada turno, depois cai pela metade. Chuva apaga.", "Subisce 2 danni per accumulo ogni turno, poi si dimezza. La Pioggia la spegne."],
["Skips its next action. After a stun the frog Resists stuns for 1 turn.", "Pierde su próxima acción. Tras un aturdimiento, la rana lo Resiste durante 1 turno.", "Saute sa prochaine action. Après un étourdissement, la grenouille y Résiste pendant 1 tour.", "Setzt die nächste Aktion aus. Danach widersteht der Frosch 1 Runde lang Betäubungen.", "Perde a próxima ação. Depois de atordoado, o sapo Resiste a atordoamentos por 1 turno.", "Salta la prossima azione. Dopo uno stordimento la rana Resiste per 1 turno."],
["A Stun caused by Frost.", "Un aturdimiento causado por la Escarcha.", "Un étourdissement causé par le Givre.", "Eine Betäubung durch Frost.", "Um atordoamento causado pelo Gelo.", "Uno stordimento causato dal Gelo."],
["Deals 25% less damage.", "Hace un 25% menos de daño.", "Inflige 25 % de dégâts en moins.", "Macht 25% weniger Schaden.", "Causa 25% menos dano.", "Infligge il 25% di danni in meno."],
["Deals 30% less damage.", "Hace un 30% menos de daño.", "Inflige 30 % de dégâts en moins.", "Macht 30% weniger Schaden.", "Causa 30% menos dano.", "Infligge il 30% di danni in meno."],
["Takes 50% more damage from hits.", "Recibe un 50% más de daño de los golpes.", "Subit 50 % de dégâts en plus.", "Nimmt 50% mehr Schaden durch Treffer.", "Sofre 50% a mais de dano dos golpes.", "Subisce il 50% di danni in più dai colpi."],
["The frog's next attack hits itself instead.", "El próximo ataque de la rana la golpea a ella misma.", "La prochaine attaque de la grenouille la frappe elle-même.", "Der nächste Angriff des Froschs trifft ihn selbst.", "O próximo ataque do sapo acerta ele mesmo.", "Il prossimo attacco della rana colpisce lei stessa."],
["Absorbs damage until the start of your next turn.", "Absorbe daño hasta el inicio de tu próximo turno.", "Absorbe les dégâts jusqu'au début de ton prochain tour.", "Absorbiert Schaden bis zum Beginn deiner nächsten Runde.", "Absorve dano até o início do seu próximo turno.", "Assorbe danni fino all'inizio del tuo prossimo turno."],
["Dodges the next hit completely.", "Esquiva por completo el próximo golpe.", "Esquive complètement le prochain coup.", "Weicht dem nächsten Treffer komplett aus.", "Esquiva totalmente o próximo golpe.", "Schiva del tutto il prossimo colpo."],
["Adds damage to every hit.", "Suma daño a cada golpe.", "Ajoute des dégâts à chaque coup.", "Erhöht den Schaden jedes Treffers.", "Soma dano a cada golpe.", "Aggiunge danni a ogni colpo."],
["Deals damage back to attackers this turn.", "Devuelve daño a quien te ataque este turno.", "Renvoie des dégâts aux attaquants ce tour-ci.", "Fügt Angreifern in dieser Runde Schaden zu.", "Devolve dano a quem atacar neste turno.", "Restituisce danni agli attaccanti in questo turno."],
["Reflects part of the frog's next attack back at it.", "Refleja parte del próximo ataque de la rana contra ella.", "Renvoie une partie de la prochaine attaque de la grenouille.", "Wirft einen Teil des nächsten Froschangriffs zurück.", "Reflete parte do próximo ataque do sapo de volta nele.", "Riflette parte del prossimo attacco della rana su di lei."],
["Removed from play for the rest of this battle.", "Sale del juego durante el resto del combate.", "Retirée du jeu pour le reste du combat.", "Für den Rest des Kampfes aus dem Spiel entfernt.", "Sai de jogo pelo resto da batalha.", "Rimossa dal gioco per il resto della battaglia."],
["Terrain. Each pad gives the frog 1 Block per turn. Fuel for Lily Pad Collapse.", "Terreno. Cada nenúfar da a la rana 1 de Bloqueo por turno. Combustible para Hundenenúfares.", "Terrain. Chaque nénuphar donne 1 Blocage par tour à la grenouille. Munitions pour Effondrement de nénuphars.", "Gelände. Jedes Blatt gibt dem Frosch 1 Block pro Runde. Futter für Seerosen-Einsturz.", "Terreno. Cada vitória-régia dá 1 de Bloqueio por turno ao sapo. Combustível para Afunda-vitórias.", "Terreno. Ogni ninfea dà alla rana 1 Blocco a turno. Carburante per Crollo di ninfee."],
["Each fly reduces frog attack by 1 (max 4). The frog eats one per turn to heal 3.", "Cada mosca reduce el ataque de la rana en 1 (máx. 4). La rana se come una por turno y se cura 3.", "Chaque mouche réduit l'attaque de la grenouille de 1 (max 4). Elle en mange une par tour et soigne 3.", "Jede Fliege senkt den Froschangriff um 1 (max. 4). Er frisst eine pro Runde und heilt 3.", "Cada mosca reduz o ataque do sapo em 1 (máx. 4). Ele come uma por turno e cura 3.", "Ogni mosca riduce l'attacco della rana di 1 (max 4). Ne mangia una a turno e cura 3."],
["Toxic flies Poison the frog for 4 instead of healing it.", "Las moscas tóxicas envenenan 4 a la rana en vez de curarla.", "Les mouches toxiques empoisonnent la grenouille de 4 au lieu de la soigner.", "Giftige Fliegen vergiften den Frosch um 4, statt ihn zu heilen.", "Moscas tóxicas envenenam o sapo em 4 em vez de curar.", "Le mosche tossiche avvelenano la rana di 4 invece di curarla."],
["Each tadpole bites you for 2 at the end of the frog turn.", "Cada renacuajo te muerde por 2 al final del turno de la rana.", "Chaque têtard te mord pour 2 à la fin du tour de la grenouille.", "Jede Kaulquappe beißt dich am Ende der Froschrunde für 2.", "Cada girino te morde por 2 no fim do turno do sapo.", "Ogni girino ti morde per 2 a fine turno della rana."],
["Electric damage. Bonus vs Wet targets.", "Daño eléctrico. Bonificación contra objetivos Mojados.", "Dégâts électriques. Bonus contre les cibles Mouillées.", "Elektroschaden. Bonus gegen nasse Ziele.", "Dano elétrico. Bônus contra alvos Molhados.", "Danno elettrico. Bonus contro bersagli Bagnati."],
["Bonus vs Dry targets or in Drought, halved vs Wet.", "Bonificación contra objetivos Secos o en Sequía; mitad contra Mojados.", "Bonus contre les cibles Sèches ou en Sécheresse, divisé par deux contre Mouillées.", "Bonus gegen trockene Ziele oder bei Dürre, halbiert gegen nasse.", "Bônus contra alvos Secos ou na Seca; metade contra Molhados.", "Bonus contro bersagli Secchi o in Siccità, dimezzato contro Bagnati."],
["Cold damage. Freezes Wet targets.", "Daño de frío. Congela objetivos Mojados.", "Dégâts de froid. Gèle les cibles Mouillées.", "Kälteschaden. Friert nasse Ziele ein.", "Dano de frio. Congela alvos Molhados.", "Danno da freddo. Congela i bersagli Bagnati."],
["Junk card spat by the frog. Play it to scrape it off.", "Carta basura escupida por la rana. Juégala para quitártela.", "Carte déchet crachée par la grenouille. Joue-la pour t'en débarrasser.", "Müllkarte, vom Frosch ausgespuckt. Spiel sie, um sie abzukratzen.", "Carta-lixo cuspida pelo sapo. Jogue-a para se livrar dela.", "Carta spazzatura sputata dalla rana. Giocala per togliertela."],

["Cards are scenarios. WEATHER (one at a time): <b>Rain</b> (frog +2 atk, Wet every turn; enables Lightning), <b>Drought</b> (frog -2 atk, loses 3 HP, Dry; boosts Fire), <b>Snow</b> (Slows frog; Frost freezes Wet frogs). ATMOSPHERE stacks with weather: <b>Fog</b> (35% miss for BOTH sides) and <b>Night</b> (Boring Lecture puts it to sleep, Charm doubles, Wisps glow; frog regenerates 1). TERRAIN: <b>Lily Pads</b> (frog gains Block; fuel for Lily Pad Collapse), <b>Flies</b> (lower frog attack, frog eats them to heal - unless they are Toxic!), <b>Tadpoles</b> (bite you each turn; net, salt, burn or flood them).", "Las cartas son escenarios. CLIMA (uno a la vez): <b>Lluvia</b> (rana +2 atq, Mojada cada turno; activa el Rayo), <b>Sequía</b> (rana -2 atq, pierde 3 PV, Seca; potencia el Fuego), <b>Nieve</b> (ralentiza a la rana; la Escarcha congela a las Mojadas). La ATMÓSFERA se suma al clima: <b>Niebla</b> (35% de fallo para AMBOS) y <b>Noche</b> (la Charla aburrida la duerme, el Encanto se duplica, los Fuegos fatuos brillan; la rana regenera 1). TERRENO: <b>Nenúfares</b> (la rana gana Bloqueo; combustible para Hundenenúfares), <b>Moscas</b> (bajan su ataque, se las come para curarse... ¡salvo que sean Tóxicas!), <b>Renacuajos</b> (te muerden cada turno; usa red, sal, fuego o inundación).", "Les cartes sont des scénarios. MÉTÉO (une à la fois) : <b>Pluie</b> (grenouille +2 atq, Mouillée chaque tour ; active la Foudre), <b>Sécheresse</b> (grenouille -2 atq, perd 3 PV, Sèche ; renforce le Feu), <b>Neige</b> (ralentit ; le Givre gèle les Mouillées). L'ATMOSPHÈRE s'ajoute à la météo : <b>Brouillard</b> (35 % de ratés des DEUX côtés) et <b>Nuit</b> (le Cours soporifique l'endort, le Charme double, les Feux follets brillent ; elle régénère 1). TERRAIN : <b>Nénuphars</b> (elle gagne du Blocage ; munitions pour Effondrement), <b>Mouches</b> (baissent son attaque, elle les mange pour se soigner... sauf si elles sont Toxiques !), <b>Têtards</b> (te mordent chaque tour ; filet, sel, feu ou inondation).", "Karten sind Szenarien. WETTER (eins auf einmal): <b>Regen</b> (Frosch +2 Ang., jede Runde Nass; ermöglicht Blitz), <b>Dürre</b> (Frosch -2 Ang., verliert 3 LP, Trocken; stärkt Feuer), <b>Schnee</b> (verlangsamt; Frost friert nasse Frösche ein). ATMOSPHÄRE kommt zum Wetter dazu: <b>Nebel</b> (35% Fehlschlag für BEIDE Seiten) und <b>Nacht</b> (Vortrag schläfert ein, Bezirzen doppelt, Irrlichter glühen; Frosch regeneriert 1). GELÄNDE: <b>Seerosenblätter</b> (Frosch erhält Block; Futter für Seerosen-Einsturz), <b>Fliegen</b> (senken den Angriff, er frisst sie zum Heilen – außer sie sind giftig!), <b>Kaulquappen</b> (beißen dich jede Runde; Netz, Salz, Feuer oder Flut).", "Cartas são cenários. CLIMA (um por vez): <b>Chuva</b> (sapo +2 atq, Molhado todo turno; ativa o Raio), <b>Seca</b> (sapo -2 atq, perde 3 PV, Seco; fortalece o Fogo), <b>Neve</b> (deixa o sapo Lento; Gelo congela sapos Molhados). A ATMOSFERA se soma ao clima: <b>Névoa</b> (35% de erro para OS DOIS lados) e <b>Noite</b> (a Palestra chata faz ele dormir, Encanto dobra, Fogos-fátuos brilham; o sapo regenera 1). TERRENO: <b>Vitórias-régias</b> (o sapo ganha Bloqueio; combustível para Afunda-vitórias), <b>Moscas</b> (baixam o ataque, ele come para se curar... a menos que sejam Tóxicas!), <b>Girinos</b> (te mordem todo turno; use rede, sal, fogo ou enchente).", "Le carte sono scenari. METEO (uno alla volta): <b>Pioggia</b> (rana +2 att, Bagnata ogni turno; attiva il Fulmine), <b>Siccità</b> (rana -2 att, perde 3 PV, Secca; potenzia il Fuoco), <b>Neve</b> (rallenta la rana; il Gelo congela le Bagnate). L'ATMOSFERA si somma al meteo: <b>Nebbia</b> (35% di mancare per ENTRAMBI) e <b>Notte</b> (la Lezione noiosa la addormenta, il Fascino raddoppia, i Fuochi fatui brillano; la rana rigenera 1). TERRENO: <b>Ninfee</b> (la rana ottiene Blocco; carburante per Crollo di ninfee), <b>Mosche</b> (abbassano l'attacco, la rana le mangia per curarsi... a meno che non siano Tossiche!), <b>Girini</b> (ti mordono ogni turno; usa rete, sale, fuoco o alluvione)."],

["Earn coins and stars (3 stars = finish with 70%+ HP). Then choose ONE: add 1 of 3 new cards, upgrade a card, or remove a card. Bosses give a trophy for your house and a Charm (passive relic; equip in Deck &amp; Charms). Random cosmetic/decor drops happen too.", "Gana monedas y estrellas (3 estrellas = acabar con 70%+ de PV). Luego elige UNA: añadir 1 de 3 cartas nuevas, mejorar una carta o quitar una. Los jefes dan un trofeo para tu casa y un Amuleto (reliquia pasiva; equípala en Mazo y amuletos). También caen cosméticos y decoración al azar.", "Gagne pièces et étoiles (3 étoiles = finir avec 70 %+ de PV). Puis choisis-en UNE : ajouter 1 carte sur 3, en améliorer une ou en retirer une. Les boss donnent un trophée pour ta maison et un Charme (relique passive ; à équiper dans Deck et charmes). Des cosmétiques et déco tombent aussi au hasard.", "Verdiene Münzen und Sterne (3 Sterne = mit 70%+ LP beenden). Dann wähle EINS: 1 von 3 neuen Karten, eine Karte verbessern oder entfernen. Bosse geben eine Trophäe fürs Haus und einen Talisman (passives Relikt; anlegen unter Deck &amp; Talismane). Zufällige Kosmetik und Deko gibt's auch.", "Ganhe moedas e estrelas (3 estrelas = terminar com 70%+ de PV). Depois escolha UMA: adicionar 1 de 3 cartas novas, melhorar ou remover uma carta. Chefes dão um troféu para sua casa e um Amuleto (relíquia passiva; equipe em Deck e amuletos). Também caem cosméticos e decoração aleatórios.", "Guadagna monete e stelle (3 stelle = finire con il 70%+ di PV). Poi scegline UNA: aggiungi 1 di 3 carte nuove, potenzia o rimuovi una carta. I boss danno un trofeo per la casa e un Amuleto (reliquia passiva; equipaggialo in Mazzo e amuleti). Cadono anche cosmetici e arredi casuali."],

["Rainstorm &#8594; Lightning Strike (triple) &#183; Thunder Clap in Rain on a Wet frog (stun) &#183; Fog Machine &#8594; Heron Summon (stun) + Stinky Sock (double poison) &#183; Full Moon &#8594; Boring Lecture (snooze-stun) &#8594; Hungry Snake (double) &#183; Swarm of Flies + Toxic Bait &#8594; Mosquito Plague &#183; Lotus Bloom x2 &#8594; Lily Pad Collapse &#183; Drought / Hair Dryer &#8594; Wildfire / Melt It With a Laser &#183; Monsoon &#8594; Ice Ray (freeze) &#183; Mirror Pond before a Heavy Slam &#183; Croak Echo after your best card &#183; Disco Ball / Anvil Drop (Dizzy: frog misses 40%) &#183; Leaf Blower clears Fog + Lily Pads + Evade &#183; Crush It With a Giant Foot on a frog with no Block (stun) &#183; Rubber Duck Decoy before a Heavy Slam.", "Chaparrón &#8594; Relámpago (triple) &#183; Trueno con Lluvia sobre rana Mojada (aturde) &#183; Máquina de niebla &#8594; Invocar garza (aturde) + Calcetín apestoso (veneno doble) &#183; Luna llena &#8594; Charla aburrida (siesta) &#8594; Serpiente hambrienta (doble) &#183; Enjambre de moscas + Cebo tóxico &#8594; Plaga de mosquitos &#183; Flor de loto x2 &#8594; Hundenenúfares &#183; Sequía / Secador &#8594; Incendio / Derrítela con un láser &#183; Monzón &#8594; Rayo de hielo (congela) &#183; Estanque espejo antes de un Golpe brutal &#183; Eco de croac tras tu mejor carta &#183; Bola de discoteca / Yunque (Mareo: falla el 40%) &#183; Soplahojas quita Niebla + Nenúfares + Esquiva &#183; Pie gigante sobre rana sin Bloqueo (aturde) &#183; Patito señuelo antes de un Golpe brutal.", "Averse &#8594; Coup de foudre (triple) &#183; Coup de tonnerre sous la Pluie sur grenouille Mouillée (étourdit) &#183; Machine à brouillard &#8594; Appel du héron (étourdit) + Chaussette puante (poison double) &#183; Pleine lune &#8594; Cours soporifique (dodo) &#8594; Serpent affamé (double) &#183; Nuée de mouches + Appât toxique &#8594; Fléau de moustiques &#183; Floraison de lotus x2 &#8594; Effondrement de nénuphars &#183; Sécheresse / Sèche-cheveux &#8594; Feu de forêt / Laser &#183; Mousson &#8594; Rayon de glace (gel) &#183; Mare miroir avant un Coup lourd &#183; Écho de croâ après ta meilleure carte &#183; Boule disco / Enclume (Vertige : rate 40 %) &#183; Souffleur : retire Brouillard + Nénuphars + Esquive &#183; Pied géant sur grenouille sans Blocage (étourdit) &#183; Canard leurre avant un Coup lourd.", "Regenguss &#8594; Blitzschlag (dreifach) &#183; Donnerschlag bei Regen auf nassen Frosch (betäubt) &#183; Nebelmaschine &#8594; Reiher-Ruf (betäubt) + Stinkesocke (doppeltes Gift) &#183; Vollmond &#8594; Langweiliger Vortrag (Schlaf) &#8594; Hungrige Schlange (doppelt) &#183; Fliegenschwarm + Giftköder &#8594; Mückenplage &#183; Lotusblüte x2 &#8594; Seerosen-Einsturz &#183; Dürre / Föhn &#8594; Lauffeuer / Laser &#183; Monsun &#8594; Eisstrahl (einfrieren) &#183; Spiegelteich vor einem Wuchtschlag &#183; Quak-Echo nach deiner besten Karte &#183; Discokugel / Ambossfall (Schwindel: 40% daneben) &#183; Laubbläser entfernt Nebel + Seerosen + Ausweichen &#183; Riesenfuß auf Frosch ohne Block (betäubt) &#183; Enten-Köder vor einem Wuchtschlag.", "Toró &#8594; Relâmpago (triplo) &#183; Trovão na Chuva num sapo Molhado (atordoa) &#183; Máquina de névoa &#8594; Chamado da garça (atordoa) + Meia fedida (veneno dobrado) &#183; Lua cheia &#8594; Palestra chata (soneca) &#8594; Cobra faminta (dobro) &#183; Enxame de moscas + Isca tóxica &#8594; Praga de mosquitos &#183; Flor de lótus x2 &#8594; Afunda-vitórias &#183; Seca / Secador &#8594; Incêndio / Laser &#183; Monção &#8594; Raio de gelo (congela) &#183; Lagoa espelho antes de uma Pancada pesada &#183; Eco de coaxar depois da sua melhor carta &#183; Globo de discoteca / Bigorna (Tontura: erra 40%) &#183; Soprador tira Névoa + Vitórias-régias + Esquiva &#183; Pé gigante num sapo sem Bloqueio (atordoa) &#183; Patinho-isca antes de uma Pancada pesada.", "Acquazzone &#8594; Fulmine (triplo) &#183; Tuono con Pioggia su rana Bagnata (stordisce) &#183; Macchina del fumo &#8594; Evoca airone (stordisce) + Calzino puzzolente (veleno doppio) &#183; Luna piena &#8594; Lezione noiosa (pisolino) &#8594; Serpente affamato (doppio) &#183; Sciame di mosche + Esca tossica &#8594; Piaga di zanzare &#183; Fiore di loto x2 &#8594; Crollo di ninfee &#183; Siccità / Phon &#8594; Incendio / Laser &#183; Monsone &#8594; Raggio di ghiaccio (congela) &#183; Stagno specchio prima di uno Schianto pesante &#183; Eco di gracidio dopo la tua carta migliore &#183; Palla da discoteca / Incudine (Vertigine: manca il 40%) &#183; Soffiafoglie toglie Nebbia + Ninfee + Schivata &#183; Piedone su rana senza Blocco (stordisce) &#183; Paperella esca prima di uno Schianto pesante."],

["Spend coins on cosmetics, decor and charms. <b>Card Services</b> are deliberately expensive long-term goals: a sealed <b>Card Pack</b> starts at 350 coins (pick 1 of 3; the price rises 40 per pack, up to 1000), and an <b>Upgrade</b> starts at 300 (+50 each, up to 2000). Packs only open after you pay, and every purchase is final.", "Gasta monedas en cosméticos, decoración y amuletos. Los <b>Servicios de cartas</b> son metas caras a largo plazo a propósito: un <b>Sobre de cartas</b> cerrado empieza en 350 monedas (elige 1 de 3; sube 40 por sobre, hasta 1000), y una <b>Mejora</b> empieza en 300 (+50 cada una, hasta 2000). Los sobres se abren solo tras pagar y todas las compras son definitivas.", "Dépense tes pièces en cosmétiques, déco et charmes. Les <b>Services de cartes</b> sont volontairement chers, des objectifs à long terme : un <b>Paquet de cartes</b> scellé démarre à 350 pièces (1 carte sur 3 ; +40 par paquet, jusqu'à 1000), et une <b>Amélioration</b> à 300 (+50 à chaque fois, jusqu'à 2000). Les paquets s'ouvrent après paiement, et tout achat est définitif.", "Gib Münzen für Kosmetik, Deko und Talismane aus. Der <b>Karten-Service</b> ist absichtlich teuer, ein Langzeitziel: ein versiegeltes <b>Kartenpack</b> kostet ab 350 Münzen (1 von 3 wählen; +40 pro Pack, bis 1000), ein <b>Upgrade</b> ab 300 (+50 pro Stück, bis 2000). Packs öffnen sich erst nach dem Bezahlen, und jeder Kauf ist endgültig.", "Gaste moedas em cosméticos, decoração e amuletos. Os <b>Serviços de cartas</b> são metas caras de longo prazo de propósito: um <b>Pacote de cartas</b> lacrado começa em 350 moedas (escolha 1 de 3; sobe 40 por pacote, até 1000), e uma <b>Melhoria</b> começa em 300 (+50 cada, até 2000). Pacotes só abrem depois de pagar, e toda compra é definitiva.", "Spendi monete in cosmetici, arredi e amuleti. I <b>Servizi carte</b> sono obiettivi a lungo termine volutamente costosi: una <b>Bustina di carte</b> sigillata parte da 350 monete (scegli 1 di 3; +40 a bustina, fino a 1000), e un <b>Potenziamento</b> parte da 300 (+50 ognuno, fino a 2000). Le bustine si aprono solo dopo il pagamento e ogni acquisto è definitivo."],

["The purple box above the frog shows exactly what it will do after your turn, with damage already adjusted for the environment. Block big hits, make it miss with Fog, Stun it, Charm it so it hits itself, or Silence its tricks.", "El recuadro morado sobre la rana muestra exactamente qué hará tras tu turno, con el daño ya ajustado al entorno. Bloquea los golpes fuertes, haz que falle con Niebla, Atúrdela, Encántala para que se golpee o Silencia sus trucos.", "La case violette au-dessus de la grenouille montre ce qu'elle fera après ton tour, dégâts déjà ajustés à l'environnement. Bloque les gros coups, fais-la rater avec le Brouillard, Étourdis-la, Charme-la pour qu'elle se frappe, ou Musèle ses ruses.", "Das lila Feld über dem Frosch zeigt genau, was er nach deiner Runde tut, Schaden schon an die Umgebung angepasst. Blocke harte Treffer, lass ihn im Nebel verfehlen, betäube ihn, bezirze ihn, damit er sich selbst trifft, oder bring seine Tricks zum Schweigen.", "A caixa roxa acima do sapo mostra exatamente o que ele fará depois do seu turno, com o dano já ajustado ao ambiente. Bloqueie golpes fortes, faça-o errar com Névoa, Atordoe, Encante para ele se acertar ou Silencie seus truques.", "Il riquadro viola sopra la rana mostra esattamente cosa farà dopo il tuo turno, con i danni già adattati all'ambiente. Blocca i colpi forti, falla mancare con la Nebbia, Stordiscila, Affascinala perché si colpisca o Zittisci i suoi trucchi."],

["Tip: watch the frog's intent. Block big attacks, use Fog to make it miss, Stun or Charm it before heavy hits, and build combos (Rain + Lightning, Fog + Bog Gas, Flies + Toxic Bait, Night + Boring Lecture). Upgrading or removing weak cards after wins makes your combos show up more often.", "Consejo: vigila la intención de la rana. Bloquea los ataques fuertes, usa Niebla para que falle, Atúrdela o Encántala antes de los golpes duros y monta combos (Lluvia + Rayo, Niebla + Gas del pantano, Moscas + Cebo tóxico, Noche + Charla aburrida). Mejorar o quitar cartas flojas tras ganar hace que tus combos salgan más.", "Astuce : surveille l'intention de la grenouille. Bloque les grosses attaques, utilise le Brouillard pour la faire rater, Étourdis-la ou Charme-la avant les gros coups, et monte des combos (Pluie + Foudre, Brouillard + Gaz des marais, Mouches + Appât toxique, Nuit + Cours soporifique). Améliorer ou retirer les cartes faibles après une victoire fait sortir tes combos plus souvent.", "Tipp: Achte auf die Absicht des Froschs. Blocke harte Angriffe, lass ihn im Nebel verfehlen, betäube oder bezirze ihn vor schweren Treffern und baue Kombos (Regen + Blitz, Nebel + Sumpfgas, Fliegen + Giftköder, Nacht + Langweiliger Vortrag). Schwache Karten nach Siegen zu verbessern oder zu entfernen bringt deine Kombos öfter.", "Dica: fique de olho na intenção do sapo. Bloqueie ataques fortes, use Névoa para ele errar, Atordoe ou Encante antes dos golpes pesados e monte combos (Chuva + Raio, Névoa + Gás do brejo, Moscas + Isca tóxica, Noite + Palestra chata). Melhorar ou remover cartas fracas depois de vencer faz seus combos aparecerem mais.", "Consiglio: osserva l'intento della rana. Blocca gli attacchi forti, usa la Nebbia per farla mancare, Stordiscila o Affascinala prima dei colpi pesanti e crea combo (Pioggia + Fulmine, Nebbia + Gas di palude, Mosche + Esca tossica, Notte + Lezione noiosa). Potenziare o rimuovere carte deboli dopo le vittorie fa uscire più spesso le combo."],

["You get 3 Energy (4 once you defeat the level 50 boss) and draw 5 cards. Each card costs Energy (top-left number). Click a card (or drag it upward; on touch: tap twice) to play it. Unplayed cards are discarded at END TURN. When your draw pile is empty your discard pile is reshuffled.", "Tienes 3 de Energía (4 tras vencer al jefe del nivel 50) y robas 5 cartas. Cada carta cuesta Energía (número arriba a la izquierda). Haz clic en una carta (o arrástrala hacia arriba; en táctil: toca dos veces) para jugarla. Las no jugadas se descartan al FIN DE TURNO. Cuando tu mazo se vacía, el descarte se baraja de nuevo.", "Tu as 3 Énergie (4 après le boss du niveau 50) et pioches 5 cartes. Chaque carte coûte de l'Énergie (chiffre en haut à gauche). Clique sur une carte (ou glisse-la vers le haut ; en tactile : touche deux fois) pour la jouer. Les cartes non jouées sont défaussées à la FIN DU TOUR. Quand ta pioche est vide, ta défausse est remélangée.", "Du hast 3 Energie (4 nach dem Boss auf Level 50) und ziehst 5 Karten. Jede Karte kostet Energie (Zahl oben links). Klick eine Karte an (oder zieh sie nach oben; Touch: zweimal tippen), um sie zu spielen. Nicht gespielte Karten werden bei ZUG BEENDEN abgelegt. Ist dein Nachziehstapel leer, wird die Ablage neu gemischt.", "Você tem 3 de Energia (4 depois de vencer o chefe do nível 50) e compra 5 cartas. Cada carta custa Energia (número no canto superior esquerdo). Clique numa carta (ou arraste para cima; no toque: toque duas vezes) para jogá-la. Cartas não jogadas são descartadas no FIM DO TURNO. Quando o monte acaba, o descarte é embaralhado de novo.", "Hai 3 Energia (4 dopo il boss del livello 50) e peschi 5 carte. Ogni carta costa Energia (numero in alto a sinistra). Clicca una carta (o trascinala in su; su touch: tocca due volte) per giocarla. Le carte non giocate vanno negli scarti a FINE TURNO. Quando il mazzo è vuoto, gli scarti vengono rimescolati."],

// ---- Croak & Dagger: smart translation of composed text (numbers + card/frog names + sentences) ----
let TS_CACHE=null,TS_LANG=null;
function tsNames(){if(TS_LANG!==LANG||!TS_CACHE){TS_LANG=LANG;TS_CACHE=[];if(typeof CARDS!=='undefined')for(const c of CARDS)TS_CACHE.push([c.n,()=>t(c.n)]);if(typeof BOSSES!=='undefined')for(const k in BOSSES)TS_CACHE.push([BOSSES[k].name,()=>t(BOSSES[k].name)]);TS_CACHE.sort((a,b)=>b[0].length-a[0].length);}
 const out=TS_CACHE.slice();if(typeof BT!=='undefined'&&BT&&BT.spec){const s=BT.spec;out.unshift([s.name,()=>frogName(s)]);if(s.title)out.unshift([s.title,()=>frogTitle(s)]);}return out;}
function tsNum(k,v,start){let n=start||0;return k.replace(/\{[^}]*\}|&#\d+;|&\w+;|\d+(?:\.\d+)?/g,m=>{if(m[0]==='{'||m[0]==='&')return m;v[n]=m;return '{'+(n++)+'}';});}
function tsEsc(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
const TS_RE=new Map();function tsHas(k,en){let r=TS_RE.get(en);if(!r){r=new RegExp('(?<![A-Za-z{])'+tsEsc(en)+'(?![A-Za-z}])','g');TS_RE.set(en,r);}r.lastIndex=0;return r.test(k)?r:null;}
function tsSub(tr,v){return tr.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?unS(v[k]):m);}
const TRV={};function isTrVal(x){let S=TRV[LANG];if(!S){S=TRV[LANG]=new Set(Object.values(I18N[LANG]||{}));}return S.has(x);}
function tsOne(s,D,logMiss){if(D[s]!=null)return D[s];
 const nums={};const k1=tsNum(s,nums);if(D[k1]!=null)return tsSub(D[k1],nums);
 if(isTrVal(s)||isTrVal(k1))return s;
 const v={};let k2=s,ni=0;for(const[en,fn]of tsNames()){if(!en||ni>3)continue;const re=tsHas(k2,en);if(re){const ph='name'+(ni||'');k2=k2.replace(re,'{'+ph+'}');v[ph]=unS(fn());ni++;}}
 if(ni){k2=tsNum(k2,v);if(D[k2]!=null)return tsSub(D[k2],v);}
 if(logMiss){const key=ni?k2:k1;if(!I18N_MISS.has(key)){I18N_MISS.add(key);console.info('[i18n] missing '+LANG+': '+key);}}
 return null;}
function tS(s){return thMark(tS0(s));}
function tS0(s){if(s==null)return s;s=String(s);if(TH_COLLECT&&/[A-Za-z]{2}/.test(s)){for(const p of s.split(/(?<=[.!?)])\s+(?=[A-Z(+])/)){const n=thNorm(p,[]);TH_COLLECT.add('S\u0001'+n.k);}}if(LANG==='en'||!/[A-Za-z]/.test(s.replace(/<[^>]*>|&\w+;/g,'')))return s;const D=I18N[LANG]||{};
 const r=tsOne(s,D,false);if(r!=null)return r;
 const parts=s.split(/(?<=[.!?)])\s+(?=[A-Z(+])/);if(parts.length>1){return parts.map(p=>{const x=tsOne(p,D,true);return x==null?p:x;}).join(' ');}
 tsOne(s,D,true);return s;}

const CARD={};CARDS.forEach(c=>CARD[c.id]=c);
function starterDeck(){return['pebble','pebble','pebble','pebble','reed','reed','reed','reed','rainstorm','lightning','fog','lullaby'].map(id=>({id,up:0}));}
function cardCost(id,up){const c=CARD[id];return up&&c.uc!==undefined?c.uc:c.c;}
function cardExhaust(id,up){const c=CARD[id];return typeof c.ex==='function'?c.ex(up):!!c.ex;}
function cardDesc(id,up){return CARD[id].d(up)+(cardExhaust(id,up)&&!/Exhaust/.test(CARD[id].d(up))?' Exhaust.':'');}
function cardDescL(id,up){return tS(cardDesc(id,up));}
function kwHtml(text){const out=[];let stun=false;for(const k in KW){const re=new RegExp('\\b'+k.replace(/[-']/g,'.')+(k.endsWith('s')||k==='Muck'?'':'s?')+'\\b','i');if(re.test(text)){out.push(`<b>${t(k)}</b>: ${t(KW[k])}`);if(k==='Stun')stun=true;}}if(/Freeze/.test(text)&&!stun)out.push('<b>'+t('Stun')+'</b>: '+t(KW.Stun));return out.join('<br>');}
const KW_HI=['Rain','Drought','Snow','Fog','Night','Wet','Dry','Poison','Burn','Stun','Freeze','Slow','Weak','Vulnerable','Charm','Block','Evade','Strength','Thorns','Exhaust','Lily Pads','Lily Pad','Flies','Toxic','Tadpoles','Tadpole','Lightning','Fire','Frost','Dizzy','Decoy','TRIPLE','double'];let KW_RE=null,KW_RE_L=null;
function hiliteKw(s){if(LANG!=='en'){if(KW_RE_L!==LANG){KW_RE_L=LANG;const w=[...new Set(KW_HI.map(k=>t(k)).filter(Boolean))].sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));KW_RE=new RegExp('(^|[^\\p{L}])('+w.join('|')+')(?![\\p{L}])','gu');}return s.replace(KW_RE,'$1<span style="color:#cfa8ff">$2</span>');}return s.replace(/\b(Rain|Drought|Snow|Fog|Night|Wet|Dry|Poison|Burn|Stun|Freeze|Slow|Weak|Vulnerable|Charm|Block|Evade|Strength|Thorns|Exhaust|Lily Pads?|Flies|Toxic|Tadpoles?|Lightning|Fire|Frost|Dizzy|Decoy|TRIPLE|double)\b/g,'<span style="color:#cfa8ff">$1</span>');}

function drawIcon(B,k){// palette indices: 2 main,3 dark,4 light,5 accent,6 accent2,7 white,8 glow
 const cloud=(x,y)=>{B.ell(x,y,6,4,4);B.ell(x+6,y-2,6,5,4);B.ell(x+11,y,5,4,4);B.rect(x-4,y,20,4,4);B.rect(x-3,y+3,18,1,3);};
 const drops=(n,x,y,c=5)=>{for(let i=0;i<n;i++){B.rect(x+i*5,y+(i%2)*3,1,3,c);}};
 const bolt=(x,y,c=8)=>{B.line(x+4,y,x,y+7,c,2);B.line(x,y+7,x+5,y+7,c,2);B.line(x+5,y+7,x+1,y+15,c,2);};
 const eye=(x,y,c=8)=>{B.rect(x-1,y,3,1,c);B.rect(x,y-1,1,3,c);B.set(x,y,7);};
 const frogMini=(x,y)=>{B.ell(x,y,6,4,2);B.ell(x-3,y-4,2,2,2);B.ell(x+3,y-4,2,2,2);B.set(x-3,y-4,8);B.set(x+3,y-4,8);B.rect(x-7,y+3,3,2,3);B.rect(x+5,y+3,3,2,3);};
 const bird=(x,y)=>{B.tri(x-10,y-2,x,y+2,x-2,y-6,2);B.tri(x+10,y-2,x,y+2,x+2,y-6,2);B.ell(x,y,3,2,2);B.set(x+2,y-1,8);};
 switch(k){
 case'rock':B.ell(14,16,7,6,2);B.ell(12,14,3,2,4);B.line(5,24,10,20,5);B.line(18,8,23,4,5);break;
 case'shield':B.tri(6,6,22,6,14,25,2);B.rect(6,5,16,4,2);B.line(14,7,14,22,4);B.line(10,8,10,15,5);B.line(18,8,18,15,5);break;
 case'rain':cloud(7,8);drops(4,6,15,8);drops(4,8,20,8);break;
 case'bolt':cloud(7,6);bolt(12,10);break;
 case'fog':for(let i=0;i<4;i++)B.rect(3+(i%2)*4,6+i*5,20,2,4);eye(9,15);eye(19,15,6);break;
 case'note':B.rect(9,6,2,14,4);B.rect(19,4,2,14,4);B.rect(9,5,12,2,4);B.ell(8,20,3,2,4);B.ell(18,18,3,2,4);B.set(5,9,8);B.set(24,22,8);break;
 case'bird':bird(14,10);B.ell(14,20,8,2,3);break;
 case'bird2':bird(14,12);B.line(15,13,20,20,5);break;

 const res={level:lvl,stars,coins,drops:[],boss:sp.boss,mode,relicChoice:null,name:sp.name};
 SAVE.stats.wins++;SAVE.stats.turns=(SAVE.stats.turns||0)+b.turn;SAVE.beaten=SAVE.beaten||{};

  if(sp.boss&&first){const un=RELICS.filter(r=>!(SAVE.relics||[]).includes(r.id));if(un.length)res.relicChoice=shuffle(un.slice()).slice(0,3).map(r=>r.id);}

 else if(mode==='endless'){SAVE.endless=SAVE.endless||{best:100,cur:101};SAVE.beaten[lvl]=1;SAVE.endless.best=Math.max(SAVE.endless.best,lvl);SAVE.endless.cur=lvl+1;if(Math.random()<.18)rollDrop(res);if(lvl>=110)ach('endless110');}

// ================= MUSIC (procedural chiptune) =================
const MUSIC={track:null,want:null,timer:null,step:0,next:0,gain:null};
const TRACKS={title:{bpm:72,root:110,scale:[0,3,5,7,8,10],seed:7,lead:'square',dens:.5},map:{bpm:96,root:130.8,scale:[0,2,3,5,7,8,10],seed:21,lead:'triangle',dens:.6},battle:{bpm:132,root:110,scale:[0,3,5,6,7,10],seed:42,lead:'square',dens:.7},boss:{bpm:150,root:98,scale:[0,1,3,5,6,8,10],seed:99,lead:'sawtooth',dens:.8}};
function genPattern(tr){const r=mulberry(tr.seed);const mel=[],bass=[];let deg=0;for(let i=0;i<64;i++){if(r()<tr.dens){deg=clamp(deg+Math.floor(r()*5)-2,-2,9);mel.push(deg);}else mel.push(null);}const prog=[0,0,5,3].map(x=>x);for(let i=0;i<64;i++)bass.push(i%2===0?prog[Math.floor(i/16)%4]:null);return{mel,bass};}
function noteF(tr,deg,oct=0){const sc=tr.scale;const o=Math.floor(deg/sc.length),d=((deg%sc.length)+sc.length)%sc.length;return tr.root*Math.pow(2,(sc[d]+12*(o+oct))/12);}
function startMusic(name){MUSIC.want=name;if(!SAVE.settings.music){stopMusic();return;}if(MUSIC.track===name&&MUSIC.timer)return;stopMusic();const a=AC;if(!a)return;MUSIC.track=name;const tr=TRACKS[name];const pat=genPattern(tr);MUSIC.step=0;MUSIC.next=a.currentTime+.1;
 MUSIC.gain=a.createGain();MUSIC.gain.gain.value=.5;MUSIC.gain.connect(a.destination);const g=MUSIC.gain;
 const play=(f,t,d,type,v)=>{const o=a.createOscillator(),e=a.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+.02);};
 MUSIC.timer=setInterval(()=>{if(!SAVE.settings.music){stopMusic();return;}const sd=60/tr.bpm/4;while(MUSIC.next<a.currentTime+.25){const i=MUSIC.step%64,t=MUSIC.next;const m=pat.mel[i];if(m!==null)play(noteF(tr,m,1),t,sd*1.8,tr.lead,.022);
  const b=pat.bass[i];if(b!==null)play(noteF(tr,b,-1),t,sd*1.9,'triangle',.06);if(i%4===2&&name!=='title'){const len=Math.floor(a.sampleRate*.03);const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let k=0;k<len;k++)ch[k]=(Math.random()*2-1)*(1-k/len);const s=a.createBufferSource();s.buffer=buf;const e=a.createGain();e.gain.value=.025;s.connect(e);e.connect(g);s.start(t);}
  if(i%16===0)play(noteF(tr,0,0),t,sd*8,'sine',.03);MUSIC.step++;MUSIC.next+=sd;}},60);}
function stopMusic(){if(MUSIC.timer)clearInterval(MUSIC.timer);MUSIC.timer=null;MUSIC.track=null;if(MUSIC.gain){try{MUSIC.gain.disconnect();}catch(e){}MUSIC.gain=null;}}

// contents saved (SAVE.pendingPack) in the same step; contents come from a per-save deterministic RNG,
// so cancelling, reloading or restoring an older save can never reroll a pack.
function buyPack(){if(SAVE.pendingPack)return show('pack');const price=packPrice();
 if(SAVE.coins<price){sfx('err');toast(`Not enough coins! A Card Pack costs ${price}. Keep winning to save up.`);return;}
 modal(`<div class="t" style="font-size:20px;color:#ffd24a">Buy a Card Pack?</div><div class="t" style="font-size:14px;margin-top:10px;line-height:20px">Price: <span class="coins">&#9679; ${price}</span> &nbsp; (you have &#9679; ${SAVE.coins})<br>The pack is sealed: its 3 cards are revealed after you pay.<br><span style="color:#ff8a9a">All sales are final.</span></div>`,
  [{t:'Buy &amp; Open',c:'gold',f:()=>purchasePack(price)},{t:'Cancel'}]);}
function purchasePack(price){if(SAVE.pendingPack)return show('pack');if(SAVE.coins<price){sfx('err');toast('Not enough coins!');return;}
 const n=SAVE.stats.packs||0;const cards=rollCardChoices(SAVE.unlocked,saveRng(1,n));
 SAVE.coins-=price;SAVE.stats.spent=(SAVE.stats.spent||0)+price;SAVE.stats.packs=n+1;
 SAVE.pendingPack={cards,price,n,seen:false};persist();sfx('buy');ach('buy1');show('pack');}

 R(14,10,68,108,'#000');R(16,12,64,104,'#e8dcb5');R(19,15,58,98,'#2a1236');
 for(let i=0;i<7;i++)R(19,15+i*14,58,7,i%2?'#3a1a5a':'#4a2470');
 for(let i=0;i<8;i++){R(16+i*8,8,4,4,'#e8dcb5');R(16+i*8,116,4,4,'#e8dcb5');}
 R(19,15,58,6,'#b04cff');R(19,107,58,6,'#3a7bff');
 // frog face emblem

 else{pc.onclick=()=>{if(phase===0){t0=performance.now()-1300;}};}

  fxx.clearRect(0,0,480,300);for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.05;q.vx*=.98;q.life--;if(q.life<=0){parts.splice(i,1);continue;}fxx.globalAlpha=Math.min(1,q.life/20);fxx.fillStyle=q.c;const X=q.x|0,Y=q.y|0;if(q.star){fxx.fillRect(X-1,Y,3,1);fxx.fillRect(X,Y-1,1,3);}else fxx.fillRect(X,Y,2,2);}fxx.globalAlpha=1;};};

const AI_PRI={rainstorm:9,monsoon:9,flood:8,fog:8,moon:8,eclipse:9,bloodmoon:6,dew:9,drought:7,heat:6,blizzard:7,flies:7,bait:8,lotus:7,ritual:10,wind:5,crow:8,salt:7,well:7,skater:7,bottle:3,stormeye:2,lantern:5,net:4,laser:8,foot:8,anvil:7,disco:7,duck:6,blower:5,pie:6,swatter:5};
const DEBUG={
 winNow(){if(!BT||BT.over)return;BT.f.hp=0;BT.revived=true;return BT.checkWin();},
 async aiTurn(){const b=BT;let guard=0;while(!b.over&&!b.busy&&guard++<20){const it=b.intent;const inc=it.dmg!==undefined&&!b.f.stun?b.frogDmg(it.dmg)*(it.hits||1):0;
  const play=b.hand.map((c,i)=>({c,i,cost:cardCost(c.id,c.up)})).filter(o=>o.cost<=b.p.energy);if(!play.length)break;
  const sc=o=>{const d=CARD[o.c.id];let s=AI_PRI[o.c.id]||5;if(d.t==='ward'||o.c.id==='turtle'||o.c.id==='mud')s=inc>b.p.block?11:1;if(o.c.id==='lightning'||o.c.id==='spark'||o.c.id==='clap')s=b.f.wet?10:4;if(o.c.id==='collapse')s=b.env.pads>=2?9:0;if(o.c.id==='lullaby'||o.c.id==='siren')s=b.night()?10:6;if(o.c.id==='muck')s=0.5;if(o.c.id==='duck')s=ATTACK_MOVES[b.intent.k]&&!b.p.decoy?9:1;if(o.c.id==='swatter')s=4+b.env.flies*2;if(o.c.id==='echo')s=b.lastCard?6:0;if(o.c.id==='pact'&&b.p.hp<15)s=0;if(o.c.id==='silence')s=ATTACK_MOVES[b.intent.k]&&!o.c.up?0:6;return s-o.cost*.1;};
  play.sort((a,b2)=>sc(b2)-sc(a));if(sc(play[0])<=0)break;await b.play(play[0].i);}
  if(!b.over)await b.endTurn();},
