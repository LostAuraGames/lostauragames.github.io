d_tomb:{text:"Sous les dunes se trouve le Tombeau du Roi-Titan, et dans sa salle la plus profonde Sekhmar, le Pharaon des Sables, boit la force des titans tombés, une jarre de poussière à la fois.\n\nQuand il aura assez bu, il sortira du tombeau comme un dieu, et chaque momie du désert marchera derrière lui.\n\nDescends dans le tombeau avant ce jour. Brise le pharaon, et laisse le Roi-Titan reposer.",done:"Le sable a cessé de bouger quand il est tombé ; les dunes ne sont plus que des dunes. L'Oasis gravera ton nom auprès des titans. Peu de mortels s'y trouvent."},
d_ziggurat:{text:"Il reste un serviteur de la Couronne dans le désert. Azhurak, un djinn des anciennes tempêtes, a été enchaîné par des prêtres Creux dans la Ziggourat des Tempêtes. Ils fouettent sa rage en tempêtes de verre qui ensevelissent des caravanes entières.\n\nIl n'a pas toujours été cruel. Mais enchaîné ainsi, il ne peut que détruire. Gravis la Ziggourat et mets fin à sa souffrance, et à celle du désert.",done:"Les tempêtes de verre ont cessé. Hier soir, le vent a soufflé doux et chaud sur l'Oasis, et certains d'entre nous jurent qu'il ressemblait à un soupir de soulagement."},
m7_1:{text:"Thalassa a sombré il y a mille ans. C'était la plus fière des cités des hommes : ils avaient forgé des cloches capables d'appeler les marées. Quand la mer l'a prise, les cloches se sont tues.\n\nMaintenant elles sonnent de nouveau la nuit. Et mes marins descendent au rivage en souriant, et continuent de marcher jusqu'à ce que l'eau se referme sur leur tête.\n\nQuelque chose les appelle. Ta carte dit que la Couronne Creuse sait quoi.",done:"Il te faudra un navire et un équipage qui ne craint pas les profondeurs. Par chance, j'ai l'un des deux. Trouvons l'autre."},
m7_2:{text:"Les crabes du récif sont sortis des hauts-fonds, gros comme des tonneaux, et ne repartent pas. Ils coupent nos filets, coulent nos esquifs et entraînent les pêcheurs dans l'eau.\n\nChasse-les des quais et de la plage. Port Nerei ne peut pas combattre les abysses s'il ne peut même pas pêcher.",done:"Les filets sont remontés pleins ce matin. Les poissonnières cuisinent du crabe pour tout le port, et tu es invité, que ça te plaise ou non."},
m7_3:{text:"Les guerriers naga gardent les routes englouties vers Thalassa. Leurs écailles sont plus dures que l'acier et plus légères que le cuir. Mes charpentiers de marine disent qu'une coque blindée de ces écailles pourrait naviguer là où aucun navire n'a navigué : vers le bas.\n\nRapporte-moi des écailles de naga. Nous construisons un navire capable de suivre ta carte.",done:"La coque est blindée. Les charpentiers l'appellent la Lanterne des Abysses. Elle tiendra, jurent-ils. J'espère qu'ils ont raison."},
m7_4:{text:"Les cloches du Récif des Cloches sonnent la nuit, et chaque fois, un autre marin entre dans la mer. Elles ont été faites pour appeler les marées. Maintenant quelqu'un s'en sert pour appeler les gens.\n\nFais taire les cloches noyées. Coupe les cordes, brise les battants, peu importe comment.",done:"La nuit dernière a été silencieuse. Pas un marin n'est entré dans la mer. Le vieux Merrit est resté assis sur les quais jusqu'à l'aube, juste pour écouter le calme."},
m7_5:{text:"Mon ancien capitaine, Brineheart, a sombré avec son navire dans l'Anse du Naufrage il y a vingt ans. Maintenant il sort de l'anse la nuit, menant les noyés contre mon port. C'était mon ami.\n\nLibère-le. Ce qui porte son visage aujourd'hui n'est pas lui. Rapporte-moi ce qu'il transporte.",done:"Une perle gravée d'un wyrm enroulé. Brineheart la portait à quelqu'un dans la jungle : la Reine Naga commerce avec les wyrms du Bois-Wyrm.\n\nLa mer, la jungle, le ciel... Vharos les lie tous ensemble. Quand il aura fini, il ne restera plus un seul lieu où l'humanité pourra tenir debout."},
m7_6:{text:"Le gardien Okonkwo protège Vinehollow à l'orée de la Jungle des Wyrms. Si la Reine Naga commerce avec les wyrms, il doit le savoir avant que la jungle ne se retourne aussi contre nous.\n\nPorte la perle à l'est. Et merci pour Brineheart. Je ne pouvais pas le faire moi-même. Port Nerei gardera une lanterne allumée pour toi.",done:"(Le gardien Okonkwo lève la perle vers la lumière verte de la jungle.) Les wyrms de Verdigrax... voilà pourquoi le dieu vert dort si mal. Viens. La jungle écoute."},
d_abyss:{text:"La reine Thalassyr règne sur le Temple Abyssal au fond de la cité engloutie. C'est elle qui sonne les cloches. Elle chante pour éveiller les noyés, et elle a promis toute la mer au Roi Creux : chaque côte, chaque port, chaque navire.\n\nLa Lanterne des Abysses est prête. Descends dans le Temple Abyssal et fais taire la Reine Naga à jamais.",done:"La mer est calme, et les cloches se sont tues pour de bon. Mes marins sont rentrés auprès de leurs familles hier soir. Port Nerei racontera ton histoire tant qu'il y aura des navires."},
});

qadd('it',{
m6_1:{text:"(La sceicca Nefret posa la tavoletta di pietra solare su un cuscino, come fosse un bambino addormentato.)\n\nLe sabbie ricordano i titani. Qui combatterono i primi dèi e qui morirono, e le loro ossa sono le dune che hai attraversato. Il mio popolo custodisce le loro tombe da tremila anni.\n\nSekhmar era il sommo sacerdote del Re Titano. Giurò che un giorno avrebbe bevuto la forza del suo signore e camminato come un dio. La Corona Cava gli ha promesso quel giorno. E ora i morti del deserto si risvegliano per servirlo.",done:"Hai portato il segreto di un jarl morto attraverso mezzo mondo per avvertire degli sconosciuti. L'Oasi non dimentica cose simili. Bevi, riposa, e poi andremo a caccia."},
m6_2:{text:"Gli scorpioni delle dune sono diventati enormi e audaci. Tendono agguati alle nostre carovane d'acqua presso i pozzi, e senza carovane l'Oasi morirà di sete prima ancora che il faraone alzi un dito.\n\nRipulisci dagli scorpioni le rotte delle carovane. Ogni carovana che arriva sono cento giorni in più di lotta.",done:"Quattro carovane sono arrivate all'alba, con i cammelli che cantavano per l'acqua. I miei figli sono corsi loro incontro. È questo che hai comprato oggi."},
m6_3:{text:"Gli sciacalli del deserto non sono selvatici. Guarda bene: ognuno porta un collare d'oro battuto, marchiato con il sole di Sekhmar. Sono i suoi segugi, i suoi occhi tra le dune. Dove ululano, le sue mummie li seguono.\n\nPortami i loro collari. Ogni collare che fondiamo è un occhio che gli caviamo.",done:"Sei collari, e sei occhi in meno. Gli sciacalli ululano, ma stanotte nulla risponde. Il faraone è cieco dalla nostra parte delle dune."},
m6_4:{text:"Nella Gabbia Toracica del Titano, il culto macina le antiche ossa in polvere. La polvere di titano mescolata alla stregoneria Cava fa alzare e camminare la sabbia: i colossi che hai visto sono fatti di quella.\n\nRaccogli i frammenti d'osso prima che vengano macinati. Li seppelliremo in terra consacrata, dove nessun sacerdote possa raggiungerli.",done:"I frammenti sono avvolti in lino bianco e sepolti sotto il santuario dell'Oasi. I titani dormono un po' meglio stanotte. Anch'io."},
m6_5:{text:"Il visir delle sabbie Ashkar è la mano destra di Sekhmar: una mummia che fu astuta in vita ed è più crudele nella morte. Lavora all'Obelisco di Sekhmar, incidendo il rituale che risveglierà il suo signore in tutta la sua forza.\n\nFerma il rituale. Distruggi Ashkar e portami ciò che custodisce.",done:"Una carta stellare dipinta su pelle di squalo. Ma le stelle sono sbagliate... no. Sono viste dal fondo del mare. È una mappa per Thalassa, la città annegata.\n\nLa Corona ha alleati in ogni angolo del mondo: la giungla, il cielo, l'abisso. Vharos non sta radunando un esercito. Sta risvegliando ogni antico male che l'umanità abbia mai sepolto."},
m6_6:{text:"Il capitano di porto Kael custodisce Port Nerei sulla costa occidentale, dove il mare inghiottì Thalassa mille anni fa. Se qualcuno può seguire una carta tracciata dal fondo del mare, è lui.\n\nL'Oasi ti deve la sua acqua e i suoi figli. Va' a ovest, Portatore dell'Aura. Le sabbie ricorderanno il tuo nome.",done:"(Il capitano di porto Kael srotola la carta di pelle di squalo e tace.) Thalassa. Mia nonna giurava che le campane suonano ancora laggiù. Ultimamente lo giurano anche i miei marinai."},
d_tomb:{text:"Sotto le dune giace la Tomba del Re Titano, e nella sua sala più profonda Sekhmar, il Faraone delle Sabbie, beve la forza dei titani caduti, un vaso di polvere alla volta.\n\nQuando avrà bevuto abbastanza, uscirà dalla tomba come un dio, e ogni mummia del deserto marcerà dietro di lui.\n\nScendi nella tomba prima che arrivi quel giorno. Spezza il faraone e lascia riposare il Re Titano.",done:"La sabbia ha smesso di muoversi quando è caduto; le dune sono di nuovo solo dune. L'Oasi inciderà il tuo nome accanto ai titani. Pochi mortali stanno lì."},
d_ziggurat:{text:"Resta un altro servo della Corona nel deserto. Azhurak, un djinn delle antiche tempeste, è stato incatenato da sacerdoti Cavi dentro lo Ziggurat delle Tempeste. Frustano la sua furia in tempeste di vetro che seppelliscono vive intere carovane.\n\nNon è sempre stato crudele. Ma incatenato così, può solo distruggere. Scala lo Ziggurat e poni fine alla sua sofferenza, e a quella del deserto.",done:"Le tempeste di vetro sono finite. Ieri notte il vento ha soffiato dolce e caldo sull'Oasi, e alcuni di noi giurano che sembrava un sospiro di sollievo."},
m7_1:{text:"Thalassa sprofondò mille anni fa. Era la città più orgogliosa degli uomini: costruirono campane capaci di chiamare le maree. Quando il mare la prese, le campane tacquero.\n\nOra suonano di nuovo di notte. E i miei marinai scendono alla riva sorridendo, e continuano a camminare finché l'acqua non si chiude sopra le loro teste.\n\nQualcosa li chiama. La tua carta dice che la Corona Cava sa cosa.",done:"Ti serviranno una nave e un equipaggio che non tema l'abisso. Per fortuna, ho una delle due cose. Troviamo l'altra."},
m7_2:{text:"I granchi della scogliera sono usciti dalle secche, grandi come barili, e non se ne vanno. Tagliano le nostre reti, affondano le nostre barche e trascinano i pescatori in acqua.\n\nCacciali dal molo e dalla spiaggia. Port Nerei non può combattere l'abisso se non riesce nemmeno a pescare.",done:"Le reti sono risalite piene stamattina. Le pescivendole cucinano granchi per tutto il porto, e sei invitato, che ti piaccia o no."},
m7_3:{text:"I guerrieri naga sorvegliano le strade sommerse verso Thalassa. Le loro scaglie sono più dure dell'acciaio e più leggere del cuoio. I miei maestri d'ascia dicono che uno scafo rivestito con esse potrebbe navigare dove nessuna nave ha mai navigato: verso il basso.\n\nPortami scaglie di naga. Stiamo costruendo una nave che possa seguire la tua carta.",done:"Lo scafo è rivestito. I maestri d'ascia la chiamano la Lanterna degli Abissi. Reggerà, giurano. Spero abbiano ragione."},
m7_4:{text:"Le campane della Scogliera delle Campane suonano di notte, e ogni volta un altro marinaio entra in mare. Furono fatte per chiamare le maree. Ora qualcuno le usa per chiamare le persone.\n\nZittisci le campane annegate. Taglia le corde, spezza i batacchi, qualunque cosa serva.",done:"Ieri notte c'è stato silenzio. Nemmeno un marinaio è entrato in mare. Il vecchio Merrit è rimasto seduto sul molo fino all'alba, solo per ascoltare la quiete."},
m7_5:{text:"Il mio vecchio capitano, Brineheart, affondò con la sua nave nella Cala del Naufragio vent'anni fa. Ora esce dalla cala di notte, guidando gli annegati contro il mio porto. Era mio amico.\n\nLiberalo. Ciò che ora porta il suo volto non è lui. Portami ciò che ha con sé.",done:"Una perla incisa con un drago avvolto su se stesso. Brineheart la stava portando a qualcuno nella giungla: la Regina Naga commercia con i draghi del Bosco dei Draghi.\n\nIl mare, la giungla, il cielo... Vharos li sta legando tutti insieme. Quando avrà finito, all'umanità non resterà un luogo dove stare in piedi."},
m7_6:{text:"Il guardiano Okonkwo protegge Vinehollow, ai margini della Giungla dei Draghi. Se la Regina Naga commercia con i draghi, deve saperlo prima che anche la giungla si rivolti contro di noi.\n\nPorta la perla a est. E grazie per Brineheart. Io non ce l'avrei fatta. Port Nerei terrà una lanterna accesa per te.",done:"(Il guardiano Okonkwo solleva la perla verso la luce verde della giungla.) I draghi di Verdigrax... ecco perché il dio verde dorme così male. Vieni. La giungla sta ascoltando."},
d_abyss:{text:"La regina Thalassyr governa il Tempio Abissale in fondo alla città annegata. È lei che suona le campane. Canta per risvegliare gli annegati, e ha promesso tutto il mare al Re Cavo: ogni costa, ogni porto, ogni nave.\n\nLa Lanterna degli Abissi è pronta. Scendi nel Tempio Abissale e zittisci per sempre la Regina Naga.",done:"Il mare è calmo, e le campane tacciono per sempre. I miei marinai sono tornati dalle loro famiglie ieri notte. Port Nerei racconterà la tua storia finché ci saranno navi."},
});

qadd('pt',{
m6_1:{text:"(A xeica Nefret coloca a tábua de pedra solar sobre uma almofada, como se fosse uma criança dormindo.)\n\nAs areias se lembram dos titãs. Eles lutaram contra os primeiros deuses aqui e morreram aqui, e seus ossos são as dunas que você atravessou. Meu povo guarda suas tumbas há três mil anos.\n\nSekhmar era o sumo sacerdote do Rei Titã. Jurou que um dia beberia a força de seu senhor e caminharia como um deus. A Coroa Oca lhe prometeu esse dia. E agora os mortos do deserto despertam para servi-lo.",done:"Você carregou o segredo de um jarl morto por meio mundo para avisar estranhos. O Oásis não esquece algo assim. Beba, descanse, e depois caçaremos."},
m6_2:{text:"Os escorpiões das dunas ficaram enormes e ousados. Emboscam nossas caravanas de água nos poços, e sem caravanas o Oásis morrerá de sede antes que o faraó mova um dedo.\n\nLimpe os escorpiões das rotas das caravanas. Cada caravana que chega são mais cem dias de luta.",done:"Quatro caravanas chegaram ao amanhecer, os camelos cantando por água. Meus filhos correram para recebê-las. Foi isso que você comprou hoje."},
m6_3:{text:"Os chacais do deserto não são selvagens. Olhe bem: cada um usa uma coleira de ouro batido, marcada com o sol de Sekhmar. São seus cães, seus olhos nas dunas. Onde uivam, suas múmias seguem.\n\nTraga-me as coleiras. Cada coleira que derretemos é um olho que arrancamos.",done:"Seis coleiras, e seis olhos a menos. Os chacais uivam, mas nada responde esta noite. O faraó está cego do nosso lado das dunas."},
m6_4:{text:"Na Costela do Titã, o culto mói os velhos ossos até virarem pó. Pó de titã misturado com feitiçaria Oca faz a areia se erguer e andar: os colossos que você viu são feitos dele.\n\nRecolha os fragmentos de osso antes que sejam moídos. Vamos enterrá-los em solo sagrado, onde nenhum sacerdote os alcance.",done:"Os fragmentos estão envoltos em linho branco e enterrados sob o santuário do Oásis. Os titãs dormem um pouco melhor esta noite. Eu também."},
m6_5:{text:"O vizir da areia Ashkar é a mão direita de Sekhmar: uma múmia que foi astuta em vida e é mais cruel na morte. Ele trabalha no Obelisco de Sekhmar, entalhando o ritual que despertará seu senhor com toda a força.\n\nPare o ritual. Destrua Ashkar e traga-me o que ele guarda.",done:"Uma carta estelar pintada em pele de tubarão. Mas as estrelas estão erradas... não. São vistas do fundo do mar. É um mapa para Thalassa, a cidade afogada.\n\nA Coroa tem aliados em cada canto do mundo: a selva, o céu, o abismo. Vharos não está erguendo um exército. Está despertando cada mal antigo que a humanidade já enterrou."},
m6_6:{text:"O mestre do porto Kael cuida de Port Nerei na costa oeste, onde o mar engoliu Thalassa há mil anos. Se alguém pode seguir uma carta traçada do fundo do mar, é ele.\n\nO Oásis lhe deve sua água e seus filhos. Vá para o oeste, Portador da Aura. As areias se lembrarão do seu nome.",done:"(O mestre do porto Kael desenrola a carta de pele de tubarão e fica em silêncio.) Thalassa. Minha avó jurava que os sinos ainda tocam lá embaixo. Ultimamente, meus marinheiros também juram."},
d_tomb:{text:"Sob as dunas está a Tumba do Rei Titã, e em seu salão mais profundo Sekhmar, o Faraó da Areia, bebe a força dos titãs caídos, um jarro de pó de cada vez.\n\nQuando tiver bebido o bastante, sairá da tumba como um deus, e cada múmia do deserto marchará atrás dele.\n\nDesça à tumba antes que esse dia chegue. Quebre o faraó e deixe o Rei Titã descansar.",done:"A areia parou de se mover quando ele caiu; as dunas voltaram a ser só dunas. O Oásis entalhará seu nome ao lado dos titãs. Poucos mortais estão lá."},
d_ziggurat:{text:"Resta mais um servo da Coroa no deserto. Azhurak, um djinn das velhas tempestades, foi acorrentado por sacerdotes Ocos dentro do Zigurate das Tempestades. Eles chicoteiam sua fúria em tempestades de vidro que enterram caravanas inteiras vivas.\n\nEle nem sempre foi cruel. Mas acorrentado assim, só pode destruir. Suba o Zigurate e acabe com seu sofrimento, e com o do deserto.",done:"As tempestades de vidro acabaram. Ontem à noite o vento soprou suave e morno sobre o Oásis, e alguns de nós juram que soou como um suspiro de alívio."},
m7_1:{text:"Thalassa afundou há mil anos. Era a cidade mais orgulhosa dos homens: construíram sinos capazes de chamar as marés. Quando o mar a levou, os sinos se calaram.\n\nAgora voltam a tocar à noite. E meus marinheiros descem até a praia sorrindo, e continuam andando até a água se fechar sobre suas cabeças.\n\nAlgo os está chamando. Sua carta diz que a Coroa Oca sabe o quê.",done:"Você vai precisar de um navio e de uma tripulação que não tema o abismo. Por sorte, tenho uma das duas coisas. Vamos achar a outra."},
m7_2:{text:"Os caranguejos do recife saíram das águas rasas, grandes como barris, e não vão embora. Cortam nossas redes, afundam nossos botes e arrastam os pescadores para a água.\n\nTire-os do cais e da praia. Port Nerei não pode lutar contra o abismo se nem consegue pescar.",done:"As redes subiram cheias esta manhã. As peixeiras estão cozinhando caranguejo para o porto inteiro, e você está convidado, queira ou não."},
m7_3:{text:"Os guerreiros naga guardam as estradas afogadas para Thalassa. Suas escamas são mais duras que o aço e mais leves que o couro. Meus construtores navais dizem que um casco revestido com elas poderia navegar aonde nenhum navio navegou: para baixo.\n\nTraga-me escamas de naga. Estamos construindo um navio que possa seguir sua carta.",done:"O casco está revestido. Os construtores a chamam de Lanterna das Profundezas. Ela vai aguentar, juram. Espero que tenham razão."},
m7_4:{text:"Os sinos do Recife dos Sinos tocam à noite, e cada vez que tocam, outro marinheiro entra no mar. Foram feitos para chamar as marés. Agora alguém os usa para chamar pessoas.\n\nSilencie os sinos afogados. Corte as cordas, quebre os badalos, o que for preciso.",done:"Ontem à noite houve silêncio. Nem um marinheiro entrou no mar. O velho Merrit ficou sentado no cais até o amanhecer, só para ouvir a calma."},
m7_5:{text:"Meu velho capitão, Brineheart, afundou com seu navio na Enseada do Naufrágio há vinte anos. Agora ele sai da enseada à noite, liderando os afogados contra o meu porto. Ele era meu amigo.\n\nLiberte-o. O que usa o rosto dele agora não é ele. Traga-me o que ele carregar.",done:"Uma pérola gravada com uma serpe enrolada. Brineheart a levava para alguém na selva: a Rainha Naga negocia com as serpes do Bosque Serpe.\n\nO mar, a selva, o céu... Vharos está amarrando todos juntos. Quando terminar, não restará lugar onde a humanidade possa ficar de pé."},
m7_6:{text:"O guardião Okonkwo protege Vinehollow, na borda da Selva Serpe. Se a Rainha Naga negocia com as serpes, ele precisa saber antes que a selva também se volte contra nós.\n\nLeve a pérola para o leste. E obrigado por Brineheart. Eu não conseguiria fazer isso. Port Nerei manterá uma lanterna acesa para você.",done:"(O guardião Okonkwo ergue a pérola contra a luz verde da selva.) As serpes de Verdigrax... então é por isso que o deus verde dorme tão mal. Venha. A selva está ouvindo."},
d_abyss:{text:"A rainha Thalassyr governa o Templo Abissal no fundo da cidade afogada. É ela quem toca os sinos. Ela canta para despertar os afogados, e prometeu todo o mar ao Rei Oco: cada costa, cada porto, cada navio.\n\nA Lanterna das Profundezas está pronta. Desça ao Templo Abissal e silencie a Rainha Naga para sempre.",done:"O mar está calmo, e os sinos se calaram de vez. Meus marinheiros voltaram para suas famílias ontem à noite. Port Nerei contará sua história enquanto houver navios."},
});

qadd('de',{
m14_1:{text:"(Archontin Solenne erhebt sich nicht vom Kriegstisch. Ihre Rüstung ist gesprungen, und die Laterne an ihrer Seite brennt sehr niedrig.)\n\nSo. Der Träger der Aura. Jede Nachricht, die Letztes Licht im vergangenen Jahr erreichte, trug deinen Namen: Hearthmoor, die Halle des Königs, Cinderwatch, die Oase, die ertrunkenen Glocken. Ich glaubte nicht, dass ein einzelner Mensch all das vollbringen könnte. Jetzt sehe ich das Licht an deiner Hand, und ich glaube es.\n\nDies ist der Riss des Ungeschaffenen, die Wunde der Welt, in der Vharos thront. Alles, was die Hohle Krone getan hat, jede Seuche, jede Krone, jeder erwachte Tote, diente dazu, diesen Ort zu nähren. Letztes Licht ist die letzte Festung der Menschheit, die sich ihm entgegenstellt.",done:"Setz dich einen Moment zu mir, vor dem Ende. Das hast du dir verdient. Dann sage ich dir, was Vharos wirklich ist."},
m14_2:{text:"Die Ungeschaffenen Schrecken quellen jede Nacht aus dem Riss. Sie sind keine Bestien. Sie sind, was übrig bleibt, wenn etwas ungeschaffen wird: Erinnerungen, an die sich niemand erinnert, Formen ohne Bedeutung. Wo sie etwas berühren, vergisst die Welt sich selbst.\n\nTreib sie von den Mauern von Letztes Licht zurück. Meine Soldaten können ein Tor halten. Gegen das Vergessenwerden können sie nichts halten.",done:"Die Mauern sind still. Meine Späher sagen, die Schrecken wichen zurück, als du kämpftest; sie mögen das Licht nicht, das du trägst. Gut. Ihr Herr mag es auch nicht."},
m14_3:{text:"Vharos war einst ein Mensch. Mehr als das: Er war der erste König der Menschheit und der erste Träger der Aura. Tausend Jahre lang sah er jeden Krieg, jeden Verrat, jede Grausamkeit seines Volkes, und schließlich beschloss er, dass das Licht der Menschheit eine Lüge sei. Er riss es aus seinem eigenen Herzen und wurde hohl.\n\nNun will er uns ungeschaffen machen, uns alle, damit niemand je wieder leidet oder Leid verursacht. Er nennt es Gnade.\n\nDie Leeren-Titanenbrut trägt Splitter seiner Krone in ihren Kernen. Jeder Splitter ist ein Stück des Herzens, das er fortwarf. Bring sie mir.",done:"Halt einen an dein Licht. Siehst du es? Er glüht, ganz schwach. Selbst jetzt ist noch etwas vom Menschen in der Krone. Denk daran, wenn du vor ihm stehst."},
m14_4:{text:"Die Zerschmetterte Brücke ist der einzige Weg über den Riss zur Ungeschaffenen Spitze, und die Hohle Krone hat Anker in sie getrieben: Säulen aus Leere, die den Riss offen halten und die Welt hineinziehen, Stein um Stein.\n\nZerbrich die Anker. Wenn sich der Riss auch nur ein wenig schließt, wird es jedes Land spüren, durch das du gegangen bist.",done:"Der Riss ist heute Nacht geschrumpft. Per Laternensignal kamen Nachrichten: Der Schnee von Rimeholt fällt nicht mehr schwarz, und die Brunnen von Bogmere laufen klar. Alles, was du gerettet hast, kannst du noch immer retten."},
m14_5:{text:"Am Rand des Nichts wandelt Vharos' Schatten: der Teil von ihm, der sich noch daran erinnert, menschlich gewesen zu sein, verdreht zu einem Wächter, damit er ihn niemals erreichen kann. Er tötet alles, was sich nähert, weil er es nicht erträgt, gesehen zu werden.\n\nBesiege ihn. Er trägt den Schlüssel zum Hohlen Thron, und ich glaube, er wartet schon lange auf jemanden, der stark genug ist, ihn zu nehmen.",done:"(Der Schatten kniet nieder, bevor er vergeht. Er greift nicht an. Er legt den Schlüssel in deine Hand und flüstert ein einziges Wort: „Erinnere ihn.“)\n\nEin Schlüssel aus schwarzem Glas, und eine Bitte des letzten menschlichen Teils des Hohlen Königs. Das hatte ich nicht erwartet. Vielleicht gibt es mehr als einen Weg, dies zu beenden."},
m14_6:{text:"Dies ist die letzte Tür. Jenseits der Ungeschaffenen Spitze liegt der Hohle Thron, und auf ihm sitzt Vharos.\n\nIch habe dir keinen Rat mehr zu geben. Alle, denen du auf deinem Weg begegnet bist, Maren und Hollis, König Aldric, Sera Vex, Mutter Ilse, Jarl Brynja, Scheicha Nefret, Kael, haben ihr Licht mit dir vorausgeschickt. Du trägst die Aura nicht allein. Das hast du nie.\n\nWenn du bereit bist, geh. Letztes Licht wird seine Laterne brennen lassen, bis du heimkehrst.",done:"(Archontin Solenne packt deinen Arm, wie Soldaten es vor einer Schlacht tun.) Komm zurück. Das ist ein Befehl, Träger der Aura. Komm zurück."},
d_spire:{text:"Vessra, die Stimme des Hohlen, bewacht die letzte Treppe der Ungeschaffenen Spitze. Sie folgte Vharos als Erste in die Hohlheit, und jede Predigt der Hohlen Krone, jeder Kult in jedem Land, das du durchquert hast, trug ihre Worte.\n\nSie wird versuchen, dich zu überzeugen, dass er recht hat: dass die Menschheit grausam ist, dass die Welt ohne uns stiller wäre. Hör nicht hin. Du hast gesehen, was Menschen sein können.\n\nErklimm die Spitze. Bring die Stimme zum Schweigen.",done:"Die Stimme schweigt, und überall auf der Welt sind die Hohlen Kulte verwirrt erwacht, wie aus einem langen bösen Traum. Nur der Thron bleibt."},
d_throne:{text:"Der Hohle Thron. Dort wartet Vharos, der erste König, der sein eigenes Licht fortwarf, weil er es nicht mehr ertrug, es auf Grausamkeit scheinen zu sehen.\n\nEr wird mit allem kämpfen, was die Krone gestohlen hat: der Seuche, der Kälte, den Ertrunkenen, den Toten. Und er wird dir sagen, dass die Menschheit ungeschaffen zu machen das Gütigste ist, was man tun kann.\n\nZeig ihm, dass er sich irrt. Du trägst die Verlorene Aura, das Licht, das er fortwarf, und mit ihm das Licht jedes Menschen, der dir half, diese Tür zu erreichen. Beende die Hohle Krone.",done:"(Als Vharos fällt, zerbricht die Hohle Krone in zwei Teile. Einen Augenblick lang fließt das Licht deiner Hand in die Leere in ihrem Inneren, und das Gesicht des alten Königs verändert sich: müde, menschlich, erstaunt.)\n\n„Ich hatte es vergessen“, sagt er. „Ich hatte vergessen, wie es aussieht.“ Dann ist er fort, und nur das Licht bleibt.\n\nDer Riss schließt sich. In Hearthmoor sieht Maren die Morgendämmerung golden über dem Flüsterwald aufgehen, und die Ameisen sind wieder nur Ameisen. Die Welt wird sich an dich erinnern, Träger der Aura. Die Geschichte der Hohlen Krone ist zu Ende. Deine nicht."},
});

qadd('es',{
m14_1:{text:"(La arconte Solenne no se levanta de la mesa de guerra. Su armadura está agrietada, y el farol a su lado arde muy bajo.)\n\nAsí que el Portador del Aura. Cada mensaje que ha llegado a Última Luz el último año traía tu nombre: Hearthmoor, el salón del Rey, Cinderwatch, el Oasis, las campanas ahogadas. No creía que una sola persona pudiera hacer todo eso. Ahora veo la luz en tu mano, y lo creo.\n\nEsta es la Grieta de lo Deshecho, la herida del mundo donde se sienta Vharos. Todo lo que ha hecho la Corona Hueca, cada plaga, cada corona y cada muerto que despierta, fue para alimentar este lugar. Última Luz es la última fortaleza de la humanidad que se alza ante ella.",done:"Siéntate conmigo un momento antes del final. Te lo has ganado. Luego te diré lo que Vharos es en realidad."},
m14_2:{text:"Los Horrores Deshechos salen de la Grieta cada noche. No son bestias. Son lo que queda cuando algo es deshecho: recuerdos sin nadie que los recuerde, formas sin sentido. Donde tocan, el mundo se olvida de sí mismo.\n\nHazlos retroceder de las murallas de Última Luz. Mis soldados pueden defender una puerta. No pueden defenderse de ser olvidados.",done:"Las murallas están en calma. Mis exploradores dicen que los Horrores retrocedieron cuando luchaste; no les gusta la luz que llevas. Bien. A su amo tampoco."},
m14_3:{text:"Vharos fue un hombre. Más que eso: fue el primer rey de la humanidad, y el primer Portador del Aura. Vio cada guerra, cada traición, cada crueldad de su pueblo durante mil años, y al final decidió que la luz de la humanidad era una mentira. Se la arrancó del corazón y quedó hueco.\n\nAhora quiere deshacernos, a todos, para que nadie vuelva a sufrir ni a causar sufrimiento. Lo llama misericordia.\n\nLos Engendros Titánicos del Vacío llevan fragmentos de su corona en el núcleo. Cada fragmento es un pedazo del corazón que desechó. Tráemelos.",done:"Acerca uno a tu luz. ¿Lo ves? Brilla, débilmente. Incluso ahora queda algo del hombre en la corona. Recuérdalo cuando estés ante él."},
m14_4:{text:"El Puente Destrozado es el único camino a través de la Grieta hasta la Aguja Deshecha, y la Corona Hueca le ha clavado anclas: pilares de vacío que mantienen abierta la Grieta y arrastran el mundo hacia ella, piedra a piedra.\n\nRompe las anclas. Si la Grieta se cierra aunque sea un poco, cada tierra que has recorrido lo notará.",done:"La Grieta se encogió esta noche. Llegaron mensajes por señales de farol: las nieves de Rimeholt dejaron de caer negras, y los pozos de Bogmere corren limpios. Todo lo que salvaste sigue siendo tuyo para salvar."},
m14_5:{text:"En el Borde de la Nada camina la Sombra de Vharos: la parte de él que aún recuerda haber sido humana, retorcida en guardián para que nunca pueda alcanzarlo. Mata todo lo que se acerca, porque no soporta ser vista.\n\nDerrótala. Lleva la llave del Trono Hueco, y creo que lleva mucho tiempo esperando a alguien lo bastante fuerte para tomarla.",done:"(La Sombra se arrodilla antes de desvanecerse. No ataca. Deposita la llave en tu mano y susurra una palabra: «Recuérdaselo».)\n\nUna llave de vidrio negro, y una petición de la última parte humana del Rey Hueco. No lo esperaba. Quizá haya más de una forma de terminar con esto."},
m14_6:{text:"Esta es la última puerta. Más allá de la Aguja Deshecha está el Trono Hueco, y en él se sienta Vharos.\n\nNo tengo más consejos que darte. Todos los que conociste en tu camino, Maren y Hollis, el rey Aldric, Sera Vex, la Madre Ilse, la jarl Brynja, la jequesa Nefret, Kael, enviaron su luz por delante contigo. No llevas el Aura solo. Nunca la llevaste.\n\nCuando estés listo, ve. Última Luz mantendrá su farol encendido hasta que vuelvas a casa.",done:"(La arconte Solenne te aprieta el brazo, como hacen los soldados antes de una batalla.) Vuelve. Es una orden, Portador del Aura. Vuelve."},
d_spire:{text:"Vessra, la Voz de lo Hueco, guarda la última escalera de la Aguja Deshecha. Fue la primera en seguir a Vharos al vacío, y cada sermón de la Corona Hueca, cada culto en cada tierra que cruzaste, llevaba sus palabras.\n\nIntentará convencerte de que él tiene razón: que la humanidad es cruel, que el mundo sería más tranquilo sin nosotros. No la escuches. Has visto lo que las personas pueden ser.\n\nSube la Aguja. Silencia la Voz.",done:"La Voz calla, y por todo el mundo los cultos Huecos han despertado confusos, como de un largo mal sueño. Solo queda el Trono."},
d_throne:{text:"El Trono Hueco. Allí espera Vharos, el primer rey, que desechó su propia luz porque ya no soportaba verla brillar sobre la crueldad.\n\nLuchará con todo lo que la Corona ha robado: la plaga, el frío, los ahogados, los muertos. Y te dirá que deshacer a la humanidad es lo más bondadoso que nadie podría hacer.\n\nDemuéstrale que se equivoca. Llevas el Aura Perdida, la luz que él desechó, y con ella la luz de cada persona que te ayudó a llegar a esta puerta. Acaba con la Corona Hueca.",done:"(Cuando Vharos cae, la Corona Hueca se parte en dos. Por un instante la luz de tu mano fluye hacia el vacío de su interior, y el rostro del viejo rey cambia: cansado, humano, asombrado.)\n\n«Lo había olvidado», dice. «Había olvidado cómo era». Y luego se ha ido, y solo queda la luz.\n\nLa Grieta se está cerrando. En Hearthmoor, Maren ve amanecer dorado sobre el Bosque Sussurrante, y las hormigas vuelven a ser solo hormigas. El mundo te recordará, Portador del Aura. La historia de la Corona Hueca ha terminado. La tuya no."},
});

qadd('fr',{
m14_1:{text:"(L'archonte Solenne ne se lève pas de la table de guerre. Son armure est fendue, et la lanterne à ses côtés brûle très bas.)\n\nAinsi, le Porteur de l'Aura. Chaque message parvenu à Dernière Lumière cette année portait ton nom : Hearthmoor, la salle du Roi, Cinderwatch, l'Oasis, les cloches noyées. Je ne croyais pas qu'une seule personne puisse accomplir tout cela. Maintenant je vois la lumière sur ta main, et je le crois.\n\nVoici la Faille de l'Indéfait, la blessure du monde où siège Vharos. Tout ce qu'a fait la Couronne Creuse, chaque peste, chaque couronne, chaque mort réveillé, servait à nourrir ce lieu. Dernière Lumière est la dernière forteresse de l'humanité dressée devant elle.",done:"Assieds-toi un instant avec moi avant la fin. Tu l'as bien mérité. Ensuite, je te dirai ce qu'est vraiment Vharos."},
m14_2:{text:"Les Horreurs Défaites sortent de la Faille chaque nuit. Ce ne sont pas des bêtes. Elles sont ce qui reste quand une chose est défaite : des souvenirs que personne ne se rappelle, des formes sans signification. Partout où elles touchent, le monde s'oublie lui-même.\n\nRepousse-les loin des remparts de Dernière Lumière. Mes soldats savent tenir une porte. Ils ne savent pas tenir contre l'oubli.",done:"Les remparts sont calmes. Mes éclaireurs disent que les Horreurs ont reculé quand tu as combattu ; elles n'aiment pas la lumière que tu portes. Bien. Leur maître non plus."},
m14_3:{text:"Vharos était un homme. Plus que cela : il fut le premier roi de l'humanité, et le premier Porteur de l'Aura. Il a vu chaque guerre, chaque trahison, chaque cruauté de son peuple pendant mille ans, et il a fini par décider que la lumière de l'humanité était un mensonge. Il l'a arrachée de son propre cœur et il est devenu creux.\n\nMaintenant il veut nous défaire, tous, pour que plus personne ne souffre ni ne fasse souffrir. Il appelle cela de la miséricorde.\n\nLes Rejetons Titaniques du Vide portent des éclats de sa couronne en leur cœur. Chaque éclat est un morceau du cœur qu'il a rejeté. Rapporte-les-moi.",done:"Tiens-en un devant ta lumière. Tu vois ? Il brille, faiblement. Même maintenant, il reste quelque chose de l'homme dans la couronne. Souviens-t'en quand tu te tiendras devant lui."},
m14_4:{text:"Le Pont Brisé est la seule route à travers la Faille jusqu'à la Flèche Défaite, et la Couronne Creuse y a planté des ancres : des piliers de vide qui maintiennent la Faille ouverte et y attirent le monde, pierre après pierre.\n\nBrise les ancres. Si la Faille se referme ne serait-ce qu'un peu, chaque terre que tu as parcourue le sentira.",done:"La Faille a rétréci cette nuit. Des messages sont arrivés par signaux de lanterne : les neiges de Rimeholt ont cessé de tomber noires, et les puits de Bogmere coulent clairs. Tout ce que tu as sauvé reste à toi de le sauver."},
m14_5:{text:"Au Bord du Néant marche l'Ombre de Vharos : la part de lui qui se souvient encore d'avoir été humaine, tordue en gardien pour qu'elle ne puisse jamais l'atteindre. Elle tue tout ce qui s'approche, car elle ne supporte pas d'être vue.\n\nVaincs-la. Elle porte la clé du Trône Creux, et je crois qu'elle attend depuis longtemps quelqu'un d'assez fort pour la prendre.",done:"(L'Ombre s'agenouille avant de s'effacer. Elle n'attaque pas. Elle pose la clé dans ta main et murmure un seul mot : « Rappelle-lui. »)\n\nUne clé de verre noir, et une requête de la dernière part humaine du Roi Creux. Je ne m'y attendais pas. Il y a peut-être plus d'une façon d'en finir."},
m14_6:{text:"Voici la dernière porte. Au-delà de la Flèche Défaite se trouve le Trône Creux, et sur lui siège Vharos.\n\nJe n'ai plus de conseils à te donner. Tous ceux que tu as rencontrés sur ta route, Maren et Hollis, le roi Aldric, Sera Vex, Mère Ilse, la jarl Brynja, la cheikha Nefret, Kael, ont tous envoyé leur lumière devant avec toi. Tu ne portes pas l'Aura seul. Tu ne l'as jamais portée seul.\n\nQuand tu seras prêt, va. Dernière Lumière gardera sa lanterne allumée jusqu'à ton retour.",done:"(L'archonte Solenne te serre le bras, comme le font les soldats avant une bataille.) Reviens. C'est un ordre, Porteur de l'Aura. Reviens."},
d_spire:{text:"Vessra, la Voix du Creux, garde le dernier escalier de la Flèche Défaite. Elle fut la première à suivre Vharos dans le vide, et chaque sermon de la Couronne Creuse, chaque culte de chaque terre que tu as traversée, portait ses paroles.\n\nElle tentera de te convaincre qu'il a raison : que l'humanité est cruelle, que le monde serait plus paisible sans nous. Ne l'écoute pas. Tu as vu ce que les gens peuvent être.\n\nGravis la Flèche. Fais taire la Voix.",done:"La Voix s'est tue, et partout dans le monde les cultes Creux se sont réveillés désorientés, comme d'un long mauvais rêve. Il ne reste que le Trône."},
d_throne:{text:"Le Trône Creux. Vharos y attend, le premier roi, qui a rejeté sa propre lumière parce qu'il ne supportait plus de la voir briller sur la cruauté.\n\nIl combattra avec tout ce que la Couronne a volé : la peste, le froid, les noyés, les morts. Et il te dira que défaire l'humanité est la plus grande bonté qui soit.\n\nMontre-lui qu'il a tort. Tu portes l'Aura Perdue, la lumière qu'il a rejetée, et avec elle la lumière de chaque personne qui t'a aidé à atteindre cette porte. Mets fin à la Couronne Creuse.",done:"(Quand Vharos tombe, la Couronne Creuse se fend en deux. Un instant, la lumière de ta main coule dans le vide en son centre, et le visage du vieux roi change : las, humain, stupéfait.)\n\n« J'avais oublié, dit-il. J'avais oublié à quoi cela ressemblait. » Puis il disparaît, et seule la lumière demeure.\n\nLa Faille se referme. À Hearthmoor, Maren voit l'aube se lever dorée sur le Bois-Murmure, et les fourmis ne sont plus que des fourmis. Le monde se souviendra de toi, Porteur de l'Aura. L'histoire de la Couronne Creuse est terminée. La tienne ne l'est pas."},
});

qadd('it',{
m14_1:{text:"(L'arconte Solenne non si alza dal tavolo di guerra. La sua armatura è incrinata, e la lanterna al suo fianco arde molto bassa.)\n\nDunque, il Portatore dell'Aura. Ogni messaggio giunto all'Ultima Luce nell'ultimo anno portava il tuo nome: Hearthmoor, la sala del Re, Cinderwatch, l'Oasi, le campane annegate. Non credevo che una sola persona potesse fare tutto questo. Ora vedo la luce sulla tua mano, e ci credo.\n\nQuesta è la Faglia del Disfatto, la ferita del mondo dove siede Vharos. Tutto ciò che la Corona Cava ha fatto, ogni peste, ogni corona, ogni morto risvegliato, serviva a nutrire questo luogo. L'Ultima Luce è l'ultima fortezza dell'umanità che le sta di fronte.",done:"Siediti con me un momento, prima della fine. Te lo sei guadagnato. Poi ti dirò cos'è davvero Vharos."},
m14_2:{text:"Gli Orrori Disfatti escono dalla Faglia ogni notte. Non sono bestie. Sono ciò che resta quando qualcosa viene disfatto: ricordi senza nessuno che li ricordi, forme senza significato. Dove toccano, il mondo dimentica se stesso.\n\nRespingili dalle mura dell'Ultima Luce. I miei soldati sanno tenere un cancello. Non sanno resistere all'essere dimenticati.",done:"Le mura sono quiete. I miei esploratori dicono che gli Orrori si sono ritirati quando hai combattuto; non amano la luce che porti. Bene. Nemmeno il loro padrone."},
m14_3:{text:"Vharos un tempo era un uomo. Più di questo: fu il primo re dell'umanità, e il primo Portatore dell'Aura. Vide ogni guerra, ogni tradimento, ogni crudeltà del suo popolo per mille anni, e alla fine decise che la luce dell'umanità era una menzogna. Se la strappò dal cuore e divenne cavo.\n\nOra vuole disfarci, tutti quanti, perché nessuno soffra o faccia soffrire mai più. Lo chiama misericordia.\n\nLe Progenie Titaniche del Vuoto portano frammenti della sua corona nei loro nuclei. Ogni frammento è un pezzo del cuore che ha gettato via. Portameli.",done:"Avvicinane uno alla tua luce. Lo vedi? Brilla, debolmente. Anche ora resta qualcosa dell'uomo nella corona. Ricordalo quando sarai davanti a lui."},
m14_4:{text:"Il Ponte Infranto è l'unica strada attraverso la Faglia fino alla Guglia Disfatta, e la Corona Cava vi ha conficcato delle ancore: pilastri di vuoto che tengono aperta la Faglia e vi trascinano dentro il mondo, pietra dopo pietra.\n\nSpezza le ancore. Se la Faglia si chiude anche solo un poco, ogni terra che hai percorso lo sentirà.",done:"La Faglia si è ristretta stanotte. Sono arrivati messaggi con segnali di lanterna: le nevi di Rimeholt hanno smesso di cadere nere, e i pozzi di Bogmere scorrono limpidi. Tutto ciò che hai salvato puoi ancora salvarlo."},
m14_5:{text:"Sull'Orlo del Nulla cammina l'Ombra di Vharos: la parte di lui che ancora ricorda di essere stata umana, distorta in guardiano perché non possa mai raggiungerlo. Uccide tutto ciò che si avvicina, perché non sopporta di essere vista.\n\nSconfiggila. Porta la chiave del Trono Cavo, e credo che aspetti da molto tempo qualcuno abbastanza forte da prenderla.",done:"(L'Ombra si inginocchia prima di svanire. Non attacca. Ti posa la chiave in mano e sussurra una sola parola: «Ricordaglielo».)\n\nUna chiave di vetro nero, e una richiesta dall'ultima parte umana del Re Cavo. Non me l'aspettavo. Forse c'è più di un modo per porre fine a tutto questo."},
m14_6:{text:"Questa è l'ultima porta. Oltre la Guglia Disfatta c'è il Trono Cavo, e su di esso siede Vharos.\n\nNon ho altri consigli da darti. Tutti quelli che hai incontrato lungo la strada, Maren e Hollis, re Aldric, Sera Vex, Madre Ilse, la jarl Brynja, la sceicca Nefret, Kael, hanno mandato la loro luce avanti con te. Non porti l'Aura da solo. Non l'hai mai fatto.\n\nQuando sei pronto, va'. L'Ultima Luce terrà accesa la sua lanterna finché non tornerai a casa.",done:"(L'arconte Solenne ti stringe il braccio, come fanno i soldati prima di una battaglia.) Torna. È un ordine, Portatore dell'Aura. Torna."},
d_spire:{text:"Vessra, la Voce del Cavo, sorveglia l'ultima scala della Guglia Disfatta. Fu la prima a seguire Vharos nel vuoto, e ogni sermone della Corona Cava, ogni culto in ogni terra che hai attraversato, portava le sue parole.\n\nCercherà di convincerti che lui ha ragione: che l'umanità è crudele, che il mondo sarebbe più quieto senza di noi. Non ascoltarla. Hai visto cosa possono essere le persone.\n\nScala la Guglia. Zittisci la Voce.",done:"La Voce tace, e in tutto il mondo i culti Cavi si sono risvegliati confusi, come da un lungo brutto sogno. Resta solo il Trono."},
d_throne:{text:"Il Trono Cavo. Lì attende Vharos, il primo re, che gettò via la sua stessa luce perché non sopportava più di vederla brillare sulla crudeltà.\n\nCombatterà con tutto ciò che la Corona ha rubato: la peste, il gelo, gli annegati, i morti. E ti dirà che disfare l'umanità è la cosa più gentile che si possa fare.\n\nDimostragli che si sbaglia. Porti l'Aura Perduta, la luce che lui ha gettato via, e con essa la luce di ogni persona che ti ha aiutato a raggiungere questa porta. Poni fine alla Corona Cava.",done:"(Quando Vharos cade, la Corona Cava si spacca in due. Per un istante la luce della tua mano scorre nel vuoto al suo interno, e il volto del vecchio re cambia: stanco, umano, stupito.)\n\n«Lo avevo dimenticato», dice. «Avevo dimenticato com'era». Poi se ne va, e resta solo la luce.\n\nLa Faglia si sta chiudendo. A Hearthmoor, Maren vede l'alba sorgere dorata sul Bosco Sussurrante, e le formiche sono di nuovo solo formiche. Il mondo si ricorderà di te, Portatore dell'Aura. La storia della Corona Cava è finita. La tua no."},
});

qadd('pt',{
m14_1:{text:"(A arconte Solenne não se levanta da mesa de guerra. Sua armadura está rachada, e a lanterna ao seu lado arde muito fraca.)\n\nEntão, o Portador da Aura. Cada mensagem que chegou à Última Luz no último ano trazia o seu nome: Hearthmoor, o salão do Rei, Cinderwatch, o Oásis, os sinos afogados. Eu não acreditava que uma só pessoa pudesse fazer tudo isso. Agora vejo a luz na sua mão, e acredito.\n\nEsta é a Fenda do Desfeito, a ferida do mundo onde Vharos se senta. Tudo o que a Coroa Oca fez, cada praga, cada coroa, cada morto despertado, foi para alimentar este lugar. A Última Luz é a última fortaleza da humanidade diante dela.",done:"Sente-se comigo um momento antes do fim. Você merece isso. Depois lhe direi o que Vharos realmente é."},
m14_2:{text:"Os Horrores Desfeitos saem da Fenda todas as noites. Não são feras. São o que resta quando algo é desfeito: lembranças sem ninguém para lembrá-las, formas sem sentido. Onde tocam, o mundo se esquece de si mesmo.\n\nExpulse-os das muralhas da Última Luz. Meus soldados conseguem defender um portão. Não conseguem se defender de ser esquecidos.",done:"As muralhas estão calmas. Meus batedores dizem que os Horrores recuaram quando você lutou; eles não gostam da luz que você carrega. Ótimo. O mestre deles também não."},
m14_3:{text:"Vharos já foi um homem. Mais do que isso: foi o primeiro rei da humanidade, e o primeiro Portador da Aura. Viu cada guerra, cada traição, cada crueldade de seu povo durante mil anos, e por fim decidiu que a luz da humanidade era uma mentira. Arrancou-a do próprio coração e ficou oco.\n\nAgora quer nos desfazer, todos nós, para que ninguém volte a sofrer ou causar sofrimento. Ele chama isso de misericórdia.\n\nAs Crias Titânicas do Vazio carregam fragmentos da coroa dele em seus núcleos. Cada fragmento é um pedaço do coração que ele jogou fora. Traga-os para mim.",done:"Erga um contra a sua luz. Está vendo? Ele brilha, fracamente. Mesmo agora, resta algo do homem na coroa. Lembre-se disso quando estiver diante dele."},
m14_4:{text:"A Ponte Despedaçada é o único caminho através da Fenda até o Pináculo Desfeito, e a Coroa Oca cravou âncoras nela: pilares de vazio que mantêm a Fenda aberta e puxam o mundo para dentro, pedra por pedra.\n\nQuebre as âncoras. Se a Fenda se fechar um pouco que seja, cada terra por onde você passou vai sentir.",done:"A Fenda encolheu esta noite. Chegaram mensagens por sinais de lanterna: a neve de Rimeholt parou de cair negra, e os poços de Bogmere correm limpos. Tudo o que você salvou ainda é seu para salvar."},
m14_5:{text:"Na Borda do Nada caminha a Sombra de Vharos: a parte dele que ainda se lembra de ter sido humana, retorcida em guardiã para que nunca possa alcançá-lo. Ela mata tudo o que se aproxima, porque não suporta ser vista.\n\nDerrote-a. Ela carrega a chave do Trono Oco, e acho que espera há muito tempo por alguém forte o bastante para tomá-la.",done:"(A Sombra se ajoelha antes de desaparecer. Não ataca. Coloca a chave na sua mão e sussurra uma palavra: \"Lembre-o.\")\n\nUma chave de vidro negro, e um pedido da última parte humana do Rei Oco. Eu não esperava por isso. Talvez haja mais de uma maneira de acabar com isto."},
m14_6:{text:"Esta é a última porta. Além do Pináculo Desfeito está o Trono Oco, e nele se senta Vharos.\n\nNão tenho mais conselhos a dar. Todos que você conheceu no caminho, Maren e Hollis, o rei Aldric, Sera Vex, a Madre Ilse, a jarl Brynja, a xeica Nefret, Kael, mandaram sua luz adiante com você. Você não carrega a Aura sozinho. Nunca carregou.\n\nQuando estiver pronto, vá. A Última Luz manterá sua lanterna acesa até você voltar para casa.",done:"(A arconte Solenne aperta seu braço, como fazem os soldados antes de uma batalha.) Volte. É uma ordem, Portador da Aura. Volte."},
d_spire:{text:"Vessra, a Voz do Oco, guarda a última escada do Pináculo Desfeito. Foi a primeira a seguir Vharos para o vazio, e cada sermão da Coroa Oca, cada culto em cada terra que você cruzou, levava as palavras dela.\n\nEla tentará convencê-lo de que ele está certo: que a humanidade é cruel, que o mundo seria mais tranquilo sem nós. Não a escute. Você viu o que as pessoas podem ser.\n\nSuba o Pináculo. Silencie a Voz.",done:"A Voz se calou, e por todo o mundo os cultos Ocos acordaram confusos, como de um longo pesadelo. Só resta o Trono."},
d_throne:{text:"O Trono Oco. Ali espera Vharos, o primeiro rei, que jogou fora a própria luz porque não suportava mais vê-la brilhar sobre a crueldade.\n\nEle lutará com tudo o que a Coroa roubou: a praga, o frio, os afogados, os mortos. E dirá que desfazer a humanidade é a coisa mais bondosa que alguém poderia fazer.\n\nMostre a ele que está errado. Você carrega a Aura Perdida, a luz que ele jogou fora, e com ela a luz de cada pessoa que o ajudou a chegar a esta porta. Acabe com a Coroa Oca.",done:"(Quando Vharos cai, a Coroa Oca se parte em duas. Por um instante a luz da sua mão flui para o vazio dentro dela, e o rosto do velho rei muda: cansado, humano, espantado.)\n\n\"Eu tinha esquecido\", diz ele. \"Tinha esquecido como era.\" E então ele se vai, e só a luz permanece.\n\nA Fenda está se fechando. Em Hearthmoor, Maren vê o amanhecer dourado sobre o Bosque Sussurrante, e as formigas voltam a ser só formigas. O mundo se lembrará de você, Portador da Aura. A história da Coroa Oca terminou. A sua, não."},
});

qadd('de',{
m8_1:{text:"(Wächter Okonkwo dreht Kaels Perle im grünen Licht, und sein Gesicht verhärtet sich.)\n\nDer Wyrmwald ist krank. Man kann es riechen: süß, wie verderbendes Obst. Unter dem Dschungel schläft Verdigrax, der grüne Gott, dessen Wurzeln durch jeden Baum von hier bis zum Meer laufen. Jemand vergiftet seine Wurzeln, und während er schwächer wird, verwildern die Wyrms und vermehren sich schneller als je zuvor.\n\nDie Nagakönigin tauschte Perlen gegen Wyrm-Eier. Die Hohle Krone will also Drachen. Der Dschungel hört uns jetzt zu, Träger der Aura. Geben wir ihm etwas, das es wert ist, gehört zu werden.",done:"Du gehst leise für einen Fremden; die Ranken haben sich nicht gegen dich bewegt. Verdigrax hat dich bemerkt. Das ist ein gutes Zeichen. Glaube ich."},
m8_2:{text:"Die Dschungelraptoren jagten früher im tiefen Grün. Jetzt umkreisen ihre Rudel Vinehollow in der Dämmerung, prüfen die Palisade, und jede Nacht kommen sie ein wenig näher. Etwas hat sie aus ihren Jagdgründen vertrieben.\n\nDünne die Rudel um das Dorf aus. Meine Jäger halten derweil das Tor.",done:"Die Raptoren haben sich in die Bäume zurückgezogen. Meine Jäger sagen, sie seien ursprünglich vor den Nistplätzen geflohen. Was dort jetzt lebt, macht sogar ihnen Angst."},
m8_3:{text:"Die Schattenpanther sind die Jäger des Gottes selbst. Sie sollten Verdigrax treu sein. Aber sieh dir ihre Augen an: grau und stumpf. Das Gift fließt zuerst durch sie; sie tragen es in ihren Fängen zu jedem Tier, das sie beißen.\n\nBring mir ihre Fänge. Wenn ich herausfinde, woraus das Gift besteht, finde ich auch heraus, wer es gemacht hat.",done:"(Okonkwo zermahlt einen Fang zu Staub und sieht zu, wie er raucht.) Titanenstaub und Hohle Asche. Derselbe Unrat wie in den Verbrannten Landen und den Wüstengräbern. Die Krone vergiftet die Welt mit den Knochen ihrer eigenen Opfer."},
m8_4:{text:"Die Nistplätze waren ein heiliger Ort, an dem Wyrms ein Ei pro Jahrhundert legten. Jetzt ist der Boden mit ihnen bedeckt, Hunderte, jedes warm und schwarz pulsierend. Die Krone züchtet ein Heer von Drachen für ihren Krieg.\n\nZerschlag die Eier. Jedes Ei, das du zerbrichst, ist ein Drache, der niemals eine Stadt verbrennen wird.",done:"Die Nester sind zerstört. Verdigrax regte sich letzte Nacht; der ganze Dschungel erschauerte auf einmal, wie ein Schläfer, der sich umdreht. Er ist noch krank. Aber er ist nicht mehr allein."},
m8_5:{text:"Brutwächter Zhal hütet die Eier an den Schlangensteinen: ein Echsenpriester, der die Wyrmmutter der Hohlen Krone für das Versprechen von Flügeln verkaufte. Dort trägt er das Gift des Gottes mit eigenen Klauen in den Boden.\n\nMach ihm ein Ende. Und bring mir, was er bei sich trägt; die Krone hinterlässt immer eine Spur.",done:"Eine Fessel aus Sturmeisen, noch immer knisternd. Sturmeisen wird nur an einem Ort geschmiedet: unter Thunderhold, wo die Riesen Blitze zu Klingen hämmern.\n\nDrachen aus dem Dschungel, Ketten aus dem Berg. Die Krone baut etwas, das einen Drachen halten kann. Oder einen Gott."},
m8_6:{text:"Thane Gorm herrscht über Thunderhold im Stormspire-Hochland. Er ist stur, laut und stolz, und er würde lieber sterben, als zuzulassen, dass Riesen unter seinem Berg Ketten für die Hohle Krone schmieden. Er muss diese Fessel sehen.\n\nGeh nach Norden, Träger der Aura. Der Dschungel wird sich erinnern, dass du ihm zugehört hast.",done:"(Thane Gorm knallt die Fessel so hart auf den Tisch, dass das Bier springt.) Sturmeisen! Aus meinem Berg! Bei Hammer und Donner, dafür wird jemand geradestehen."},
d_wyrmden:{text:"Tief unter den Nistplätzen liegt der Hort der Wyrmmutter. Vyrnaxa war die älteste der Wyrms, die Hüterin des Gottes selbst. Die Hohle Krone vergiftete ihr Herz und fütterte sie, bis sie von ihrer Zauberei anschwoll, und nun gebiert sie Drachen für deren Krieg.\n\nSie kann nicht gerettet werden. Aber sie kann befreit werden. Steig hinab in ihren Hort und mach der Wyrmmutter ein Ende, damit Verdigrax rein erwachen kann.",done:"Verdigrax erwachte im Morgengrauen. Jede Blume im Wyrmwald öffnete sich zugleich, und der Regen schmeckte süß. Der Dschungel verneigt sich vor dir, Träger der Aura. Ich auch."},
});

qadd('es',{
m8_1:{text:"(El guardián Okonkwo gira la perla de Kael bajo la luz verde, y su rostro se endurece.)\n\nEl Bosque Wyrm está enfermo. Se huele: dulce, como fruta que se pudre. Bajo la selva duerme Verdigrax, el dios verde, cuyas raíces recorren cada árbol de aquí al mar. Alguien envenena sus raíces, y mientras se debilita, los dragones se vuelven salvajes y crían más rápido que nunca.\n\nLa Reina Naga cambiaba perlas por huevos de dragón. Así que la Corona Hueca quiere dragones. La selva nos escucha ahora, Portador del Aura. Démosle algo que merezca oír.",done:"Caminas con suavidad para ser forastero; las lianas no se movieron contra ti. Verdigrax se ha fijado en ti. Es buena señal. Creo."},
m8_2:{text:"Los raptores de la selva cazaban en lo más profundo. Ahora sus manadas rodean Vinehollow al anochecer, tanteando la empalizada, y cada noche se acercan un poco más. Algo los ha expulsado de sus cotos de caza.\n\nDiezma las manadas alrededor del pueblo. Mis cazadores defenderán la puerta mientras tanto.",done:"Los raptores se han retirado a los árboles. Mis cazadores dicen que, en primer lugar, huyeron de los nidales. Lo que vive allí ahora asusta incluso a ellos."},
m8_3:{text:"Las panteras sombrías son las cazadoras del propio dios. Deberían ser leales a Verdigrax. Pero mírales los ojos: grises y apagados. El veneno pasa primero por ellas; lo llevan en los colmillos a cada animal que muerden.\n\nTráeme sus colmillos. Si descubro de qué está hecho el veneno, descubriré quién lo hizo.",done:"(Okonkwo muele un colmillo hasta hacerlo polvo y lo ve humear.) Polvo de titán y ceniza Hueca. La misma inmundicia de las Tierras Quemadas y las tumbas del desierto. La Corona envenena el mundo con los huesos de sus propias víctimas."},
m8_4:{text:"Los nidales eran un lugar sagrado, donde los dragones ponían un huevo cada siglo. Ahora el suelo está cubierto de ellos, cientos, cada uno tibio y latiendo en negro. La Corona está criando un ejército de dragones para su guerra.\n\nRompe los huevos. Cada huevo que rompes es un dragón que nunca quemará una ciudad.",done:"Los nidos están destrozados. Verdigrax se agitó anoche; toda la selva tembló a la vez, como un durmiente que se da la vuelta. Sigue enfermo. Pero ya no está solo."},
m8_5:{text:"Zhal, guardián de la nidada, cuida los huevos en las Piedras de la Serpiente: un sacerdote lagarto que vendió a la Madre Dragón a la Corona Hueca a cambio de una promesa de alas. Allí vierte el veneno del dios en la tierra con sus propias garras.\n\nAcaba con él. Y tráeme lo que lleve; la Corona siempre deja un rastro.",done:"Un grillete de hierro de tormenta, aún chisporroteando. El hierro de tormenta solo se forja en un lugar: bajo Thunderhold, donde los gigantes martillan rayos para hacer espadas.\n\nDragones de la selva, cadenas de la montaña. La Corona está construyendo algo capaz de retener a un dragón. O a un dios."},
m8_6:{text:"El thane Gorm gobierna Thunderhold en las Tierras Altas de Stormspire. Es terco, ruidoso y orgulloso, y preferiría morir antes que permitir que los gigantes de su montaña forjen cadenas para la Corona Hueca. Debe ver este grillete.\n\nVe al norte, Portador del Aura. La selva recordará que la escuchaste.",done:"(El thane Gorm golpea la mesa con el grillete tan fuerte que la cerveza salta.) ¡Hierro de tormenta! ¡De mi montaña! Por el martillo y el trueno, alguien va a responder por esto."},
d_wyrmden:{text:"En lo hondo, bajo los nidales, está la Guarida de la Madre Dragón. Vyrnaxa era la más antigua de los dragones, la guardiana del propio dios. La Corona Hueca le envenenó el corazón y la alimentó hasta hincharla de hechicería, y ahora pare dragones para su guerra.\n\nNo se la puede salvar. Pero sí liberar. Baja a su Guarida y acaba con la Madre Dragón, para que Verdigrax despierte limpio.",done:"Verdigrax despertó al alba. Todas las flores del Bosque Wyrm se abrieron a la vez, y la lluvia supo dulce. La selva se inclina ante ti, Portador del Aura. Y yo también."},
});

qadd('fr',{
m8_1:{text:"(Le gardien Okonkwo fait tourner la perle de Kael dans la lumière verte, et son visage se durcit.)\n\nLe Bois-Wyrm est malade. Ça se sent : une odeur douce, comme un fruit qui pourrit. Sous la jungle dort Verdigrax, le dieu vert, dont les racines courent dans chaque arbre d'ici à la mer. Quelqu'un empoisonne ses racines, et à mesure qu'il s'affaiblit, les wyrms deviennent sauvages et se reproduisent plus vite que jamais.\n\nLa Reine Naga échangeait des perles contre des œufs de wyrm. La Couronne Creuse veut donc des dragons. La jungle nous écoute maintenant, Porteur de l'Aura. Donnons-lui quelque chose qui vaille la peine d'être entendu.",done:"Tu marches doucement pour un étranger ; les lianes ne se sont pas dressées contre toi. Verdigrax t'a remarqué. C'est bon signe. Je crois."},
m8_2:{text:"Les raptors de la jungle chassaient au plus profond du vert. Maintenant leurs meutes tournent autour de Vinehollow au crépuscule, éprouvant la palissade, et chaque nuit elles s'approchent un peu plus. Quelque chose les a chassés de leurs terrains de chasse.\n\nÉclaircis les meutes autour du village. Mes chasseurs tiendront la porte pendant ce temps.",done:"Les raptors se sont retirés sous les arbres. Mes chasseurs disent qu'ils avaient d'abord fui les aires de nidification. Ce qui vit là-bas maintenant les effraie, même eux."},
m8_3:{text:"Les panthères d'ombre sont les chasseresses du dieu lui-même. Elles devraient être fidèles à Verdigrax. Mais regarde leurs yeux : gris et ternes. Le poison passe d'abord par elles ; elles le portent dans leurs crocs à chaque animal qu'elles mordent.\n\nRapporte-moi leurs crocs. Si je trouve de quoi est fait le poison, je trouverai qui l'a fait.",done:"(Okonkwo réduit un croc en poudre et le regarde fumer.) De la poussière de titan et de la cendre Creuse. La même immondice que dans les Terres Brûlées et les tombes du désert. La Couronne empoisonne le monde avec les os de ses propres victimes."},
m8_4:{text:"Les aires de nidification étaient un lieu sacré, où les wyrms pondaient un œuf par siècle. Maintenant le sol en est couvert, des centaines, chacun tiède et palpitant de noir. La Couronne élève une armée de dragons pour sa guerre.\n\nBrise les œufs. Chaque œuf brisé est un dragon qui ne brûlera jamais une ville.",done:"Les nids sont détruits. Verdigrax a remué cette nuit ; toute la jungle a frissonné d'un coup, comme un dormeur qui se retourne. Il est encore malade. Mais il n'est plus seul."},
m8_5:{text:"Zhal, gardien du couvain, veille sur les œufs aux Pierres du Serpent : un prêtre-lézard qui a vendu la Mère des Wyrms à la Couronne Creuse contre une promesse d'ailes. Il verse là-bas le poison du dieu dans le sol de ses propres griffes.\n\nAchève-le. Et rapporte-moi ce qu'il porte ; la Couronne laisse toujours une trace.",done:"Une entrave en fer-tempête, qui crépite encore. Le fer-tempête ne se forge qu'en un seul lieu : sous Thunderhold, où les géants martèlent la foudre en lames.\n\nDes dragons de la jungle, des chaînes de la montagne. La Couronne construit quelque chose capable de retenir un dragon. Ou un dieu."},
m8_6:{text:"Le thane Gorm règne sur Thunderhold dans les Hautes-Terres de Stormspire. Il est têtu, bruyant et fier, et il préférerait mourir plutôt que de laisser les géants de sa montagne forger des chaînes pour la Couronne Creuse. Il doit voir cette entrave.\n\nVa au nord, Porteur de l'Aura. La jungle se souviendra que tu l'as écoutée.",done:"(Le thane Gorm frappe la table avec l'entrave si fort que la bière en saute.) Du fer-tempête ! De ma montagne ! Par le marteau et le tonnerre, quelqu'un va en répondre."},
d_wyrmden:{text:"Tout au fond, sous les aires de nidification, se trouve l'Antre de la Mère des Wyrms. Vyrnaxa était la plus ancienne des wyrms, la gardienne du dieu lui-même. La Couronne Creuse a empoisonné son cœur et l'a nourrie jusqu'à la gorger de sorcellerie, et maintenant elle enfante des dragons pour leur guerre.\n\nOn ne peut pas la sauver. Mais on peut la libérer. Descends dans son Antre et mets fin à la Mère des Wyrms, pour que Verdigrax s'éveille purifié.",done:"Verdigrax s'est éveillé à l'aube. Toutes les fleurs du Bois-Wyrm se sont ouvertes en même temps, et la pluie avait un goût sucré. La jungle s'incline devant toi, Porteur de l'Aura. Moi aussi."},
});

qadd('it',{
m8_1:{text:"(Il guardiano Okonkwo rigira la perla di Kael nella luce verde, e il suo volto si indurisce.)\n\nIl Bosco dei Draghi è malato. Si sente dall'odore: dolce, come frutta che marcisce. Sotto la giungla dorme Verdigrax, il dio verde, le cui radici attraversano ogni albero da qui al mare. Qualcuno sta avvelenando le sue radici, e mentre si indebolisce, i draghi inselvatichiscono e si riproducono più in fretta che mai.\n\nLa Regina Naga scambiava perle con uova di drago. Dunque la Corona Cava vuole draghi. La giungla ci sta ascoltando ora, Portatore dell'Aura. Diamole qualcosa che valga la pena sentire.",done:"Cammini leggero per essere uno straniero; le liane non si sono mosse contro di te. Verdigrax ti ha notato. È un buon segno. Credo."},
m8_2:{text:"I raptor della giungla cacciavano nel verde profondo. Ora i loro branchi girano attorno a Vinehollow al crepuscolo, saggiando la palizzata, e ogni notte si avvicinano un po' di più. Qualcosa li ha cacciati dai loro territori.\n\nSfoltisci i branchi attorno al villaggio. I miei cacciatori terranno il cancello nel frattempo.",done:"I raptor si sono ritirati tra gli alberi. I miei cacciatori dicono che all'inizio erano fuggiti dai nidi. Ciò che vive laggiù adesso spaventa perfino loro."},
m8_3:{text:"Le pantere d'ombra sono le cacciatrici del dio stesso. Dovrebbero essere fedeli a Verdigrax. Ma guarda i loro occhi: grigi e spenti. Il veleno passa prima da loro; lo portano nelle zanne a ogni animale che mordono.\n\nPortami le loro zanne. Se scopro di cosa è fatto il veleno, scoprirò chi l'ha fatto.",done:"(Okonkwo riduce una zanna in polvere e la guarda fumare.) Polvere di titano e cenere Cava. La stessa sozzura delle Terre Bruciate e delle tombe del deserto. La Corona avvelena il mondo con le ossa delle sue stesse vittime."},
m8_4:{text:"I nidi erano un luogo sacro, dove i draghi deponevano un uovo ogni secolo. Ora il terreno ne è coperto, centinaia, ognuno tiepido e pulsante di nero. La Corona sta allevando un esercito di draghi per la sua guerra.\n\nSpacca le uova. Ogni uovo che rompi è un drago che non brucerà mai una città.",done:"I nidi sono distrutti. Verdigrax si è mosso stanotte; l'intera giungla ha rabbrividito all'unisono, come un dormiente che si gira. È ancora malato. Ma non è più solo."},
m8_5:{text:"Zhal, custode della covata, sorveglia le uova alle Pietre del Serpente: un sacerdote lucertola che ha venduto la Madre dei Draghi alla Corona Cava in cambio di una promessa di ali. Lì versa il veleno del dio nel terreno con i suoi stessi artigli.\n\nFiniscilo. E portami ciò che ha con sé; la Corona lascia sempre una traccia.",done:"Un ceppo di ferro della tempesta, che crepita ancora. Il ferro della tempesta si forgia in un solo luogo: sotto Thunderhold, dove i giganti martellano i fulmini in lame.\n\nDraghi dalla giungla, catene dalla montagna. La Corona sta costruendo qualcosa in grado di trattenere un drago. O un dio."},
m8_6:{text:"Il thane Gorm governa Thunderhold, negli Altipiani di Stormspire. È testardo, rumoroso e orgoglioso, e preferirebbe morire piuttosto che lasciare che i giganti sotto la sua montagna forgino catene per la Corona Cava. Deve vedere questo ceppo.\n\nVa' a nord, Portatore dell'Aura. La giungla ricorderà che l'hai ascoltata.",done:"(Il thane Gorm sbatte il ceppo sul tavolo così forte che la birra sobbalza.) Ferro della tempesta! Dalla mia montagna! Per il martello e il tuono, qualcuno ne risponderà."},
d_wyrmden:{text:"Nel profondo, sotto i nidi, si trova la Tana della Madre dei Draghi. Vyrnaxa era la più antica dei draghi, la custode del dio stesso. La Corona Cava le ha avvelenato il cuore e l'ha nutrita finché non si è gonfiata della loro stregoneria, e ora partorisce draghi per la loro guerra.\n\nNon si può salvare. Ma si può liberare. Scendi nella sua Tana e poni fine alla Madre dei Draghi, perché Verdigrax possa risvegliarsi puro.",done:"Verdigrax si è risvegliato all'alba. Ogni fiore del Bosco dei Draghi si è aperto nello stesso istante, e la pioggia aveva un sapore dolce. La giungla si inchina davanti a te, Portatore dell'Aura. Anch'io."},
});

qadd('pt',{
m8_1:{text:"(O guardião Okonkwo gira a pérola de Kael na luz verde, e seu rosto endurece.)\n\nO Bosque Serpe está doente. Dá para sentir o cheiro: doce, como fruta apodrecendo. Sob a selva dorme Verdigrax, o deus verde, cujas raízes correm por cada árvore daqui até o mar. Alguém está envenenando suas raízes, e à medida que ele enfraquece, as serpes ficam selvagens e se reproduzem mais rápido do que nunca.\n\nA Rainha Naga trocava pérolas por ovos de serpe. Então a Coroa Oca quer dragões. A selva está nos ouvindo agora, Portador da Aura. Vamos dar a ela algo que valha a pena ouvir.",done:"Você pisa leve para um forasteiro; os cipós não se moveram contra você. Verdigrax notou você. É um bom sinal. Acho."},
m8_2:{text:"Os raptores da selva caçavam no verde profundo. Agora suas matilhas rondam Vinehollow ao anoitecer, testando a paliçada, e a cada noite chegam um pouco mais perto. Algo os expulsou de seus territórios de caça.\n\nReduza as matilhas ao redor da vila. Meus caçadores vão segurar o portão enquanto isso.",done:"Os raptores recuaram para as árvores. Meus caçadores dizem que, para começar, eles fugiram dos ninhais. O que vive lá agora assusta até eles."},
m8_3:{text:"As panteras sombrias são as caçadoras do próprio deus. Deveriam ser leais a Verdigrax. Mas veja os olhos delas: cinzentos e opacos. O veneno passa primeiro por elas; elas o levam nas presas a cada animal que mordem.\n\nTraga-me as presas delas. Se eu descobrir do que o veneno é feito, descobrirei quem o fez.",done:"(Okonkwo mói uma presa até virar pó e a observa fumegar.) Pó de titã e cinza Oca. A mesma imundície das Terras Queimadas e das tumbas do deserto. A Coroa envenena o mundo com os ossos de suas próprias vítimas."},
m8_4:{text:"Os ninhais eram um lugar sagrado, onde as serpes punham um ovo por século. Agora o chão está coberto deles, centenas, cada um morno e pulsando em negro. A Coroa está criando um exército de dragões para sua guerra.\n\nQuebre os ovos. Cada ovo que você quebra é um dragão que nunca queimará uma cidade.",done:"Os ninhos foram destruídos. Verdigrax se mexeu ontem à noite; a selva inteira estremeceu de uma vez, como alguém que se vira no sono. Ele ainda está doente. Mas não está mais sozinho."},
m8_5:{text:"Zhal, guardião da ninhada, cuida dos ovos nas Pedras da Serpente: um sacerdote-lagarto que vendeu a Mãe das Serpes à Coroa Oca em troca de uma promessa de asas. Ele despeja o veneno do deus no solo com as próprias garras.\n\nAcabe com ele. E traga-me o que ele carregar; a Coroa sempre deixa um rastro.",done:"Um grilhão de ferro da tempestade, ainda estalando. O ferro da tempestade só é forjado em um lugar: sob Thunderhold, onde os gigantes martelam raios em lâminas.\n\nDragões da selva, correntes da montanha. A Coroa está construindo algo capaz de prender um dragão. Ou um deus."},
m8_6:{text:"O thane Gorm governa Thunderhold, nas Terras Altas de Stormspire. É teimoso, barulhento e orgulhoso, e preferiria morrer a deixar que gigantes sob sua montanha forjem correntes para a Coroa Oca. Ele precisa ver este grilhão.\n\nVá para o norte, Portador da Aura. A selva se lembrará de que você a ouviu.",done:"(O thane Gorm bate o grilhão na mesa com tanta força que a cerveja salta.) Ferro da tempestade! Da minha montanha! Pelo martelo e pelo trovão, alguém vai pagar por isso."},
d_wyrmden:{text:"Bem abaixo dos ninhais fica o Covil da Mãe das Serpes. Vyrnaxa era a mais antiga das serpes, a guardiã do próprio deus. A Coroa Oca envenenou seu coração e a alimentou até incharem de feitiçaria, e agora ela pare dragões para a guerra deles.\n\nEla não pode ser salva. Mas pode ser libertada. Desça ao Covil e acabe com a Mãe das Serpes, para que Verdigrax desperte limpo.",done:"Verdigrax despertou ao amanhecer. Todas as flores do Bosque Serpe se abriram ao mesmo tempo, e a chuva teve gosto doce. A selva se curva diante de você, Portador da Aura. Eu também."},
});

qadd('de',{
m9_1:{text:"(Thane Gorm starrt noch immer wütend auf die Sturmeisen-Fessel.)\n\nThunderhold hält diesen Berg seit neunhundert Jahren. Meine Vorväter schlossen Frieden mit den Riesen: Sie behalten die tiefen Hallen, wir die Hochstraßen, und niemand schmiedet, was er nicht schmieden sollte. Jetzt hämmern die Riesen jede Nacht Blitze zu Ketten, und die Stürme über dem Stormspire haben seit einem Monat nicht aufgehört.\n\nJemand hat diesen Frieden gebrochen. Ich will wissen, wer, und dann will ich ihn brechen.",done:"Du bist den ganzen Weg aus dem Dschungel gekommen, um mir schlechte Nachrichten zu bringen. Das ist entweder mutig oder dumm, und in Thunderhold trinken wir auf beides. Setz dich."},
m9_2:{text:"Die Sturmharpyien reiten auf den Blitzen herab auf die Hochstraßen und zerreißen alles, was sich bewegt: Händler, Hirten, meine eigenen Patrouillen. Die Stürme nähren sie; nie waren es so viele.\n\nSäubere die Straßen um Thunderhold. Wenn wir nicht reisen können, können wir nicht kämpfen.",done:"Die Händler kamen heute Morgen die Hochstraße herauf, ohne ein einziges Maultier zu verlieren. Die Harpyien kreischen auf den Gipfeln, aber sie halten jetzt Abstand."},
m9_3:{text:"Die Donnerwidder waren früher sanfte Tiere; unsere Hirten ritten auf ihnen. Jetzt rammen sie alles, was sich bewegt, Funken knistern in ihren Hörnern, als würde der Sturm selbst sie in den Wahnsinn treiben.\n\nBring mir ihre Hörner. Meine Runenschmiede können den Sturm darin lesen und mir sagen, von wo er gerufen wird.",done:"Die Runenschmiede brachen ein Horn auf, und es summte wie eine angeschlagene Glocke. Der Sturm wird tatsächlich gerufen: vom Spitzenfeld, wo die Riesen ihre Blitzstangen aufgerichtet haben."},
m9_4:{text:"Auf dem Spitzenfeld haben die Riesen Eisenstangen errichtet, höher als jeder Baum. Sie ziehen die Blitze vom Himmel und leiten sie in die Schmieden unter dem Berg, wo sie zu Sturmeisen werden.\n\nReiß die Stangen um. Keine Blitze, kein Sturmeisen. Kein Sturmeisen, keine Ketten für die Hohle Krone.",done:"Der Himmel über dem Stormspire ist zum ersten Mal seit einem Monat klar. Mein Volk stand auf den Mauern, nur um die Sterne anzusehen. Das warst du."},
m9_5:{text:"Die Riesen gehorchen Himmelsreißer, dem größten von ihnen, der auf dem Donnergipfel steht und die Stürme wachbrüllt. Er schloss den Handel mit der Hohlen Krone: ihr Gold und ihre Versprechen für seine Blitze.\n\nBring ihn zu Fall. Und bring mir, womit die Krone ihn bezahlt hat.",done:"Eine Feder aus reinem Weiß und Gold, warm in der Hand, von den Himmelsinseln über den Wolken. Die Krone hat ihn nicht mit Gold bezahlt. Sie bezahlte ihn mit der Feder eines Seraphen: dem Versprechen eines Platzes unter den Göttern.\n\nDie Seraphen von Zephyra stehen beim Hohlen König. Bei Hammer und Donner, selbst der Himmel ist gefallen."},
m9_6:{text:"Hohepriesterin Aelia hütet Zephyra, den letzten freien Tempel der Himmelsinseln. Wenn die Seraphen der Krone verfallen sind, weiß sie, wie, und wie man zu ihnen hinaufsteigt.\n\nSteig hinauf, Träger der Aura. Thunderhold wird den Berg halten. Und wenn du je einen Hammer brauchst, weißt du, wo wir wohnen.",done:"(Hohepriesterin Aelia nimmt die Feder, und ihre Hände zittern.) Sie gehört Seraphiel. Unserem Hüter. Dann ist es also wahr. Er hat ihnen unseren Himmel gegeben."},
d_thunder:{text:"Unter dem Berg, in den Tiefen von Thunderhold, schmiedet Gorgrim Sturmbrecher Sturmeisen für die Hohle Krone. Er ist der Kriegsherr der Sturmriesen, der den alten Frieden gebrochen hat, und jede Kette, die die Krone trägt, kam von seinem Amboss.\n\nSteig hinab in die Tiefen und brich den Sturmbrecher. Thunderhold wird die Tore hinter dir halten.",done:"Die Schmieden unter dem Berg sind erkaltet, und die Riesen, die ihm dienten, sind in die tiefen Hallen geflohen. Der alte Frieden ist nicht wiederhergestellt. Aber jetzt kann er es werden. Thunderhold schuldet dir ein Lied, und wir singen laut."},
m10_1:{text:"Seraphiel war unser Hüter. Tausend Jahre lang stand er am Wolkentor und hielt die Dunkelheit unter den Wolken. Dann kam die Hohle Krone mit einem Flüstern zu ihm: dass die Menschheit den Himmel zerstören würde, wie sie alles andere zerstört hatte.\n\nEr glaubte ihnen. Er riss meinen Schwestern die Flügel aus und gab dem Hohlen König unseren Himmel. Zephyra ist alles, was bleibt.\n\nDu bist den ganzen Weg heraufgestiegen. Ich glaube, der Himmel hat noch ein wenig Hoffnung.",done:"Der Wind drehte sich, als du ankamst. Die alten Priester sagten, das bedeute, dass ein Freund gekommen sei. Ich hatte aufgehört, ihnen zu glauben. Danke."},
m10_2:{text:"Die Greife waren die heiligen Reittiere der Himmelspriester. Ohne ihre Reiter sind sie verwildert, und nun jagen sie jeden, der die Brücken zwischen den Inseln betritt.\n\nVertreib sie von den Brücken. Eines Tages, wenn der Himmel wieder frei ist, zähmen wir sie wieder. Heute müssen wir gehen können.",done:"Die Brücken sind offen. Meine Akolythinnen gingen heute Morgen zum Windschrein hinüber und kamen singend zurück. Das ist lange nicht geschehen."},
m10_3:{text:"Die Schutzzauber, die die Dunkelheit unter den Wolken hielten, sind gebrochen. Die alten Texte sagen, sie wurden aus Himmelsschlangenschuppen gewoben, die den Wind halten wie Glas das Licht.\n\nBring mir Himmelsschlangenschuppen, und meine Priesterinnen beginnen, die Schutzzauber neu zu weben.",done:"Der erste Schutzzauber ist gewoben, und er hält. Nur ein kleiner, über Zephyra. Aber letzte Nacht stieg die Dunkelheit nicht durch die Wolken."},
m10_4:{text:"Als Seraphiel fiel, zersprangen die Heiligenscheine der Gläubigen im Zerbrochenen Tempel. Ihre Splitter leuchten noch, und die Hohle Krone sammelt sie, denn ein zerbrochener Heiligenschein ist eine Tür für das, was von unten kommt.\n\nSammle die zerbrochenen Heiligenscheine, bevor die Krone sie nutzen kann. Wir werden sie zur Ruhe betten.",done:"Die Heiligenscheine liegen auf dem Altar von Zephyra. Sie sind matt, aber nicht dunkel. Das Licht meiner Schwestern ist nicht ganz erloschen."},
m10_5:{text:"Exarch Valen war Seraphiels Stellvertreter. Valen öffnete das Wolkentor und ließ die Dunkelheit aufsteigen. Er steht noch immer dort und hält es für seinen Herrn offen.\n\nSchließ das Tor. Besiege Valen und bring mir, was er bei sich trägt.",done:"Ein Obolus: eine Münze der Toten, kalt wie das Grab. Sie war für den Knochenfährmann bestimmt, der die Toten über den Styx rudert.\n\nDie Krone kauft also den Himmel mit Lügen und die Toten mit Münzen. Die Dunkelheit kommt von unten wie von oben, Träger der Aura."},
m10_6:{text:"Steig hinab. Tief hinab, unter die Berge, in den Styxsumpf, wo der Fluss der Toten fließt. Dort, in Charons Rast, lebt ein Fährmann: der, der den Handel seines Bruders ablehnte.\n\nBring ihm den Obolus. Und wenn du aus dem Sumpf aufblickst, denk daran, dass der Himmel noch da ist, und noch dir gehört.",done:"(Ein alter Mann im grauen Umhang nimmt den Obolus und seufzt.) Die Münze meines Bruders. Willkommen, Lebender. Ich bin Charon, der Fährmann, der sich weigerte. Setz dich. Wir haben viel zu bereden."},
d_aerie:{text:"Seraphiel der Gefallene wartet im Horst der Gefallenen, dem höchsten Tempel der Himmelsinseln. Er war unser Hüter, und nun reißt er den Gläubigen die Flügel aus und bietet dem Hohlen König den Himmel an.\n\nIch bitte dich nicht, ihn zu hassen. Ich bitte dich, ihn aufzuhalten. Steig hinauf in den Horst und beende den Verräter des Himmelstempels.",done:"(Aelia schweigt lange.) Er hat nichts gesagt, als er fiel? Nein... ich glaube, er war erleichtert. Der Himmel ist klar, Träger der Aura. Meine Schwestern werden wieder fliegen."},
});

qadd('es',{
m9_1:{text:"(El thane Gorm sigue mirando con furia el grillete de hierro de tormenta.)\n\nThunderhold ha defendido esta montaña durante novecientos años. Mis antepasados hicieron las paces con los gigantes: ellos guardan las salas profundas, nosotros los caminos altos, y nadie forja lo que no debe. Ahora los gigantes martillan rayos para hacer cadenas cada noche, y las tormentas sobre Stormspire no han parado en un mes.\n\nAlguien rompió esa paz. Quiero saber quién, y luego quiero romperlo a él.",done:"Viniste desde la selva para traerme malas noticias. Eso es valiente o estúpido, y en Thunderhold brindamos por ambas cosas. Siéntate."},
m9_2:{text:"Las arpías de la tormenta bajan cabalgando el rayo sobre los caminos altos y despedazan todo lo que se mueve: comerciantes, pastores, mis propias patrullas. Las tormentas las alimentan; nunca habían sido tantas.\n\nDespeja los caminos alrededor de Thunderhold. Si no podemos viajar, no podemos luchar.",done:"Los comerciantes subieron por el camino alto esta mañana sin perder ni una mula. Las arpías chillan en las cumbres, pero ahora guardan las distancias."},
m9_3:{text:"Los carneros del trueno eran bestias mansas; nuestros pastores los montaban. Ahora embisten todo lo que se mueve, con chispas crepitando en los cuernos, como si la propia tormenta los volviera locos.\n\nTráeme sus cuernos. Mis herreros rúnicos pueden leer la tormenta en ellos y decirme desde dónde la convocan.",done:"Los herreros rúnicos partieron un cuerno y zumbó como una campana golpeada. La tormenta la convocan, sin duda: desde el Campo de Agujas, donde los gigantes han alzado sus pararrayos."},
m9_4:{text:"En el Campo de Agujas, los gigantes han levantado varas de hierro más altas que cualquier árbol. Arrancan el rayo del cielo y lo llevan a las forjas bajo la montaña, donde se convierte en hierro de tormenta.\n\nDerriba las varas. Sin rayos no hay hierro de tormenta. Sin hierro de tormenta no hay cadenas para la Corona Hueca.",done:"El cielo sobre Stormspire está despejado por primera vez en un mes. Mi gente subió a las murallas solo para mirar las estrellas. Lo hiciste tú."},
m9_5:{text:"Los gigantes obedecen a Rasgacielos, el mayor de ellos, que se alza en el Pico del Trueno y despierta las tormentas a gritos. Él hizo el trato con la Corona Hueca: su oro y sus promesas a cambio de su rayo.\n\nDerríbalo. Y tráeme aquello con lo que la Corona le pagó.",done:"Una pluma de blanco y oro puros, tibia al tacto, de las Islas del Cielo sobre las nubes. La Corona no le pagó con oro. Le pagó con una pluma de serafín: la promesa de un lugar entre los dioses.\n\nLos serafines de Zephyra están con el Rey Hueco. Por el martillo y el trueno, hasta el cielo ha caído."},
