<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>MYTHWEALD - The Hollow Crown (Playtest)</title>
<meta name="description" content="Mythweald: a retro pixel-art mythological online RPG. A Lost Aura Games production. Private playtest build.">
<style>
:root{--bone:#e8dcb5;--bone2:#a89f80;--bg:#050806;--green:#3cff5a;--blue:#3a7bff;--purple:#b04cff;--red:#ff4a5a;--gold:#ffd24a;--orange:#ff8a1e;--panel:#0d0b10f2;--c0:#d8d8d8;--c1:#3cff5a;--c2:#4a9bff;--c3:#c25cff;--c4:#ff8a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;font-family:"Courier New",Courier,monospace;font-weight:bold;color:var(--bone);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;font-size:14px}
#gc{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:1;cursor:crosshair}
#scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:multiply}
#vign{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.55) 100%)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:block}
.pass{pointer-events:none}.pass .pe{pointer-events:auto}
.t{text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.btn{display:inline-block;cursor:pointer;padding:7px 12px;margin:3px;background:#120f16;color:var(--bone);border:3px solid var(--bone);box-shadow:3px 3px 0 #000,inset -3px -3px 0 #241d2c;font:bold 14px "Courier New",monospace;text-shadow:2px 2px 0 #000;letter-spacing:1px;text-transform:uppercase;position:relative;text-align:center;touch-action:manipulation;vertical-align:middle}
.btn:hover{border-color:#fff;box-shadow:3px 3px 0 #000,0 0 10px var(--gold),inset -3px -3px 0 #241d2c;color:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.blue{border-color:var(--blue);color:#bcd3ff}.btn.purple{border-color:var(--purple);color:#e2c2ff}.btn.red{border-color:var(--red);color:#ffc2c8}.btn.gold{border-color:var(--gold);color:#fff2c2}.btn.green{border-color:var(--green);color:#c8ffd0}
.btn.big{font-size:20px;padding:11px 18px;min-width:220px}
.btn.sm{font-size:11px;padding:3px 7px;border-width:2px}
.btn.dis{opacity:.4;pointer-events:none}
.btn.sel{background:#2d2008;border-color:var(--gold);color:#fff}
.panel{background:var(--panel);border:3px solid var(--bone2);box-shadow:5px 5px 0 #000,inset 0 0 0 2px #000;padding:10px}
.gold{color:var(--gold)}.grey{color:#8d8577}.red{color:var(--red)}.green{color:var(--green)}.blue{color:#7fb2ff}
.r0{color:var(--c0)}.r1{color:var(--c1)}.r2{color:var(--c2)}.r3{color:var(--c3)}.r4{color:var(--c4)}
.b0{border-color:#777!important}.b1{border-color:var(--c1)!important}.b2{border-color:var(--c2)!important}.b3{border-color:var(--c3)!important}.b4{border-color:var(--c4)!important;box-shadow:0 0 8px var(--c4)}
/* title */
#s-title{background:#000}
#titlebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(94vw,680px)}
#titlebox .sub{color:var(--bone2);margin:8px 0 18px;letter-spacing:2px}
#credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#6d6656;font-size:11px;z-index:6}
/* create */
#s-create{background:#07060a;overflow:auto;touch-action:pan-y}
#createbox{max-width:980px;margin:0 auto;padding:16px 12px 60px}
.h1{font-size:22px;color:var(--gold);letter-spacing:2px;margin:6px 0 10px;text-shadow:2px 2px 0 #000}
.h2{font-size:15px;color:var(--gold);margin:10px 0 6px}
.cards{display:flex;flex-wrap:wrap;gap:10px}
.card{flex:1 1 200px;cursor:pointer;background:#110e15;border:3px solid #3a3242;padding:8px;box-shadow:3px 3px 0 #000;min-width:180px}
.card:hover{border-color:var(--bone2)}.card.sel{border-color:var(--gold);background:#1d1608}
.card .nm{color:var(--gold);font-size:16px}.card .ds{font-size:12px;color:#c9bfa4;font-weight:normal;margin-top:4px;line-height:1.35}
.card canvas{float:right;margin-left:6px}
input.txt{font:bold 18px "Courier New",monospace;background:#000;color:var(--bone);border:3px solid var(--bone2);padding:6px 8px;width:260px;text-transform:uppercase;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.slotrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.slotc{background:#110e15;border:3px solid #3a3242;padding:10px;min-width:220px;cursor:pointer}
.slotc:hover{border-color:var(--gold)}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud .pe{pointer-events:auto}
#pframe{position:absolute;left:8px;top:8px;width:250px}
.bar{height:14px;background:#1a1016;border:2px solid #000;box-shadow:0 0 0 1px #5a4a3a;position:relative;margin-top:3px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:#c22;transition:width .15s}
.bar>span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:11px;text-shadow:1px 1px 0 #000;color:#fff}
.bar.mp>i{background:#2a6cf0}.bar.rage>i{background:#d06a10}.bar.en>i{background:#e8d020}.bar.xp>i{background:#9a4cff}
#pname{font-size:13px;text-shadow:2px 2px 0 #000}
#buffs{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.buff{width:22px;height:22px;border:2px solid #000;font-size:9px;text-align:center;line-height:9px;position:relative;background:#222}
.buff b{position:absolute;bottom:-1px;right:0;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
#tframe{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:240px;display:none}
#tname{font-size:12px;text-align:center;text-shadow:2px 2px 0 #000}
#mmwrap{position:absolute;right:8px;top:8px;text-align:right}
#mmc{border:3px solid var(--bone2);box-shadow:3px 3px 0 #000;background:#000;width:150px;height:150px}
#zonelbl{font-size:12px;text-shadow:2px 2px 0 #000;max-width:220px;margin-left:auto}
#tracker{position:absolute;right:8px;top:200px;width:230px;font-size:11px;text-shadow:1px 1px 0 #000,2px 2px 0 #000}
#tracker .q{margin-bottom:6px}#tracker .qt{color:var(--gold)}#tracker .done{color:var(--green)}
#hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end}
.hk{width:46px;height:46px;background:#120f16;border:3px solid var(--bone2);box-shadow:2px 2px 0 #000;position:relative;cursor:pointer;touch-action:manipulation}
.hk canvas{position:absolute;left:4px;top:4px;width:32px;height:32px}
.hk .k{position:absolute;left:2px;top:0;font-size:10px;text-shadow:1px 1px 0 #000;color:#fff}
.hk .n{position:absolute;right:2px;bottom:0;font-size:10px;text-shadow:1px 1px 0 #000;color:#fff}
.hk .cd{position:absolute;left:0;right:0;bottom:0;background:#000b;pointer-events:none}
.hk .cdt{position:absolute;inset:0;text-align:center;line-height:40px;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none}
.hk.off{opacity:.45}.hk.act{border-color:var(--gold)}
#xpbar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:min(520px,70vw)}
#menubtns{position:absolute;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:300px}
#menubtns .btn{margin:0;padding:4px 6px;font-size:11px;border-width:2px}
#chat{position:absolute;left:8px;bottom:8px;width:min(340px,42vw);font-size:11px}
#chatlog{max-height:120px;overflow:hidden;text-shadow:1px 1px 0 #000,2px 2px 0 #000;display:flex;flex-direction:column;justify-content:flex-end}
#chatlog div{margin-top:1px;word-wrap:break-word}
#chatin{display:none;width:100%;font:bold 12px "Courier New",monospace;background:#000c;color:#fff;border:2px solid var(--bone2);padding:4px;user-select:text;-webkit-user-select:text}
#online{font-size:10px;color:#9fe;text-shadow:1px 1px 0 #000}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
#lootfeed{position:fixed;right:10px;bottom:96px;z-index:55;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#lootfeed div{background:#000a;padding:2px 8px;font-size:11px;text-shadow:1px 1px 0 #000;animation:tst 4s forwards}
body.touch #lootfeed{right:auto;left:10px;bottom:auto;top:110px}
#toast div{background:#000d;border:2px solid var(--gold);padding:5px 12px;font-size:13px;text-shadow:2px 2px 0 #000;animation:tst 2.8s forwards;text-align:center}
@keyframes tst{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:40;pointer-events:none;font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;opacity:0;transition:opacity .6s}
#banner small{display:block;font-size:14px;color:var(--bone)}
#castbar{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:220px;display:none}
/* panels */
#panels{position:fixed;inset:0;z-index:30;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--panel);border:3px solid var(--bone2);box-shadow:6px 6px 0 #000,inset 0 0 0 2px #000;display:none;max-height:calc(100% - 20px);overflow:hidden;flex-direction:column}
.win.on{display:flex}
.win .hd{display:flex;align-items:center;justify-content:space-between;background:#231b12;border-bottom:3px solid #000;padding:4px 6px 4px 10px;color:var(--gold);font-size:15px;text-shadow:2px 2px 0 #000;flex:0 0 auto}
.win .hd .x{cursor:pointer;color:#fff;background:#5a1a1a;border:2px solid #000;padding:0 7px;font-size:16px}
.win .bd{padding:8px 10px;overflow:auto;flex:1 1 auto;touch-action:pan-y;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,44px);gap:4px}
.slot{width:44px;height:44px;background:#0a080c;border:2px solid #3a3242;position:relative;cursor:pointer;touch-action:manipulation}
.slot canvas{position:absolute;left:4px;top:4px;width:32px;height:32px}
.slot .q{position:absolute;right:1px;bottom:0;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
.slot.lock{opacity:.35;background:repeating-linear-gradient(45deg,#000 0 4px,#140f18 4px 8px)}
.slot.empty .lbl{position:absolute;inset:0;font-size:8px;color:#555;display:flex;align-items:center;justify-content:center;text-align:center}
.slot.hi{outline:2px solid var(--gold)}
.slot.bad::after{content:'';position:absolute;inset:0;background:#f003}
#tip{position:fixed;z-index:80;pointer-events:none;background:#0a080ef7;border:3px solid var(--bone2);padding:7px 9px;font-size:12px;max-width:290px;display:none;box-shadow:4px 4px 0 #000;line-height:1.35}
#tip .tn{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list .it{display:flex;align-items:center;gap:8px;padding:5px;border-bottom:1px solid #2a2230;cursor:pointer}
.list .it:hover{background:#1b1520}
.list .it.sel{background:#2a2010}
.pill{font-size:10px;padding:1px 5px;border:1px solid #555;margin-left:4px}
.stats td{padding:1px 8px 1px 0;font-size:12px}
.tree{display:flex;gap:8px;flex-wrap:wrap}
.branch{flex:1 1 210px;background:#0a080c;border:2px solid #3a3242;padding:6px}
.branch .bt{color:var(--gold);text-align:center;margin-bottom:4px}
.node{display:flex;gap:6px;align-items:center;padding:4px;border:2px solid #2a2230;margin-bottom:4px;cursor:pointer;background:#120f16;font-size:11px}
.node.max{border-color:var(--gold)}.node.lock{opacity:.4}.node:hover{border-color:#fff}
.node .rk{margin-left:auto;color:#fff;white-space:nowrap}
.dlg{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:min(560px,94vw)}
.qtext{font-weight:normal;line-height:1.45;color:#e8e0c8;white-space:pre-wrap}
/* modal */
#modal{position:fixed;inset:0;z-index:90;background:#000a;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modalp{max-width:min(520px,94vw);text-align:center;max-height:90vh;overflow:auto}
/* touch */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
body.touch #touch{display:block}
#joy{position:absolute;left:20px;bottom:30px;width:130px;height:130px;border-radius:50%;border:3px solid #fff4;background:#0004;pointer-events:auto;touch-action:none}
#joyk{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:#e8dcb588;border:3px solid #000}
#tbtns{position:absolute;right:14px;bottom:26px;width:210px;height:210px;pointer-events:none}
.tb{position:absolute;width:56px;height:56px;border-radius:50%;background:#120f16cc;border:3px solid var(--bone2);pointer-events:auto;touch-action:none;color:#fff;font-size:11px;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb canvas{width:32px;height:32px}
.tb.atk{width:80px;height:80px;right:0;bottom:0;border-color:var(--gold);font-size:14px}
.tb .cd{position:absolute;left:0;right:0;bottom:0;background:#000b}
body.touch #chat{bottom:170px;width:46vw}
body.touch #hotbar{display:none}
body.touch #xpbar{bottom:4px;width:40vw}
body.touch #menubtns{bottom:auto;top:6px;max-width:270px;right:128px}
body.touch #menubtns .btn{font-size:10px;padding:3px 5px}
body.touch #tframe{top:64px}
body.touch #tracker{display:none}
body.touch #mmc{width:110px;height:110px}
@media (max-width:700px){#pframe{width:180px}#tframe{width:150px;top:60px}#menubtns .btn{font-size:10px;padding:3px 4px}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="vign"></div>
<div id="scan"></div>
<div id="s-title" class="screen on"><canvas id="titlebg" class="px" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div id="titlebox"><div id="logo"></div><div class="sub t" id="tsub"></div><div id="tbtns0"></div></div><div id="credit"></div></div>
<div id="s-create" class="screen"><div id="createbox"></div></div>
<div id="s-game" class="screen pass">
 <div id="hud">
  <div id="pframe" class="pe"><div id="pname"></div><div class="bar" id="hpb"><i></i><span></span></div><div class="bar mp" id="mpb"><i></i><span></span></div><div id="buffs"></div></div>
  <div id="tframe"><div id="tname"></div><div class="bar" id="thpb"><i></i><span></span></div></div>
  <div id="mmwrap" class="pe"><canvas id="mmc" class="px" width="150" height="150"></canvas><div id="zonelbl"></div><div id="online"></div></div>
  <div id="tracker"></div>
  <div id="castbar"><div class="bar en" id="castb"><i></i><span></span></div></div>
  <div id="xpbar"><div class="bar xp" id="xpb"><i></i><span></span></div></div>

 </div>

</div>

<div id="modal"><div id="modalp" class="panel"></div></div>
<script>
// ================= I18N (shared by Lost Aura Games titles) =================
// One language setting for the whole site and every game: localStorage "lag.lang".
// Strings are looked up by their English text: t('PLAY') -> 'JUGAR'. {name} placeholders are filled from vars.
// Missing translations fall back to English and are logged once (console.info + I18N_MISS) so tests can catch them.
const LAG_LANGS=[['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português'],['it','Italiano']];
const LAG_LANG_KEY='lag.lang';
const LAG_LANG_CODES=LAG_LANGS.map(l=>l[0]);
function lagDetectLang(){let v=null;try{v=localStorage.getItem(LAG_LANG_KEY);}catch(e){}if(v&&LAG_LANG_CODES.includes(v))return v;
 const navs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(const n of navs){const c=String(n||'').toLowerCase().slice(0,2);if(LAG_LANG_CODES.includes(c))return c;}return'en';}
let LANG=lagDetectLang();
const I18N={};for(const c of LAG_LANG_CODES)I18N[c]={};
const I18N_MISS=new Set();
// rows: [english, es, fr, de, pt, it]
function i18nRows(rows){for(const r of rows){for(let i=1;i<LAG_LANG_CODES.length;i++){if(r[i]!=null)I18N[LAG_LANG_CODES[i]][r[0]]=r[i];}}}
function t(key,vars){let s=key;if(LANG!=='en'){const d=I18N[LANG];if(d&&Object.prototype.hasOwnProperty.call(d,key))s=d[key];else if(!I18N_MISS.has(LANG+'|'+key)){I18N_MISS.add(LANG+'|'+key);try{console.info('[i18n] missing '+LANG+': '+key);}catch(e){}}}
 if(vars)s=String(s).replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);return s;}
const I18N_HOOKS=[];
function langName(c){const l=LAG_LANGS.find(x=>x[0]===c);return l?l[1]:c;}
function setLang(c,fromStorage){if(!LAG_LANG_CODES.includes(c))return;const changed=c!==LANG;LANG=c;try{document.documentElement.lang=c;}catch(e){}
 if(!fromStorage){try{localStorage.setItem(LAG_LANG_KEY,c);}catch(e){}}
 if(changed)for(const f of I18N_HOOKS){try{f(c);}catch(e){console.error(e);}}}
addEventListener('storage',e=>{if(e.key===LAG_LANG_KEY&&e.newValue&&e.newValue!==LANG)setLang(e.newValue,true);});
try{document.documentElement.lang=LANG;}catch(e){}
// Accented capitals for 5x7 bitmap fonts. Accented glyphs have 9 rows: row 0 is drawn one pixel row ABOVE the
// normal cell, rows 1..7 are the normal 7 rows, row 8 is one row below (for the cedilla).
function i18nFontExt(F){const sq=(g,drop)=>g.filter((_,i)=>i!==drop);
 const AC={acute:[2,4],grave:[8,4],circ:[4,10],tilde:[13,22],uml:[10,0],ring:[4,10]};
 const mk=(base,acc,drop)=>{const g=F[base];if(!g)return;const s=sq(g,drop==null?2:drop);return[AC[acc][0],AC[acc][1],...s,0];};
 const map={'Á':['A','acute'],'À':['A','grave'],'Â':['A','circ'],'Ã':['A','tilde'],'Ä':['A','uml'],'É':['E','acute'],'È':['E','grave'],'Ê':['E','circ'],'Ë':['E','uml'],
  'Í':['I','acute'],'Ì':['I','grave'],'Î':['I','circ'],'Ï':['I','uml'],'Ó':['O','acute'],'Ò':['O','grave'],'Ô':['O','circ'],'Õ':['O','tilde'],'Ö':['O','uml'],
  'Ú':['U','acute'],'Ù':['U','grave'],'Û':['U','circ'],'Ü':['U','uml'],'Ñ':['N','tilde',1]};
 for(const k in map){if(F[k])continue;const v=map[k];const g=mk(v[0],v[1],v[2]);if(g)F[k]=g;}
 if(!F['Ç']&&F.C)F['Ç']=[0,...F.C,4];
 if(!F['¿'])F['¿']=[4,0,4,8,16,17,14];if(!F['¡'])F['¡']=[4,0,4,4,4,4,4];
 if(!F[','])F[',']=[0,0,0,0,0,4,8];if(!F['/'])F['/']=[1,1,2,4,8,16,16];if(!F['('])F['(']=[2,4,8,8,8,4,2];if(!F[')'])F[')']=[8,4,2,2,2,4,8];
 if(!F['%'])F['%']=[24,25,2,4,8,19,3];if(!F['+'])F['+']=[0,4,4,31,4,4,0];if(!F['"'])F['"']=[10,10,0,0,0,0,0];if(!F['«'])F['«']=[0,5,10,20,10,5,0];if(!F['»'])F['»']=[0,20,10,5,10,20,0];
 if(!F['Œ']&&F.O)F['Œ']=[15,20,20,23,20,20,15];return F;}
// glyph row helper for font renderers: returns [rows, yOffset]
function glyphRows(g){return g&&g.length===9?[g,-1]:[g,0];}
// Upper-case for the pixel fonts: keep ß as SS (toUpperCase does that) and fold anything unknown to its base letter.
function pixUpper(s,F){s=String(s).toUpperCase();if(!F)return s;let o='';for(const ch of s){if(F[ch]){o+=ch;continue;}const b=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');o+=F[b]?b:ch;}return o;}
// tiny pixel globe icon (12x12, scaled) for the language buttons

 const R=['....####....','..##.#..##..','.#..#..#..#.','.#..#..#..#.','############','#...#..#...#','#...#..#...#','############','.#..#..#..#.','.#..#..#..#.','..##.#..##..','....####....'];
 for(let j=0;j<12;j++)for(let i=0;i<12;i++)if(R[j][i]==='#')x.fillRect(i*px,j*px,px,px);c.style.verticalAlign='middle';return c;}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=OPT.muted?0:1;MASTER.connect(AC.destination);}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,d,type='square',vol=.08,slide=0,delay=0){if(OPT.muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.02);}
function noise(d,vol=.08,delay=0,hp=800){if(OPT.muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const len=Math.max(1,Math.floor(a.sampleRate*d));const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);}

function startMusic(name){MUSIC.want=name;if(OPT.muted||!OPT.music||!AC)return;if(MUSIC.track===name&&MUSIC.timer)return;stopMusic();const a=AC;MUSIC.track=name;const tr=TRACKS[name]||TRACKS.wild;const pat=genPattern(tr);MUSIC.step=0;MUSIC.next=a.currentTime+.08;
 MUSIC.gain=a.createGain();MUSIC.gain.gain.value=.4;MUSIC.gain.connect(MASTER);const g=MUSIC.gain;
 const play=(f,t,d,type,v)=>{const o=a.createOscillator(),e=a.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+.02);};
 MUSIC.timer=setInterval(()=>{if(OPT.muted||!OPT.music){stopMusic();return;}const sd=60/tr.bpm/4;while(MUSIC.next<a.currentTime+.25){const i=MUSIC.step%64,t=MUSIC.next;const m=pat.mel[i];if(m!==null)play(noteF(tr,m,1),t,sd*1.7,tr.lead,tr.lead==='sawtooth'?.012:.018);
  const b=pat.bass[i];if(b!==null)play(noteF(tr,b,-1),t,sd*1.9,'triangle',.06);
  if(tr.drums){if(i%4===0)play(70,t,.08,'sine',.1);if(i%4===2){const len=Math.floor(a.sampleRate*.03);const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let k=0;k<len;k++)ch[k]=(Math.random()*2-1)*(1-k/len);const s=a.createBufferSource();s.buffer=buf;const e=a.createGain();e.gain.value=.025;s.connect(e);e.connect(g);s.start(t);}}
  if(i%16===0)play(noteF(tr,0,0),t,sd*8,'sine',.025);MUSIC.step++;MUSIC.next+=sd;}},50);}
function stopMusic(){if(MUSIC.timer)clearInterval(MUSIC.timer);MUSIC.timer=null;MUSIC.track=null;if(MUSIC.gain){try{MUSIC.gain.disconnect();}catch(e){}MUSIC.gain=null;}}
function setMuted(m){OPT.muted=!!m;saveOpt();if(MASTER)MASTER.gain.value=OPT.muted?0:1;if(OPT.muted)stopMusic();else{ac();if(MUSIC.want)startMusic(MUSIC.want);}}
// ---- value noise ----
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o=3){let t=0,a=1,f=1,n=0;for(let i=0;i<o;i++){t+=vnoise(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2;}return t/n;}
// ---- misc ----
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function fmt(n){n=Math.floor(n);if(n>=1e7)return(n/1e6).toFixed(1)+'M';if(n>=1e5)return Math.floor(n/1e3)+'k';return n.toLocaleString('en-US');}
function goldStr(n){return '<span class="gold">'+fmt(n)+'g</span>';}
function wpick(list,wf,r=Math.random){let tot=0;for(const x of list)tot+=wf(x);let v=r()*tot;for(const x of list){v-=wf(x);if(v<=0)return x;}return list[list.length-1];}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ================= LEVEL CURVE (max 200) =================
const MAX_LEVEL=200;
function mobXP(L){return Math.round(10+L*3);}
function killsPerLevel(L){return 4+.12*Math.pow(L,1.75);}
function xpToNext(L){return L>=MAX_LEVEL?Infinity:Math.round(killsPerLevel(L)*mobXP(L));}
// ================= COMBAT CURVES =================
function mobHPBase(L){return 20+16*Math.pow(L,1.12);}
function weaponBase(L){return mobHPBase(L)/6.2;}
function mobDmgBase(L){return (80+16*L)/11;}
function statRating(v,L){return v/(10+3*L);}

function tierOf(L){let t=0;for(let i=0;i<ZONES.length;i++)if(ZONES[i].lvl[0]<=L)t=i;return t;}
function gearVal(ilvl,rar){return Math.max(1,Math.round((3+Math.pow(ilvl,1.4)*.7)*RAR[rar].v));}
function statRoll(ilvl,rar,r){return Math.max(1,Math.round((2+ilvl*.35)*(.6+r()*.4)*(RAR[rar].m)));}
function goldDrop(L){return(2+L*1.0+Math.pow(L,1.5)*.06);}

function itemClasses(it){if(it.k!=='gear')return null;if(it.arm){return CLASS_KEYS.filter(c=>CLASSES[c].armor.includes(it.arm));}
 if(it.wt)return WEAPONS[it.wt].cls.slice();return CLASS_KEYS.slice();}
function canEquip(P,it){if(!it||it.k!=='gear')return{ok:false,why:'Not equipment'};const cls=itemClasses(it);if(cls&&!cls.includes(P.cls))return{ok:false,why:'Your class cannot use '+(it.arm?ARMOR_FAM[it.arm].n+' armor':WEAPONS[it.wt].n+'s')};
 if(it.arm==='plate'&&!P.plate)return{ok:false,why:P.lvl<20?'Plate armor requires level 20 and Warrior Specialist training':'Train Plate Armor with a Warrior Specialist first'};
 if(P.lvl<it.req)return{ok:false,why:'Requires level '+it.req};return{ok:true};}

 if(wt){slot=WEAPONS[wt].off?'off':'main';}

 else if(slot==='main'||slot==='off'){if(!wt){if(slot==='off')wt='shield';else wt=pick2(['sword2','axe2','mace2','hammer2','sword','mace','axe','dagger','rapier','wand','sceptre','staff'],r);}

  if(W.off){it.armor=Math.round((4+ilvl*2.2)*2.6*.7*RAR[rar].m);it.block=10;}else{it.dmg=Math.round(weaponBase(ilvl)*W.m*RAR[rar].m*(.95+r()*.1));it.spd=W.spd;it.h=W.h;}
  nm=(W.ranged?WOOD_N[tier]:METAL_N[tier])+' '+W.n;it.icon=wt;}
 else{slot=slot==='ring1'||slot==='ring2'?'ring':slot;it.slot=slot;statPool=STAT_KEYS;nm=(slot==='amulet'?['Copper','Silver','Gold','Moonstone','Opal','Sapphire','Ruby','Pearl','Emerald','Storm-Opal','Skystone','Soulgem','Firegem','Onyx','Aether'][tier]+' '+(slot==='amulet'?'Amulet':'Ring'):['Copper','Silver','Gold','Moonstone','Opal','Sapphire','Ruby','Pearl','Emerald','Storm-Opal','Skystone','Soulgem','Firegem','Onyx','Aether'][tier]+' Ring');it.icon=slot;}

function rollRarity(r=Math.random,elite=false){const v=r()*100;if(v<(elite?1.2:.3))return 3;if(v<(elite?25:10))return 2;if(v<(elite?65:38))return 1;return 0;}
function rollMobLoot(L,mob,P){const out=[];const r=Math.random;const chance=mob.elite?1:.34;if(r()>chance)return out;
 const n=mob.elite?(r()<.5?2:1):1;
 for(let i=0;i<n;i++){const v=r()*100;const il=clamp(L+ri(-1,1),1,MAX_LEVEL);
  if(v<28)out.push(mkJunk(L));
  else if(v<54){const opt={};if(r()<.45&&P)opt.cls=P.cls;if(opt.cls&&r()<.6){const C=CLASSES[P.cls];if(r()<.6)opt.arm=pick(C.armor.filter(a=>a!=='plate'||il>=20));else opt.wt=pick(C.weapons);}out.push(genGear(il,rollRarity(r,mob.elite),opt));}
  else if(v<66)out.push(mkPotion(r()<.65?'hp':'mp',potTier(L)));
  else if(v<72)out.push(mkScroll(pick(Object.keys(SCROLLS)),L));
  else if(v<79)out.push(genGear(il,rollRarity(r,mob.elite),{slot:r()<.5?'ring':'amulet'}));
  else if(v<85)out.push(mkFood(ri(0,FOODS.length-2),tierOf(L)));
  else if(v<88)out.push(mkEnch(ri(0,ENCH.length-1),L));
  else if(v<93)out.push(mkBandage(tierOf(L)));
  else if(v<99.7)out.push(mkJunk(L));
  else out.push(mkBag(tierOf(L),2));}
 return out;}

 ZONES.forEach((Z,z)=>{const S=STORY[z];const L0=Z.lvl[0],L1=Z.lvl[1];const lv=f=>Math.max(1,Math.round(L0+(L1-L0)*f));const E=npcId(z,'elder');const M=Z.mobs;
  const prevEnd=z>0?'m'+(z-1)+'_6':null;
  addQ({id:'m'+z+'_1',z,main:1,giver:E,lvl:lv(0),pre:prevEnd,title:z===0?'A Stranger Wakes':'Word from '+ZONES[z-1].town,text:S.intro+(z===0?'':'\n\n(You deliver the evidence.)'),obj:[{t:'talk',npc:E}],auto:z===0});

 const clear=(x,y,rad,path)=>{for(let j=-rad;j<=rad;j++)for(let k=-rad;k<=rad;k++){const xx=x+k,yy=y+j;if(xx<1||yy<1||xx>=W-1||yy>=H-1)continue;if(k*k+j*j>rad*rad+1)continue;const i=I(xx,yy);M.solid[i]=0;M.obj[i]=0;if(M.ground[i]>=G_LIQ)M.ground[i]=path?G_PATH:0;if(path)M.ground[i]=G_PATH;}};

function genDungeon(did){const D=DUNGEON_BY_ID[did];const r=mulberry(5000+D.idx*131);const W=90,H=90;const M=newMap(W,H);M.kind='dungeon';M.d=did;M.z=D.zone;const I=(x,y)=>y*W+x;

 const rooms=[];let x=10+Math.floor(r()*10),y=H-16;const n=8;
 for(let k=0;k<n;k++){const big=k===n-1;const w=big?18:9+Math.floor(r()*6),h=big?16:8+Math.floor(r()*5);const rx=clamp(x-(w>>1),2,W-w-2),ry=clamp(y-(h>>1),2,H-h-2);rooms.push({x:rx,y:ry,w,h,cx:rx+(w>>1),cy:ry+(h>>1)});
  // next room position: wander upward / sideways
  const dir=k%3===2?'up':(r()<.5?'side':'up');if(dir==='up'){y-=14+Math.floor(r()*6);x+=Math.floor((r()-.5)*24);}else{x+=(x<W/2?1:-1)*(20+Math.floor(r()*8));y-=Math.floor(r()*8);}x=clamp(x,12,W-12);y=clamp(y,12,H-12);}
 const carve=(x0,y0,w,h)=>{for(let j=y0;j<y0+h;j++)for(let i=x0;i<x0+w;i++){if(i<1||j<1||i>=W-1||j>=H-1)continue;M.solid[I(i,j)]=0;M.ground[I(i,j)]=G_FLOOR;}};
 rooms.forEach(R=>carve(R.x,R.y,R.w,R.h));
 for(let k=1;k<rooms.length;k++){const a=rooms[k-1],b=rooms[k];let cx=a.cx,cy=a.cy;while(cx!==b.cx){carve(cx-1,cy-1,3,3);cx+=Math.sign(b.cx-cx);}while(cy!==b.cy){carve(cx-1,cy-1,3,3);cy+=Math.sign(b.cy-cy);}}
 // decor
 rooms.forEach((R,k)=>{for(let t=0;t<4;t++){const xx=R.x+1+Math.floor(r()*(R.w-2)),yy=R.y+1+Math.floor(r()*(R.h-2));if(Math.abs(xx-R.cx)<3&&Math.abs(yy-R.cy)<3)continue;const i=I(xx,yy);M.obj[i]=OBJ_IDX[D.theme==='ice'?'icerock':D.theme==='tomb'?'pillar':D.theme==='sunken'?'column':D.theme==='under'?'grave':D.theme==='jungle'?'jtree':D.theme==='void'||D.theme==='shadow'?'crystal':'rock'];M.solid[i]=1;}
  for(let t=0;t<3;t++){const xx=R.x+1+Math.floor(r()*(R.w-2)),yy=R.y+1+Math.floor(r()*(R.h-2));const i=I(xx,yy);if(!M.solid[i]){M.obj[i]=OBJ_IDX[D.theme==='hive'?'shroom':D.theme==='foundry'?'vent':'bones'];}}});
 M.rooms=rooms;const s=rooms[0];M.start={x:s.cx+.5,y:s.cy+2.5};M.exitPortal={x:s.cx+.5,y:s.cy+.5};
 // packs
 rooms.forEach((R,k)=>{if(k===0)return;const last=k===rooms.length-1;if(last){M.spawns.push({x:R.cx+.5,y:R.cy+.5,boss:1,lvl:D.lvl,n:1,alive:0,timer:0,once:1});
   for(let t=0;t<2;t++){const m=D.mobs[t%D.mobs.length];M.spawns.push({x:R.cx-5+t*10+.5,y:R.cy+4.5,dmob:m,lvl:D.lvl,n:1,alive:0,once:1});}return;}
  const packs=1+(R.w*R.h>110?1:0)+(r()<.5?1:0);for(let p=0;p<packs;p++){const m=D.mobs[Math.floor(r()*D.mobs.length)];const px_=R.x+2+Math.floor(r()*(R.w-4)),py_=R.y+2+Math.floor(r()*(R.h-4));
   M.spawns.push({x:px_+.5,y:py_+.5,dmob:m,lvl:D.lvl-2+Math.floor(r()*3),n:2+Math.floor(r()*2),alive:0,once:1,elite:k===4&&p===0});}});
 M.reach=new Uint8Array(W*H).fill(1);return M;}

function calcStats(){const C=CLASSES[P.cls];const L=P.lvl;const M=treeMods();const st={};STAT_KEYS.forEach(k=>st[k]=0);let armor=0,block=0;
 for(const s of SLOTS){const it=P.eq[s];if(!it)continue;for(const k in it.st)st[k]+=it.st[k];if(it.armor)armor+=it.armor*(1+((it.ench&&it.ench.arm)||0)/100);if(it.block)block+=it.block;
  if(it.ench&&it.ench.stat)st[it.ench.stat]+=it.ench.v;if(it.fx)for(const k in it.fx)M[k]=(M[k]||0)+it.fx[k];}
 const now=Date.now();for(const b of P.buffs){if(b.until>now)for(const k in b.b)M[k]=(M[k]||0)+b.b[k];}
 if(GAME.abuffs)for(const b of GAME.abuffs){for(const k in b.b)M[k]=(M[k]||0)+b.b[k];}
 const [pk,sk]=C.main;const fl=1+L*.08;st[pk]+=(M.primFlat||0)*fl;st[sk]+=(M.secFlat||0)*fl;
 const all=1+(M.allstat||0)/100;for(const k of STAT_KEYS)st[k]=Math.round(st[k]*all);st[pk]=Math.round(st[pk]*(1+(M.primScale||0)/100));st[sk]=Math.round(st[sk]*(1+(M.secScale||0)/100));

  gold:1+(M.gold||0)/100,xp:1+(M.xp||0)/100,cdr:(M.cdr||0),splash:1+(M.splash||0)/100,minDmg:1+(M.minionDmg||0)/100,minHp:1+(M.minionHp||0)/100,minAs:1+(M.minionAs||0)/100,minCount:(M.minionCount||0),jumps:(M.jumps||0)};
 let hpm=1+(M.hp||0)/100;
 if(P.cls==='knight'){S.pow=1.3+.5*p;hpm*=1+.5*s;armor*=1+.2*s;S.block=P.eq.off&&P.eq.off.wt==='shield'?5+8*p+(M.block||0)+block*.2:0;if(P.eq.main&&P.eq.main.h===2)S.dmg*=1+(M.twoh||0)/100;}

// ---- equipment ----
function equip(invIdx){const it=P.inv[invIdx];const c=canEquip(P,it);if(!c.ok){toast(t(c.why),'#ff4a5a');sfx('err');return;}
 let slot=it.slot;if(slot==='ring')slot=!P.eq.ring1?'ring1':!P.eq.ring2?'ring2':'ring1';

 if(slot==='main'&&it.h===2&&P.eq.off){const o=P.eq.off;P.eq.off=null;if(!invAdd(o,true)){P.eq.off=o;P.eq[slot]=old;P.inv[invIdx]=it;toast(t('No room to unequip off-hand'));return;}}

function unequip(slot){const it=P.eq[slot];if(!it)return;const i=P.inv.indexOf(null);if(i<0){toast(t('Inventory full!'),'#ff4a5a');return;}P.inv[i]=it;P.eq[slot]=null;sfx('equip');calcStats();}
function itemScore(it){if(!it||it.k!=='gear')return 0;const C=CLASSES[P.cls];let s=0;for(const k in it.st)s+=it.st[k]*(C.main[0]===k?3:C.main[1]===k?2:.3);s+=(it.armor||0)*.15+(it.dmg?it.dmg/(it.spd||1)*1.2:0);return s*(it.leg?2:1);}

// ---- tile helpers ----
function solidAt(M,x,y){const xi=Math.floor(x),yi=Math.floor(y);if(xi<0||yi<0||xi>=M.w||yi>=M.h)return true;return M.solid[yi*M.w+xi]===1;}
function canStand(M,x,y,r){return!solidAt(M,x-r,y-r*.5)&&!solidAt(M,x+r,y-r*.5)&&!solidAt(M,x-r,y+r*.5)&&!solidAt(M,x+r,y+r*.5);}
function moveEnt(e,dx,dy,r=.3){const M=GAME.map;if(dx&&canStand(M,e.x+dx,e.y,r))e.x+=dx;if(dy&&canStand(M,e.x,e.y+dy,r))e.y+=dy;}
function losClear(a,b){const M=GAME.map;const d=Math.hypot(b.x-a.x,b.y-a.y);const n=Math.ceil(d*2);for(let i=1;i<n;i++){const x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;const t=M.solid[Math.floor(y)*M.w+Math.floor(x)];if(t&&M.ground[Math.floor(y)*M.w+Math.floor(x)]!==G_LIQ&&M.ground[Math.floor(y)*M.w+Math.floor(x)]!==G_VOID)return false;}return true;}

function unstick(){const M=GAME.map;if(canStand(M,PE.x,PE.y,.3))return;for(let r=1;r<12;r++)for(let a=0;a<16;a++){const x=PE.x+Math.cos(a/16*6.283)*r*.5,y=PE.y+Math.sin(a/16*6.283)*r*.5;if(canStand(M,x,y,.3)){PE.x=x;PE.y=y;return;}}}

 return{id:uid(),kind:'mob',mid:id,name:opts.name||name,arch,pal,lvl,hp,maxHp:hp,dmg:mobDmgBase(lvl)*dmM,x,y,sx:x,sy:y,spd:(fast?3.6:2.5)*(opts.boss?1.05:1),ranged:flags.includes('R'),beast:flags.includes('B'),tough,elite:!!opts.elite,boss:!!opts.boss,

function updateSpawns(dt){const M=GAME.map;for(const s of M.spawns){const d=Math.hypot(s.x-PE.x,s.y-PE.y);
  if(s.mobs&&s.mobs.length){s.mobs=s.mobs.filter(m=>m.hp>0);if(!s.mobs.length){if(s.once){s.done=1;}else s.timer=rnd(30,55);}

  if(s.done)continue;if(s.timer>0){s.timer-=dt;continue;}if(d>(M.kind==='dungeon'?60:46))continue;if(d<9&&M.kind==='zone')continue;
  s.mobs=[];for(let k=0;k<s.n;k++){let m;const ox=k?rnd(-1.2,1.2):0,oy=k?rnd(-1.2,1.2):0;

 // quest elites
 if(M.kind==='zone'){for(const qid in P.quests.a){const q=QUESTS[qid];if(!q||q.z!==M.z)continue;q.obj.forEach((o,oi)=>{if(o.t!=='elite')return;const st=P.quests.a[qid];if(st.p[oi]>=1)return;
   if(GAME.mobs.some(m=>m.quest===qid&&m.hp>0))return;st.et=(st.et||0)-dt;if(st.et>0)return;const poi=M.pois[o.poi];if(Math.hypot(poi.x-PE.x,poi.y-PE.y)>40)return;
   const Z=ZONES[M.z];const pal=o.pal||['#3a1a4a','#22102d','#c8a0a0','#ff3aff'];const m=makeMob(['qe_'+qid,o.name,o.arch,pal,0,'T'],Math.min(Z.lvl[1],q.lvl+2),poi.x+.5,poi.y+.5,{elite:1,quest:qid,name:o.name,qitem:o.item});m.hp=m.maxHp=Math.round(m.maxHp*1.6);GAME.mobs.push(m);st.et=40;});}}}

function playerHit(m,base,o={}){if(!m||m.hp<=0)return 0;let d=base*PS.pow*PS.dmg;let crit=Math.random()*100<PS.crit;
 if(PE.stealth&&o.melee!==false&&P.cls==='thief'){d*=1.6*(PS.stealthDmg/100);crit=true;o.ambush=1;}
 if(o.behind&&P.cls==='thief'){const fx=m.fx;const behind=(PE.x-m.x)*fx<0;if(behind||o.ambush){d*=(o.behind+(PS.M.behind||0)/100);}}
 if(PE.next50){d*=1.5;PE.next50=false;}

 if(crit)d*=1+PS.critd/100;d*=rnd(.92,1.08);d=Math.max(1,Math.round(d));
 if(o.ambush){floater(m.x,m.y-.4,t('AMBUSH!'),'#c25cff',1);}
 if(PE.stealth&&o.melee!==false){breakStealth();}
 damageMob(m,d,crit,o.el);PE.lastHit=GAME.time;
 if(PS.lifesteal&&d>0){healPlayer(d*PS.lifesteal/100,true);}
 if(o.poisonable!==false&&GAME.abuffs.some(b=>b.id==='poison')){m.dots.push({dps:d*.12*(1+(PS.M.poison||0)/100),t:6,c:'#3cff5a'});}
 if(o.el==='fire'&&PS.M.burn){m.dots.push({dps:d*.04*PS.M.burn/15,t:4,c:'#ff8a1e'});}
 if(P.cls==='knight'&&!o.noGain)gainRes(6);
 return d;}
function damageMob(m,d,crit,el){if(m.hp<=0)return;m.hp-=d;m.flash=.12;floater(m.x,m.y,(crit?'*':'')+fmt(d),crit?'#ffd24a':el==='fire'?'#ff8a1e':el==='frost'?'#9fe':el==='shock'?'#fff27a':el==='dark'?'#c25cff':'#fff',crit);sfx(crit?'crit':'hit');
 if(m.state==='idle'||m.state==='return'){m.state='chase';m.tgt=PE;alertPack(m);}if(m.hp<=0)killMob(m);}

function killMob(m){m.hp=0;sfx('die');burst(m.x,m.y,m.pal[0],12);GAME.mobs=GAME.mobs.filter(o=>o!==m);if(GAME.target===m)GAME.target=null;

 // xp & gold
 const diff=m.lvl-P.lvl;let xm=diff<-10?.1:diff<-5?.5:diff>3?1.25:1;let xp=mobXP(m.lvl)*xm*(m.elite?3:1)*(m.boss?25:1)*(m.dun&&!m.boss?1.3:1);gainXP(xp);

 if(m.boss)onBossKilled();

function damagePlayer(d,src){if(PE.dead||d<=0)return;if(GAME.godmode)return;

function mobsNear(x,y,r){return GAME.mobs.filter(m=>m.hp>0&&Math.hypot(m.x-x,m.y-y)<=r+.3*m.size);}
function pickTarget(range){const T=GAME.target;if(T&&T.hp>0&&Math.hypot(T.x-PE.x,T.y-PE.y)<=range+.4*T.size)return T;

function npcName(id){for(const k in GAME.zoneMaps){const n=GAME.zoneMaps[k].npcs.find(n=>n.id===id);if(n)return n.n;}const m=id.match(/^z(\d+)_(\w+)$/);if(m&&m[2]==='elder')return ELDERS[+m[1]];return id;}
function qState(id){return P.quests.a[id];}
function qDone(id){return!!P.quests.d[id];}
function qAvailable(q){if(qDone(q.id)||qState(q.id))return false;if(q.pre&&!qDone(q.pre))return false;if(P.lvl<q.lvl-(q.dungeon?0:2))return false;return true;}
function qComplete(q){const st=qState(q.id);if(!st)return false;return q.obj.every((o,i)=>objProgress(q,o,i)>=objNeed(o));}
function objNeed(o){return o.n||1;}
function objProgress(q,o,i){const st=qState(q.id);if(!st)return 0;if(o.t==='collect'||o.t==='gather')return Math.min(o.n,invCount('q_'+o.item));if(o.t==='elite')return invCount('q_'+o.item)>0||st.p[i]>=1?1:0;return st.p[i]||0;}
function objText(q,o,i){const p=objProgress(q,o,i),n=objNeed(o);const Z=ZONES[q.z];const poi=(k)=>STORY[q.z].pois[k];
 switch(o.t){case'kill':{const d=mobDef(o.mob);return t('Slay {m}',{m:d?d[1]:o.mob})+' '+p+'/'+n;}case'collect':{const d=mobDef(o.mob);return o.item+' ('+(d?d[1]:'')+') '+p+'/'+n;}
  case'gather':return o.item+' @ '+poi(o.poi)+' '+p+'/'+n;case'elite':return t('Defeat {m} at {p}',{m:o.name,p:poi(o.poi)})+' '+p+'/1';case'talk':return t('Speak with {n}',{n:npcName(o.npc)})+(p?' ✓':'');
  case'explore':return t('Explore {p}',{p:poi(o.poi)})+(p?' ✓':'');case'dungeon':{const D=DUNGEON_BY_ID[o.d];return t('Defeat {b}',{b:D.boss.n})+(p?' ✓':'');}}return'';}
function acceptQuest(q){if(!qAvailable(q))return;P.quests.a[q.id]={p:q.obj.map(()=>0),t:Date.now()};sfx('quest');chat(t('Quest accepted: {q}',{q:q.title}),'#ffd24a');
 q.obj.forEach((o,i)=>{if(o.t==='talk'&&o.npc===q.giver&&!q.turn)P.quests.a[q.id].p[i]=1;});
 if(q.dungeon){chat(t('Dungeon unlocked in your Adventure Book: {d}',{d:DUNGEON_BY_ID[q.dungeon].n}),'#ff8a1e');}rebuildQuestObjects();UI.dirty=1;}
function abandonQuest(id){delete P.quests.a[id];const q=QUESTS[id];q.obj.forEach(o=>{if(o.item&&(o.t==='collect'||o.t==='gather'||o.t==='elite'))invRemove('q_'+o.item,999);});rebuildQuestObjects();UI.dirty=1;}
function turnInQuest(q){if(!qComplete(q))return;q.obj.forEach(o=>{if(o.item)invRemove('q_'+o.item,999);});delete P.quests.a[q.id];P.quests.d[q.id]=1;
 const g=Math.round(questGold(q)*PS.gold);P.gold+=g;sfx('quest');banner(t('Quest Complete'),q.title,2400);chat(t('Quest complete: {q} (+{g} gold)',{q:q.title,g:fmt(g)}),'#3cff5a');
 // item reward
 let it=null;if(q.dungeon)it=genGear(q.lvl,2,{cls:P.cls,arm:pick(CLASSES[P.cls].armor.filter(a=>a!=='plate'||P.plate))});else if(q.main&&q.obj[0].t!=='talk')it=genGear(Math.max(1,q.lvl),Math.random()<.25?2:1,{cls:P.cls,...(Math.random()<.5?{wt:pick(CLASSES[P.cls].weapons.filter(w=>w!=='shield'))}:{arm:pick(CLASSES[P.cls].armor.filter(a=>a!=='plate'||P.plate))})});
 else if(!q.main){const r=Math.random();if(r<.35)it=genGear(q.lvl,1,{cls:P.cls});else{it=mkPotion('hp',potTier(q.lvl));it.q=3;}}
 if(it){if(!invAdd(it))GAME.loot.push({x:PE.x,y:PE.y+.5,it,t:300,bob:0});}
 gainXP(questXP(q));
 if(q.next){/* next zone's chain continues automatically */}
 rebuildQuestObjects();UI.dirty=1;saveGame(true);}
function questOnKill(m){for(const id in P.quests.a){const q=QUESTS[id];const st=P.quests.a[id];q.obj.forEach((o,i)=>{
  if(o.t==='kill'&&m.mid===o.mob&&st.p[i]<o.n){st.p[i]++;if(st.p[i]===o.n)questProgressMsg(q);}
  if(o.t==='collect'&&m.mid===o.mob&&invCount('q_'+o.item)<o.n&&Math.random()<o.chance){invAdd(mkQuest(id,o.item));}
  if(o.t==='elite'&&m.quest===id){st.p[i]=1;}});}UI.dirty=1;}
function questOnItem(it){if(it.k!=='quest')return;for(const id in P.quests.a){const q=QUESTS[id];q.obj.forEach((o,i)=>{if(o.item===it.n&&objProgress(q,o,i)>=objNeed(o))questProgressMsg(q);});}}
function questProgressMsg(q){if(qComplete(q)){sfx('quest');toast(t('{q} — ready to turn in!',{q:q.title}),'#3cff5a');}}
function questOnExplore(){const M=GAME.map;if(!M||M.kind!=='zone')return;for(const id in P.quests.a){const q=QUESTS[id];if(q.z!==M.z)continue;q.obj.forEach((o,i)=>{if(o.t!=='explore')return;const poi=M.pois[o.poi];const st=P.quests.a[id];if(!st.p[i]&&Math.hypot(poi.x-PE.x,poi.y-PE.y)<6){st.p[i]=1;toast(t('Explored {p}',{p:poi.n}),'#3cff5a');questProgressMsg(q);UI.dirty=1;}});}}
function questOnTalk(npc){for(const id in P.quests.a){const q=QUESTS[id];q.obj.forEach((o,i)=>{if(o.t==='talk'&&o.npc===npc.id&&!P.quests.a[id].p[i]){P.quests.a[id].p[i]=1;UI.dirty=1;}});}}
function npcQuests(npc){const give=QUEST_LIST.filter(q=>q.giver===npc.id&&qAvailable(q));const turn=QUEST_LIST.filter(q=>(q.turn||q.giver)===npc.id&&qState(q.id)&&qComplete(q));const act=QUEST_LIST.filter(q=>(q.turn||q.giver)===npc.id&&qState(q.id)&&!qComplete(q));return{give,turn,act};}
function npcMarker(npc){if(!['elder','board','villager'].includes(npc.role))return null;const Q=npcQuests(npc);if(Q.turn.length)return'?';if(Q.give.length)return'!';if(Q.act.length)return'.';return null;}

const PROF_MAX=400;
function profReq(tier){return tier*25;}
function profGain(tier){if(P.prof<PROF_MAX&&P.prof<profReq(tier)+40){P.prof++;if(P.prof%25===0)chat(t('{i} skill increased to {n}',{i:INTERESTS[P.interest].n,n:P.prof}),'#ffd24a');}}
function startChannel(label,dur,done){if(GAME.cast)return;if(inCombat()&&label!==t('Bandaging')){}GAME.cast={label,t:0,dur,done,x:PE.x,y:PE.y,interruptible:true};}
function harvestNode(n){const want=n.kind==='herb'?'cloth':'mining';if(P.interest!==want){toast(t(n.kind==='herb'?'Only Clothworkers can harvest herbs':'Only Miners can mine ore'));return;}
 if(P.prof<profReq(n.tier)){toast(t('Requires {i} skill {n}',{i:INTERESTS[P.interest].n,n:profReq(n.tier)}),'#ff4a5a');return;}
 startChannel(n.kind==='herb'?t('Harvesting'):t('Mining'),1.4,()=>{if(n.t>0)return;n.t=90;const q=ri(1,n.kind==='ore'&&n.tier>=10?2:3);invAdd(mkMat(n.kind,n.tier,q));profGain(n.tier);sfx(n.kind==='herb'?'harvest':'mine');
  if(Math.random()<.08){invAdd(n.kind==='herb'?mkMat('herb',Math.min(14,n.tier+1),1):mkMat('ore',Math.min(14,n.tier+1),1));}});}
function skinCorpse(c){if(P.interest!=='leather'){toast(t('Only Leatherworkers can skin beasts'));return;}if(!c.beast||c.skinned){toast(t('Nothing to skin'));return;}if(P.prof<profReq(c.tier)){toast(t('Requires {i} skill {n}',{i:INTERESTS.leather.n,n:profReq(c.tier)}),'#ff4a5a');return;}
 startChannel(t('Skinning'),1.2,()=>{if(c.skinned)return;c.skinned=true;invAdd(mkMat('hide',c.tier,ri(1,c.boss?6:2)));profGain(c.tier);sfx('harvest');});}
// recipes are generated per tier for the chosen interest

 for(let t0=0;t0<maxT;t0++){const req=profReq(t0);const L=Math.round(ZONES[t0].lvl[0]+(ZONES[t0].lvl[1]-ZONES[t0].lvl[0])*.5);

   out.push({t:t0,req,n:CLOTH_N[t0]+' Bandage x3',mats:[['mat_cloth_'+t0,1,CLOTH_N[t0]+' Cloth']],make:()=>{const b=mkBandage(t0);b.q=3;return b;},icon:'bandage'});
   [['head',3],['chest',5],['legs',4],['hands',2],['feet',2]].forEach(([s,q])=>out.push({t:t0,req,n:CLOTH_N[t0]+' '+ARMOR_FAM.cloth.names[s],mats:[['mat_cloth_'+t0,q,CLOTH_N[t0]+' Cloth']],make:()=>craftGear(L,{slot:s,arm:'cloth'}),icon:s,gear:1,lvl:L}));}

   [['head',3],['chest',5],['legs',4],['hands',2],['feet',2]].forEach(([s,q])=>out.push({t:t0,req,n:LEATHER_N[t0]+' '+ARMOR_FAM.leather.names[s],mats:[['mat_leather_'+t0,q,LEATHER_N[t0]]],make:()=>craftGear(L,{slot:s,arm:'leather'}),icon:s,gear:1,lvl:L}));
   out.push({t:t0,req,n:mkBag(t0).n,mats:[['mat_leather_'+t0,6+t0,LEATHER_N[t0]],['mat_hide_'+t0,4,ZONES[t0].hide]],make:()=>mkBag(t0,1),icon:'bag'});}

   if(L>=20)[['head',4],['chest',7],['legs',5],['hands',3],['feet',3]].forEach(([s,q])=>out.push({t:t0,req:req+10,n:METAL_N[t0]+' '+ARMOR_FAM.plate.names[s],mats:[['mat_bar_'+t0,q,BAR_N[t0]]],make:()=>craftGear(L,{slot:s,arm:'plate'}),icon:s,gear:1,lvl:L}));}}
 return out;}
function craftGear(L,opt){const v=Math.random()*100;const rar=v<3?3:v<30?2:1;const cls=(CLASSES[P.cls].armor.includes(opt.arm))?P.cls:null;return genGear(L,rar,Object.assign({cls},opt));}

function shopStock(npc){const z=npc.z;const key=npc.id;GAME.shops=GAME.shops||{};let S=GAME.shops[key];const now=Date.now();if(S&&S.until>now&&S.lvl===P.lvl)return S.items;
 const L=clamp(P.lvl,ZONES[z].lvl[0],ZONES[z].lvl[1]+5);const items=[];const T=tierOf(L);
 switch(npc.role){

  case'weapons':for(let i=0;i<7;i++){const C=CLASSES[P.cls];items.push(genGear(L-ri(0,3),Math.random()<.3?1:0,{wt:pick(C.weapons),cls:P.cls}));}break;
  case'jeweler':for(let i=0;i<6;i++)items.push(genGear(L,Math.random()<.4?2:1,{slot:i%2?'ring':'amulet',cls:P.cls}));break;

 items.forEach(it=>{it.price=priceOf(it,npc.role);});GAME.shops[key]={items,until:now+10*60e3,lvl:P.lvl};return items;}
function priceOf(it,role){if(it.k==='mount')return MOUNTS[it.mid].cost;if(it.k==='bag')return it.val*8;if(it.k==='gear')return it.val*4;return it.val*3;}
function sellPrice(it){return it.k==='quest'?0:Math.max(1,Math.floor((it.val||1)*(it.q||1)));}
function buyItem(npc,it){const price=it.price;if(P.gold<price){toast(t('Not enough gold'),'#ff4a5a');sfx('err');return;}if(it.k==='mount'){if(P.lvl<it.req){toast(t('Requires level {n}',{n:it.req}));return;}if(P.mounts&&P.mounts.includes(it.mid)){toast(t('You already own this mount'));return;}}
 const c=cloneItem(it);delete c.price;if(c.k==='mount'){P.gold-=price;P.mounts=P.mounts||[];P.mounts.push(c.mid);if(!P.mount||MOUNTS[c.mid].sp>MOUNTS[P.mount].sp)P.mount=c.mid;sfx('buy');toast(t('Mount acquired: {m}. Press R to ride.',{m:c.n}),'#ffd24a');UI.dirty=1;return;}
 if(!invAdd(c,true)){toast(t('Inventory full!'),'#ff4a5a');return;}P.gold-=price;sfx('buy');UI.dirty=1;}
function sellItem(idx){const it=P.inv[idx];if(!it)return;if(it.k==='quest'){toast(t('Quest items cannot be sold'));return;}const g=sellPrice(it);P.gold+=g;P.inv[idx]=null;GAME.buyback=GAME.buyback||[];GAME.buyback.unshift(it);GAME.buyback=GAME.buyback.slice(0,8);sfx('gold');toast(t('Sold {i} for {g}g',{i:it.n,g:fmt(g)}));UI.dirty=1;}

  case'bandage':{if(inCombat()){toast(t('Cannot bandage in combat'));return;}if(PE.hp>=PE.maxHp){toast(t('Already at full health'));return;}const total=baseHPAt(ZONES[it.tier].lvl[0]+6,P.cls)*1.1;GAME.cast={label:t('Bandaging'),t:0,dur:5,interruptible:true,x:PE.x,y:PE.y,tick:total/5,done:()=>{}};sfx('heal');break;}

  case'food':{const F=FOODS[it.fi];const pot=1+it.tier*.08;const b={};for(const k in F.b)b[k]=Math.round(F.b[k]*pot);P.buffs=P.buffs.filter(x=>x.id!=='food');P.buffs.push({id:'food',n:F.n,b,until:Date.now()+15*60e3});calcStats();sfx('heal');toast(t('Well fed: {f}',{f:F.d}));break;}
  case'ench':{UI.enchantPick(idx);return;}
  case'bag':{const slot=P.bags.findIndex(b=>!b);if(slot<0){const smallest=P.bags.reduce((a,b,i)=>b.size<P.bags[a].size?i:a,0);if(P.bags[smallest].size>=it.size){toast(t('Your bags are already bigger'));return;}

  case'junk':case'mat':case'quest':toast(t('This item cannot be used'));return;}

function applyEnchant(invIdx,slot){const it=P.inv[invIdx];const g=P.eq[slot];if(!it||!g)return;const E=ENCH[it.ei];

function sortInv(){const items=P.inv.filter(Boolean);const ord={gear:0,pot:1,bandage:2,food:3,scroll:4,ench:5,bag:6,mount:7,mat:8,quest:9,junk:10};items.sort((a,b)=>(ord[a.k]-ord[b.k])||((b.rar||0)-(a.rar||0))||((b.ilvl||b.tier||0)-(a.ilvl||a.tier||0))||String(a.n).localeCompare(b.n));P.inv=items.concat(new Array(P.inv.length-items.length).fill(null));UI.dirty=1;}

function lbNormalize(s){return s.toLowerCase().replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t').replace(/8/g,'b').replace(/9/g,'g');}
function lbSlurNorm(s){const m={'1':'i','l':'i','!':'i','|':'i','y':'i','3':'e','4':'a','@':'a','0':'o','5':'s','$':'s','9':'g','6':'g','7':'t'};return String(s||'').toLowerCase().replace(/[1l!|y34@05$967]/g,c=>m[c]).replace(/[^a-z]/g,'').replace(/(.)\1+/g,'$1');}
function lbBlocked(s){return /nig(a|e?r|u[hr]|z|s|let)/.test(lbSlurNorm(s));}
function cleanName(raw){return String(raw||'').toUpperCase().replace(/[^A-Z0-9 _.\-]/g,'').replace(/\s+/g,' ').trim();}

 allSaves().forEach(s=>{const c=el('div',{class:'slotc'});const pv=document.createElement('canvas');pv.width=18;pv.height=26;pv.className='px';pv.style.cssText='width:54px;height:78px;float:right';try{pv.getContext('2d').drawImage(playerSprite(s,0),0,0);}catch(e){}
  c.appendChild(pv);c.insertAdjacentHTML('beforeend','<div class="gold" style="font-size:18px">'+esc(s.name)+'</div><div>'+t('Level {n}',{n:s.lvl})+' '+t(CLASSES[s.cls].n)+'</div><div class="grey">'+t(INTERESTS[s.interest].n)+'</div><div class="grey">'+esc(ZONES[s.zone]?ZONES[s.zone].n:'')+'</div>');
  c.onclick=()=>startGame(s);const del=el('div',{class:'btn sm red'},t('Delete'));del.onclick=ev=>{ev.stopPropagation();modal(t('Delete {n} forever?',{n:esc(s.name)}),[{t:t('Delete'),c:'red',f:()=>{deleteSave(s.id);showSelect();}},{t:t('Cancel')}]);};c.appendChild(del);row.appendChild(c);});
 B.appendChild(row);const bk=el('div',{class:'btn'},t('Back'));bk.onclick=showTitle;B.appendChild(bk);}
function showCreate(){showScreen('create');const B=$('#createbox');const st={cls:'knight',interest:'cloth',skin:'#e0b088',hair:'#5a3a1e'};
 const draw=()=>{B.innerHTML='<div class="h1">'+t('Create your hero')+'</div><div class="qtext grey">'+t('You wake in Hearthmoor, a village ringed by the enchanted Whisperwood. Giant ants are spilling from the forest... and a strange ember-mark glows on your palm.')+'</div>';
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Name')+'</div>');const nm=el('input',{class:'txt',maxlength:'12',placeholder:t('NAME'),id:'cname'});nm.value=st.name||'';nm.oninput=()=>{st.name=nm.value;$('#nerr').textContent='';};B.appendChild(nm);B.insertAdjacentHTML('beforeend','<div id="nerr" class="red" style="min-height:18px"></div>');
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Class')+'</div>');const cc=el('div',{class:'cards'});CLASS_KEYS.forEach(k=>{const C=CLASSES[k];const card=el('div',{class:'card'+(st.cls===k?' sel':''),'data-cls':k});const pv=document.createElement('canvas');pv.width=18;pv.height=26;pv.className='px';pv.style.cssText='width:54px;height:78px';
   const fake=newCharacter('X',k,'cloth',st);pv.getContext('2d').drawImage(playerSprite(fake,0),0,0);card.appendChild(pv);
   card.insertAdjacentHTML('beforeend','<div class="nm">'+t(C.n)+'</div><div class="ds">'+esc(t(C.d))+'</div><div class="ds"><b class="gold">'+t('Main stats')+':</b> '+t(STATS[C.main[0]].n)+' ★ / '+t(STATS[C.main[1]].n)+' ☆<br><b>'+t('Health')+':</b> '+(C.hp>=1.3?t('Highest'):C.hp<.8?t('Lowest'):t('Medium'))+'</div>');card.onclick=()=>{st.cls=k;draw();};cc.appendChild(card);});B.appendChild(cc);
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Interest')+' <span class="grey" style="font-size:12px">('+t('pick one — what you do when not questing')+')</span></div>');const ic=el('div',{class:'cards'});Object.keys(INTERESTS).forEach(k=>{const I=INTERESTS[k];const card=el('div',{class:'card'+(st.interest===k?' sel':''),'data-int':k});
   card.appendChild(canvasIcon(itemIcon({icon:I.icon==='herb'?'herb':I.icon==='hide'?'hide':'ore',k:'mat',tier:k==='mining'?12:0}),32));card.insertAdjacentHTML('beforeend','<div class="nm">'+t(I.n)+'</div><div class="ds">'+esc(t(I.d))+'</div>');card.onclick=()=>{st.interest=k;draw();};ic.appendChild(card);});B.appendChild(ic);
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Appearance')+'</div>');const ap=el('div',{class:'row'});['#f0c8a0','#e0b088','#c08a5a','#8a5a3a','#6a4a2a'].forEach(c=>{const b=el('div',{class:'btn sm'+(st.skin===c?' sel':''),style:'background:'+c+';width:28px;height:24px'});b.onclick=()=>{st.skin=c;draw();};ap.appendChild(b);});
  ap.appendChild(el('span',{style:'width:12px'}));['#5a3a1e','#2a1a10','#d8c070','#a03a1a','#e8e8e8','#3a3a5a'].forEach(c=>{const b=el('div',{class:'btn sm'+(st.hair===c?' sel':''),style:'background:'+c+';width:28px;height:24px'});b.onclick=()=>{st.hair=c;draw();};ap.appendChild(b);});B.appendChild(ap);
  const row=el('div',{class:'row',style:'margin-top:16px'});const go=el('div',{class:'btn big gold',id:'cgo'},t('Begin the journey'));go.onclick=()=>{const v=validateName(st.name||'');if(!v.ok){$('#nerr').textContent=v.err;sfx('err');return;}const p=newCharacter(v.name,st.cls,st.interest,st);startGame(p,true);};row.appendChild(go);
  const bk=el('div',{class:'btn'},t('Back'));bk.onclick=showTitle;row.appendChild(bk);B.appendChild(row);};
 draw();}
// ---------- start / quit ----------
function startGame(save,isNew){P=fixSave(JSON.parse(JSON.stringify(save)));GAME.zoneMaps={};GAME.mobs=[];GAME.minions=[];GAME.abuffs=[];GAME.loot=[];GAME.dun=null;GAME.shops={};GAME.time=0;GAME.lastTown=-1;mkPlayerEntity();calcStats();
 if(isNew||!P.woke){const M=getZoneMap(0);P.zone=0;PE.x=M.town.cx+.5;PE.y=M.town.cy-3;PE.hp=1;}
 showScreen('game');closeAll();buildMenuBtns();buildHotbar();$('#chatlog').innerHTML='';
 const z=P.zone||0;enterZone(z,null,P.x?{x:P.x,y:P.y}:null);if(PE.hp<=0)PE.hp=PE.maxHp;
 if(isNew||!P.woke){P.woke=true;PE.hp=Math.round(PE.maxHp*.3);const elder=GAME.map.npcs.find(n=>n.role==='elder');PE.x=elder.x+1.5;PE.y=elder.y+1;unstick();
  setTimeout(()=>{banner(t('You wake...'),t('Hearthmoor, the Whisperwood'),3200);setTimeout(()=>{if(GAME.running&&!GAME.dun&&GAME.map&&GAME.map.z===0&&Math.hypot(PE.x-elder.x,PE.y-elder.y)<6)talkTo(elder);},1600);},300);saveGame(true);}
 updateTracker();net.start();net.updateMeta();chat(t('Welcome to {g}! Press H or the ☰ menu for controls.',{g:GAME_TITLE}),'#ffd24a');if(net.ok)net.track();}
function quitToTitle(){GAME.running=false;closeAll();net.joinZone(null);P=null;PE=null;showTitle();}
// ---------- boot ----------
function boot(){R.c=$('#gc');R.x=R.c.getContext('2d');resize();setupInput();if(OPT.touch!=null)setTouch(OPT.touch);else setTouch(matchMedia('(pointer:coarse)').matches);
 addEventListener('keydown',e=>{if(e.code==='KeyH'&&GAME.running&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))showHelp();});
 I18N_HOOKS.push(()=>{if(GAME.running){buildMenuBtns();buildHotbar();Object.keys(UI.wins).forEach(id=>{const W=UI.wins[id];W.e.remove();delete UI.wins[id];});UI.open.clear();updateTracker();}else if($('#s-title').classList.contains('on'))showTitle();else if($('#s-create').classList.contains('on'))showCreate();});
 addEventListener('beforeunload',()=>{if(P)saveGame(true);});document.addEventListener('visibilitychange',()=>{if(document.hidden&&P)saveGame(true);});
 showTitle();requestAnimationFrame(frame);
 window.DEBUG={GAME,get P(){return P;},get PE(){return PE;},PS,ZONES,DUNGEONS,QUESTS,AB,give:(it)=>invAdd(it),lvl:(n)=>{P.lvl=n;P.xp=0;calcStats();PE.hp=PE.maxHp;PE.res=PE.maxRes;UI.dirty=1;},gold:(n)=>{P.gold+=n;},
  tp:(z)=>enterZone(z,null,null),dun:(id)=>enterDungeon(id),learnAll:()=>{Object.values(AB).filter(a=>a.cls===P.cls&&a.lvl<=P.lvl).forEach(a=>P.abil[a.id]=Math.max(1,P.abil[a.id]||0));buildHotbar();},
  accept:(id)=>{const q=QUESTS[id];P.quests.a[id]={p:q.obj.map(()=>0),t:Date.now()};rebuildQuestObjects();},finishQuest:(id)=>{delete P.quests.a[id];P.quests.d[id]=1;},
  god:(v=true)=>{GAME.godmode=v;},legRate:(r)=>{GAME.debugLeg=r;},gear:(L,rar)=>{const C=CLASSES[P.cls];SLOTS.forEach(s=>{let it;if(s==='main')it=genGear(L,rar,{wt:C.weapons.find(w=>WEAPONS[w].h===2)||C.weapons[0],cls:P.cls});else if(s==='off')return;else if(s.startsWith('ring'))it=genGear(L,rar,{slot:'ring',cls:P.cls});else if(s==='amulet')it=genGear(L,rar,{slot:'amulet',cls:P.cls});else it=genGear(L,rar,{slot:s,arm:C.armor[C.armor.length-1]==='plate'&&L>=20&&P.plate?'plate':C.armor[0],cls:P.cls});P.eq[s]=it;});calcStats();PE.hp=PE.maxHp;}};}
boot();

</script></body></html>
