<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>MYTHWEALD - The Hollow Crown (Playtest)</title>
<meta name="description" content="Mythweald: a retro pixel-art mythological online RPG. A Lost Aura Games production. Private playtest build.">
<style>
:root{--bone:#e8dcb5;--bone2:#a89f80;--bg:#050806;--green:#3cff5a;--blue:#3a7bff;--purple:#b04cff;--red:#ff4a5a;--gold:#ffd24a;--orange:#ff8a1e;--panel:#0d0b10f2;--c0:#d8d8d8;--c1:#3cff5a;--c2:#4a9bff;--c3:#c25cff;--c4:#ff8a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;font-family:"Courier New",Courier,monospace;font-weight:bold;color:var(--bone);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;font-size:14px}
#gc{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:1;cursor:crosshair}
#scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:multiply}
#vign{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.55) 100%)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:block}
.pass{pointer-events:none}.pass .pe{pointer-events:auto}
.t{text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.btn{display:inline-block;cursor:pointer;padding:7px 12px;margin:3px;background:#120f16;color:var(--bone);border:3px solid var(--bone);box-shadow:3px 3px 0 #000,inset -3px -3px 0 #241d2c;font:bold 14px "Courier New",monospace;text-shadow:2px 2px 0 #000;letter-spacing:1px;text-transform:uppercase;position:relative;text-align:center;touch-action:manipulation;vertical-align:middle}
.btn:hover{border-color:#fff;box-shadow:3px 3px 0 #000,0 0 10px var(--gold),inset -3px -3px 0 #241d2c;color:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.blue{border-color:var(--blue);color:#bcd3ff}.btn.purple{border-color:var(--purple);color:#e2c2ff}.btn.red{border-color:var(--red);color:#ffc2c8}.btn.gold{border-color:var(--gold);color:#fff2c2}.btn.green{border-color:var(--green);color:#c8ffd0}
.btn.big{font-size:20px;padding:11px 18px;min-width:220px}
.btn.sm{font-size:11px;padding:3px 7px;border-width:2px}
.btn.dis{opacity:.4;pointer-events:none}
.btn.sel{background:#2d2008;border-color:var(--gold);color:#fff}
.panel{background:var(--panel);border:3px solid var(--bone2);box-shadow:5px 5px 0 #000,inset 0 0 0 2px #000;padding:10px}
.gold{color:var(--gold)}.grey{color:#8d8577}.red{color:var(--red)}.green{color:var(--green)}.blue{color:#7fb2ff}
.r0{color:var(--c0)}.r1{color:var(--c1)}.r2{color:var(--c2)}.r3{color:var(--c3)}.r4{color:var(--c4)}
.b0{border-color:#777!important}.b1{border-color:var(--c1)!important}.b2{border-color:var(--c2)!important}.b3{border-color:var(--c3)!important}.b4{border-color:var(--c4)!important;box-shadow:0 0 8px var(--c4)}
/* title */
#s-title{background:#000}
#titlebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(94vw,680px)}
#titlebox .sub{color:var(--bone2);margin:8px 0 18px;letter-spacing:2px}
#credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#6d6656;font-size:11px;z-index:6}
/* create */
#s-create{background:#07060a;overflow:auto;touch-action:pan-y}
#createbox{max-width:980px;margin:0 auto;padding:16px 12px 60px}
.h1{font-size:22px;color:var(--gold);letter-spacing:2px;margin:6px 0 10px;text-shadow:2px 2px 0 #000}
.h2{font-size:15px;color:var(--gold);margin:10px 0 6px}
.cards{display:flex;flex-wrap:wrap;gap:10px}
.card{flex:1 1 200px;cursor:pointer;background:#110e15;border:3px solid #3a3242;padding:8px;box-shadow:3px 3px 0 #000;min-width:180px}
.card:hover{border-color:var(--bone2)}.card.sel{border-color:var(--gold);background:#1d1608}
.card .nm{color:var(--gold);font-size:16px}.card .ds{font-size:12px;color:#c9bfa4;font-weight:normal;margin-top:4px;line-height:1.35}
.card canvas{float:right;margin-left:6px}
input.txt{font:bold 18px "Courier New",monospace;background:#000;color:var(--bone);border:3px solid var(--bone2);padding:6px 8px;width:260px;text-transform:uppercase;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.slotrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.slotc{background:#110e15;border:3px solid #3a3242;padding:10px;min-width:220px;cursor:pointer}
.slotc:hover{border-color:var(--gold)}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud .pe{pointer-events:auto}
#pframe{position:absolute;left:8px;top:8px;width:250px}
.bar{height:14px;background:#1a1016;border:2px solid #000;box-shadow:0 0 0 1px #5a4a3a;position:relative;margin-top:3px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:#c22;transition:width .15s}
.bar>span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:11px;text-shadow:1px 1px 0 #000;color:#fff}
.bar.mp>i{background:#2a6cf0}.bar.rage>i{background:#d06a10}.bar.en>i{background:#e8d020}.bar.xp>i{background:#9a4cff}
#pname{font-size:13px;text-shadow:2px 2px 0 #000}
#buffs{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.buff{width:22px;height:22px;border:2px solid #000;font-size:9px;text-align:center;line-height:9px;position:relative;background:#222}
.buff b{position:absolute;bottom:-1px;right:0;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
#tframe{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:240px;display:none}
#tname{font-size:12px;text-align:center;text-shadow:2px 2px 0 #000}
#mmwrap{position:absolute;right:8px;top:8px;text-align:right}
#mmc{border:3px solid var(--bone2);box-shadow:3px 3px 0 #000;background:#000;width:150px;height:150px}
#zonelbl{font-size:12px;text-shadow:2px 2px 0 #000;max-width:220px;margin-left:auto}
#tracker{position:absolute;right:8px;top:200px;width:230px;font-size:11px;text-shadow:1px 1px 0 #000,2px 2px 0 #000}
#tracker .q{margin-bottom:6px}#tracker .qt{color:var(--gold)}#tracker .done{color:var(--green)}
#hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end}
.hk{width:46px;height:46px;background:#120f16;border:3px solid var(--bone2);box-shadow:2px 2px 0 #000;position:relative;cursor:pointer;touch-action:manipulation}
.hk canvas{position:absolute;left:4px;top:4px;width:32px;height:32px}
.hk .k{position:absolute;left:2px;top:0;font-size:10px;text-shadow:1px 1px 0 #000;color:#fff}
.hk .n{position:absolute;right:2px;bottom:0;font-size:10px;text-shadow:1px 1px 0 #000;color:#fff}
.hk .cd{position:absolute;left:0;right:0;bottom:0;background:#000b;pointer-events:none}
.hk .cdt{position:absolute;inset:0;text-align:center;line-height:40px;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none}
.hk.off{opacity:.45}.hk.act{border-color:var(--gold)}
#xpbar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:min(520px,70vw)}
#menubtns{position:absolute;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:300px}
#menubtns .btn{margin:0;padding:4px 6px;font-size:11px;border-width:2px}
#chat{position:absolute;left:8px;bottom:8px;width:min(340px,42vw);font-size:11px}
#chatlog{max-height:120px;overflow:hidden;text-shadow:1px 1px 0 #000,2px 2px 0 #000;display:flex;flex-direction:column;justify-content:flex-end}
#chatlog div{margin-top:1px;word-wrap:break-word}
#chatin{display:none;width:100%;font:bold 12px "Courier New",monospace;background:#000c;color:#fff;border:2px solid var(--bone2);padding:4px;user-select:text;-webkit-user-select:text}
#online{font-size:10px;color:#9fe;text-shadow:1px 1px 0 #000}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
#lootfeed{position:fixed;right:10px;bottom:96px;z-index:55;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#lootfeed div{background:#000a;padding:2px 8px;font-size:11px;text-shadow:1px 1px 0 #000;animation:tst 4s forwards}
body.touch #lootfeed{right:auto;left:10px;bottom:auto;top:110px}
#toast div{background:#000d;border:2px solid var(--gold);padding:5px 12px;font-size:13px;text-shadow:2px 2px 0 #000;animation:tst 2.8s forwards;text-align:center}
@keyframes tst{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:9;pointer-events:none;font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;opacity:0;transition:opacity .6s}
#banner small{display:block;font-size:14px;color:var(--bone)}
#castbar{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:220px;display:none}
/* panels */
#panels{position:fixed;inset:0;z-index:30;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--panel);border:3px solid var(--bone2);box-shadow:6px 6px 0 #000,inset 0 0 0 2px #000;display:none;max-height:calc(100% - 20px);overflow:hidden;flex-direction:column}
.win.on{display:flex}
.win .hd{display:flex;align-items:center;justify-content:space-between;background:#231b12;border-bottom:3px solid #000;padding:4px 6px 4px 10px;color:var(--gold);font-size:15px;text-shadow:2px 2px 0 #000;flex:0 0 auto}
.win .hd .x{cursor:pointer;color:#fff;background:#5a1a1a;border:2px solid #000;padding:0 7px;font-size:16px}
.win .bd{padding:8px 10px;overflow:auto;flex:1 1 auto;touch-action:pan-y;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,44px);gap:4px}
.slot{width:44px;height:44px;background:#0a080c;border:2px solid #3a3242;position:relative;cursor:pointer;touch-action:manipulation}
.slot canvas{position:absolute;left:4px;top:4px;width:32px;height:32px}
.slot .q{position:absolute;right:1px;bottom:0;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
.slot.lock{opacity:.35;background:repeating-linear-gradient(45deg,#000 0 4px,#140f18 4px 8px)}
.slot.empty .lbl{position:absolute;inset:0;font-size:8px;color:#555;display:flex;align-items:center;justify-content:center;text-align:center}
.slot.hi{outline:2px solid var(--gold)}
.slot.bad::after{content:'';position:absolute;inset:0;background:#f003}
#tip{position:fixed;z-index:80;pointer-events:none;background:#0a080ef7;border:3px solid var(--bone2);padding:7px 9px;font-size:12px;max-width:290px;display:none;box-shadow:4px 4px 0 #000;line-height:1.35}
#tip .tn{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list .it{display:flex;align-items:center;gap:8px;padding:5px;border-bottom:1px solid #2a2230;cursor:pointer}
.list .it:hover{background:#1b1520}
.list .it.sel{background:#2a2010}
.pill{font-size:10px;padding:1px 5px;border:1px solid #555;margin-left:4px}
.stats td{padding:1px 8px 1px 0;font-size:12px}
.tree{display:flex;gap:8px;flex-wrap:wrap}
.branch{flex:1 1 210px;background:#0a080c;border:2px solid #3a3242;padding:6px}
.branch .bt{color:var(--gold);text-align:center;margin-bottom:4px}
.node{display:flex;gap:6px;align-items:center;padding:4px;border:2px solid #2a2230;margin-bottom:4px;cursor:pointer;background:#120f16;font-size:11px}
.node.max{border-color:var(--gold)}.node.lock{opacity:.4}.node:hover{border-color:#fff}
.node .rk{margin-left:auto;color:#fff;white-space:nowrap}
.dlg{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:min(560px,94vw)}
.qtext{font-weight:normal;line-height:1.45;color:#e8e0c8;white-space:pre-wrap}
/* modal */
#modal{position:fixed;inset:0;z-index:90;background:#000a;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modalp{max-width:min(520px,94vw);text-align:center;max-height:90vh;overflow:auto}
/* touch */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
body.touch #touch{display:block}
#joy{position:absolute;left:20px;bottom:30px;width:130px;height:130px;border-radius:50%;border:3px solid #fff4;background:#0004;pointer-events:auto;touch-action:none}
#joyk{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:#e8dcb588;border:3px solid #000}
#tbtns{position:absolute;right:14px;bottom:26px;width:210px;height:210px;pointer-events:none}
.tb{position:absolute;width:56px;height:56px;border-radius:50%;background:#120f16cc;border:3px solid var(--bone2);pointer-events:auto;touch-action:none;color:#fff;font-size:11px;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb canvas{width:32px;height:32px}
.tb.atk{width:80px;height:80px;right:0;bottom:0;border-color:var(--gold);font-size:14px}
.tb .cd{position:absolute;left:0;right:0;bottom:0;background:#000b}
body.touch #chat{bottom:170px;width:46vw}
body.touch #hotbar{display:none}
body.touch #xpbar{bottom:4px;width:40vw}
body.touch #menubtns{bottom:auto;top:6px;max-width:270px;right:128px}
body.touch #menubtns .btn{font-size:10px;padding:3px 5px}
body.touch #tframe{top:64px}
body.touch #tracker{display:none}
body.touch #mmc{width:110px;height:110px}
@media (max-width:700px){#pframe{width:180px}#tframe{width:150px;top:60px}#menubtns .btn{font-size:10px;padding:3px 4px}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="vign"></div>
<div id="scan"></div>
<div id="s-title" class="screen on"><canvas id="titlebg" class="px" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div id="titlebox"><div id="logo"></div><div class="sub t" id="tsub"></div><div id="tbtns0"></div></div><div id="credit"></div></div>
<div id="s-create" class="screen"><div id="createbox"></div></div>
<div id="s-game" class="screen pass">
 <div id="hud">
  <div id="pframe" class="pe"><div id="pname"></div><div class="bar" id="hpb"><i></i><span></span></div><div class="bar mp" id="mpb"><i></i><span></span></div><div id="buffs"></div></div>
  <div id="tframe"><div id="tname"></div><div class="bar" id="thpb"><i></i><span></span></div></div>
  <div id="mmwrap" class="pe"><canvas id="mmc" class="px" width="150" height="150"></canvas><div id="zonelbl"></div><div id="online"></div></div>
  <div id="tracker"></div>
  <div id="castbar"><div class="bar en" id="castb"><i></i><span></span></div></div>

 </div>

</div>

<div id="modal"><div id="modalp" class="panel"></div></div>
<script>
// ================= I18N (shared by Lost Aura Games titles) =================
// One language setting for the whole site and every game: localStorage "lag.lang".
// Strings are looked up by their English text: t('PLAY') -> 'JUGAR'. {name} placeholders are filled from vars.
// Missing translations fall back to English and are logged once (console.info + I18N_MISS) so tests can catch them.
const LAG_LANGS=[['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português'],['it','Italiano']];
const LAG_LANG_KEY='lag.lang';
const LAG_LANG_CODES=LAG_LANGS.map(l=>l[0]);
function lagDetectLang(){let v=null;try{v=localStorage.getItem(LAG_LANG_KEY);}catch(e){}if(v&&LAG_LANG_CODES.includes(v))return v;
 const navs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(const n of navs){const c=String(n||'').toLowerCase().slice(0,2);if(LAG_LANG_CODES.includes(c))return c;}return'en';}
let LANG=lagDetectLang();
const I18N={};for(const c of LAG_LANG_CODES)I18N[c]={};
const I18N_MISS=new Set();
// rows: [english, es, fr, de, pt, it]
function i18nRows(rows){for(const r of rows){for(let i=1;i<LAG_LANG_CODES.length;i++){if(r[i]!=null)I18N[LAG_LANG_CODES[i]][r[0]]=r[i];}}}
function t(key,vars){let s=key;if(LANG!=='en'){const d=I18N[LANG];if(d&&Object.prototype.hasOwnProperty.call(d,key))s=d[key];else if(!I18N_MISS.has(LANG+'|'+key)){I18N_MISS.add(LANG+'|'+key);try{console.info('[i18n] missing '+LANG+': '+key);}catch(e){}}}
 if(vars)s=String(s).replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);return s;}
const I18N_HOOKS=[];
function langName(c){const l=LAG_LANGS.find(x=>x[0]===c);return l?l[1]:c;}
function setLang(c,fromStorage){if(!LAG_LANG_CODES.includes(c))return;const changed=c!==LANG;LANG=c;try{document.documentElement.lang=c;}catch(e){}
 if(!fromStorage){try{localStorage.setItem(LAG_LANG_KEY,c);}catch(e){}}
 if(changed)for(const f of I18N_HOOKS){try{f(c);}catch(e){console.error(e);}}}
addEventListener('storage',e=>{if(e.key===LAG_LANG_KEY&&e.newValue&&e.newValue!==LANG)setLang(e.newValue,true);});
try{document.documentElement.lang=LANG;}catch(e){}
// Accented capitals for 5x7 bitmap fonts. Accented glyphs have 9 rows: row 0 is drawn one pixel row ABOVE the
// normal cell, rows 1..7 are the normal 7 rows, row 8 is one row below (for the cedilla).
function i18nFontExt(F){const sq=(g,drop)=>g.filter((_,i)=>i!==drop);
 const AC={acute:[2,4],grave:[8,4],circ:[4,10],tilde:[13,22],uml:[10,0],ring:[4,10]};
 const mk=(base,acc,drop)=>{const g=F[base];if(!g)return;const s=sq(g,drop==null?2:drop);return[AC[acc][0],AC[acc][1],...s,0];};
 const map={'Á':['A','acute'],'À':['A','grave'],'Â':['A','circ'],'Ã':['A','tilde'],'Ä':['A','uml'],'É':['E','acute'],'È':['E','grave'],'Ê':['E','circ'],'Ë':['E','uml'],
  'Í':['I','acute'],'Ì':['I','grave'],'Î':['I','circ'],'Ï':['I','uml'],'Ó':['O','acute'],'Ò':['O','grave'],'Ô':['O','circ'],'Õ':['O','tilde'],'Ö':['O','uml'],
  'Ú':['U','acute'],'Ù':['U','grave'],'Û':['U','circ'],'Ü':['U','uml'],'Ñ':['N','tilde',1]};
 for(const k in map){if(F[k])continue;const v=map[k];const g=mk(v[0],v[1],v[2]);if(g)F[k]=g;}
 if(!F['Ç']&&F.C)F['Ç']=[0,...F.C,4];
 if(!F['¿'])F['¿']=[4,0,4,8,16,17,14];if(!F['¡'])F['¡']=[4,0,4,4,4,4,4];
 if(!F[','])F[',']=[0,0,0,0,0,4,8];if(!F['/'])F['/']=[1,1,2,4,8,16,16];if(!F['('])F['(']=[2,4,8,8,8,4,2];if(!F[')'])F[')']=[8,4,2,2,2,4,8];
 if(!F['%'])F['%']=[24,25,2,4,8,19,3];if(!F['+'])F['+']=[0,4,4,31,4,4,0];if(!F['"'])F['"']=[10,10,0,0,0,0,0];if(!F['«'])F['«']=[0,5,10,20,10,5,0];if(!F['»'])F['»']=[0,20,10,5,10,20,0];
 if(!F['Œ']&&F.O)F['Œ']=[15,20,20,23,20,20,15];return F;}
// glyph row helper for font renderers: returns [rows, yOffset]
function glyphRows(g){return g&&g.length===9?[g,-1]:[g,0];}
// Upper-case for the pixel fonts: keep ß as SS (toUpperCase does that) and fold anything unknown to its base letter.
function pixUpper(s,F){s=String(s).toUpperCase();if(!F)return s;let o='';for(const ch of s){if(F[ch]){o+=ch;continue;}const b=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');o+=F[b]?b:ch;}return o;}
// tiny pixel globe icon (12x12, scaled) for the language buttons

 const R=['....####....','..##.#..##..','.#..#..#..#.','.#..#..#..#.','############','#...#..#...#','#...#..#...#','############','.#..#..#..#.','.#..#..#..#.','..##.#..##..','....####....'];
 for(let j=0;j<12;j++)for(let i=0;i<12;i++)if(R[j][i]==='#')x.fillRect(i*px,j*px,px,px);c.style.verticalAlign='middle';return c;}

['Lowest health, highest burst. Stalks in stealth and strikes from the shadows with one-handed blades. Leather armor only.','La menor salud, el mayor daño explosivo. Acecha en sigilo y ataca desde las sombras con armas de una mano. Solo armadura de cuero.','Santé la plus faible, dégâts éclair les plus élevés. Rôde en furtivité et frappe depuis l\'ombre avec des lames à une main. Armure de cuir uniquement.','Wenigste Gesundheit, höchster Burst. Schleicht getarnt und schlägt mit Einhandklingen aus den Schatten zu. Nur Lederrüstung.','Menor vida, maior dano explosivo. Espreita furtivo e ataca das sombras com lâminas de uma mão. Apenas armadura de couro.','Salute minima, danni a raffica massimi. Si muove furtivo e colpisce dall\'ombra con lame a una mano. Solo armatura di cuoio.'],
['Harvest herbs found across the world (rarer herbs in harder lands). Weave them into cloth, then craft cloth armor and bandages that heal you to full fast after a fight.','Recolecta hierbas por todo el mundo (las más raras, en las tierras más duras). Tejelas en tela y fabrica armaduras de tela y vendas que te curan del todo rápidamente tras un combate.','Récolte des herbes à travers le monde (les plus rares dans les terres les plus rudes). Tisse-les en étoffe, puis fabrique des armures de tissu et des bandages qui te soignent entièrement et vite après un combat.','Sammle Kräuter auf der ganzen Welt (seltenere in raueren Landen). Webe sie zu Stoff und fertige Stoffrüstungen und Verbände, die dich nach einem Kampf schnell vollständig heilen.','Colete ervas pelo mundo todo (as mais raras nas terras mais duras). Teça-as em tecido e crie armaduras de tecido e bandagens que curam você por completo rapidamente após uma luta.','Raccogli erbe in tutto il mondo (le più rare nelle terre più dure). Tessile in stoffa, poi crea armature di stoffa e bende che ti curano completamente in fretta dopo uno scontro.'],
['Skin the beasts you slay (wolves, birds, bears and stranger things) for hides. Cure leather, craft leather armor and rare, expensive Bags for more inventory space.','Despelleja a las bestias que matas (lobos, aves, osos y cosas más extrañas) para obtener pieles. Curte el cuero, fabrica armaduras de cuero y Bolsas raras y caras para tener más espacio en el inventario.','Dépèce les bêtes que tu abats (loups, oiseaux, ours et choses plus étranges) pour leurs peaux. Tanne le cuir, fabrique des armures de cuir et de rares et coûteux Sacs pour agrandir ton inventaire.','Häute erlegte Bestien (Wölfe, Vögel, Bären und seltsamere Dinge) für Felle. Gerbe Leder, fertige Lederrüstungen und seltene, teure Taschen für mehr Inventarplatz.','Esfole as feras que você abate (lobos, aves, ursos e coisas mais estranhas) para obter peles. Curta o couro, crie armaduras de couro e Bolsas raras e caras para ter mais espaço no inventário.','Scuoia le bestie che abbatti (lupi, uccelli, orsi e cose più strane) per ottenere pelli. Concia il cuoio, crea armature di cuoio e Borse rare e costose per avere più spazio nell\'inventario.'],
['Mine ore deposits — the finest ores shine brightest. Smelt bars to forge mail and plate armor, or trade ore to Provisioners for buff food.','Extrae vetas de mineral: los mejores brillan más. Funde lingotes para forjar armaduras de malla y de placas, o cambia mineral a los Proveedores por comida que potencia.','Extrais les gisements de minerai : les plus fins brillent le plus. Fonds des lingots pour forger des armures de mailles et de plaques, ou échange du minerai aux Ravitailleurs contre de la nourriture qui renforce.','Baue Erzvorkommen ab – die feinsten Erze glänzen am hellsten. Schmelze Barren, um Ketten- und Plattenrüstungen zu schmieden, oder tausche Erz bei Versorgern gegen Stärkungsessen.','Extraia veios de minério: os melhores brilham mais. Funda barras para forjar armaduras de malha e de placas, ou troque minério com os Provedores por comida que fortalece.','Estrai i giacimenti di minerale: i più pregiati brillano di più. Fondi lingotti per forgiare armature di maglia e di piastre, o scambia minerale con i Provveditori per cibo che potenzia.'],

  for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[2,2]])draw(dx,dy,'#000');
  draw(0,0,fill);if(glow){c.style.filter=`drop-shadow(0 0 ${s*2}px ${glow})`;}return c;}
// draw text straight onto a context (s = pixel size)
function drawPixText(x,str,X,Y,s,fill,shadow='#000'){str=pixUpper(str,FONT);const draw=(ox,oy,col)=>{x.fillStyle=col;for(let k=0;k<str.length;k++){const [g,yo]=glyphRows(FONT[str[k]]||FONT[' ']);for(let r=0;r<g.length;r++)for(let b=0;b<5;b++)if(g[r]&(16>>b))x.fillRect(X+(k*6+b+ox)*s,Y+(r+yo+oy)*s,s,s);}};
  if(shadow){for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[1,2],[2,2]])draw(dx,dy,shadow);}draw(0,0,fill);}

let AC=null,MASTER=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=OPT.muted?0:1;MASTER.connect(AC.destination);}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,d,type='square',vol=.08,slide=0,delay=0){if(OPT.muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.02);}
function noise(d,vol=.08,delay=0,hp=800){if(OPT.muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const len=Math.max(1,Math.floor(a.sampleRate*d));const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);}

const MUSIC={track:null,want:null,timer:null,step:0,next:0,gain:null};
const TRACKS={
 title:{bpm:84,root:130.8,scale:[0,2,3,5,7,8,10],seed:11,lead:'triangle',dens:.45,drums:false},
 town:{bpm:100,root:146.8,scale:[0,2,4,5,7,9,11],seed:23,lead:'square',dens:.5,drums:true},
 forest:{bpm:96,root:130.8,scale:[0,2,4,7,9],seed:7,lead:'triangle',dens:.5,drums:false},
 wild:{bpm:118,root:110,scale:[0,2,3,5,7,8,10],seed:31,lead:'square',dens:.55,drums:true},
 dark:{bpm:88,root:98,scale:[0,1,3,5,6,8,10],seed:66,lead:'sawtooth',dens:.4,drums:true},
 dungeon:{bpm:132,root:92.5,scale:[0,1,3,5,7,8,10],seed:91,lead:'square',dens:.62,drums:true},
};
function genPattern(tr){const r=mulberry(tr.seed);const mel=[];let deg=4;for(let i=0;i<64;i++){if(i%8===0||r()<tr.dens){deg=clamp(deg+Math.floor(r()*5)-2,0,10);mel.push(deg);}else mel.push(null);}
 const prog=[0,5,3,4];const bass=[];for(let i=0;i<64;i++)bass.push(i%2===0?prog[Math.floor(i/16)%4]:null);const arp=[];for(let i=0;i<64;i++)arp.push(prog[Math.floor(i/16)%4]+[0,2,4,7][i%4]);return{mel,bass,arp};}
function noteF(tr,deg,oct=0){const sc=tr.scale;const o=Math.floor(deg/sc.length),d=((deg%sc.length)+sc.length)%sc.length;return tr.root*Math.pow(2,(sc[d]+12*(o+oct))/12);}
function startMusic(name){MUSIC.want=name;if(OPT.muted||!OPT.music||!AC)return;if(MUSIC.track===name&&MUSIC.timer)return;stopMusic();const a=AC;MUSIC.track=name;const tr=TRACKS[name]||TRACKS.wild;const pat=genPattern(tr);MUSIC.step=0;MUSIC.next=a.currentTime+.08;
 MUSIC.gain=a.createGain();MUSIC.gain.gain.value=.4;MUSIC.gain.connect(MASTER);const g=MUSIC.gain;
 const play=(f,t,d,type,v)=>{const o=a.createOscillator(),e=a.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+.02);};
 MUSIC.timer=setInterval(()=>{if(OPT.muted||!OPT.music){stopMusic();return;}const sd=60/tr.bpm/4;while(MUSIC.next<a.currentTime+.25){const i=MUSIC.step%64,t=MUSIC.next;const m=pat.mel[i];if(m!==null)play(noteF(tr,m,1),t,sd*1.7,tr.lead,tr.lead==='sawtooth'?.012:.018);
  const b=pat.bass[i];if(b!==null)play(noteF(tr,b,-1),t,sd*1.9,'triangle',.06);
  if(tr.drums){if(i%4===0)play(70,t,.08,'sine',.1);if(i%4===2){const len=Math.floor(a.sampleRate*.03);const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let k=0;k<len;k++)ch[k]=(Math.random()*2-1)*(1-k/len);const s=a.createBufferSource();s.buffer=buf;const e=a.createGain();e.gain.value=.025;s.connect(e);e.connect(g);s.start(t);}}
  if(i%16===0)play(noteF(tr,0,0),t,sd*8,'sine',.025);MUSIC.step++;MUSIC.next+=sd;}},50);}
function stopMusic(){if(MUSIC.timer)clearInterval(MUSIC.timer);MUSIC.timer=null;MUSIC.track=null;if(MUSIC.gain){try{MUSIC.gain.disconnect();}catch(e){}MUSIC.gain=null;}}
function setMuted(m){OPT.muted=!!m;saveOpt();if(MASTER)MASTER.gain.value=OPT.muted?0:1;if(OPT.muted)stopMusic();else{ac();if(MUSIC.want)startMusic(MUSIC.want);}}
// ---- value noise ----
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o=3){let t=0,a=1,f=1,n=0;for(let i=0;i<o;i++){t+=vnoise(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2;}return t/n;}
// ---- misc ----
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function fmt(n){n=Math.floor(n);if(n>=1e7)return(n/1e6).toFixed(1)+'M';if(n>=1e5)return Math.floor(n/1e3)+'k';return n.toLocaleString('en-US');}
function goldStr(n){return '<span class="gold">'+fmt(n)+'g</span>';}
function wpick(list,wf,r=Math.random){let tot=0;for(const x of list)tot+=wf(x);let v=r()*tot;for(const x of list){v-=wf(x);if(v<=0)return x;}return list[list.length-1];}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ================= LEVEL CURVE (max 200) =================
const MAX_LEVEL=200;
function mobXP(L){return Math.round(10+L*3);}
function killsPerLevel(L){return 4+.12*Math.pow(L,1.75);}
function xpToNext(L){return L>=MAX_LEVEL?Infinity:Math.round(killsPerLevel(L)*mobXP(L));}
// ================= COMBAT CURVES =================
function mobHPBase(L){return 20+16*Math.pow(L,1.12);}
function weaponBase(L){return mobHPBase(L)/6.2;}
function mobDmgBase(L){return (80+16*L)/11*(.55+.45*Math.min(1,L/15));}
function statRating(v,L){return v/(10+3*L);}

  on:'The ledger names a foundry in the Burned Lands — Cindermaw\'s forge — poisoning the earth to breed monsters. Captain Sera Vex holds Cinderwatch. Go to her, champion of Aurelion.'},
 {pois:['Ashen Farmstead','Sludge Pits','Vulture Ridge','Black Chimneys'],intro:'Look at it. This was the breadbasket of the realm. Now the ground is rust and the rain burns. Everything here is poisoned by the Hollow foundries.',
  a:'Smash the slag golems lumbering out of the Black Chimneys.',b:['Cinder Core','Cinder imps carry burning cores. Bring them — we can turn their fire against them.'],
  g:['Toxic Runoff Valve','The Sludge Pits are fed by runoff valves. Seal them shut.'],lt:['Overseer Grakk','golem','Overseer Grakk drives the foundry slaves at the Black Chimneys. Bring him down.','Foundry Schematics'],
  on:'These schematics are for plague engines — sent south to the Mirewood. Mother Ilse in Bogmere needs to see this. Hurry.'},
 {pois:['Lantern Dock','Witchlight Hollow','Croc Shallows','Gallows Bog'],intro:'Plague engines... so that is what the witches brew. My people cough black water. The fen hags have sworn themselves to Mother Morrow and the Hollow King.',
  a:'Clear the bog lurkers oozing up through the village wells.',b:['Crocolisk Bile','The crocolisks drink the plague-water and live. Their bile is the base of our cure.'],
  g:['Plague Cauldron','Overturn the plague cauldrons bubbling in Witchlight Hollow.'],lt:['Grandmother Rot','human','The eldest hag, Grandmother Rot, holds court at Gallows Bog.','Frozen Rune Key'],
  on:'A key of black ice — from Rimehold, in the Frostfang Peaks. The witches trade with the dead jarl there. Jarl Brynja of Rimeholt will know what it opens.'},
 {pois:['Hot Springs','Frozen Barrow','Yeti Caves','Ice Throne Pass'],intro:'Hrimgar\'s key. My grandfather\'s grandfather sealed that oathbreaker in ice. Now the barrows open and the draugr walk again.',
  a:'Put down the frostbound draugr walking out of the barrows.',b:['Yeti Heart','Yeti hearts burn hot. Our shamans need them to keep the ward-fires lit.'],
  g:['Rune Stone','Recarve — no, recover — the ward rune stones stolen from the Frozen Barrow.'],lt:['Skald of Hrimgar','skeleton','Hrimgar\'s skald sings the dead awake at the Ice Throne Pass. Silence his song.','Sunstone Tablet'],
  on:'A sunstone tablet from the southern deserts. The dead jarl was promised a tomb beside the Titan-King. Find Sheikha Nefret at Khepri Oasis.'},
 {pois:['Mirage Well','Titan\'s Ribcage','Glass Flats','Obelisk of Sekhmar'],intro:'The sands remember the titans who died here. Sekhmar the Pharaoh wants their strength — and the Hollow Crown has promised it to him.',
  a:'Destroy the sand mummies shambling from the dunes.',b:['Golden Jackal Collar','The Pharaoh\'s jackals wear golden collars. Bring them as proof.'],
  g:['Titan Bone Shard','Collect titan bone shards from the Ribcage before the cult grinds them into war-dust.'],lt:['Sand-Vizier Ashkar','mummy','The Pharaoh\'s vizier Ashkar works at the Obelisk.','Drowned Star-Chart'],
  on:'A star-chart that leads under the sea to sunken Thalassa. Harbormaster Kael at Port Nerei can get you there.'},
 {pois:['Coral Arch','Bell Reef','Pearl Terraces','Shipwreck Cove'],intro:'Thalassa sank a thousand years ago. Lately the drowned bells ring at night, and my sailors walk into the sea smiling.',
  a:'Drive off the naga raiding the terraces.',b:['Naga Scale','Bring naga scales; the shipwrights need them.'],
  g:['Drowned Bell','Silence the drowned bells on Bell Reef.'],lt:['Captain Brineheart','skeleton','My old captain, Brineheart, leads the drowned from Shipwreck Cove. Free him.','Wyrm-Etched Pearl'],
  on:'A pearl etched with a wyrm. The Naga Queen trades with the jungle wyrms. Warden Okonkwo in Vinehollow guards that jungle.'},
 {pois:['Hidden Falls','Nesting Grounds','Temple of Vines','Serpent Stones'],intro:'The Wyrmwood is sick. The green god Verdigrax is poisoned, and the wyrms breed for the Hollow war.',
  a:'Thin the jungle raptors stalking Vinehollow.',b:['Poisoned Panther Fang','The shadow panthers carry the poison in their fangs. Bring them.'],
  g:['Wyrm Egg','Smash the wyrm eggs in the Nesting Grounds.'],lt:['Broodkeeper Zhal','lizard','Broodkeeper Zhal tends the eggs at the Serpent Stones.','Storm-Iron Shackle'],
  on:'A shackle of storm-iron, forged in Thunderhold. The giants are arming the Hollow Crown. Thane Gorm must be told.'},
 {pois:['Shepherd\'s Hut','Spire Field','Giant\'s Steps','Thunder Peak'],intro:'Giants hammer lightning into blades under my mountain. The storms grow worse each night.',
  a:'Bring down the storm harpies that harry the high roads.',b:['Thunder Ram Horn','Bring the horns of the thunder rams.'],
  g:['Lightning Rod','Topple the giants\' lightning rods in Spire Field.'],lt:['Skyrender the Giant','yeti','Skyrender commands from Thunder Peak.','Feather of Zephyra'],
  on:'A feather from the Sky Isles. The fallen seraphs above us bless the Hollow armies. High Priestess Aelia of Zephyra will help you climb.'},
 {pois:['Wind Shrine','Broken Temple','Griffin Roost','Cloudgate'],intro:'The sky temples have fallen. Seraphiel, our guardian, tore the wings from my sisters and gave the Hollow King our sky.',
  a:'Cast down the fallen seraphs haunting the isles.',b:['Sky Serpent Scale','Bring sky serpent scales to mend the wards.'],
  g:['Shattered Halo','Collect the shattered halos in the Broken Temple.'],lt:['Exarch Valen','wraith','Exarch Valen opened the Cloudgate to the dark.','Obol of Passage'],
  on:'An obol — the coin of the dead. They are coming from below as well as above. Go down to the Styx Mire, to Charon\'s Rest.'},
 {pois:['Mourner\'s Path','Lantern Graves','Ghoul Warrens','Black Ferry Landing'],intro:'Welcome, living one. I am the ferryman who refused. My brother, the Bone Ferryman, rows the dead back to fight for the Hollow King.',
  a:'Lay the ghouls of the mire to rest.',b:['Soul Wisp','Free the soul wisps trapped in the shades.'],
  g:['Grave Lantern','Light the grave lanterns so lost souls can find their way.'],lt:['The Weeping Knight','human','A knight weeps at the Black Ferry Landing and kills all who pass.','Legion Orders'],
  on:'Marching orders for the Hollow Legion in the Obsidian Wastes. Marshal Ignatius at Basalt Gate is the last wall between them and the world.'},
 {pois:['Glass Canyon','Legion Camp','Drake Roost','Magma Gate'],intro:'The Hollow Legion musters beyond the Magma Gate. Every blade is forged at the Obsidian Forge.',
  a:'Break the Ashen Legionnaires.',b:['Drake Scale','Drake scales make the only shields that hold against legion fire.'],
  g:['Legion War Banner','Burn the war banners in the Legion Camp.'],lt:['Centurion Vulkar','human','Centurion Vulkar holds the Magma Gate.','Lantern of Dusk'],
  on:'A lantern that burns black. It comes from the Shadowfell. Lantern-Keeper Wren of Lanternfall must see it.'},
 {pois:['Lantern Road','Weeping Wood','Crystal Hollow','Moonless Crossing'],intro:'In the Shadowfell, light is life. The Long Night\'s priests snuff our lanterns one by one.',
  a:'Cut down the shadow knights on the Lantern Road.',b:['Void Silk','Gather void silk from the void spiders.'],
  g:['Darkened Lantern','Relight the darkened lanterns of the Lantern Road.'],lt:['The Hollow Herald','wraith','The Herald waits at the Moonless Crossing.','Shard of the Hollow Crown'],
  on:'A shard of the Hollow Crown itself. The Rift is open. Archon Solenne holds Last Light, the final bastion. Go, Bearer of the Aura.'},
 {pois:['Last Bastion','Shattered Bridge','Void Garden','Edge of Nothing'],intro:'You carry the Lost Aura — the light of humanity that Vharos wants to unmake. Everything has led here.',
  a:'Destroy the Unmade horrors pouring from the Rift.',b:['Hollow Crown Shard','Take the crown shards from the Void Titanspawn.'],
  g:['Rift Anchor','Break the rift anchors on the Shattered Bridge.'],lt:['Vharos\'s Shadow','human','The Hollow King\'s own shadow walks at the Edge of Nothing.','Key of the Hollow Throne'],
  on:'The Throne awaits. When you are ready, enter the Hollow Throne and end this.'},
];
// side-quest templates: [title, text, objective-builder]
const QUESTS={};const QUEST_LIST=[];
function addQ(q){QUESTS[q.id]=q;QUEST_LIST.push(q);return q;}
function npcId(z,role){return 'z'+z+'_'+role;}
function buildQuests(){
 ZONES.forEach((Z,z)=>{const S=STORY[z];const L0=Z.lvl[0],L1=Z.lvl[1];const lv=f=>Math.max(1,Math.round(L0+(L1-L0)*f));const E=npcId(z,'elder');const M=Z.mobs;
  const prevEnd=z>0?'m'+(z-1)+'_6':null;
  addQ({id:'m'+z+'_1',z,main:1,giver:E,lvl:lv(0),pre:prevEnd,title:z===0?'A Stranger Wakes':'Word from '+ZONES[z-1].town,text:S.intro+(z===0?'':'\n\n(You deliver the evidence.)'),obj:[{t:'talk',npc:E}],auto:z===0});
  addQ({id:'m'+z+'_2',z,main:1,giver:E,lvl:lv(Math.max(0,M[0][4])),pre:'m'+z+'_1',title:'The '+M[0][1]+' Threat',text:S.a,obj:[{t:'kill',mob:M[0][0],n:z===0?6:8}]});
  addQ({id:'m'+z+'_3',z,main:1,giver:E,lvl:lv(Math.max(.2,M[1][4])),pre:'m'+z+'_2',title:S.b[0]+'s',text:S.b[1],obj:[{t:'collect',item:S.b[0],mob:M[1][0],chance:.6,n:6}]});
  addQ({id:'m'+z+'_4',z,main:1,giver:E,lvl:lv(.4),pre:'m'+z+'_3',title:S.pois[1],text:S.g[1],obj:[{t:'gather',item:S.g[0],poi:1,n:6}]});
  addQ({id:'m'+z+'_5',z,main:1,giver:E,lvl:lv(.6),pre:'m'+z+'_4',title:'The Hollow Lieutenant',text:S.lt[2],obj:[{t:'elite',name:S.lt[0],arch:S.lt[1],poi:3,item:S.lt[3]}]});
  addQ({id:'m'+z+'_6',z,main:1,giver:E,lvl:lv(.75),pre:'m'+z+'_5',title:z<14?'Onward to '+ZONES[z+1].town:'The Last Door',text:S.on,obj:z<14?[{t:'talk',npc:npcId(z+1,'elder')}]:[{t:'talk',npc:E}],turn:z<14?npcId(z+1,'elder'):E,next:z<14?1:0});
  // side quests from the Bounty Board and the village quest-giver
  const B=npcId(z,'board'),V=npcId(z,'villager');const pick3=(i)=>M[i%M.length];
  addQ({id:'s'+z+'_1',z,giver:V,lvl:lv(Math.max(.1,pick3(2)[4])),title:'Cull the '+pick3(2)[1]+'s',text:'The '+pick3(2)[1].toLowerCase()+'s near '+Z.town+' grow bolder each day. Thin their numbers and I\'ll make it worth your while.',obj:[{t:'kill',mob:pick3(2)[0],n:10}]});
  const TROPHY=['Fang','Claw','Trinket','Stinger','Shard','Totem','Scale','Feather','Horn','Charm'];const tro=pick3(3)[1].split(' ').pop()+' '+TROPHY[z%TROPHY.length];
  addQ({id:'s'+z+'_2',z,giver:V,lvl:lv(Math.max(.3,pick3(3)[4])),title:'Trophies of the Wild',text:'An alchemist in '+Z.town+' pays well for '+tro.toLowerCase()+'s. Bring me six and we\'ll split the profit.',obj:[{t:'collect',item:tro,mob:pick3(3)[0],chance:.55,n:6}]});
  addQ({id:'s'+z+'_3',z,giver:B,lvl:lv(.35),title:'Lost Supplies',text:'BOUNTY: A supply caravan was ambushed near '+S.pois[0]+'. Recover the scattered crates.',obj:[{t:'gather',item:'Supply Crate',poi:0,n:5}]});
  const eliteN=['Old One-Eye','Grimtooth','The Pale Stalker','Ironhide','Mother of Thorns','Bloodmaw','Gravelgut','The Whisperer','Scarback','Ashfang','Hollowgaze','Duskwing','Cindertail','Nightjaw','Riftborn'][z];
  addQ({id:'s'+z+'_4',z,giver:B,lvl:lv(.55),title:'Bounty: '+eliteN,text:'BOUNTY: A monstrous '+pick3(4)[1].toLowerCase()+' called '+eliteN+' prowls near '+S.pois[2]+'. Reward on proof of death.',obj:[{t:'elite',name:eliteN,arch:pick3(4)[2],pal:pick3(4)[3],poi:2,item:eliteN+'\'s Head'}]});
  addQ({id:'s'+z+'_5',z,giver:B,lvl:lv(Math.max(.8,pick3(5)[4])),title:'Hold the Line',text:'BOUNTY: '+pick3(5)[1]+'s are massing on the edge of '+Z.n+'. Break them before they reach '+Z.town+'.',obj:[{t:'kill',mob:pick3(5)[0],n:14}]});
  addQ({id:'s'+z+'_6',z,giver:V,lvl:lv(.5),title:'Scout '+S.pois[3],text:'Nobody who goes near '+S.pois[3]+' comes back with a straight story. Go and look — just look — and come back.',obj:[{t:'explore',poi:3}]});
 });
 // dungeon quests
 DUNGEONS.forEach(d=>{const Zd=ZONES[d.zone];const gz=Zd.lvl[1]>=d.lvl?d.zone:tierOf(d.lvl);const G=npcId(gz,'elder');
  addQ({id:'d_'+d.id,z:gz,giver:G,lvl:d.lvl,dungeon:d.id,title:'Dungeon: '+d.n,text:d.lore+'\n\nThe way into '+d.n+' lies in '+Zd.n+'. Its master is '+d.boss.n+'. You will need to be strong — level '+d.lvl+' at least — and you should not go alone without potions.',obj:[{t:'dungeon',d:d.id}]});});
}
buildQuests();
function questXP(q){const base=xpToNext(q.lvl);return Math.round(base*(q.dungeon?.6:q.main?.28:.2));}
function questGold(q){return Math.round(goldDrop(q.lvl)*(q.dungeon?30:q.main?9:7));}

// ================= Hand-written main questline: Whisperwood, Aurelion, Burned Lands =================
// Overrides quest offer text (text) and adds turn-in dialogue (done). Other regions keep the generated text.
const STORY_RICH={
 m1_1:{text:"Maren's sigil. An empty crown. (Reeve Hollis sets it on the table like it might bite.)\n\nI laughed at the old songs too. Then the bandits on my roads started paying for ale in black coins stamped with that same crown. Briarford is the last stop before the Kingdom — every cart of grain and iron for Aurelion rolls through here, and lately half of them never arrive.\n\nSomeone wants the capital hungry. I want to know who.",
  done:"Right. If Maren trusts you, so do I. Thornvale's yours to walk — just don't trust anyone carrying black coin."},
 m1_2:{text:"The cutthroats on the east road used to take a toll and let people pass. Now they burn the carts, kill the drivers, and leave the cargo to rot. That's not robbery. That's a blockade.\n\nThin them out. Every bandit you put down is a wagon that reaches the Kingdom.",
  done:"Three wagons made it through to the capital this morning. First time in a month. The drivers are buying you drinks whether you like it or not."},
 m1_3:{text:"The boars came down from the hills this spring with red eyes and foam on their tusks. They don't eat the crops — they trample them, field after field, like they're being herded.\n\nBring me their tusks. The farmers will pay a bounty, and I'll have the hedge-witch look at what's driving them mad.",
  done:"The hedge-witch boiled a tusk and the water went black. Same ash Maren found in her ants. Whatever the Crown is feeding the beasts, it's spreading east."},
 m1_4:{text:"The bandits hit our granary two nights ago and carried off every sack of winter grain to their camp in the hills. If we don't get it back, Briarford starves before spring — and so do the families on the road to Aurelion.\n\nGo into the Bandit Camp and bring the grain home.",
  done:"You found the sacks... and orders nailed to the camp's post. 'Burn what you cannot carry. The capital must kneel hungry.' Signed with a crown that has nothing inside it."},
 m1_5:{text:"The man giving those orders calls himself Gallowsjack, the Bandit King. Used to be a hangman in Aurelion until the King pardoned the man he was meant to hang. He's hated the crown ever since — and now he's found a new one to serve.\n\nHe's holed up in the Thornkeep Ruins. End him, and bring me whatever he's carrying.",
  done:"A purse full of Hollow coin, and a letter sealed in black wax. It's addressed to someone inside the royal court.\n\nThis is bigger than bandits, bigger than Briarford. The Crown has friends in the King's own hall."},
 m1_6:{text:"I can't send this by courier — whoever's in that court would make sure it 'went missing'. It has to go by hand, to the King himself.\n\nRide for Aurelion. Ask for an audience with King Aldric and put that purse and that letter in his hands, no one else's. Thornvale will hold. Go.",
  done:"(The palace guards try to turn you away — until the King sees the black coin in your hand and calls you forward himself.)"},

 m0_1:{text:"Easy now — you've slept two days. Hunters found you at the forest's edge, cold as river stone, and that mark on your palm was glowing like a coal.\n\nI am Maren, elder of Hearthmoor. I have no answers for you yet, only trouble: the Whisperwood has turned against us. Ants the size of ponies are pouring from the trees, and our palisade was built for wolves, not this.\n\nWhoever you were before, Hearthmoor needs you to be someone now.",
  done:"You are steadier on your feet than you have any right to be. Good. The mark on your hand flared when you stood — I have read of such things in the old songs. Stay close to the village for now. There is work, and there is little time."},
 m0_2:{text:"Look at the fields — the worker ants strip a barley row in an hour and carry it back into the forest. Ants do not plan like this. Something is feeding them, driving them.\n\nCut down the workers in the fields and the forest edge. Every one you slay is a mouth that does not reach our granary.",
  done:"Six fewer, and the rest pulled back into the trees. They did not flee... they withdrew, like soldiers. That frightens me more than the swarm itself."},
 m0_3:{text:"The soldier ants spit an acid that eats through oak and iron alike. Our east gate is half gone.\n\nOld Teodric, our alchemist, swears he can brew a counter-salve — but he needs their mandibles, fresh, with the acid glands still inside. Bring him what he needs. Mind your hands.",
  done:"Teodric cut one open and went pale. There is ash in the glands — black ash, the kind that comes from no fire in this forest. Someone has been feeding the swarm something far older than hunger."},
 m0_4:{text:"Our scouts found where they breed: Anthill Hollow, north of the Moonwell. The ground there is a carpet of egg sacs, each one pulsing with that same black ash.\n\nBurn them. If the next brood hatches, Hearthmoor falls before the first snow.",
  done:"The hunters saw the smoke from the walls and cheered. But they also saw a shape standing on the Hollow Altar, watching the fire. Tall. Wrong. Not an ant."},
 m0_5:{text:"The Hollow Altar — a ruin older than Hearthmoor. Children are told never to go there. Now something stands upon it and the swarm moves when it moves.\n\nIt calls itself Kzzrak, the Brood Overseer. The ants are not its children; they are its weapon. End it, and bring me anything it carries.",
  done:"A sigil of black iron: a crown, with nothing inside it.\n\nThe Hollow Crown. My grandmother sang of them — men and women who believe humanity was the world's great mistake, and serve a king with no heart called Vharos. They want every hearth cold and every road empty. I thought them a story.\n\nAnd your mark... the songs call it the Lost Aura. The last light that answers when the Crown rises."},
 m0_6:{text:"The Overseer is dead but the Queen beneath the forest still breeds. That is a fight for later — when you are stronger.\n\nFirst, this sigil must be seen by people with swords and walls. Take it east through the trees to Reeve Hollis in Briarford. If the Hollow Crown is moving here, it is moving everywhere.\n\nGo with the light, child. Hearthmoor will remember you.",
  done:"(Reeve Hollis turns the sigil over in his hands for a long while.) Maren sent you? Then it's true, and I'm a fool for laughing at the old songs."},
 d_hive:{text:"Now you are ready to hear it. Beneath the Whisperwood, under the roots of the oldest tree, lies a Hive. In its heart lives Myrmexa, the Brood Queen — once a common ant queen, now swollen with Hollow sorcery until she is the size of a barn.\n\nAs long as she lives, the swarm returns, season after season, until every village on the forest's edge is gone. The Crown planted her here to bleed us slowly.\n\nGo down into the Brood Hive. Kill her. Bring potions — many — and do not let her slams catch you.",
  done:"The forest is... quiet. For the first time in a year I hear birds at dawn. Whatever she guarded down there, keep it. You earned it, champion of Hearthmoor."},
 m2_1:{text:"So the hero of the Whisperwood arrives bearing Hollow coin and a bandit's orders. Kneel if you like; I am tired of ceremony.\n\nI am Aldric, and this is my kingdom — what is left of it. My father spoke of the Hollow Crown: a faith that teaches humanity is a sickness, and that the kindest thing is to end it. Their priests now preach openly on my roads, and my own lords pretend not to hear.\n\nThat mark you carry... my court sorcerer would give her left eye to see it. I would rather see it used.",
  done:"You did not flinch when I named them. Good. Most of my court did. Aurelion has walls, merchants, and ten thousand souls who do not yet know what is coming. Help me keep them that way."},
 m2_2:{text:"The cultists gather crowds at the crossroads. They tell farmers that their king has abandoned them, that the Crown will give them peace — the peace of the grave.\n\nI will not jail people for listening. But the preachers carry daggers, and three of my tax-riders are already dead. Break the cult's grip on the crownlands.",
  done:"The crossroads are quiet. My guards found lists on the bodies — names of every family that refused to listen. Marked for 'unmaking'. Those lists are ash now. Thank you."},
 m2_3:{text:"Grave robbers have broken into the Old Graveyard and taken the signet rings of my ancestors from their tombs. Petty theft, you would think.\n\nBut a signet can seal a royal order. With seven kings' seals, the Crown could command half my garrisons to march wherever they please. Get them back.",
  done:"Seven signets... and one more I have never seen: the seal of Sir Varric, my grandfather's champion, who betrayed him and was buried beneath the city in chains. That grave was supposed to be sealed forever."},
 m2_4:{text:"The cultists are raising effigies in the Old Graveyard — straw kings with empty crowns, soaked in blood and pitch. My priests say each one thins the wall between the living and what lies beneath.\n\nTear them down. Burn them. Let my people see that the Crown's idols fall like any other straw.",
  done:"The priests say the graveyard 'breathes easier'. I do not know what that means, and I am not sure I want to."},
 m2_5:{text:"All of it leads to one man: Deacon Malvray, once my own chaplain. He holds rites at the Sunken Shrine below the old aqueduct, and he is the voice the cultists obey.\n\nHe baptized my daughter. Now he would drown the kingdom. Silence him, and bring me whatever he writes in.",
  done:"His ledger. Pages of names, payments in black gold... and orders, written in a cold, beautiful hand and signed only with an empty crown.\n\nThey are building something in the Burned Lands. A foundry, it says. Cindermaw's forge. 'To poison the bread of men.'"},
 m2_6:{text:"The Burned Lands were once the breadbasket of my realm. Now nothing grows there, and my scouts come back coughing blood. If Malvray's ledger is right, the Crown is poisoning the earth itself to starve us and breed monsters from the slag.\n\nCaptain Sera Vex holds the fort at Cinderwatch with what is left of the Ember Guard. Go to her. Tell her the king has not forgotten her — and that help is finally coming.",
  done:"(Captain Vex reads the king's seal and laughs, short and hard.) 'Help is coming.' He's been saying that for two years. And they sent... you. Well. You'd better be as good as the stories."},
 d_crypt:{text:"Sir Varric the Oathless. My grandfather's champion, who opened the gates to raiders for a bag of gold and was buried alive beneath this city in silver chains.\n\nThe cultists broke those chains. My guards hear armor marching in the Catacombs of Aurelion at night, and the royal dead do not rest. Varric is raising an army of kings under my very throne.\n\nGo down. Put him back in his grave, and this time make sure he stays.",
  done:"The bells rang on their own when he fell. The priests are calling it a miracle. I am calling it a debt — one Aurelion will repay you."},
 m3_1:{text:"Look around you. This was the breadbasket of the realm. My grandmother farmed barley where that slag heap stands. Now the soil is rust, the rain burns skin, and the wells taste of copper.\n\nEvery bit of it is the work of the Hollow foundries. Their chimneys never stop. They are poisoning the land so the cities starve — and out of the poison, they grow soldiers.\n\nI'm Sera Vex. Welcome to the end of the world.",
  done:"You came. That's more than most. The Ember Guard is forty souls and three working crossbows. Whatever you are, you're our best weapon now."},
 m3_2:{text:"The slag golems are the worst of it. They crawl out of the Black Chimneys — molten waste given legs by Hollow rites — and they walk until they cool, burning everything they touch.\n\nSmash them before they reach the farmsteads that are still trying to grow something. Aim for the cracks; the cores burn hottest there.",
  done:"They break like pottery once they cool. Good to know. The Guard is already calling you 'the golem breaker'. Try not to let it go to your head."},
 m3_3:{text:"The cinder imps carry burning cores — little hearts of foundry fire. My smith thinks she can turn them into fire-bombs, and we'd love to give the Crown a taste of its own smoke.\n\nBring me cores. Don't hold them too long; they bite back.",
  done:"Ha! Smith Odda threw one at a slag heap and it went up like a festival. We have teeth again."},
 m3_4:{text:"The Sludge Pits are fed by valves from the foundry — runoff so foul it kills birds that fly over it. Every drop that seeps into the earth is another field lost forever.\n\nSeal those valves. All of them. We can't heal the land yet, but we can stop the bleeding.",
  done:"The Ashen Farmstead's well ran clear this morning. Clear. Old Haskin wept into the bucket. You did that."},
 m3_5:{text:"The foundry slaves are men and women from Aurelion's villages, taken in the night and chained to the furnaces. Overseer Grakk works them until they drop, then feeds them to the slag.\n\nHe holds the Black Chimneys. Kill him, free whoever you can, and bring me anything he carries. If we're going to strike the foundry itself, we need to know how it works.",
  done:"Foundry schematics. Not for weapons — for engines. Plague engines, crated and sent south to the Mirewood Fen.\n\nThey're not just starving us. They mean to sicken whoever's left. This was never a war for land. It's a war to end us."},
 m3_6:{text:"These schematics must reach Mother Ilse in Bogmere before the plague engines do. She knows the fen and its witches better than anyone alive.\n\nI'd go myself, but if I leave, Cinderwatch falls. So it's you again. It's always you, isn't it? Ride south. And thank you — I don't say that often.",
  done:"(Mother Ilse takes the schematics with shaking hands.) Plague engines... so that is what the witches have been brewing. Sit, champion. This will be a long night."},
 d_foundry:{text:"At the heart of the Burned Lands stands the Slag Foundry, and at its heart, Cindermaw the Artificer — a Hollow smith who forged the golems, poisoned the rivers, and built the plague engines with his own scorched hands.\n\nAs long as his furnaces burn, nothing will ever grow here again. Go into the Slag Foundry and put out his fire for good.\n\nThe Ember Guard will hold the gate behind you. Come back to us.",
  done:"The chimneys went dark at dawn. All of them. For the first time in two years I can see the stars over Cinderwatch. Drink with us tonight, champion. Tomorrow the land starts healing."},
};

// translated quest dialogue: QTR[lang][questId] = {text, done}
const QTR={es:{},fr:{},de:{},pt:{},it:{}};
function qtx(q,f){const tr=QTR[LANG]&&QTR[LANG][q.id];return(tr&&tr[f])||q[f];}

// ================= Hand-written main questline: Mirewood Fen, Frostfang Peaks =================
Object.assign(STORY_RICH,{
m4_1:{text:"(Mother Ilse spreads Captain Vex's schematics across a table slick with damp.)\n\nPlague engines. Copper bellies, bone pipes, a furnace that breathes sickness instead of smoke. So that is what the witches have been brewing in the deep fen.\n\nI am Mother Ilse. I keep the healing-house in Bogmere, and lately it is full. My people cough black water. The fen hags have sworn themselves to Mother Morrow, and Mother Morrow has sworn herself to the Hollow King.",
 done:"You came all this way through the reeds for strangers. Vex wrote that you would. Rest a moment, then help me keep Bogmere breathing."},
m4_2:{text:"The bog lurkers used to stay in the deep pools. Now they ooze up through our wells at night, and wherever they pass the water turns grey and sour.\n\nClear them from the village wells and the paths around Bogmere. Burn what is left of them; do not let it touch your skin.",
 done:"The wells have stopped bubbling. Old Fenna drank from hers this morning and did not cough once. Small mercies, and I will take every one."},
m4_3:{text:"Here is something strange: the crocolisks drink the plague-water and grow fat on it. Whatever the witches brew, their bile fights it off.\n\nBring me crocolisk bile. With it I can make a tonic for the sick, and perhaps learn how to break the plague itself. Mind the jaws; they are faster than they look.",
 done:"The tonic works. Not a cure, but the fever breaks in half a day instead of killing in three. You have saved more lives today than you will ever know."},
m4_4:{text:"My scouts found the cauldrons: a ring of them in Witchlight Hollow, each as large as a cart, each bubbling green. The witches fill clay jars from them and send the jars south and east on smugglers' boats.\n\nOverturn every cauldron. Let the bog swallow their brew before another jar leaves the fen.",
 done:"Witchlight Hollow burns cold and green tonight. The smugglers came for their jars and found only mud. The coven will know it was you."},
m4_5:{text:"The eldest hag, Grandmother Rot, holds court at Gallows Bog. She was a midwife once, in Bogmere. She delivered half the village, and now she poisons their children.\n\nShe guards something the coven values above their own lives. End her, and bring me whatever she was guarding.",
 done:"A key of black ice that never melts, carved with runes from the far north. The Frostfang Peaks: Rimehold.\n\nThe witches trade plague for something there. Something old, and cold, and very patient."},
m4_6:{text:"Jarl Brynja rules Rimeholt in the Frostfang Peaks. Her people have guarded those mountains since before the Kingdom had a name. If anyone knows what lock this key was cut for, it is her.\n\nTake it north. Dress warmly, and do not trust the snow where it lies too smooth. Bogmere will hold. We have a tonic now, thanks to you.",
 done:"(Jarl Brynja turns the black key in her mailed hand, and the fire in the hall gutters.) Where did you find this? No. Do not tell me yet. Sit by the fire first."},
d_chapel:{text:"Mother Morrow herself sits beneath the fen, in the Drowned Chapel: a church that sank into the bog a hundred years ago with its whole congregation still inside.\n\nShe brews the plague there, and the drowned parish serves her still. Every jar of sickness that leaves Mirewood starts in her cauldron.\n\nGo down into the Drowned Chapel and end the Bog Witch. Take my tonic and plenty of potions. The air down there is poison.",
 done:"The fen smells of rain this morning, not rot. The sick are sitting up in their beds. Whatever you found in that chapel, it is yours, and Bogmere's gratitude with it."},
m5_1:{text:"Hrimgar's key. (Jarl Brynja does not let go of it.) My grandfather's grandfather sealed that oathbreaker in the ice beneath Rimehold. Jarl Hrimgar sold his own people to the winter for a crown that would never melt.\n\nThe Hollow Crown found him. The witches have been trading him plague for his frozen dead, and now the barrows open and the draugr walk again.\n\nWelcome to Rimeholt, southerner. You came at a bad time.",
 done:"You did not flinch at the name. Good. My huscarls whisper it like a curse. We will need someone who does not whisper."},
m5_2:{text:"The draugr walk out of the barrows at dusk: frostbound dead in rusted mail, the old huscarls of Hrimgar. They do not tire, they do not feel cold, and they remember every road to our hall.\n\nPut them down. Break their skulls; the ice inside is what moves them.",
 done:"The night watch saw no draugr on the passes last night. First quiet night in a month. The skalds will want to make a song about you. Try not to let them."},
m5_3:{text:"The ward-fires around Rimeholt keep the dead out. They are dying, and ordinary wood will not keep them lit. Our shamans burn yeti hearts; a yeti's heart is hot enough to melt stone.\n\nHunt the yetis in the high snows and bring me their hearts. It is cruel, but our children sleep inside those fires.",
 done:"The ward-fires roar again. The shamans say the dead cannot cross them now, not even the old ones. You have bought us the winter."},
m5_4:{text:"The rune stones that sealed the Frozen Barrow have been stolen, dragged out by the draugr and scattered in the snow. Without them, every tomb in the Peaks will open.\n\nRecover the rune stones from the Frozen Barrow. Our shamans will carve the seals again.",
 done:"Six stones, every rune intact. The shamans have begun the carving. The Barrow is silent tonight."},
m5_5:{text:"Hrimgar's skald still lives, if you can call it that. He stands at the Ice Throne Pass and sings the old songs of winter, and every verse wakes another dead warrior.\n\nSilence his song. Bring me whatever he carries; a skald always carries his king's secrets.",
 done:"A tablet of sunstone, warm even here, from the deserts of the far south. Desert script: a promise. Hrimgar was promised a tomb beside the Titan-King, a place among the gods, if he gave the Hollow Crown his winter.\n\nVharos is gathering the old kings of the world. The dead, the cursed, the forgotten. He is building a court."},
m5_6:{text:"Sheikha Nefret rules Khepri Oasis in the Sunscar Desert. Her people guard the Titan tombs, as mine guard the barrows. If the Crown has bargained for a dead king's power down there, she must hear it from you.\n\nTake the tablet south. And southerner: the Peaks will remember you. That is not a small thing.",
 done:"(Sheikha Nefret reads the tablet twice, then sets it down very gently.) Sekhmar. The Titan-King's high priest. So the old story was a warning, not a legend."},
d_vault:{text:"Jarl Hrimgar the Frostbound sits on his throne of ice in the Rimehold Vault, beneath the mountain. Every draugr in the Peaks answers to him, and as long as he endures, the barrows will keep opening.\n\nHe holds the frozen key to the desert tombs, the bargain Vharos made with him. Go down into the Rimehold Vault and end the oathbreaker. Bring fire, bring potions, and do not stand still.",
 done:"The mountain groaned when he fell; we heard it in the hall. The snow on the passes is just snow again. Rimeholt owes you a debt we will sing about for a hundred years."},
});

// ================= Hand-written main questline: Sunscar Desert, Sunken Ruins of Thalassa =================
Object.assign(STORY_RICH,{
m6_1:{text:"(Sheikha Nefret sets the sunstone tablet on a cushion, as if it were a sleeping child.)\n\nThe sands remember the titans. They fought the first gods here and died here, and their bones are the dunes you crossed. My people have guarded their tombs for three thousand years.\n\nSekhmar was the Titan-King's high priest. He swore that one day he would drink his master's strength and walk as a god. The Hollow Crown has promised him that day. And now the dead of the desert are waking to serve him.",
 done:"You carried a dead jarl's secret across half the world to warn strangers. The Oasis does not forget such things. Drink, rest, and then we hunt."},
m6_2:{text:"The dune scorpions have grown huge and bold. They ambush our water caravans at the wells, and the caravans that do not reach us mean the Oasis dies of thirst before the Pharaoh even lifts a hand.\n\nClear the scorpions from the caravan routes. Every caravan that arrives is a hundred more days we can fight.",
 done:"Four caravans came in at dawn, the camels singing for water. My children ran out to meet them. That is what you bought today."},
m6_3:{text:"The desert jackals are not wild. Look closely: each wears a collar of beaten gold, stamped with Sekhmar's sun. They are his hounds, his eyes in the dunes. Wherever they howl, his mummies follow.\n\nBring me their collars. Every collar we melt is an eye we put out.",
 done:"Six collars, and six fewer eyes. The jackals howl, but nothing answers tonight. The Pharaoh is blind on our side of the dunes."},
m6_4:{text:"In the Titan's Ribcage, the cult grinds the old bones to dust. Titan-dust mixed with Hollow sorcery makes the sand rise and walk: the colossi you have seen are made of it.\n\nGather the bone shards before they are ground. We will bury them in holy ground, where no priest can reach them.",
 done:"The shards are wrapped in white linen and buried beneath the Oasis shrine. The titans sleep a little easier tonight. So do I."},
m6_5:{text:"Sand-Vizier Ashkar is Sekhmar's right hand: a mummy who was clever in life and is crueler in death. He works at the Obelisk of Sekhmar, carving the ritual that will wake his master at full strength.\n\nStop the ritual. Destroy Ashkar and bring me whatever he guards.",
 done:"A star-chart, painted on sharkskin. But the stars are wrong... no. They are seen from beneath the sea. This is a map to Thalassa, the drowned city.\n\nThe Crown has allies in every corner of the world: the jungle, the sky, the deep. Vharos is not raising an army. He is raising every old evil that humanity ever buried."},
m6_6:{text:"Harbormaster Kael keeps Port Nerei on the western coast, where the sea swallowed Thalassa a thousand years ago. If anyone can follow a chart drawn from the bottom of the sea, it is him.\n\nThe Oasis owes you its water and its children. Go west, Bearer of the Aura. The sands will remember your name.",
 done:"(Harbormaster Kael unrolls the sharkskin chart and goes quiet.) Thalassa. My grandmother swore the bells still ring down there. Lately, so do my sailors."},
d_tomb:{text:"Beneath the dunes lies the Tomb of the Titan-King, and in its deepest hall Sekhmar the Sand Pharaoh drinks the strength of the slain titans, one jar of dust at a time.\n\nWhen he has drunk enough, he will walk out of the tomb as a god, and every mummy in the desert will march behind him.\n\nGo down into the tomb before that day comes. Break the Pharaoh, and let the Titan-King rest.",
 done:"The sand stopped moving when he fell; the dunes are just dunes again. The Oasis will carve your name beside the titans. Few mortals stand there."},
d_ziggurat:{text:"There is one more servant of the Crown in the desert. Azhurak, a djinn of the old storms, was chained by Hollow priests inside the Ziggurat of Storms. They whip his rage into glass storms that bury whole caravans alive.\n\nHe was not always cruel. But chained as he is, he can only destroy. Climb the Ziggurat and end his suffering, and the desert's with it.",
 done:"The glass storms have ended. Last night the wind blew soft and warm across the Oasis, and some of us swore it sounded like a sigh of relief."},
m7_1:{text:"Thalassa sank a thousand years ago. It was the proudest city of men: they built bells that could call the tides. When the sea took it, the bells went quiet.\n\nNow they ring again at night. And my sailors walk down to the shore, smiling, and keep walking until the water closes over their heads.\n\nSomething is calling them. Your chart says the Hollow Crown knows what.",
 done:"You will need a ship and a crew that is not afraid of the deep. Luckily, I have one of the two. Let us find the other."},
m7_2:{text:"The reef crabs have come up out of the shallows, big as barrels, and they will not leave. They cut our nets, sink our skiffs, and drag the fishermen into the water.\n\nClear them from the docks and the beach. Port Nerei cannot fight the deep if it cannot even fish.",
 done:"The nets came up full this morning. The fishwives are cooking crab for the whole harbor, and you are invited, whether you like it or not."},
m7_3:{text:"The naga warriors guard the drowned roads into Thalassa. Their scales are harder than steel and lighter than leather. My shipwrights say a hull plated with them could sail where no ship has sailed: down.\n\nBring me naga scales. We are building a ship that can follow your chart.",
 done:"The hull is plated. The shipwrights are calling her the Lantern of the Deep. She will hold, they swear. I hope they are right."},
m7_4:{text:"The bells on Bell Reef ring at night, and every time they ring, another sailor walks into the sea. They were made to call the tides. Now someone uses them to call people.\n\nSilence the drowned bells. Cut the ropes, break the clappers, whatever it takes.",
 done:"Last night was silent. Not one sailor walked into the sea. Old Merrit sat on the docks till dawn, just to listen to the quiet."},
m7_5:{text:"My old captain, Brineheart, went down with his ship in Shipwreck Cove twenty years ago. Now he walks out of the cove at night, leading the drowned against my port. He was my friend.\n\nFree him. Whatever wears his face now is not him. Bring me whatever he carries.",
 done:"A pearl, etched with a coiled wyrm. Brineheart was carrying it to someone in the jungle: the Naga Queen trades with the wyrms of the Wyrmwood.\n\nThe sea, the jungle, the sky... Vharos is binding them all together. When he is done, there will be nowhere left for humanity to stand."},
m7_6:{text:"Warden Okonkwo guards Vinehollow at the edge of the Wyrmwood Jungle. If the Naga Queen is trading with the wyrms, he needs to know before the jungle turns against us too.\n\nTake the pearl east. And thank you for Brineheart. I could not do it myself. Port Nerei will keep a lantern lit for you.",
 done:"(Warden Okonkwo holds the pearl up to the green light of the jungle.) Verdigrax's wyrms... so that is why the green god sleeps so badly. Come. The jungle is listening."},
d_abyss:{text:"Queen Thalassyr rules the Abyssal Temple at the bottom of the drowned city. She is the one who rings the bells. She sings the drowned awake, and she has promised the whole sea to the Hollow King, every coast, every port, every ship.\n\nThe Lantern of the Deep is ready. Go down into the Abyssal Temple and silence the Naga Queen forever.",
 done:"The sea is calm, and the bells are silent for good. My sailors came home to their families last night. Port Nerei will tell your story as long as there are ships."},
});

// ================= Hand-written finale: Rift of the Unmade =================
Object.assign(STORY_RICH,{
m14_1:{text:"(Archon Solenne does not rise from the war-table. Her armor is cracked, and the lantern at her side burns very low.)\n\nSo. The Bearer of the Aura. Every message that has reached Last Light in the past year carried your name: Hearthmoor, the King's hall, Cinderwatch, the Oasis, the drowned bells. I did not believe one person could do all that. Now I see the light on your hand, and I believe it.\n\nThis is the Rift of the Unmade, the wound in the world where Vharos sits. Everything the Hollow Crown has done, every plague and every crown and every waking dead thing, was to feed this place. Last Light is the last fortress of humanity standing in front of it.",
 done:"Sit with me a moment before the end. You have earned that much. Then I will tell you what Vharos really is."},
m14_2:{text:"The Unmade Horrors pour out of the Rift every night. They are not beasts. They are what is left when something is unmade: memories with no one to remember them, shapes with no meaning. Wherever they touch, the world forgets itself.\n\nDrive them back from the walls of Last Light. My soldiers can hold a gate. They cannot hold against being forgotten.",
 done:"The walls are quiet. My scouts say the Horrors drew back when you fought; they do not like the light you carry. Good. Neither does their master."},
m14_3:{text:"Vharos was once a man. More than that: he was the first king of humanity, and the first Bearer of the Aura. He saw every war, every betrayal, every cruelty of his people for a thousand years, and at last he decided that humanity's light was a lie. He tore it from his own heart and became hollow.\n\nNow he wants to unmake us, all of us, so that no one ever suffers or causes suffering again. He calls it mercy.\n\nThe Void Titanspawn carry shards of his crown in their cores. Each shard is a piece of the heart he threw away. Bring them to me.",
 done:"Hold one up to your light. Do you see it? It glows, faintly. Even now, there is something of the man left in the crown. Remember that when you stand before him."},
m14_4:{text:"The Shattered Bridge is the only road across the Rift to the Unmade Spire, and the Hollow Crown has sunk anchors into it: pillars of void that hold the Rift open and pull the world into it, one stone at a time.\n\nBreak the anchors. If the Rift closes even a little, every land you have walked through will feel it.",
 done:"The Rift shrank tonight. Messages came by lantern-signal: the snows of Rimeholt stopped falling black, and the wells of Bogmere ran clear. Everything you saved is still yours to save."},
m14_5:{text:"At the Edge of Nothing walks Vharos's Shadow: the part of him that still remembers being human, twisted into a guard so that it can never reach him. It kills everything that comes near, because it cannot bear to be seen.\n\nDefeat it. It carries the key to the Hollow Throne, and I think it has been waiting a long time for someone strong enough to take it.",
 done:"(The Shadow kneels before it fades. It does not attack. It places the key in your hand and whispers one word: 'Remind him.')\n\nA key of black glass, and a request from the last human part of the Hollow King. I did not expect that. Perhaps there is more than one way to end this."},
m14_6:{text:"This is the last door. Beyond the Unmade Spire is the Hollow Throne, and on it sits Vharos.\n\nI have no more advice to give you. Everyone you met on your road, Maren and Hollis, King Aldric, Sera Vex, Mother Ilse, Jarl Brynja, Sheikha Nefret, Kael, they all sent their light ahead with you. You are not carrying the Aura alone. You never were.\n\nWhen you are ready, go. Last Light will keep its lantern burning until you come home.",
 done:"(Archon Solenne grips your arm, the way soldiers do before a battle.) Come back. That is an order, Bearer of the Aura. Come back."},
d_spire:{text:"Vessra, the Voice of the Hollow, guards the last stair of the Unmade Spire. She was the first to follow Vharos into hollowness, and every sermon of the Hollow Crown, every cult in every land you crossed, carried her words.\n\nShe will try to convince you that he is right: that humanity is cruel, that the world would be quieter without us. Do not listen. You have seen what people can be.\n\nClimb the Spire. Silence the Voice.",
 done:"The Voice is silent, and across the world the Hollow cults have woken up confused, as if from a long bad dream. Only the Throne remains."},
d_throne:{text:"The Hollow Throne. Vharos waits there, the first king, who threw away his own light because he could no longer bear to see it shine on cruelty.\n\nHe will fight with everything the Crown has stolen: the plague, the cold, the drowned, the dead. And he will tell you that unmaking humanity is the kindest thing anyone could do.\n\nShow him he is wrong. You carry the Lost Aura, the light he cast away, and with it the light of every person who helped you reach this door. End the Hollow Crown.",
 done:"(As Vharos falls, the Hollow Crown cracks in two. For a moment the light on your hand flows into the empty space inside it, and the old king's face changes: tired, human, astonished.)\n\n'I had forgotten,' he says. 'I had forgotten what it looked like.' And then he is gone, and only the light remains.\n\nThe Rift is closing. In Hearthmoor, Maren sees the dawn come up gold over the Whisperwood, and the ants are only ants again. The world will remember you, Bearer of the Aura. The story of the Hollow Crown is over. Yours is not."},
});
