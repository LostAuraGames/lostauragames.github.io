m2_1:{text:"Così l'eroe del Bosco Sussurrante arriva con monete Cave e ordini di un brigante. Inginocchiati se vuoi; sono stanco delle cerimonie.\n\nSono Aldric, e questo è il mio regno, ciò che ne resta. Mio padre parlava della Corona Cava: una fede che insegna che l'umanità è una malattia, e che la cosa più pietosa è porvi fine. I loro sacerdoti predicano apertamente sulle mie strade, e i miei stessi lord fingono di non sentire.\n\nQuel segno che porti... la mia maga di corte darebbe l'occhio sinistro per vederlo. Io preferirei vederlo all'opera.",done:"Non hai sussultato quando li ho nominati. Bene. La maggior parte della mia corte l'ha fatto. Aurelion ha mura, mercanti e diecimila anime che ancora non sanno cosa sta arrivando. Aiutami a mantenerle così."},
m2_2:{text:"I settari radunano folle agli incroci. Dicono ai contadini che il re li ha abbandonati, che la Corona darà loro pace: la pace della tomba.\n\nNon arresterò nessuno per aver ascoltato. Ma i predicatori portano pugnali, e tre dei miei esattori sono già morti. Spezza la presa del culto sulle terre della corona.",done:"Gli incroci sono tranquilli. Le mie guardie hanno trovato liste sui corpi: nomi di ogni famiglia che si è rifiutata di ascoltare. Segnate per essere 'disfatte'. Quelle liste ora sono cenere. Grazie."},
m2_3:{text:"Dei tombaroli hanno violato il Vecchio Cimitero e rubato gli anelli con sigillo dei miei antenati. Un furto da poco, penseresti.\n\nMa un sigillo può autenticare un ordine reale. Con i sigilli di sette re, la Corona potrebbe far marciare metà delle mie guarnigioni dove vuole. Recuperali.",done:"Sette sigilli... e uno che non avevo mai visto: il sigillo di Sir Varric, campione di mio nonno, che lo tradì e fu sepolto in catene sotto la città. Quella tomba doveva restare sigillata per sempre."},
m2_4:{text:"I settari erigono effigi nel Vecchio Cimitero: re di paglia con corone vuote, intrisi di sangue e pece. I miei sacerdoti dicono che ognuna assottiglia il muro tra i vivi e ciò che giace sotto.\n\nAbbattile. Bruciale. Che il mio popolo veda che gli idoli della Corona cadono come qualsiasi paglia.",done:"I sacerdoti dicono che il cimitero 'respira meglio'. Non so cosa significhi, e non sono sicuro di volerlo sapere."},
m2_5:{text:"Tutto porta a un uomo: il diacono Malvray, un tempo mio cappellano. Celebra riti nel Santuario Sommerso sotto il vecchio acquedotto, ed è la voce a cui obbediscono i settari.\n\nHa battezzato mia figlia. Ora affogherebbe il regno. Zittiscilo, e portami ciò su cui scrive.",done:"Il suo registro. Pagine di nomi, pagamenti in oro nero... e ordini, in una grafia fredda e bella, firmati solo con una corona vuota.\n\nStanno costruendo qualcosa nelle Terre Bruciate. Una fonderia, dice qui. La forgia di Cindermaw. 'Per avvelenare il pane degli uomini.'"},
m2_6:{text:"Le Terre Bruciate erano il granaio del mio regno. Ora non vi cresce nulla, e i miei esploratori tornano tossendo sangue. Se il registro di Malvray dice il vero, la Corona avvelena la terra stessa per affamarci e generare mostri dalle scorie.\n\nLa capitana Sera Vex tiene il forte di Cinderwatch con ciò che resta della Guardia delle Braci. Va' da lei. Dille che il re non l'ha dimenticata, e che l'aiuto finalmente sta arrivando.",done:"(La capitana Vex legge il sigillo del re e fa una risata breve e dura.) 'L'aiuto sta arrivando.' Lo dice da due anni. E hanno mandato... te. Be'. Sarà meglio che tu sia bravo come dicono le storie."},
d_crypt:{text:"Sir Varric lo Spergiuro. Il campione di mio nonno, che aprì le porte ai predoni per una borsa d'oro e fu sepolto vivo sotto questa città in catene d'argento.\n\nI settari hanno spezzato quelle catene. Le mie guardie sentono armature marciare di notte nelle Catacombe di Aurelion, e i morti reali non riposano. Varric solleva un esercito di re sotto il mio stesso trono.\n\nScendi. Rimettilo nella tomba, e questa volta assicurati che ci resti.",done:"Le campane hanno suonato da sole quando è caduto. I sacerdoti lo chiamano miracolo. Io lo chiamo un debito, uno che Aurelion ti ripagherà."},
m3_1:{text:"Guardati intorno. Questo era il granaio del regno. Mia nonna seminava orzo dove ora c'è quel cumulo di scorie. Ora il suolo è ruggine, la pioggia brucia la pelle e i pozzi sanno di rame.\n\nTutto opera delle fonderie Cave. I loro camini non si fermano mai. Avvelenano la terra perché le città muoiano di fame, e dal veleno generano soldati.\n\nSono Sera Vex. Benvenuto alla fine del mondo.",done:"Sei venuto. È più di quanto faccia la maggior parte. La Guardia delle Braci conta quaranta anime e tre balestre funzionanti. Qualunque cosa tu sia, ora sei la nostra arma migliore."},
m3_2:{text:"I golem di scorie sono i peggiori. Strisciano fuori dai Camini Neri, scarti fusi a cui i riti Cavi hanno dato le gambe, e camminano finché non si raffreddano, bruciando tutto ciò che toccano.\n\nDistruggili prima che raggiungano le fattorie che provano ancora a coltivare. Mira alle crepe; è lì che i nuclei bruciano di più.",done:"Si rompono come terracotta una volta raffreddati. Buono a sapersi. La Guardia ti chiama già 'spaccagolem'. Non montarti la testa."},
m3_3:{text:"I folletti di cenere portano nuclei ardenti, piccoli cuori di fuoco di fonderia. La mia fabbra pensa di poterli trasformare in bombe incendiarie, e ci piacerebbe far assaggiare alla Corona il suo stesso fumo.\n\nPortami dei nuclei. Non tenerli in mano troppo a lungo; mordono.",done:"Ah! La fabbra Odda ne ha lanciato uno su un cumulo di scorie ed è esploso come una festa. Abbiamo di nuovo i denti."},
m3_4:{text:"I Pozzi di Melma sono alimentati da valvole della fonderia: scarichi così sporchi da uccidere gli uccelli che ci volano sopra. Ogni goccia che penetra nel terreno è un altro campo perso per sempre.\n\nChiudi quelle valvole. Tutte. Non possiamo ancora guarire la terra, ma possiamo fermare l'emorragia.",done:"Il pozzo della Fattoria Grigia è sgorgato limpido stamattina. Limpido. Il vecchio Haskin ha pianto nel secchio. Sei stato tu."},
m3_5:{text:"Gli schiavi della fonderia sono uomini e donne dei villaggi di Aurelion, presi di notte e incatenati alle fornaci. Il sorvegliante Grakk li fa lavorare finché crollano, poi li getta nelle scorie.\n\nComanda i Camini Neri. Uccidilo, libera chi puoi e portami ciò che ha con sé. Se vogliamo colpire la fonderia, dobbiamo sapere come funziona.",done:"Progetti della fonderia. Non di armi: di macchine. Macchine della peste, imballate e spedite a sud, verso la Palude di Mirewood.\n\nNon vogliono solo affamarci. Vogliono far ammalare chi resta. Non è mai stata una guerra per la terra. È una guerra per finirci."},
m3_6:{text:"Questi progetti devono arrivare a Madre Ilse a Bogmere prima delle macchine della peste. Conosce la palude e le sue streghe meglio di chiunque altro.\n\nAndrei io stessa, ma se me ne vado, Cinderwatch cade. Quindi tocca di nuovo a te. Tocca sempre a te, vero? Cavalca a sud. E grazie; non lo dico spesso.",done:"(Madre Ilse prende i progetti con mani tremanti.) Macchine della peste... ecco cosa preparano le streghe. Siediti, campione. Sarà una lunga notte."},
d_foundry:{text:"Nel cuore delle Terre Bruciate c'è la Fonderia delle Scorie e, nel suo cuore, Cindermaw l'Artefice: un fabbro Cavo che ha forgiato i golem, avvelenato i fiumi e costruito le macchine della peste con le sue mani bruciate.\n\nFinché le sue fornaci ardono, qui non crescerà più nulla. Entra nella Fonderia delle Scorie e spegni il suo fuoco per sempre.\n\nLa Guardia delle Braci terrà il cancello alle tue spalle. Torna da noi.",done:"I camini si sono spenti all'alba. Tutti. Per la prima volta in due anni vedo le stelle sopra Cinderwatch. Bevi con noi stasera, campione. Domani la terra comincia a guarire."},
};

QTR.pt={
m0_1:{text:"Calma, você dormiu dois dias. Os caçadores o encontraram na orla da floresta, frio como pedra de rio, e aquela marca na sua palma brilhava como brasa.\n\nSou Maren, anciã de Hearthmoor. Ainda não tenho respostas, só problemas: o Bosque Sussurrante se voltou contra nós. Formigas do tamanho de pôneis saem das árvores, e nossa paliçada foi feita para lobos, não para isto.\n\nSeja quem você foi antes, Hearthmoor precisa que você seja alguém agora.",done:"Você se firma melhor do que deveria. Ótimo. A marca na sua mão brilhou quando você se levantou; li sobre coisas assim nas velhas canções. Fique perto da vila por enquanto. Há trabalho, e pouco tempo."},
m0_2:{text:"Olhe os campos: as formigas operárias devoram uma fileira de cevada em uma hora e a levam para a floresta. Formigas não planejam assim. Algo as alimenta, as conduz.\n\nAbata as operárias nos campos e na orla da floresta. Cada uma que você mata é uma boca a menos em nosso celeiro.",done:"Seis a menos, e o resto recuou para as árvores. Não fugiram... recuaram, como soldados. Isso me assusta mais que o próprio enxame."},
m0_3:{text:"As formigas soldado cospem um ácido que corrói carvalho e ferro igualmente. Nosso portão leste está meio destruído.\n\nO velho Teodric, nosso alquimista, jura que pode preparar um unguento contrário, mas precisa das mandíbulas delas, frescas, com as glândulas de ácido dentro. Leve a ele o que precisa. Cuidado com as mãos.",done:"Teodric abriu uma e ficou pálido. Há cinza nas glândulas: cinza negra, de nenhum fogo desta floresta. Alguém alimenta o enxame com algo muito mais antigo que a fome."},
m0_4:{text:"Nossos batedores acharam onde elas procriam: a Depressão do Formigueiro, ao norte do Poço Lunar. O chão é um tapete de sacos de ovos, cada um pulsando com a mesma cinza negra.\n\nQueime-os. Se a próxima ninhada eclodir, Hearthmoor cai antes da primeira neve.",done:"Os caçadores viram a fumaça das muralhas e comemoraram. Mas também viram uma figura de pé sobre o Altar Oco, observando o fogo. Alta. Errada. Não era uma formiga."},
m0_5:{text:"O Altar Oco: uma ruína mais antiga que Hearthmoor. Dizem às crianças para nunca irem lá. Agora algo está sobre ele, e o enxame se move quando ele se move.\n\nEle se chama Kzzrak, o Feitor da Ninhada. As formigas não são seus filhos; são sua arma. Acabe com ele e traga-me o que carregar.",done:"Um selo de ferro negro: uma coroa, sem nada dentro.\n\nA Coroa Oca. Minha avó cantava sobre eles: homens e mulheres que acreditam que a humanidade foi o grande erro do mundo, e servem a um rei sem coração chamado Vharos. Querem cada lareira fria e cada estrada vazia. Eu os achava uma lenda.\n\nE sua marca... as canções a chamam de Aura Perdida. A última luz que responde quando a Coroa se ergue."},
m0_6:{text:"O Feitor está morto, mas a Rainha sob a floresta continua a procriar. Essa é uma luta para depois, quando você estiver mais forte.\n\nPrimeiro, este selo precisa ser visto por gente com espadas e muralhas. Leve-o para o leste, pelas árvores, ao Meirinho Hollis em Briarford. Se a Coroa Oca se move aqui, move-se em toda parte.\n\nVá com a luz, criança. Hearthmoor se lembrará de você.",done:"(O Meirinho Hollis vira o selo nas mãos por um longo tempo.) Maren o enviou? Então é verdade, e fui um tolo por rir das velhas canções."},
d_hive:{text:"Agora você está pronto para ouvir. Sob o Bosque Sussurrante, entre as raízes da árvore mais velha, existe uma Colmeia. Em seu coração vive Myrmexa, a Rainha da Ninhada: antes uma simples rainha formiga, agora inchada de feitiçaria Oca até o tamanho de um celeiro.\n\nEnquanto ela viver, o enxame voltará, estação após estação, até não restar vila na orla da floresta. A Coroa a plantou aqui para nos sangrar devagar.\n\nDesça à Colmeia da Ninhada. Mate-a. Leve poções, muitas, e não deixe os golpes dela o pegarem.",done:"A floresta está... quieta. Pela primeira vez em um ano ouço pássaros ao amanhecer. O que ela guardava lá embaixo, fique com isso. Você mereceu, campeão de Hearthmoor."},
m1_1:{text:"O selo de Maren. Uma coroa vazia. (O Meirinho Hollis o põe na mesa como se pudesse morder.)\n\nEu também ria das velhas canções. Até que os bandidos das minhas estradas passaram a pagar cerveja com moedas negras cunhadas com essa mesma coroa. Briarford é a última parada antes do Reino: cada carroça de grãos e ferro para Aurelion passa por aqui, e ultimamente metade nunca chega.\n\nAlguém quer a capital faminta. Quero saber quem.",done:"Certo. Se Maren confia em você, eu também. Thornvale é seu para percorrer; só não confie em ninguém que carregue moeda negra."},
m1_2:{text:"Os degoladores da estrada leste cobravam pedágio e deixavam passar. Agora queimam as carroças, matam os condutores e deixam a carga apodrecer. Isso não é roubo. É um bloqueio.\n\nReduza o número deles. Cada bandido abatido é uma carroça que chega ao Reino.",done:"Três carroças chegaram à capital esta manhã. Primeira vez em um mês. Os condutores vão lhe pagar bebidas, queira ou não."},
m1_3:{text:"Os javalis desceram das colinas nesta primavera com olhos vermelhos e espuma nas presas. Não comem as plantações: pisoteiam-nas, campo após campo, como se fossem pastoreados.\n\nTraga-me as presas. Os fazendeiros pagarão uma recompensa, e mandarei a bruxa da sebe ver o que os enlouquece.",done:"A bruxa ferveu uma presa e a água ficou negra. A mesma cinza que Maren achou nas formigas. O que a Coroa dá às feras está se espalhando para o leste."},
m1_4:{text:"Os bandidos atacaram nosso celeiro há duas noites e levaram cada saco de grão de inverno para o acampamento nas colinas. Se não o recuperarmos, Briarford passa fome antes da primavera, e também as famílias da estrada para Aurelion.\n\nEntre no Acampamento Bandido e traga o grão para casa.",done:"Você achou os sacos... e ordens pregadas no poste do acampamento. 'Queimem o que não puderem carregar. A capital deve ajoelhar-se faminta.' Assinado com uma coroa sem nada dentro."},
m1_5:{text:"O homem que dá essas ordens se chama Gallowsjack, o Rei Bandido. Era carrasco em Aurelion até o Rei perdoar o homem que ele deveria enforcar. Desde então odeia a coroa, e agora encontrou outra para servir.\n\nEle está entocado nas Ruínas de Thornkeep. Acabe com ele e traga-me o que carregar.",done:"Uma bolsa cheia de moedas Ocas e uma carta selada com cera negra. Está endereçada a alguém dentro da corte real.\n\nIsso é maior que bandidos, maior que Briarford. A Coroa tem amigos no próprio salão do Rei."},
m1_6:{text:"Não posso mandar isto por mensageiro: quem estiver naquela corte faria com que 'se perdesse'. Tem de ir em mãos, ao próprio Rei.\n\nCavalgue para Aurelion. Peça audiência ao rei Aldric e ponha essa bolsa e essa carta nas mãos dele, de mais ninguém. Thornvale aguentará. Vá.",done:"(Os guardas do palácio tentam mandá-lo embora, até o Rei ver a moeda negra em sua mão e chamá-lo ele mesmo.)"},
m2_1:{text:"Então o herói do Bosque Sussurrante chega com moeda Oca e ordens de um bandido. Ajoelhe-se se quiser; estou cansado de cerimônias.\n\nSou Aldric, e este é meu reino, o que resta dele. Meu pai falava da Coroa Oca: uma fé que ensina que a humanidade é uma doença, e que o mais piedoso é acabar com ela. Seus sacerdotes pregam abertamente em minhas estradas, e meus próprios lordes fingem não ouvir.\n\nEssa marca que você carrega... minha feiticeira da corte daria o olho esquerdo para vê-la. Eu prefiro vê-la em uso.",done:"Você não vacilou quando os nomeei. Bom. A maior parte da minha corte vacilou. Aurelion tem muralhas, mercadores e dez mil almas que ainda não sabem o que vem por aí. Ajude-me a mantê-las assim."},
m2_2:{text:"Os sectários reúnem multidões nas encruzilhadas. Dizem aos fazendeiros que o rei os abandonou, que a Coroa lhes dará paz: a paz do túmulo.\n\nNão prenderei ninguém por ouvir. Mas os pregadores carregam punhais, e três dos meus coletores já estão mortos. Quebre o domínio da seita sobre as terras da coroa.",done:"As encruzilhadas estão calmas. Meus guardas acharam listas nos corpos: nomes de cada família que se recusou a ouvir. Marcadas para serem 'desfeitas'. Essas listas agora são cinzas. Obrigado."},
m2_3:{text:"Ladrões de túmulos invadiram o Velho Cemitério e roubaram os anéis de sinete dos meus ancestrais. Um furto menor, você pensaria.\n\nMas um sinete pode selar uma ordem real. Com os selos de sete reis, a Coroa poderia mandar metade das minhas guarnições marchar para onde quisesse. Recupere-os.",done:"Sete sinetes... e mais um que nunca vi: o selo de Sir Varric, campeão do meu avô, que o traiu e foi enterrado acorrentado sob a cidade. Aquele túmulo devia estar selado para sempre."},
m2_4:{text:"Os sectários erguem efígies no Velho Cemitério: reis de palha com coroas vazias, encharcados de sangue e piche. Meus sacerdotes dizem que cada uma afina o muro entre os vivos e o que jaz embaixo.\n\nDerrube-as. Queime-as. Que meu povo veja que os ídolos da Coroa caem como qualquer palha.",done:"Os sacerdotes dizem que o cemitério 'respira melhor'. Não sei o que isso significa, e não tenho certeza se quero saber."},
m2_5:{text:"Tudo leva a um homem: o diácono Malvray, antes meu próprio capelão. Ele realiza ritos no Santuário Submerso sob o velho aqueduto, e é a voz que os sectários obedecem.\n\nEle batizou minha filha. Agora afogaria o reino. Silencie-o, e traga-me aquilo em que ele escreve.",done:"O livro-razão dele. Páginas de nomes, pagamentos em ouro negro... e ordens, numa letra fria e bela, assinadas apenas com uma coroa vazia.\n\nEstão construindo algo nas Terras Queimadas. Uma fundição, diz aqui. A forja de Cindermaw. 'Para envenenar o pão dos homens.'"},
m2_6:{text:"As Terras Queimadas foram o celeiro do meu reino. Agora nada cresce lá, e meus batedores voltam tossindo sangue. Se o livro de Malvray está certo, a Coroa envenena a própria terra para nos matar de fome e criar monstros da escória.\n\nA capitã Sera Vex defende o forte de Cinderwatch com o que resta da Guarda das Brasas. Vá até ela. Diga que o rei não a esqueceu, e que a ajuda finalmente está chegando.",done:"(A capitã Vex lê o selo do rei e solta uma risada curta e dura.) 'A ajuda está chegando.' Ele diz isso há dois anos. E mandaram... você. Bem. É melhor ser tão bom quanto dizem as histórias."},
d_crypt:{text:"Sir Varric, o Perjuro. O campeão do meu avô, que abriu os portões a saqueadores por uma bolsa de ouro e foi enterrado vivo sob esta cidade em correntes de prata.\n\nOs sectários quebraram essas correntes. Meus guardas ouvem armaduras marchando à noite nas Catacumbas de Aurelion, e os mortos reais não descansam. Varric ergue um exército de reis sob meu próprio trono.\n\nDesça. Devolva-o ao túmulo, e desta vez garanta que ele fique lá.",done:"Os sinos tocaram sozinhos quando ele caiu. Os sacerdotes chamam de milagre. Eu chamo de dívida, uma que Aurelion lhe pagará."},
m3_1:{text:"Olhe ao redor. Este era o celeiro do reino. Minha avó plantava cevada onde está aquele monte de escória. Agora o solo é ferrugem, a chuva queima a pele e os poços têm gosto de cobre.\n\nTudo isso é obra das fundições Ocas. Suas chaminés nunca param. Envenenam a terra para que as cidades passem fome, e do veneno criam soldados.\n\nSou Sera Vex. Bem-vindo ao fim do mundo.",done:"Você veio. Isso é mais do que a maioria. A Guarda das Brasas são quarenta almas e três bestas que funcionam. Seja o que for, agora você é nossa melhor arma."},
m3_2:{text:"Os golens de escória são o pior. Rastejam para fora das Chaminés Negras, rejeito derretido que ganhou pernas por ritos Ocos, e caminham até esfriar, queimando tudo o que tocam.\n\nDestrua-os antes que cheguem às fazendas que ainda tentam plantar algo. Mire nas rachaduras; é ali que os núcleos queimam mais.",done:"Quebram como cerâmica depois de esfriar. Bom saber. A Guarda já o chama de 'quebra-golens'. Não deixe subir à cabeça."},
m3_3:{text:"Os diabretes de cinza carregam núcleos ardentes, pequenos corações de fogo de fundição. Minha ferreira acha que pode transformá-los em bombas incendiárias, e adoraríamos dar à Coroa um gosto da própria fumaça.\n\nTraga-me núcleos. Não os segure muito tempo; eles mordem.",done:"Ha! A ferreira Odda jogou um num monte de escória e ele explodiu como uma festa. Temos dentes de novo."},
m3_4:{text:"Os Poços de Lodo são alimentados por válvulas da fundição: dejetos tão imundos que matam os pássaros que voam por cima. Cada gota que penetra na terra é outro campo perdido para sempre.\n\nFeche essas válvulas. Todas. Ainda não podemos curar a terra, mas podemos estancar o sangramento.",done:"O poço da Fazenda Cinzenta correu limpo esta manhã. Limpo. O velho Haskin chorou no balde. Foi você."},
m3_5:{text:"Os escravos da fundição são homens e mulheres das vilas de Aurelion, levados à noite e acorrentados às fornalhas. O feitor Grakk os faz trabalhar até caírem, e depois os joga na escória.\n\nEle domina as Chaminés Negras. Mate-o, liberte quem puder e traga-me o que ele carregar. Se vamos atacar a fundição, precisamos saber como ela funciona.",done:"Plantas da fundição. Não de armas: de máquinas. Máquinas de praga, encaixotadas e enviadas para o sul, ao Pântano de Mirewood.\n\nNão querem só nos matar de fome. Querem adoecer quem restar. Nunca foi uma guerra por terras. É uma guerra para nos acabar."},
m3_6:{text:"Essas plantas precisam chegar à Madre Ilse em Bogmere antes das máquinas de praga. Ela conhece o pântano e suas bruxas melhor que ninguém.\n\nEu iria pessoalmente, mas se eu sair, Cinderwatch cai. Então é você de novo. É sempre você, não é? Cavalgue para o sul. E obrigada; não digo isso com frequência.",done:"(A Madre Ilse pega as plantas com mãos trêmulas.) Máquinas de praga... então é isso que as bruxas preparam. Sente-se, campeão. Será uma longa noite."},
d_foundry:{text:"No coração das Terras Queimadas fica a Fundição de Escória e, em seu coração, Cindermaw, o Artífice: um ferreiro Oco que forjou os golens, envenenou os rios e construiu as máquinas de praga com as próprias mãos chamuscadas.\n\nEnquanto suas fornalhas arderem, nada voltará a crescer aqui. Entre na Fundição de Escória e apague o fogo dele para sempre.\n\nA Guarda das Brasas segurará o portão atrás de você. Volte para nós.",done:"As chaminés se apagaram ao amanhecer. Todas. Pela primeira vez em dois anos vejo as estrelas sobre Cinderwatch. Beba conosco esta noite, campeão. Amanhã a terra começa a sarar."},
};

qadd('de',{
m4_1:{text:"(Mutter Ilse breitet die Pläne von Hauptfrau Vex auf einem feuchten Tisch aus.)\n\nSeuchenmaschinen. Kupferbäuche, Knochenrohre, ein Ofen, der Krankheit statt Rauch ausatmet. Das also brauen die Hexen tief im Moor.\n\nIch bin Mutter Ilse. Ich führe das Heilhaus von Bogmere, und in letzter Zeit ist es voll. Meine Leute husten schwarzes Wasser. Die Moorhexen haben Mutter Morrow die Treue geschworen, und Mutter Morrow dem Hohlen König.",done:"Du bist für Fremde durch das Schilf gekommen. Vex schrieb, dass du das tun würdest. Ruh dich kurz aus, dann hilf mir, Bogmere am Atmen zu halten."},
m4_2:{text:"Die Moorlauerer blieben früher in den tiefen Tümpeln. Jetzt quellen sie nachts durch unsere Brunnen herauf, und wo sie vorbeiziehen, wird das Wasser grau und sauer.\n\nSäubere die Dorfbrunnen und die Wege um Bogmere. Verbrenne, was von ihnen übrig bleibt; lass es nicht an deine Haut.",done:"Die Brunnen blubbern nicht mehr. Die alte Fenna hat heute Morgen aus ihrem getrunken und kein einziges Mal gehustet. Kleine Gnaden, und ich nehme jede."},
m4_3:{text:"Etwas Seltsames: Die Krokilisken trinken das Seuchenwasser und werden fett davon. Was immer die Hexen brauen, ihre Galle wehrt es ab.\n\nBring mir Krokilisken-Galle. Damit kann ich ein Tonikum für die Kranken brauen und vielleicht lernen, die Seuche selbst zu brechen. Vorsicht vor den Kiefern; sie sind schneller, als sie aussehen.",done:"Das Tonikum wirkt. Kein Heilmittel, aber das Fieber bricht in einem halben Tag, statt in dreien zu töten. Du hast heute mehr Leben gerettet, als du je erfahren wirst."},
m4_4:{text:"Meine Späher haben die Kessel gefunden: ein Ring davon in der Hexenlichtsenke, jeder so groß wie ein Karren, jeder grün brodelnd. Die Hexen füllen Tonkrüge daraus und schicken sie auf Schmugglerbooten nach Süden und Osten.\n\nStürze jeden Kessel um. Lass das Moor ihr Gebräu verschlucken, bevor noch ein Krug das Fenn verlässt.",done:"Die Hexenlichtsenke brennt heute Nacht kalt und grün. Die Schmuggler kamen wegen ihrer Krüge und fanden nur Schlamm. Der Zirkel wird wissen, dass du es warst."},
m4_5:{text:"Die älteste Hexe, Großmutter Fäulnis, hält Hof im Galgenmoor. Sie war einst Hebamme in Bogmere. Sie hat das halbe Dorf zur Welt gebracht, und jetzt vergiftet sie deren Kinder.\n\nSie bewacht etwas, das dem Zirkel mehr wert ist als das eigene Leben. Mach ihr ein Ende und bring mir, was sie bewachte.",done:"Ein Schlüssel aus schwarzem Eis, das nie schmilzt, mit Runen aus dem hohen Norden. Die Frostzahngipfel: Rimehold.\n\nDie Hexen tauschen dort Seuche gegen etwas. Etwas Altes, Kaltes und sehr Geduldiges."},
m4_6:{text:"Jarl Brynja herrscht über Rimeholt in den Frostzahngipfeln. Ihr Volk bewacht diese Berge, seit das Königreich noch keinen Namen hatte. Wenn jemand weiß, für welches Schloss dieser Schlüssel geschnitten wurde, dann sie.\n\nBring ihn nach Norden. Zieh dich warm an, und trau dem Schnee nicht, wo er zu glatt liegt. Bogmere wird durchhalten. Dank dir haben wir jetzt ein Tonikum.",done:"(Jarl Brynja dreht den schwarzen Schlüssel in ihrer Kettenhand, und das Feuer in der Halle flackert.) Wo hast du das gefunden? Nein. Sag es mir noch nicht. Setz dich zuerst ans Feuer."},
d_chapel:{text:"Mutter Morrow selbst haust unter dem Moor, in der Ertrunkenen Kapelle: einer Kirche, die vor hundert Jahren samt ihrer ganzen Gemeinde im Sumpf versank.\n\nDort braut sie die Seuche, und die ertrunkene Gemeinde dient ihr noch immer. Jeder Krug Krankheit, der Mirewood verlässt, beginnt in ihrem Kessel.\n\nSteig hinab in die Ertrunkene Kapelle und mach der Moorhexe ein Ende. Nimm mein Tonikum und viele Tränke mit. Die Luft dort unten ist Gift.",done:"Das Moor riecht heute Morgen nach Regen, nicht nach Fäulnis. Die Kranken sitzen wieder aufrecht in ihren Betten. Was du in dieser Kapelle gefunden hast, gehört dir, und mit ihm Bogmeres Dank."},
m5_1:{text:"Hrimgars Schlüssel. (Jarl Brynja lässt ihn nicht los.) Der Großvater meines Großvaters hat diesen Eidbrecher im Eis unter Rimehold versiegelt. Jarl Hrimgar verkaufte sein eigenes Volk an den Winter, für eine Krone, die niemals schmelzen würde.\n\nDie Hohle Krone hat ihn gefunden. Die Hexen tauschen Seuche gegen seine gefrorenen Toten, und nun öffnen sich die Hügelgräber und die Draugr wandeln wieder.\n\nWillkommen in Rimeholt, Südländer. Du kommst zur falschen Zeit.",done:"Du bist beim Namen nicht zusammengezuckt. Gut. Meine Huskarle flüstern ihn wie einen Fluch. Wir werden jemanden brauchen, der nicht flüstert."},
m5_2:{text:"Die Draugr kommen in der Dämmerung aus den Hügelgräbern: frostgebundene Tote in rostigen Kettenhemden, Hrimgars alte Huskarle. Sie ermüden nicht, sie spüren keine Kälte, und sie erinnern sich an jeden Weg zu unserer Halle.\n\nStreck sie nieder. Zerschlag ihre Schädel; das Eis darin ist es, was sie bewegt.",done:"Die Nachtwache sah letzte Nacht keine Draugr auf den Pässen. Die erste ruhige Nacht seit einem Monat. Die Skalden werden ein Lied über dich dichten wollen. Versuch, es ihnen auszureden."},
m5_3:{text:"Die Wachfeuer um Rimeholt halten die Toten fern. Sie erlöschen, und gewöhnliches Holz hält sie nicht am Brennen. Unsere Schamanen verbrennen Yetiherzen; ein Yetiherz brennt heiß genug, um Stein zu schmelzen.\n\nJage die Yetis im hohen Schnee und bring mir ihre Herzen. Es ist grausam, aber unsere Kinder schlafen im Schutz dieser Feuer.",done:"Die Wachfeuer lodern wieder. Die Schamanen sagen, die Toten können sie jetzt nicht mehr überqueren, nicht einmal die alten. Du hast uns den Winter erkauft."},
m5_4:{text:"Die Runensteine, die das Gefrorene Hügelgrab versiegelten, wurden gestohlen, von den Draugr herausgezerrt und im Schnee verstreut. Ohne sie öffnet sich jedes Grab in den Gipfeln.\n\nHol die Runensteine aus dem Gefrorenen Hügelgrab zurück. Unsere Schamanen werden die Siegel neu schnitzen.",done:"Sechs Steine, jede Rune unversehrt. Die Schamanen haben mit dem Schnitzen begonnen. Das Hügelgrab ist heute Nacht still."},
m5_5:{text:"Hrimgars Skalde lebt noch, wenn man es so nennen kann. Er steht am Eisthronpass und singt die alten Winterlieder, und jede Strophe weckt einen weiteren toten Krieger.\n\nBring sein Lied zum Schweigen. Bring mir, was er bei sich trägt; ein Skalde trägt immer die Geheimnisse seines Königs.",done:"Eine Tafel aus Sonnenstein, selbst hier warm, aus den Wüsten des fernen Südens. Wüstenschrift: ein Versprechen. Man versprach Hrimgar ein Grab neben dem Titanenkönig, einen Platz unter den Göttern, wenn er der Hohlen Krone seinen Winter gäbe.\n\nVharos sammelt die alten Könige der Welt. Die Toten, die Verfluchten, die Vergessenen. Er baut einen Hofstaat."},
m5_6:{text:"Scheicha Nefret herrscht über die Oase Khepri in der Sunscar-Wüste. Ihr Volk bewacht die Titanengräber, wie meines die Hügelgräber. Wenn die Krone dort um die Macht eines toten Königs gefeilscht hat, muss sie es von dir hören.\n\nBring die Tafel nach Süden. Und, Südländer: Die Gipfel werden sich an dich erinnern. Das ist keine Kleinigkeit.",done:"(Scheicha Nefret liest die Tafel zweimal und legt sie dann sehr behutsam nieder.) Sekhmar. Der Hohepriester des Titanenkönigs. Die alte Geschichte war also eine Warnung, keine Legende."},
d_vault:{text:"Jarl Hrimgar der Frostgebundene sitzt auf seinem Eisthron im Rimehold-Gewölbe unter dem Berg. Jeder Draugr der Gipfel gehorcht ihm, und solange er besteht, werden sich die Hügelgräber weiter öffnen.\n\nEr hält den gefrorenen Schlüssel zu den Wüstengräbern, den Handel, den Vharos mit ihm schloss. Steig hinab ins Rimehold-Gewölbe und mach dem Eidbrecher ein Ende. Bring Feuer, bring Tränke, und bleib nicht stehen.",done:"Der Berg stöhnte, als er fiel; wir hörten es in der Halle. Der Schnee auf den Pässen ist wieder nur Schnee. Rimeholt schuldet dir etwas, von dem wir hundert Jahre singen werden."},
});

qadd('es',{
m4_1:{text:"(La Madre Ilse extiende los planos de la capitana Vex sobre una mesa húmeda.)\n\nMáquinas de plaga. Vientres de cobre, tubos de hueso, un horno que exhala enfermedad en lugar de humo. Así que eso es lo que las brujas cocinan en el pantano profundo.\n\nSoy la Madre Ilse. Llevo la casa de curación de Bogmere, y últimamente está llena. Mi gente tose agua negra. Las brujas del pantano se han jurado a la Madre Morrow, y la Madre Morrow se ha jurado al Rey Hueco.",done:"Cruzaste los juncos por unos desconocidos. Vex escribió que lo harías. Descansa un momento y luego ayúdame a que Bogmere siga respirando."},
m4_2:{text:"Los acechadores del pantano solían quedarse en las pozas profundas. Ahora suben de noche por nuestros pozos, y por donde pasan el agua se vuelve gris y agria.\n\nLimpia los pozos del pueblo y los caminos alrededor de Bogmere. Quema lo que quede de ellos; que no te toque la piel.",done:"Los pozos han dejado de burbujear. La vieja Fenna bebió del suyo esta mañana y no tosió ni una vez. Pequeñas misericordias, y acepto todas."},
m4_3:{text:"Algo extraño: los crocoliscos beben el agua de la plaga y engordan con ella. Lo que sea que cocinen las brujas, su bilis lo combate.\n\nTráeme bilis de crocolisco. Con ella puedo preparar un tónico para los enfermos, y quizá aprender a romper la plaga misma. Cuidado con las fauces; son más rápidas de lo que parecen.",done:"El tónico funciona. No es una cura, pero la fiebre cede en medio día en lugar de matar en tres. Hoy has salvado más vidas de las que nunca sabrás."},
m4_4:{text:"Mis exploradores encontraron los calderos: un círculo en la Hondonada de Luzbruja, cada uno grande como un carro, cada uno burbujeando verde. Las brujas llenan tinajas de barro y las envían al sur y al este en barcas de contrabandistas.\n\nVuelca cada caldero. Que el pantano se trague su brebaje antes de que otra tinaja salga del pantano.",done:"La Hondonada de Luzbruja arde fría y verde esta noche. Los contrabandistas vinieron por sus tinajas y solo encontraron barro. El aquelarre sabrá que fuiste tú."},
m4_5:{text:"La bruja más vieja, la Abuela Podredumbre, tiene su corte en el Pantano del Patíbulo. Fue partera en Bogmere. Trajo al mundo a medio pueblo, y ahora envenena a sus hijos.\n\nGuarda algo que el aquelarre valora más que sus propias vidas. Acaba con ella y tráeme lo que guardaba.",done:"Una llave de hielo negro que nunca se derrite, tallada con runas del lejano norte. Los Picos Colmillo Helado: Rimehold.\n\nLas brujas intercambian plaga por algo allí. Algo antiguo, frío y muy paciente."},
m4_6:{text:"La jarl Brynja gobierna Rimeholt en los Picos Colmillo Helado. Su pueblo ha guardado esas montañas desde antes de que el Reino tuviera nombre. Si alguien sabe para qué cerradura se talló esta llave, es ella.\n\nLlévala al norte. Abrígate, y no te fíes de la nieve donde está demasiado lisa. Bogmere resistirá. Ahora tenemos un tónico, gracias a ti.",done:"(La jarl Brynja gira la llave negra en su mano enguantada de malla, y el fuego del salón titubea.) ¿Dónde encontraste esto? No. No me lo digas aún. Siéntate primero junto al fuego."},
d_chapel:{text:"La propia Madre Morrow se esconde bajo el pantano, en la Capilla Ahogada: una iglesia que se hundió en la ciénaga hace cien años con toda su congregación dentro.\n\nAllí cocina la plaga, y la parroquia ahogada aún la sirve. Cada tinaja de enfermedad que sale de Mirewood nace en su caldero.\n\nBaja a la Capilla Ahogada y acaba con la Bruja del Pantano. Lleva mi tónico y muchas pociones. El aire allí abajo es veneno.",done:"El pantano huele a lluvia esta mañana, no a podredumbre. Los enfermos se incorporan en sus camas. Lo que encontraras en esa capilla es tuyo, y con ello la gratitud de Bogmere."},
m5_1:{text:"La llave de Hrimgar. (La jarl Brynja no la suelta.) El abuelo de mi abuelo selló a ese perjuro en el hielo bajo Rimehold. El jarl Hrimgar vendió a su propio pueblo al invierno por una corona que nunca se derretiría.\n\nLa Corona Hueca lo encontró. Las brujas le cambian plaga por sus muertos helados, y ahora los túmulos se abren y los draugr vuelven a caminar.\n\nBienvenido a Rimeholt, sureño. Llegas en mal momento.",done:"No te inmutaste al oír el nombre. Bien. Mis huscarles lo susurran como una maldición. Necesitaremos a alguien que no susurre."},
m5_2:{text:"Los draugr salen de los túmulos al anochecer: muertos helados en cotas oxidadas, los viejos huscarles de Hrimgar. No se cansan, no sienten frío y recuerdan cada camino hasta nuestro salón.\n\nAcaba con ellos. Rómpeles el cráneo; el hielo de dentro es lo que los mueve.",done:"La guardia nocturna no vio draugr en los pasos anoche. La primera noche tranquila en un mes. Los escaldos querrán componerte una canción. Intenta que no lo hagan."},
m5_3:{text:"Los fuegos de guarda alrededor de Rimeholt mantienen fuera a los muertos. Se están apagando, y la leña común no basta. Nuestros chamanes queman corazones de yeti; un corazón de yeti arde tanto como para fundir piedra.\n\nCaza a los yetis en las nieves altas y tráeme sus corazones. Es cruel, pero nuestros niños duermen dentro de esos fuegos.",done:"Los fuegos de guarda rugen de nuevo. Los chamanes dicen que los muertos ya no pueden cruzarlos, ni siquiera los antiguos. Nos has comprado el invierno."},
m5_4:{text:"Las piedras rúnicas que sellaban el Túmulo Helado han sido robadas, arrastradas por los draugr y esparcidas en la nieve. Sin ellas, cada tumba de los Picos se abrirá.\n\nRecupera las piedras rúnicas del Túmulo Helado. Nuestros chamanes volverán a tallar los sellos.",done:"Seis piedras, cada runa intacta. Los chamanes han empezado a tallar. El Túmulo está en silencio esta noche."},
m5_5:{text:"El escaldo de Hrimgar aún vive, si puede llamarse así. Está en el Paso del Trono de Hielo cantando las viejas canciones del invierno, y cada verso despierta a otro guerrero muerto.\n\nSilencia su canción. Tráeme lo que lleve; un escaldo siempre guarda los secretos de su rey.",done:"Una tablilla de piedra solar, tibia incluso aquí, de los desiertos del lejano sur. Escritura del desierto: una promesa. A Hrimgar le prometieron una tumba junto al Rey Titán, un lugar entre los dioses, si entregaba su invierno a la Corona Hueca.\n\nVharos está reuniendo a los viejos reyes del mundo. Los muertos, los malditos, los olvidados. Está construyendo una corte."},
m5_6:{text:"La jequesa Nefret gobierna el Oasis de Khepri en el Desierto Sunscar. Su pueblo guarda las tumbas de los Titanes, como el mío guarda los túmulos. Si la Corona ha negociado allí por el poder de un rey muerto, debe oírlo de ti.\n\nLleva la tablilla al sur. Y, sureño: los Picos te recordarán. No es poca cosa.",done:"(La jequesa Nefret lee la tablilla dos veces y luego la deja con mucho cuidado.) Sekhmar. El sumo sacerdote del Rey Titán. Así que la vieja historia era una advertencia, no una leyenda."},
d_vault:{text:"El jarl Hrimgar el Helado se sienta en su trono de hielo en la Cámara de Rimehold, bajo la montaña. Cada draugr de los Picos le responde, y mientras perdure, los túmulos seguirán abriéndose.\n\nGuarda la llave helada de las tumbas del desierto, el trato que Vharos hizo con él. Baja a la Cámara de Rimehold y acaba con el perjuro. Lleva fuego, lleva pociones y no te quedes quieto.",done:"La montaña gimió cuando cayó; lo oímos en el salón. La nieve de los pasos vuelve a ser solo nieve. Rimeholt te debe algo que cantaremos durante cien años."},
});

qadd('fr',{
m4_1:{text:"(Mère Ilse étale les plans de la capitaine Vex sur une table humide.)\n\nDes machines de peste. Ventres de cuivre, tuyaux d'os, un fourneau qui exhale la maladie au lieu de la fumée. Voilà donc ce que les sorcières brassent au fond du marais.\n\nJe suis Mère Ilse. Je tiens la maison de soins de Bogmere, et elle est pleine ces temps-ci. Mes gens crachent de l'eau noire. Les sorcières du marais se sont vouées à Mère Morrow, et Mère Morrow s'est vouée au Roi Creux.",done:"Tu as traversé les roseaux pour des inconnus. Vex avait écrit que tu le ferais. Repose-toi un instant, puis aide-moi à garder Bogmere en vie."},
m4_2:{text:"Les rôdeurs des tourbières restaient autrefois dans les mares profondes. Maintenant ils remontent la nuit par nos puits, et partout où ils passent l'eau devient grise et aigre.\n\nNettoie les puits du village et les chemins autour de Bogmere. Brûle ce qu'il en reste ; que ça ne touche pas ta peau.",done:"Les puits ont cessé de bouillonner. La vieille Fenna a bu au sien ce matin sans tousser une seule fois. De petites grâces, et je les prends toutes."},
m4_3:{text:"Chose étrange : les crocilisques boivent l'eau de la peste et s'en engraissent. Quoi que brassent les sorcières, leur bile le combat.\n\nRapporte-moi de la bile de crocilisque. Avec elle, je peux préparer un tonique pour les malades, et peut-être apprendre à briser la peste elle-même. Attention aux mâchoires ; elles sont plus rapides qu'il n'y paraît.",done:"Le tonique fonctionne. Ce n'est pas un remède, mais la fièvre tombe en une demi-journée au lieu de tuer en trois. Tu as sauvé aujourd'hui plus de vies que tu ne le sauras jamais."},
m4_4:{text:"Mes éclaireurs ont trouvé les chaudrons : un cercle dans le Creux de Lueur-Sorcière, chacun grand comme une charrette, chacun bouillonnant de vert. Les sorcières en remplissent des jarres d'argile qu'elles envoient au sud et à l'est sur des bateaux de contrebandiers.\n\nRenverse chaque chaudron. Que le marais avale leur breuvage avant qu'une autre jarre ne quitte le marécage.",done:"Le Creux de Lueur-Sorcière brûle froid et vert ce soir. Les contrebandiers sont venus chercher leurs jarres et n'ont trouvé que de la boue. Le cercle saura que c'était toi."},
m4_5:{text:"La plus vieille sorcière, Grand-mère Pourriture, tient sa cour au Marais du Gibet. Elle était sage-femme à Bogmere. Elle a mis au monde la moitié du village, et maintenant elle empoisonne leurs enfants.\n\nElle garde quelque chose que le cercle estime plus que sa propre vie. Achève-la, et rapporte-moi ce qu'elle gardait.",done:"Une clé de glace noire qui ne fond jamais, gravée de runes du Grand Nord. Les Pics de Crocgivre : Rimehold.\n\nLes sorcières échangent la peste contre quelque chose là-bas. Quelque chose d'ancien, de froid, et de très patient."},
m4_6:{text:"La jarl Brynja règne sur Rimeholt dans les Pics de Crocgivre. Son peuple garde ces montagnes depuis avant que le Royaume n'ait un nom. Si quelqu'un sait pour quelle serrure cette clé a été taillée, c'est elle.\n\nPorte-la au nord. Couvre-toi bien, et méfie-toi de la neige là où elle est trop lisse. Bogmere tiendra. Nous avons un tonique maintenant, grâce à toi.",done:"(La jarl Brynja fait tourner la clé noire dans sa main gantée de mailles, et le feu de la grande salle vacille.) Où as-tu trouvé ça ? Non. Ne me le dis pas encore. Assieds-toi d'abord près du feu."},
d_chapel:{text:"Mère Morrow elle-même se terre sous le marais, dans la Chapelle Noyée : une église engloutie par la tourbière il y a cent ans avec toute sa congrégation à l'intérieur.\n\nC'est là qu'elle brasse la peste, et la paroisse noyée la sert encore. Chaque jarre de maladie qui quitte Mirewood naît dans son chaudron.\n\nDescends dans la Chapelle Noyée et achève la Sorcière des Tourbières. Prends mon tonique et beaucoup de potions. L'air là-dessous est un poison.",done:"Le marais sent la pluie ce matin, pas la pourriture. Les malades se redressent dans leurs lits. Ce que tu as trouvé dans cette chapelle est à toi, et la gratitude de Bogmere avec."},
m5_1:{text:"La clé de Hrimgar. (La jarl Brynja ne la lâche pas.) Le grand-père de mon grand-père a scellé ce parjure dans la glace sous Rimehold. Le jarl Hrimgar a vendu son propre peuple à l'hiver pour une couronne qui ne fondrait jamais.\n\nLa Couronne Creuse l'a trouvé. Les sorcières lui échangent la peste contre ses morts gelés, et maintenant les tertres s'ouvrent et les draugr marchent de nouveau.\n\nBienvenue à Rimeholt, sudiste. Tu arrives au mauvais moment.",done:"Tu n'as pas tressailli au nom. Bien. Mes huscarls le murmurent comme une malédiction. Il nous faudra quelqu'un qui ne murmure pas."},
m5_2:{text:"Les draugr sortent des tertres au crépuscule : des morts gelés en mailles rouillées, les anciens huscarls de Hrimgar. Ils ne se fatiguent pas, ne sentent pas le froid, et se souviennent de chaque route jusqu'à notre salle.\n\nAbats-les. Brise-leur le crâne ; c'est la glace à l'intérieur qui les fait bouger.",done:"Le guet de nuit n'a vu aucun draugr sur les cols cette nuit. Première nuit calme depuis un mois. Les scaldes voudront composer une chanson sur toi. Essaie de les en empêcher."},
m5_3:{text:"Les feux de garde autour de Rimeholt tiennent les morts à l'écart. Ils s'éteignent, et le bois ordinaire ne suffit pas. Nos chamans brûlent des cœurs de yéti ; un cœur de yéti brûle assez fort pour fondre la pierre.\n\nChasse les yétis dans les hautes neiges et rapporte-moi leurs cœurs. C'est cruel, mais nos enfants dorment à l'abri de ces feux.",done:"Les feux de garde rugissent de nouveau. Les chamans disent que les morts ne peuvent plus les franchir, pas même les anciens. Tu nous as acheté l'hiver."},
m5_4:{text:"Les pierres runiques qui scellaient le Tertre Gelé ont été volées, traînées dehors par les draugr et éparpillées dans la neige. Sans elles, chaque tombe des Pics s'ouvrira.\n\nRécupère les pierres runiques du Tertre Gelé. Nos chamans graveront de nouveau les sceaux.",done:"Six pierres, chaque rune intacte. Les chamans ont commencé à graver. Le Tertre est silencieux ce soir."},
m5_5:{text:"Le scalde de Hrimgar vit encore, si l'on peut dire. Il se tient au Col du Trône de Glace et chante les vieux chants de l'hiver, et chaque couplet réveille un autre guerrier mort.\n\nFais taire son chant. Rapporte-moi ce qu'il porte ; un scalde porte toujours les secrets de son roi.",done:"Une tablette de pierre solaire, tiède même ici, venue des déserts du grand sud. Écriture du désert : une promesse. On a promis à Hrimgar une tombe aux côtés du Roi-Titan, une place parmi les dieux, s'il offrait son hiver à la Couronne Creuse.\n\nVharos rassemble les anciens rois du monde. Les morts, les maudits, les oubliés. Il bâtit une cour."},
m5_6:{text:"La cheikha Nefret règne sur l'Oasis de Khepri dans le Désert de Sunscar. Son peuple garde les tombes des Titans, comme le mien garde les tertres. Si la Couronne a marchandé là-bas le pouvoir d'un roi mort, elle doit l'entendre de ta bouche.\n\nPorte la tablette au sud. Et, sudiste : les Pics se souviendront de toi. Ce n'est pas rien.",done:"(La cheikha Nefret lit la tablette deux fois, puis la pose avec une grande douceur.) Sekhmar. Le grand prêtre du Roi-Titan. La vieille histoire était donc un avertissement, pas une légende."},
d_vault:{text:"Le jarl Hrimgar le Givré trône sur son siège de glace dans la Chambre forte de Rimehold, sous la montagne. Chaque draugr des Pics lui obéit, et tant qu'il durera, les tertres continueront de s'ouvrir.\n\nIl détient la clé gelée des tombes du désert, le marché que Vharos a conclu avec lui. Descends dans la Chambre forte de Rimehold et achève le parjure. Apporte du feu, des potions, et ne reste pas immobile.",done:"La montagne a gémi quand il est tombé ; nous l'avons entendu dans la salle. La neige des cols n'est plus que de la neige. Rimeholt te doit une dette que nous chanterons pendant cent ans."},
});

qadd('it',{
m4_1:{text:"(Madre Ilse stende i progetti della capitana Vex su un tavolo umido.)\n\nMacchine della peste. Ventri di rame, tubi d'osso, una fornace che esala malattia invece di fumo. Ecco cosa preparano le streghe nel profondo della palude.\n\nSono Madre Ilse. Gestisco la casa di cura di Bogmere, e ultimamente è piena. La mia gente tossisce acqua nera. Le streghe della palude hanno giurato fedeltà a Madre Morrow, e Madre Morrow l'ha giurata al Re Cavo.",done:"Hai attraversato i canneti per degli sconosciuti. Vex aveva scritto che l'avresti fatto. Riposa un momento, poi aiutami a far respirare Bogmere."},
m4_2:{text:"I predatori della palude restavano nelle pozze profonde. Ora risalgono di notte dai nostri pozzi, e dove passano l'acqua diventa grigia e acida.\n\nRipulisci i pozzi del villaggio e i sentieri intorno a Bogmere. Brucia ciò che resta di loro; non lasciare che ti tocchi la pelle.",done:"I pozzi hanno smesso di gorgogliare. La vecchia Fenna ha bevuto dal suo stamattina e non ha tossito nemmeno una volta. Piccole grazie, e le accetto tutte."},
m4_3:{text:"Una cosa strana: i crocolischi bevono l'acqua della peste e ci ingrassano. Qualunque cosa preparino le streghe, la loro bile la combatte.\n\nPortami bile di crocolisco. Con essa posso preparare un tonico per i malati, e forse imparare a spezzare la peste stessa. Attento alle fauci; sono più veloci di quanto sembrino.",done:"Il tonico funziona. Non è una cura, ma la febbre cala in mezza giornata invece di uccidere in tre. Oggi hai salvato più vite di quante saprai mai."},
m4_4:{text:"I miei esploratori hanno trovato i calderoni: un cerchio nella Conca di Lucestrega, ognuno grande come un carro, ognuno ribollente di verde. Le streghe ne riempiono giare d'argilla e le mandano a sud e a est su barche di contrabbandieri.\n\nRovescia ogni calderone. Che la palude inghiotta la loro pozione prima che un'altra giara lasci l'acquitrino.",done:"La Conca di Lucestrega brucia fredda e verde stanotte. I contrabbandieri sono venuti per le giare e hanno trovato solo fango. La congrega saprà che sei stato tu."},
m4_5:{text:"La strega più vecchia, Nonna Putredine, tiene corte alla Palude della Forca. Un tempo era levatrice a Bogmere. Ha fatto nascere mezzo villaggio, e ora ne avvelena i figli.\n\nCustodisce qualcosa che la congrega stima più della propria vita. Finiscila e portami ciò che custodiva.",done:"Una chiave di ghiaccio nero che non si scioglie mai, incisa con rune dell'estremo nord. I Picchi Zannagelo: Rimehold.\n\nLe streghe scambiano peste per qualcosa lassù. Qualcosa di antico, freddo e molto paziente."},
m4_6:{text:"La jarl Brynja governa Rimeholt nei Picchi Zannagelo. Il suo popolo custodisce quelle montagne da prima che il Regno avesse un nome. Se qualcuno sa per quale serratura è stata intagliata questa chiave, è lei.\n\nPortala a nord. Copriti bene, e non fidarti della neve dove è troppo liscia. Bogmere resisterà. Ora abbiamo un tonico, grazie a te.",done:"(La jarl Brynja rigira la chiave nera nella mano coperta di maglia, e il fuoco della sala vacilla.) Dove l'hai trovata? No. Non dirmelo ancora. Prima siediti accanto al fuoco."},
d_chapel:{text:"Madre Morrow in persona si nasconde sotto la palude, nella Cappella Annegata: una chiesa sprofondata nell'acquitrino cento anni fa con tutta la congregazione dentro.\n\nLì prepara la peste, e la parrocchia annegata la serve ancora. Ogni giara di malattia che lascia Mirewood nasce nel suo calderone.\n\nScendi nella Cappella Annegata e finisci la Strega della Palude. Porta il mio tonico e molte pozioni. L'aria laggiù è veleno.",done:"La palude profuma di pioggia stamattina, non di marcio. I malati si mettono a sedere nei loro letti. Ciò che hai trovato in quella cappella è tuo, e con esso la gratitudine di Bogmere."},
m5_1:{text:"La chiave di Hrimgar. (La jarl Brynja non la lascia.) Il nonno di mio nonno sigillò quello spergiuro nel ghiaccio sotto Rimehold. Il jarl Hrimgar vendette il proprio popolo all'inverno per una corona che non si sarebbe mai sciolta.\n\nLa Corona Cava lo ha trovato. Le streghe gli scambiano peste per i suoi morti congelati, e ora i tumuli si aprono e i draugr camminano di nuovo.\n\nBenvenuto a Rimeholt, sudista. Arrivi in un brutto momento.",done:"Non hai sussultato al nome. Bene. I miei huscarl lo sussurrano come una maledizione. Ci servirà qualcuno che non sussurri."},
m5_2:{text:"I draugr escono dai tumuli al crepuscolo: morti congelati in maglie arrugginite, i vecchi huscarl di Hrimgar. Non si stancano, non sentono il freddo e ricordano ogni strada fino alla nostra sala.\n\nAbbattili. Spaccagli il cranio; è il ghiaccio dentro che li muove.",done:"La guardia notturna non ha visto draugr sui passi stanotte. La prima notte tranquilla in un mese. Gli scaldi vorranno comporre una canzone su di te. Cerca di impedirlo."},
m5_3:{text:"I fuochi di guardia intorno a Rimeholt tengono fuori i morti. Si stanno spegnendo, e la legna comune non basta. I nostri sciamani bruciano cuori di yeti; un cuore di yeti arde tanto da fondere la pietra.\n\nCaccia gli yeti nelle nevi alte e portami i loro cuori. È crudele, ma i nostri bambini dormono dentro quei fuochi.",done:"I fuochi di guardia ruggiscono di nuovo. Gli sciamani dicono che i morti non possono più attraversarli, nemmeno quelli antichi. Ci hai comprato l'inverno."},
m5_4:{text:"Le pietre runiche che sigillavano il Tumulo Ghiacciato sono state rubate, trascinate fuori dai draugr e sparse nella neve. Senza di esse, ogni tomba dei Picchi si aprirà.\n\nRecupera le pietre runiche dal Tumulo Ghiacciato. I nostri sciamani incideranno di nuovo i sigilli.",done:"Sei pietre, ogni runa intatta. Gli sciamani hanno iniziato a incidere. Il Tumulo è silenzioso stanotte."},
m5_5:{text:"Lo scaldo di Hrimgar vive ancora, se così si può dire. Sta al Passo del Trono di Ghiaccio e canta le vecchie canzoni dell'inverno, e ogni strofa risveglia un altro guerriero morto.\n\nZittisci il suo canto. Portami ciò che porta con sé; uno scaldo porta sempre i segreti del suo re.",done:"Una tavoletta di pietra solare, tiepida perfino qui, dai deserti dell'estremo sud. Scrittura del deserto: una promessa. A Hrimgar fu promessa una tomba accanto al Re Titano, un posto tra gli dèi, se avesse dato il suo inverno alla Corona Cava.\n\nVharos sta radunando gli antichi re del mondo. I morti, i maledetti, i dimenticati. Sta costruendo una corte."},
m5_6:{text:"La sceicca Nefret governa l'Oasi di Khepri nel Deserto di Sunscar. Il suo popolo custodisce le tombe dei Titani, come il mio custodisce i tumuli. Se la Corona ha contrattato laggiù per il potere di un re morto, deve sentirlo da te.\n\nPorta la tavoletta a sud. E, sudista: i Picchi si ricorderanno di te. Non è poco.",done:"(La sceicca Nefret legge la tavoletta due volte, poi la posa con grande delicatezza.) Sekhmar. Il sommo sacerdote del Re Titano. Dunque la vecchia storia era un avvertimento, non una leggenda."},
d_vault:{text:"Il jarl Hrimgar il Gelido siede sul suo trono di ghiaccio nella Cripta di Rimehold, sotto la montagna. Ogni draugr dei Picchi gli obbedisce, e finché resiste, i tumuli continueranno ad aprirsi.\n\nCustodisce la chiave ghiacciata delle tombe del deserto, il patto che Vharos ha stretto con lui. Scendi nella Cripta di Rimehold e finisci lo spergiuro. Porta fuoco, porta pozioni e non restare fermo.",done:"La montagna ha gemuto quando è caduto; l'abbiamo sentito nella sala. La neve sui passi è di nuovo solo neve. Rimeholt ti deve un debito che canteremo per cent'anni."},
});

qadd('pt',{
m4_1:{text:"(Madre Ilse espalha as plantas da capitã Vex sobre uma mesa úmida.)\n\nMáquinas de praga. Barrigas de cobre, tubos de osso, uma fornalha que exala doença em vez de fumaça. Então é isso que as bruxas preparam no fundo do pântano.\n\nSou a Madre Ilse. Cuido da casa de cura de Bogmere, e ultimamente ela está cheia. Meu povo tosse água negra. As bruxas do pântano juraram lealdade à Madre Morrow, e a Madre Morrow jurou lealdade ao Rei Oco.",done:"Você atravessou os juncos por estranhos. Vex escreveu que você faria isso. Descanse um momento, depois me ajude a manter Bogmere respirando."},
m4_2:{text:"Os espreitadores do brejo ficavam nas poças fundas. Agora sobem à noite pelos nossos poços, e por onde passam a água fica cinza e azeda.\n\nLimpe os poços da vila e os caminhos ao redor de Bogmere. Queime o que restar deles; não deixe tocar sua pele.",done:"Os poços pararam de borbulhar. A velha Fenna bebeu do dela esta manhã e não tossiu nenhuma vez. Pequenas misericórdias, e aceito todas."},
m4_3:{text:"Algo estranho: os crocoliscos bebem a água da praga e engordam com ela. Seja o que for que as bruxas preparam, a bile deles o combate.\n\nTraga-me bile de crocolisco. Com ela posso fazer um tônico para os doentes, e talvez aprender a quebrar a própria praga. Cuidado com as mandíbulas; são mais rápidas do que parecem.",done:"O tônico funciona. Não é uma cura, mas a febre cede em meio dia em vez de matar em três. Hoje você salvou mais vidas do que jamais saberá."},
m4_4:{text:"Meus batedores acharam os caldeirões: um círculo deles na Depressão de Luzbruxa, cada um do tamanho de uma carroça, cada um borbulhando verde. As bruxas enchem jarros de barro e os mandam para o sul e o leste em barcos de contrabandistas.\n\nVire cada caldeirão. Que o brejo engula a poção antes que outro jarro deixe o pântano.",done:"A Depressão de Luzbruxa queima fria e verde esta noite. Os contrabandistas vieram buscar os jarros e só acharam lama. O conciliábulo saberá que foi você."},
m4_5:{text:"A bruxa mais velha, Vovó Podridão, mantém sua corte no Brejo da Forca. Ela foi parteira em Bogmere. Trouxe ao mundo metade da vila, e agora envenena os filhos deles.\n\nEla guarda algo que o conciliábulo valoriza mais que a própria vida. Acabe com ela e traga-me o que ela guardava.",done:"Uma chave de gelo negro que nunca derrete, entalhada com runas do extremo norte. Os Picos Presa Gélida: Rimehold.\n\nAs bruxas trocam praga por algo lá. Algo antigo, frio e muito paciente."},
m4_6:{text:"A jarl Brynja governa Rimeholt nos Picos Presa Gélida. Seu povo guarda aquelas montanhas desde antes de o Reino ter nome. Se alguém sabe para qual fechadura esta chave foi talhada, é ela.\n\nLeve-a para o norte. Agasalhe-se, e não confie na neve onde ela está lisa demais. Bogmere resistirá. Agora temos um tônico, graças a você.",done:"(A jarl Brynja gira a chave negra na mão coberta de malha, e o fogo do salão vacila.) Onde você achou isto? Não. Não me diga ainda. Sente-se primeiro junto ao fogo."},
d_chapel:{text:"A própria Madre Morrow se esconde sob o pântano, na Capela Afogada: uma igreja que afundou no brejo há cem anos com toda a congregação dentro.\n\nÉ lá que ela prepara a praga, e a paróquia afogada ainda a serve. Cada jarro de doença que deixa Mirewood começa no caldeirão dela.\n\nDesça à Capela Afogada e acabe com a Bruxa do Brejo. Leve meu tônico e muitas poções. O ar lá embaixo é veneno.",done:"O pântano cheira a chuva esta manhã, não a podridão. Os doentes estão se sentando nas camas. O que você achou naquela capela é seu, e com isso a gratidão de Bogmere."},
m5_1:{text:"A chave de Hrimgar. (A jarl Brynja não a solta.) O avô do meu avô selou aquele perjuro no gelo sob Rimehold. O jarl Hrimgar vendeu o próprio povo ao inverno por uma coroa que nunca derreteria.\n\nA Coroa Oca o encontrou. As bruxas trocam praga pelos mortos congelados dele, e agora os túmulos se abrem e os draugr caminham de novo.\n\nBem-vindo a Rimeholt, sulista. Você chegou numa hora ruim.",done:"Você não vacilou ao ouvir o nome. Ótimo. Meus huscarls o sussurram como uma maldição. Vamos precisar de alguém que não sussurre."},
m5_2:{text:"Os draugr saem dos túmulos ao anoitecer: mortos congelados em cotas enferrujadas, os velhos huscarls de Hrimgar. Não se cansam, não sentem frio e lembram cada caminho até o nosso salão.\n\nDerrube-os. Quebre-lhes o crânio; é o gelo lá dentro que os move.",done:"A vigília noturna não viu draugr nos desfiladeiros ontem à noite. A primeira noite tranquila em um mês. Os escaldos vão querer fazer uma canção sobre você. Tente impedi-los."},
m5_3:{text:"Os fogos de guarda ao redor de Rimeholt mantêm os mortos do lado de fora. Estão se apagando, e lenha comum não basta. Nossos xamãs queimam corações de yeti; um coração de yeti arde o bastante para derreter pedra.\n\nCace os yetis nas neves altas e traga-me seus corações. É cruel, mas nossas crianças dormem dentro desses fogos.",done:"Os fogos de guarda rugem de novo. Os xamãs dizem que os mortos não conseguem mais cruzá-los, nem mesmo os antigos. Você nos comprou o inverno."},
m5_4:{text:"As pedras rúnicas que selavam o Túmulo Congelado foram roubadas, arrastadas pelos draugr e espalhadas pela neve. Sem elas, cada tumba dos Picos se abrirá.\n\nRecupere as pedras rúnicas do Túmulo Congelado. Nossos xamãs entalharão os selos de novo.",done:"Seis pedras, cada runa intacta. Os xamãs começaram a entalhar. O Túmulo está em silêncio esta noite."},
m5_5:{text:"O escaldo de Hrimgar ainda vive, se é que se pode chamar assim. Ele está no Desfiladeiro do Trono de Gelo cantando as velhas canções do inverno, e cada verso desperta outro guerreiro morto.\n\nSilencie a canção dele. Traga-me o que ele carregar; um escaldo sempre carrega os segredos do seu rei.",done:"Uma tábua de pedra solar, morna mesmo aqui, dos desertos do extremo sul. Escrita do deserto: uma promessa. Prometeram a Hrimgar uma tumba ao lado do Rei Titã, um lugar entre os deuses, se ele desse seu inverno à Coroa Oca.\n\nVharos está reunindo os velhos reis do mundo. Os mortos, os amaldiçoados, os esquecidos. Ele está construindo uma corte."},
m5_6:{text:"A xeica Nefret governa o Oásis de Khepri no Deserto Sunscar. Seu povo guarda as tumbas dos Titãs, como o meu guarda os túmulos. Se a Coroa barganhou lá pelo poder de um rei morto, ela precisa ouvir isso de você.\n\nLeve a tábua para o sul. E, sulista: os Picos se lembrarão de você. Isso não é pouca coisa.",done:"(A xeica Nefret lê a tábua duas vezes e depois a pousa com muito cuidado.) Sekhmar. O sumo sacerdote do Rei Titã. Então a velha história era um aviso, não uma lenda."},
d_vault:{text:"O jarl Hrimgar, o Congelado, senta-se em seu trono de gelo na Câmara de Rimehold, sob a montanha. Cada draugr dos Picos lhe obedece, e enquanto ele resistir, os túmulos continuarão se abrindo.\n\nEle guarda a chave congelada das tumbas do deserto, o acordo que Vharos fez com ele. Desça à Câmara de Rimehold e acabe com o perjuro. Leve fogo, leve poções e não fique parado.",done:"A montanha gemeu quando ele caiu; ouvimos no salão. A neve nos desfiladeiros voltou a ser só neve. Rimeholt lhe deve algo que cantaremos por cem anos."},
});

qadd('de',{
m6_1:{text:"(Scheicha Nefret legt die Sonnensteintafel auf ein Kissen, als wäre sie ein schlafendes Kind.)\n\nDer Sand erinnert sich an die Titanen. Sie kämpften hier gegen die ersten Götter und starben hier, und ihre Knochen sind die Dünen, die du durchquert hast. Mein Volk bewacht ihre Gräber seit dreitausend Jahren.\n\nSekhmar war der Hohepriester des Titanenkönigs. Er schwor, eines Tages die Kraft seines Herrn zu trinken und als Gott zu wandeln. Die Hohle Krone hat ihm diesen Tag versprochen. Und nun erwachen die Toten der Wüste, um ihm zu dienen.",done:"Du hast das Geheimnis eines toten Jarls um die halbe Welt getragen, um Fremde zu warnen. Die Oase vergisst so etwas nicht. Trink, ruh dich aus, und dann jagen wir."},
m6_2:{text:"Die Dünenskorpione sind riesig und dreist geworden. Sie überfallen unsere Wasserkarawanen an den Brunnen, und ohne Karawanen verdurstet die Oase, bevor der Pharao auch nur die Hand hebt.\n\nSäubere die Karawanenwege von Skorpionen. Jede Karawane, die ankommt, bedeutet hundert weitere Tage Kampf.",done:"Vier Karawanen kamen im Morgengrauen an, die Kamele sangen nach Wasser. Meine Kinder liefen ihnen entgegen. Das hast du heute erkauft."},
m6_3:{text:"Die Wüstenschakale sind nicht wild. Sieh genau hin: Jeder trägt ein Halsband aus getriebenem Gold, geprägt mit Sekhmars Sonne. Sie sind seine Hunde, seine Augen in den Dünen. Wo sie heulen, folgen seine Mumien.\n\nBring mir ihre Halsbänder. Jedes Halsband, das wir einschmelzen, ist ein Auge, das wir ausstechen.",done:"Sechs Halsbänder, und sechs Augen weniger. Die Schakale heulen, aber heute Nacht antwortet nichts. Der Pharao ist auf unserer Seite der Dünen blind."},
m6_4:{text:"Im Brustkorb des Titanen mahlt der Kult die alten Knochen zu Staub. Titanenstaub, vermischt mit Hohler Zauberei, lässt den Sand sich erheben und gehen: Die Kolosse, die du gesehen hast, sind daraus gemacht.\n\nSammle die Knochensplitter, bevor sie zermahlen werden. Wir begraben sie in heiliger Erde, wo kein Priester sie erreicht.",done:"Die Splitter sind in weißes Leinen gehüllt und unter dem Schrein der Oase begraben. Die Titanen schlafen heute Nacht etwas ruhiger. Ich auch."},
m6_5:{text:"Sandwesir Ashkar ist Sekhmars rechte Hand: eine Mumie, die im Leben klug war und im Tod grausamer ist. Er arbeitet am Obelisken von Sekhmar und meißelt das Ritual, das seinen Herrn in voller Stärke erwecken soll.\n\nHalte das Ritual auf. Vernichte Ashkar und bring mir, was er bewacht.",done:"Eine Sternkarte, auf Haifischhaut gemalt. Aber die Sterne stimmen nicht... nein. Sie sind vom Meeresgrund aus gesehen. Das ist eine Karte nach Thalassa, der versunkenen Stadt.\n\nDie Krone hat Verbündete in jedem Winkel der Welt: im Dschungel, am Himmel, in der Tiefe. Vharos stellt kein Heer auf. Er erweckt jedes alte Übel, das die Menschheit je begraben hat."},
m6_6:{text:"Hafenmeister Kael hält Port Nerei an der Westküste, wo das Meer vor tausend Jahren Thalassa verschlang. Wenn jemand einer Karte vom Meeresgrund folgen kann, dann er.\n\nDie Oase verdankt dir ihr Wasser und ihre Kinder. Geh nach Westen, Träger der Aura. Der Sand wird sich an deinen Namen erinnern.",done:"(Hafenmeister Kael rollt die Haifischhautkarte aus und verstummt.) Thalassa. Meine Großmutter schwor, dass die Glocken dort unten noch läuten. In letzter Zeit schwören es auch meine Seeleute."},
d_tomb:{text:"Unter den Dünen liegt das Grab des Titanenkönigs, und in seiner tiefsten Halle trinkt Sekhmar, der Sandpharao, die Kraft der gefallenen Titanen, einen Krug Staub nach dem anderen.\n\nWenn er genug getrunken hat, wird er als Gott aus dem Grab treten, und jede Mumie der Wüste wird hinter ihm marschieren.\n\nSteig in das Grab hinab, bevor dieser Tag kommt. Brich den Pharao, und lass den Titanenkönig ruhen.",done:"Der Sand hörte auf, sich zu bewegen, als er fiel; die Dünen sind wieder nur Dünen. Die Oase wird deinen Namen neben die Titanen meißeln. Wenige Sterbliche stehen dort."},
d_ziggurat:{text:"Ein Diener der Krone bleibt noch in der Wüste. Azhurak, ein Dschinn der alten Stürme, wurde von Hohlen Priestern in der Zikkurat der Stürme angekettet. Sie peitschen seine Wut zu Glasstürmen, die ganze Karawanen lebendig begraben.\n\nEr war nicht immer grausam. Doch so gefesselt kann er nur zerstören. Erklimm die Zikkurat und beende sein Leiden, und mit ihm das der Wüste.",done:"Die Glasstürme haben aufgehört. Letzte Nacht wehte der Wind sanft und warm über die Oase, und manche von uns schwören, es klang wie ein Seufzer der Erleichterung."},
m7_1:{text:"Thalassa versank vor tausend Jahren. Sie war die stolzeste Stadt der Menschen: Sie bauten Glocken, die die Gezeiten rufen konnten. Als das Meer sie nahm, verstummten die Glocken.\n\nJetzt läuten sie nachts wieder. Und meine Seeleute gehen lächelnd zum Ufer hinunter und gehen weiter, bis sich das Wasser über ihren Köpfen schließt.\n\nEtwas ruft sie. Deine Karte sagt, die Hohle Krone weiß, was.",done:"Du brauchst ein Schiff und eine Mannschaft, die die Tiefe nicht fürchtet. Zum Glück habe ich eins von beiden. Suchen wir das andere."},
m7_2:{text:"Die Riffkrabben sind aus dem Flachwasser gekommen, groß wie Fässer, und sie gehen nicht wieder. Sie zerschneiden unsere Netze, versenken unsere Boote und ziehen die Fischer ins Wasser.\n\nVertreib sie von den Docks und vom Strand. Port Nerei kann nicht gegen die Tiefe kämpfen, wenn es nicht einmal fischen kann.",done:"Die Netze kamen heute Morgen voll herauf. Die Fischweiber kochen Krabben für den ganzen Hafen, und du bist eingeladen, ob du willst oder nicht."},
m7_3:{text:"Die Naga-Krieger bewachen die versunkenen Straßen nach Thalassa. Ihre Schuppen sind härter als Stahl und leichter als Leder. Meine Schiffbauer sagen, ein damit beplankter Rumpf könnte dorthin segeln, wohin noch kein Schiff gesegelt ist: nach unten.\n\nBring mir Nagaschuppen. Wir bauen ein Schiff, das deiner Karte folgen kann.",done:"Der Rumpf ist beplankt. Die Schiffbauer nennen sie die Laterne der Tiefe. Sie wird halten, schwören sie. Ich hoffe, sie haben recht."},
m7_4:{text:"Die Glocken am Glockenriff läuten nachts, und jedes Mal geht ein weiterer Seemann ins Meer. Sie wurden gemacht, um die Gezeiten zu rufen. Jetzt benutzt jemand sie, um Menschen zu rufen.\n\nBring die ertrunkenen Glocken zum Schweigen. Kapp die Seile, zerbrich die Klöppel, was immer nötig ist.",done:"Letzte Nacht war es still. Kein einziger Seemann ging ins Meer. Der alte Merrit saß bis zum Morgengrauen auf den Docks, nur um der Stille zu lauschen."},
m7_5:{text:"Mein alter Kapitän, Brineheart, ging vor zwanzig Jahren mit seinem Schiff in der Wrackbucht unter. Jetzt kommt er nachts aus der Bucht und führt die Ertrunkenen gegen meinen Hafen. Er war mein Freund.\n\nErlöse ihn. Was jetzt sein Gesicht trägt, ist nicht er. Bring mir, was er bei sich trägt.",done:"Eine Perle, in die ein zusammengerollter Wyrm geätzt ist. Brineheart brachte sie zu jemandem im Dschungel: Die Nagakönigin handelt mit den Wyrms des Wyrmwalds.\n\nDas Meer, der Dschungel, der Himmel... Vharos bindet sie alle zusammen. Wenn er fertig ist, bleibt der Menschheit kein Ort mehr, an dem sie stehen kann."},
m7_6:{text:"Wächter Okonkwo bewacht Vinehollow am Rand des Wyrmwald-Dschungels. Wenn die Nagakönigin mit den Wyrms handelt, muss er es wissen, bevor sich auch der Dschungel gegen uns wendet.\n\nBring die Perle nach Osten. Und danke für Brineheart. Ich hätte es nicht selbst gekonnt. Port Nerei wird eine Laterne für dich brennen lassen.",done:"(Wächter Okonkwo hält die Perle ins grüne Licht des Dschungels.) Verdigrax' Wyrms... darum schläft der grüne Gott so schlecht. Komm. Der Dschungel hört zu."},
d_abyss:{text:"Königin Thalassyr herrscht über den Abyssischen Tempel am Grund der versunkenen Stadt. Sie ist es, die die Glocken läutet. Sie singt die Ertrunkenen wach, und sie hat dem Hohlen König das ganze Meer versprochen: jede Küste, jeden Hafen, jedes Schiff.\n\nDie Laterne der Tiefe ist bereit. Steig hinab in den Abyssischen Tempel und bring die Nagakönigin für immer zum Schweigen.",done:"Das Meer ist ruhig, und die Glocken schweigen für immer. Meine Seeleute sind letzte Nacht zu ihren Familien heimgekehrt. Port Nerei wird deine Geschichte erzählen, solange es Schiffe gibt."},
});

qadd('es',{
m6_1:{text:"(La jequesa Nefret coloca la tablilla de piedra solar sobre un cojín, como si fuera un niño dormido.)\n\nLas arenas recuerdan a los titanes. Aquí lucharon contra los primeros dioses y aquí murieron, y sus huesos son las dunas que cruzaste. Mi pueblo ha guardado sus tumbas durante tres mil años.\n\nSekhmar era el sumo sacerdote del Rey Titán. Juró que un día bebería la fuerza de su señor y caminaría como un dios. La Corona Hueca le ha prometido ese día. Y ahora los muertos del desierto despiertan para servirle.",done:"Cargaste el secreto de un jarl muerto por medio mundo para avisar a desconocidos. El Oasis no olvida algo así. Bebe, descansa, y luego cazaremos."},
m6_2:{text:"Los escorpiones de las dunas se han vuelto enormes y osados. Emboscan nuestras caravanas de agua en los pozos, y si las caravanas no llegan, el Oasis morirá de sed antes de que el faraón mueva un dedo.\n\nLimpia de escorpiones las rutas de las caravanas. Cada caravana que llega son cien días más de lucha.",done:"Cuatro caravanas llegaron al alba, con los camellos cantando por agua. Mis hijos corrieron a recibirlas. Eso es lo que compraste hoy."},
m6_3:{text:"Los chacales del desierto no son salvajes. Mira bien: cada uno lleva un collar de oro batido, marcado con el sol de Sekhmar. Son sus perros, sus ojos en las dunas. Donde aúllan, sus momias los siguen.\n\nTráeme sus collares. Cada collar que fundimos es un ojo que le arrancamos.",done:"Seis collares, y seis ojos menos. Los chacales aúllan, pero esta noche nada responde. El faraón está ciego en nuestro lado de las dunas."},
m6_4:{text:"En el Costillar del Titán, el culto muele los viejos huesos hasta hacerlos polvo. El polvo de titán mezclado con hechicería Hueca hace que la arena se alce y camine: los colosos que has visto están hechos de él.\n\nRecoge los fragmentos de hueso antes de que los muelan. Los enterraremos en tierra sagrada, donde ningún sacerdote pueda alcanzarlos.",done:"Los fragmentos están envueltos en lino blanco y enterrados bajo el santuario del Oasis. Los titanes duermen un poco mejor esta noche. Y yo también."},
m6_5:{text:"El visir de arena Ashkar es la mano derecha de Sekhmar: una momia que fue astuta en vida y es más cruel en la muerte. Trabaja en el Obelisco de Sekhmar, tallando el ritual que despertará a su señor con toda su fuerza.\n\nDetén el ritual. Destruye a Ashkar y tráeme lo que guarde.",done:"Una carta estelar pintada sobre piel de tiburón. Pero las estrellas están mal... no. Están vistas desde debajo del mar. Es un mapa hacia Thalassa, la ciudad ahogada.\n\nLa Corona tiene aliados en cada rincón del mundo: la selva, el cielo, el abismo. Vharos no está reuniendo un ejército. Está despertando cada viejo mal que la humanidad enterró."},
m6_6:{text:"El capitán de puerto Kael guarda Port Nerei en la costa oeste, donde el mar se tragó Thalassa hace mil años. Si alguien puede seguir una carta trazada desde el fondo del mar, es él.\n\nEl Oasis te debe su agua y sus hijos. Ve al oeste, Portador del Aura. Las arenas recordarán tu nombre.",done:"(El capitán de puerto Kael desenrolla la carta de piel de tiburón y se queda callado.) Thalassa. Mi abuela juraba que las campanas aún suenan allí abajo. Últimamente, también lo juran mis marineros."},
d_tomb:{text:"Bajo las dunas yace la Tumba del Rey Titán, y en su sala más profunda Sekhmar, el Faraón de Arena, bebe la fuerza de los titanes caídos, un tarro de polvo cada vez.\n\nCuando haya bebido bastante, saldrá de la tumba como un dios, y cada momia del desierto marchará tras él.\n\nBaja a la tumba antes de que llegue ese día. Quiebra al faraón y deja descansar al Rey Titán.",done:"La arena dejó de moverse cuando cayó; las dunas vuelven a ser solo dunas. El Oasis tallará tu nombre junto a los titanes. Pocos mortales están allí."},
d_ziggurat:{text:"Queda un siervo más de la Corona en el desierto. Azhurak, un djinn de las viejas tormentas, fue encadenado por sacerdotes Huecos dentro del Zigurat de las Tormentas. Azotan su furia hasta convertirla en tormentas de vidrio que entierran caravanas enteras.\n\nNo siempre fue cruel. Pero encadenado así, solo puede destruir. Sube al Zigurat y pon fin a su sufrimiento, y al del desierto con él.",done:"Las tormentas de vidrio han terminado. Anoche el viento sopló suave y cálido sobre el Oasis, y algunos juramos que sonó como un suspiro de alivio."},
m7_1:{text:"Thalassa se hundió hace mil años. Era la ciudad más orgullosa de los hombres: construyeron campanas capaces de llamar a las mareas. Cuando el mar se la llevó, las campanas callaron.\n\nAhora vuelven a sonar de noche. Y mis marineros bajan a la orilla sonriendo, y siguen caminando hasta que el agua se cierra sobre sus cabezas.\n\nAlgo los está llamando. Tu carta dice que la Corona Hueca sabe qué.",done:"Necesitarás un barco y una tripulación que no tema al abismo. Por suerte, tengo una de las dos cosas. Busquemos la otra."},
m7_2:{text:"Los cangrejos del arrecife han salido de las aguas bajas, grandes como barriles, y no se van. Cortan nuestras redes, hunden nuestros esquifes y arrastran a los pescadores al agua.\n\nLímpialos del muelle y de la playa. Port Nerei no puede luchar contra el abismo si ni siquiera puede pescar.",done:"Las redes salieron llenas esta mañana. Las pescaderas están cocinando cangrejo para todo el puerto, y estás invitado, te guste o no."},
m7_3:{text:"Los guerreros naga guardan los caminos ahogados hacia Thalassa. Sus escamas son más duras que el acero y más ligeras que el cuero. Mis carpinteros de ribera dicen que un casco forrado con ellas podría navegar adonde ningún barco ha navegado: hacia abajo.\n\nTráeme escamas de naga. Estamos construyendo un barco que pueda seguir tu carta.",done:"El casco está forrado. Los carpinteros la llaman el Farol de las Profundidades. Aguantará, juran. Espero que tengan razón."},
m7_4:{text:"Las campanas del Arrecife de las Campanas suenan de noche, y cada vez que suenan, otro marinero se adentra en el mar. Se hicieron para llamar a las mareas. Ahora alguien las usa para llamar a personas.\n\nSilencia las campanas ahogadas. Corta las cuerdas, rompe los badajos, lo que haga falta.",done:"Anoche hubo silencio. Ni un marinero entró en el mar. El viejo Merrit se sentó en el muelle hasta el alba, solo para escuchar la calma."},
m7_5:{text:"Mi viejo capitán, Brineheart, se hundió con su barco en la Cala del Naufragio hace veinte años. Ahora sale de la cala por las noches, guiando a los ahogados contra mi puerto. Era mi amigo.\n\nLibéralo. Lo que lleva ahora su rostro no es él. Tráeme lo que lleve consigo.",done:"Una perla grabada con un dragón enroscado. Brineheart la llevaba a alguien en la selva: la Reina Naga comercia con los dragones del Bosque Wyrm.\n\nEl mar, la selva, el cielo... Vharos los está atando todos. Cuando termine, no quedará lugar donde la humanidad pueda mantenerse en pie."},
m7_6:{text:"El guardián Okonkwo protege Vinehollow, al borde de la Selva Wyrm. Si la Reina Naga comercia con los dragones, él debe saberlo antes de que la selva también se vuelva contra nosotros.\n\nLleva la perla al este. Y gracias por Brineheart. Yo no podía hacerlo. Port Nerei mantendrá un farol encendido para ti.",done:"(El guardián Okonkwo alza la perla hacia la luz verde de la selva.) Los dragones de Verdigrax... así que por eso el dios verde duerme tan mal. Ven. La selva está escuchando."},
d_abyss:{text:"La reina Thalassyr gobierna el Templo Abisal en el fondo de la ciudad ahogada. Ella es quien toca las campanas. Canta para despertar a los ahogados, y ha prometido todo el mar al Rey Hueco: cada costa, cada puerto, cada barco.\n\nEl Farol de las Profundidades está listo. Baja al Templo Abisal y silencia para siempre a la Reina Naga.",done:"El mar está en calma y las campanas callan para siempre. Mis marineros volvieron anoche con sus familias. Port Nerei contará tu historia mientras haya barcos."},
});

qadd('fr',{
m6_1:{text:"(La cheikha Nefret pose la tablette de pierre solaire sur un coussin, comme un enfant endormi.)\n\nLes sables se souviennent des titans. Ils ont combattu les premiers dieux ici et y sont morts, et leurs os sont les dunes que tu as traversées. Mon peuple garde leurs tombes depuis trois mille ans.\n\nSekhmar était le grand prêtre du Roi-Titan. Il a juré qu'un jour il boirait la force de son maître et marcherait comme un dieu. La Couronne Creuse lui a promis ce jour. Et maintenant les morts du désert s'éveillent pour le servir.",done:"Tu as porté le secret d'un jarl mort à travers la moitié du monde pour prévenir des inconnus. L'Oasis n'oublie pas cela. Bois, repose-toi, puis nous chasserons."},
m6_2:{text:"Les scorpions des dunes sont devenus énormes et hardis. Ils tendent des embuscades à nos caravanes d'eau aux puits, et sans caravanes l'Oasis mourra de soif avant même que le pharaon ne lève la main.\n\nNettoie les routes des caravanes. Chaque caravane qui arrive, ce sont cent jours de combat de plus.",done:"Quatre caravanes sont arrivées à l'aube, les chameaux chantant pour de l'eau. Mes enfants ont couru à leur rencontre. Voilà ce que tu as acheté aujourd'hui."},
m6_3:{text:"Les chacals du désert ne sont pas sauvages. Regarde bien : chacun porte un collier d'or battu, frappé du soleil de Sekhmar. Ce sont ses chiens, ses yeux dans les dunes. Là où ils hurlent, ses momies suivent.\n\nRapporte-moi leurs colliers. Chaque collier fondu est un œil crevé.",done:"Six colliers, et six yeux de moins. Les chacals hurlent, mais rien ne répond ce soir. Le pharaon est aveugle de notre côté des dunes."},
m6_4:{text:"Dans la Cage Thoracique du Titan, le culte broie les vieux os en poussière. La poussière de titan mêlée à la sorcellerie Creuse fait se lever et marcher le sable : les colosses que tu as vus en sont faits.\n\nRamasse les éclats d'os avant qu'ils ne soient broyés. Nous les enterrerons en terre sacrée, hors de portée des prêtres.",done:"Les éclats sont enveloppés de lin blanc et enterrés sous le sanctuaire de l'Oasis. Les titans dorment un peu mieux ce soir. Moi aussi."},
m6_5:{text:"Le vizir des sables Ashkar est la main droite de Sekhmar : une momie qui était rusée de son vivant et plus cruelle dans la mort. Il œuvre à l'Obélisque de Sekhmar, gravant le rituel qui éveillera son maître dans toute sa force.\n\nArrête le rituel. Détruis Ashkar et rapporte-moi ce qu'il garde.",done:"Une carte céleste peinte sur peau de requin. Mais les étoiles sont fausses... non. Elles sont vues depuis le fond de la mer. C'est une carte vers Thalassa, la cité engloutie.\n\nLa Couronne a des alliés dans chaque recoin du monde : la jungle, le ciel, les abysses. Vharos ne lève pas une armée. Il réveille chaque mal ancien que l'humanité a enterré."},
m6_6:{text:"Le maître de port Kael tient Port Nerei sur la côte ouest, là où la mer a englouti Thalassa il y a mille ans. Si quelqu'un peut suivre une carte tracée depuis le fond de la mer, c'est lui.\n\nL'Oasis te doit son eau et ses enfants. Va vers l'ouest, Porteur de l'Aura. Les sables se souviendront de ton nom.",done:"(Le maître de port Kael déroule la carte en peau de requin et se tait.) Thalassa. Ma grand-mère jurait que les cloches sonnent encore là-dessous. Ces temps-ci, mes marins le jurent aussi."},
