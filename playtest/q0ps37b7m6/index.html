d_cathedral:{text:"Erzbischof Nocturne predigt in der Schattenkathedrale, das Licht sei immer eine Lüge gewesen und die Lange Nacht eine Gnade: Wenn niemand aufwacht, leidet niemand. Jede verdunkelte Laterne wurde auf seinem Altar verdunkelt. Jeder Schläfer in Lanternfall ist einer seiner Bekehrten, ob er es wollte oder nicht.\n\nGeh in die Kathedrale und bring ihn zum Schweigen. Bring das Licht zurück, das er gestohlen hat.",done:"(Überall in Lanternfall, einer nach dem anderen, beginnen die Schläfer aufzuwachen.) Hörst du das? Türen, die aufgehen. Menschen, die Namen rufen. Elf Jahre Stille, und jetzt ist die Stadt laut. Es ist das Schönste, was ich je gehört habe."},
d_sanctum:{text:"Unter der Kristallsenke liegt das Heiligtum der Nachtmutter. Sie webt die Albträume, die ganze Städte in den Wahnsinn treiben, und ihr Netz ist die Tür des Hohlen Königs in jeden schlafenden Geist. Die Hunde sind ihre Träume. Die Schläfer sind ihre Fliegen.\n\nZerschneide das Netz. Steig ins Heiligtum hinab und mach der Nachtmutter ein Ende, und die Schläfer der Welt werden wieder ihre eigenen Träume träumen.",done:"Ich habe letzte Nacht geschlafen. Richtig geschlafen, zum ersten Mal seit Jahren, und ich habe von der Küche meiner Mutter geträumt. Ich hatte ihre Farbe vergessen. Danke, Träger der Aura. Wirklich."},
});
qadd('pt',{
m13_1:{text:"Essa lanterna foi acesa na Catedral Umbral. Os sacerdotes da Longa Noite pegam uma lanterna de Lanternfall, uma luz viva que alguém cuidava, e a viram do avesso. Para cada uma que fazem, uma das nossas se apaga.\n\nEm Shadowfell, luz é vida. Onde as lanternas se apagam, os pesadelos caminham, e as pessoas simplesmente param de acordar. Metade de Lanternfall dorme agora e não há como acordá-la.\n\nSou a última guardiã das lanternas. Há onze anos cuido das luzes sozinha. Você me ajuda a mantê-las acesas um pouco mais?",done:"(Wren acende uma velinha e a coloca entre vocês.) Pronto. Mais uma luz no mundo, e duas pessoas para cuidar dela. É assim que começa."},
m13_2:{text:"Os cães de pesadelo caçam na Estrada das Lanternas. São feitos dos sonhos dos adormecidos, e farejam a luz como lobos farejam sangue. Cada portador de lanterna que envio, eles alcançam antes da segunda milha.\n\nCace-os primeiro. Fique na luz e não olhe nos olhos deles por muito tempo. Você verá algo que teme, e eles cairão sobre você.",done:"Os portadores de lanternas voltaram da segunda milha, e da terceira. Um dos adormecidos do salão acordou esta manhã e pediu o café da manhã. Coisas pequenas. Aqui tudo são coisas pequenas."},
m13_3:{text:"As aranhas do vazio tecem uma seda que não reflete a luz. Os sacerdotes Ocos a usam para sufocar nossas lanternas. Mas, usada ao contrário, como pavio, a seda do vazio bebe a escuridão e a queima: uma chama que a Longa Noite não consegue apagar.\n\nTraga-me seda do vazio. Farei pavios para cada lanterna de Lanternfall.",done:"(Wren acende um pavio novo. A chama é prateada e pálida, e as sombras dos cantos recuam.) Olhe só isso. Que tentem apagá-la agora."},
m13_4:{text:"O Bosque Choroso era o último trecho da antiga linha de lanternas, a que ia de Lanternfall até a Última Luz. Os sacerdotes apagaram todas as lanternas de lá, e desde então nenhuma mensagem da Arconte chegou.\n\nAcenda de novo as lanternas apagadas do Bosque Choroso com os pavios novos. Se a linha voltar a brilhar, a Última Luz a verá e saberá que ainda estamos aqui.",done:"Está vendo aquilo, lá longe, além das árvores? Uma luz respondendo à nossa. A Última Luz ainda resiste. Onze anos procurando essa luz sem vê-la. Me dê um momento."},
m13_5:{text:"Há algo esperando na Travessia sem Lua. O Arauto Oco, a voz que caminha à frente de Vharos. Onde ele fala, a Longa Noite vem atrás: foi ele quem disse aos sacerdotes quais lanternas apagar primeiro.\n\nEle está esperando você. Quer que você vá. Não gosto disso. Mas ele guarda a travessia para a Última Luz, então não há outro caminho.",done:"(Wren pega o fragmento e quase o deixa cair; está tão frio que queima.) Um fragmento da própria Coroa Oca. O Arauto o carregava como uma relíquia sagrada. Era uma promessa: que o Rei está vindo, e que a Fenda está aberta.\n\nNão resta mais nada a limpar antes do fim, Portador da Aura. Só o fim."},
m13_6:{text:"Leve o fragmento à Arconte Solenne, na Última Luz. Ela defende a última fortaleza à beira da Fenda do Desfeito, e a defende há mais tempo do que eu cuido das lanternas. Se alguém sabe o que é Vharos e como detê-lo, é ela.\n\nSiga a linha de lanternas. Graças a você, está acesa até o fim. E quando tudo acabar, volte e me conte. Gostaria de ouvir isso de você.",done:"(Um soldado de armadura rachada pega o fragmento sem dizer nada, olha sua mão brilhante e leva você para dentro, até a mesa de guerra.)"},
d_cathedral:{text:"O arcebispo Nocturne prega na Catedral Umbral que a luz sempre foi uma mentira, e que a Longa Noite é uma misericórdia: se ninguém acorda, ninguém sofre. Cada lanterna escurecida foi escurecida no altar dele. Cada adormecido de Lanternfall é um de seus convertidos, tenha escolhido isso ou não.\n\nEntre na Catedral e cale-o. Traga de volta a luz que ele roubou.",done:"(Por toda Lanternfall, um após o outro, os adormecidos começam a acordar.) Está ouvindo? Portas se abrindo. Pessoas chamando nomes. Onze anos de silêncio, e agora a cidade está barulhenta. É a melhor coisa que já ouvi."},
d_sanctum:{text:"Sob o Vale de Cristal fica o Santuário da Mãe-Noite. Ela tece os pesadelos que enlouquecem cidades inteiras, e sua teia é a porta do Rei Oco para cada mente adormecida. Os cães são os sonhos dela. Os adormecidos são suas moscas.\n\nCorte a teia. Desça ao Santuário e acabe com a Mãe-Noite, e os adormecidos do mundo voltarão a sonhar os próprios sonhos.",done:"Dormi esta noite. Dormi de verdade, pela primeira vez em anos, e sonhei com a cozinha da minha mãe. Eu tinha esquecido a cor dela. Obrigada, Portador da Aura. De verdade."},
});
qadd('it',{
m13_1:{text:"Quella lanterna è stata accesa nella Cattedrale Umbratile. I sacerdoti della Lunga Notte prendono una lanterna di Lanternfall, una luce viva che qualcuno curava, e la rovesciano. Per ognuna che creano, una delle nostre si spegne.\n\nA Shadowfell, la luce è vita. Dove le lanterne si spengono camminano gli incubi, e la gente smette semplicemente di svegliarsi. Metà di Lanternfall ora dorme e non c'è modo di svegliarla.\n\nSono l'ultima custode delle lanterne. Da undici anni curo le luci da sola. Mi aiuterai a tenerle accese ancora un po'?",done:"(Wren accende una candelina e la posa tra voi.) Ecco. Una luce in più nel mondo, e due persone a custodirla. È così che comincia."},
m13_2:{text:"I segugi dell'incubo cacciano sulla Via delle Lanterne. Sono fatti dei sogni dei dormienti, e fiutano la luce come i lupi fiutano il sangue. Ogni portatore di lanterne che mando, lo raggiungono prima del secondo miglio.\n\nCacciali tu per primo. Resta nella luce, e non guardarli negli occhi troppo a lungo. Vedrai qualcosa che temi, e ti saranno addosso.",done:"I portatori di lanterne sono tornati dal secondo miglio, e dal terzo. Uno dei dormienti nella sala si è svegliato stamattina e ha chiesto la colazione. Piccole cose. Qui tutto è fatto di piccole cose."},
m13_3:{text:"I ragni del vuoto tessono una seta che non riflette la luce. I sacerdoti Cavi la usano per soffocare le nostre lanterne. Ma rovesciata, come stoppino, la seta del vuoto beve il buio e lo brucia: una fiamma che la Lunga Notte non può spegnere.\n\nPortami seta del vuoto. Farò stoppini per ogni lanterna di Lanternfall.",done:"(Wren accende uno stoppino nuovo. La fiamma è d'argento pallido, e le ombre negli angoli si ritirano.) Guarda un po'. Che provino a spegnerla, adesso."},
m13_4:{text:"Il Bosco Piangente era l'ultimo tratto dell'antica linea delle lanterne, quella che andava da Lanternfall all'Ultima Luce. I sacerdoti vi hanno spento ogni lanterna, e da allora non è arrivato un solo messaggio dall'Arconte.\n\nRiaccendi le lanterne spente del Bosco Piangente con i nuovi stoppini. Se la linea tornerà a brillare, l'Ultima Luce la vedrà e saprà che siamo ancora qui.",done:"Lo vedi, laggiù oltre gli alberi? Una luce che risponde alla nostra. L'Ultima Luce resiste ancora. Undici anni che cerco quella luce senza vederla. Dammi un momento."},
m13_5:{text:"C'è qualcosa che aspetta al Guado senza Luna. L'Araldo Cavo, la voce che cammina davanti a Vharos. Dove parla, la Lunga Notte lo segue: è stato lui a dire ai sacerdoti quali lanterne spegnere per prime.\n\nTi sta aspettando. Vuole che tu vada. Non mi piace. Ma sorveglia il guado verso l'Ultima Luce, quindi non c'è altra strada.",done:"(Wren prende il frammento e per poco non lo lascia cadere; è così freddo da bruciare.) Un frammento della Corona Cava in persona. L'Araldo lo portava come una sacra reliquia. Era una promessa: che il Re sta arrivando, e che la Faglia è aperta.\n\nNon resta più nulla da ripulire prima della fine, Portatore dell'Aura. Solo la fine."},
m13_6:{text:"Porta il frammento all'Arconte Solenne, all'Ultima Luce. Difende l'ultima fortezza sull'orlo della Faglia del Disfatto, e la difende da più tempo di quanto io custodisca le lanterne. Se qualcuno sa cos'è Vharos e come fermarlo, è lei.\n\nSegui la linea delle lanterne. Grazie a te, ora è accesa fino in fondo. E quando sarà finita, torna a raccontarmelo. Mi piacerebbe sentirlo da te.",done:"(Un soldato dall'armatura incrinata prende il frammento senza una parola, guarda la tua mano luminosa e ti conduce dentro, fino al tavolo di guerra.)"},
d_cathedral:{text:"L'arcivescovo Nocturne predica dalla Cattedrale Umbratile che la luce è sempre stata una menzogna, e che la Lunga Notte è misericordia: se nessuno si sveglia, nessuno soffre. Ogni lanterna oscurata lo è stata sul suo altare. Ogni dormiente di Lanternfall è uno dei suoi convertiti, che l'abbia scelto o no.\n\nEntra nella Cattedrale e fallo tacere. Riporta la luce che ha rubato.",done:"(In tutta Lanternfall, uno dopo l'altro, i dormienti cominciano a svegliarsi.) Senti? Porte che si aprono. Gente che chiama nomi. Undici anni di silenzio, e ora la città è rumorosa. È la cosa più bella che abbia mai sentito."},
d_sanctum:{text:"Sotto la Conca di Cristallo si trova il Santuario della Madre Notte. Tesse gli incubi che fanno impazzire intere città, e la sua tela è la porta del Re Cavo verso ogni mente addormentata. I segugi sono i suoi sogni. I dormienti sono le sue mosche.\n\nTaglia la tela. Scendi nel Santuario e poni fine alla Madre Notte, e i dormienti del mondo torneranno a sognare i propri sogni.",done:"Stanotte ho dormito. Dormito davvero, per la prima volta da anni, e ho sognato la cucina di mia madre. Avevo dimenticato il suo colore. Grazie, Portatore dell'Aura. Davvero."},
});

qadd('es',{
m13_1:{text:"Ese farol se encendió en la Catedral Umbría. Los sacerdotes de la Larga Noche toman un farol de Lanternfall, una luz viva que alguien cuidaba, y le dan la vuelta. Por cada uno que hacen, uno de los nuestros se apaga.\n\nEn Shadowfell, la luz es vida. Donde los faroles se apagan, caminan las pesadillas, y la gente simplemente deja de despertar. La mitad de Lanternfall duerme ahora y no hay forma de despertarla.\n\nSoy la última guardiana de faroles. Llevo once años cuidando las luces sola. ¿Me ayudarás a mantenerlas un poco más?",done:"(Wren enciende una velita y la pone entre los dos.) Ya está. Una luz más en el mundo, y dos personas para cuidarla. Así es como empieza."},
m13_2:{text:"Los sabuesos de pesadilla cazan en el Camino de los Faroles. Están hechos de los sueños de los durmientes, y huelen la luz como los lobos huelen la sangre. A cada portador de faroles que envío, lo alcanzan antes de la segunda milla.\n\nCázalos tú primero. Mantente en la luz, y no les mires a los ojos mucho rato. Verás algo que temes, y se te echarán encima.",done:"Los portadores de faroles volvieron de la segunda milla, y de la tercera. Uno de los durmientes de la sala despertó esta mañana y pidió el desayuno. Cosas pequeñas. Aquí todo son cosas pequeñas."},
m13_3:{text:"Las arañas del vacío tejen una seda que no refleja la luz. Los sacerdotes Huecos la usan para sofocar nuestros faroles. Pero usada al revés, como mecha, la seda del vacío bebe la oscuridad y la quema: una llama que la Larga Noche no puede apagar.\n\nTráeme seda del vacío. Haré mechas para cada farol de Lanternfall.",done:"(Wren enciende una mecha nueva. La llama es de un plateado pálido, y las sombras de los rincones retroceden.) Mira eso. Que intenten apagarla ahora."},
m13_4:{text:"El Bosque Lloroso era el último tramo de la antigua línea de faroles, la que iba de Lanternfall a la Última Luz. Los sacerdotes apagaron todos los faroles de allí, y desde entonces no ha llegado ni un mensaje de la Arconte.\n\nVuelve a encender los faroles apagados del Bosque Lloroso con las nuevas mechas. Si la línea vuelve a brillar, la Última Luz la verá y sabrá que seguimos aquí.",done:"¿Ves eso, a lo lejos, más allá de los árboles? Una luz que responde a la nuestra. La Última Luz sigue en pie. Once años buscando esa luz sin verla. Dame un momento."},
m13_5:{text:"Hay algo esperando en el Cruce sin Luna. El Heraldo Hueco, la voz que camina delante de Vharos. Allí donde habla, la Larga Noche lo sigue: fue él quien dijo a los sacerdotes qué faroles apagar primero.\n\nTe está esperando. Quiere que vayas. No me gusta. Pero guarda el cruce hacia la Última Luz, así que no hay otro camino.",done:"(Wren toma el fragmento y casi se le cae; está tan frío que quema.) Un fragmento de la mismísima Corona Hueca. El Heraldo lo llevaba como una reliquia sagrada. Era una promesa: que el Rey viene, y que la Grieta está abierta.\n\nNo queda nada que limpiar antes del final, Portador del Aura. Solo el final."},
m13_6:{text:"Lleva el fragmento a la Arconte Solenne, en la Última Luz. Defiende la última fortaleza al borde de la Grieta de lo Deshecho, y la ha defendido más tiempo del que yo llevo cuidando los faroles. Si alguien sabe qué es Vharos y cómo detenerlo, es ella.\n\nSigue la línea de faroles. Gracias a ti, ahora está encendida hasta el final. Y cuando todo acabe, vuelve y cuéntamelo. Me gustaría oírlo de tu boca.",done:"(Un soldado de armadura agrietada toma el fragmento sin decir palabra, mira tu mano resplandeciente y te conduce adentro, hasta la mesa de guerra.)"},
d_cathedral:{text:"El arzobispo Nocturne predica desde la Catedral Umbría que la luz siempre fue una mentira, y que la Larga Noche es misericordia: si nadie despierta, nadie sufre. Cada farol oscurecido lo fue en su altar. Cada durmiente de Lanternfall es uno de sus conversos, lo eligiera o no.\n\nEntra en la Catedral y hazlo callar. Trae de vuelta la luz que robó.",done:"(Por todo Lanternfall, uno tras otro, los durmientes empiezan a despertar.) ¿Lo oyes? Puertas que se abren. Gente llamando nombres. Once años de silencio, y ahora el pueblo hace ruido. Es lo mejor que he oído nunca."},
d_sanctum:{text:"Bajo la Hondonada de Cristal está el Santuario de la Madre Noche. Ella teje las pesadillas que enloquecen a ciudades enteras, y su red es la puerta del Rey Hueco a cada mente dormida. Los sabuesos son sus sueños. Los durmientes, sus moscas.\n\nCorta la red. Baja al Santuario y acaba con la Madre Noche, y los durmientes del mundo volverán a soñar sus propios sueños.",done:"Anoche dormí. Dormí de verdad, por primera vez en años, y soñé con la cocina de mi madre. Había olvidado su color. Gracias, Portador del Aura. De verdad."},
});
qadd('fr',{
m13_1:{text:"Cette lanterne a été allumée dans la Cathédrale Ombreuse. Les prêtres de la Longue Nuit prennent une lanterne de Lanternfall, une lumière vivante que quelqu'un entretenait, et la retournent. Pour chacune qu'ils fabriquent, une des nôtres s'éteint.\n\nDans le Shadowfell, la lumière, c'est la vie. Là où les lanternes s'éteignent, les cauchemars marchent, et les gens cessent simplement de se réveiller. La moitié de Lanternfall dort maintenant, et rien ne peut la réveiller.\n\nJe suis la dernière gardienne des lanternes. Cela fait onze ans que j'entretiens les lumières seule. M'aideras-tu à les garder allumées encore un peu ?",done:"(Wren allume une petite bougie et la pose entre vous.) Voilà. Une lumière de plus dans le monde, et deux personnes pour la garder. C'est comme ça que ça commence."},
m13_2:{text:"Les chiens de cauchemar chassent sur la Route des Lanternes. Ils sont faits des rêves des dormeurs, et ils sentent la lumière comme les loups sentent le sang. Chaque porteur de lanterne que j'envoie, ils le rattrapent avant le deuxième mille.\n\nChasse-les d'abord. Reste dans la lumière, et ne les regarde pas trop longtemps dans les yeux. Tu y verrais quelque chose que tu crains, et ils te sauteraient dessus.",done:"Les porteurs de lanternes sont revenus du deuxième mille, et du troisième. Un des dormeurs de la salle s'est réveillé ce matin et a demandé son petit-déjeuner. Des petites choses. Ici, tout n'est que petites choses."},
m13_3:{text:"Les araignées du vide tissent une soie qui ne reflète pas la lumière. Les prêtres Creux s'en servent pour étouffer nos lanternes. Mais retournée, comme mèche, la soie du vide boit l'obscurité et la brûle : une flamme que la Longue Nuit ne peut pas éteindre.\n\nApporte-moi de la soie du vide. Je ferai des mèches pour chaque lanterne de Lanternfall.",done:"(Wren allume une nouvelle mèche. La flamme est d'un argent pâle, et les ombres des coins reculent.) Regarde-moi ça. Qu'ils essaient de l'éteindre, maintenant."},
m13_4:{text:"Le Bois Pleureur était le dernier tronçon de l'ancienne ligne des lanternes, celle qui menait de Lanternfall à la Dernière Lumière. Les prêtres y ont éteint toutes les lanternes, et depuis, pas un seul message de l'Archonte n'est passé.\n\nRallume les lanternes éteintes du Bois Pleureur avec les nouvelles mèches. Si la ligne brille de nouveau, la Dernière Lumière la verra, et saura que nous sommes toujours là.",done:"Tu vois ça, au loin, par-delà les arbres ? Une lumière qui répond à la nôtre. La Dernière Lumière tient toujours. Onze ans que je cherche cette lumière sans la voir. Laisse-moi un instant."},
m13_5:{text:"Quelque chose attend au Passage sans Lune. Le Héraut Creux, la voix qui marche devant Vharos. Là où il parle, la Longue Nuit suit : c'est lui qui a dit aux prêtres quelles lanternes éteindre en premier.\n\nIl t'attend. Il veut que tu viennes. Je n'aime pas ça. Mais il garde le passage vers la Dernière Lumière, alors il n'y a pas d'autre chemin.",done:"(Wren prend l'éclat et manque de le lâcher ; il est si froid qu'il brûle.) Un éclat de la Couronne Creuse elle-même. Le Héraut le portait comme une relique sacrée. C'était une promesse : que le Roi arrive, et que la Faille est ouverte.\n\nIl ne reste plus rien à nettoyer avant la fin, Porteur de l'Aura. Seulement la fin."},
m13_6:{text:"Porte l'éclat à l'Archonte Solenne, à la Dernière Lumière. Elle tient la dernière forteresse au bord de la Faille de l'Indéfait, et elle la tient depuis plus longtemps que je n'entretiens les lanternes. Si quelqu'un sait ce qu'est Vharos et comment l'arrêter, c'est elle.\n\nSuis la ligne des lanternes. Grâce à toi, elle est allumée jusqu'au bout. Et quand ce sera fini, reviens me raconter. J'aimerais l'entendre de ta bouche.",done:"(Un soldat à l'armure fendue prend l'éclat sans un mot, regarde ta main lumineuse et te conduit à l'intérieur, jusqu'à la table de guerre.)"},
d_cathedral:{text:"L'archevêque Nocturne prêche depuis la Cathédrale Ombreuse que la lumière a toujours été un mensonge, et que la Longue Nuit est une miséricorde : si personne ne se réveille, personne ne souffre. Chaque lanterne assombrie l'a été sur son autel. Chaque dormeur de Lanternfall est l'un de ses convertis, qu'il l'ait choisi ou non.\n\nEntre dans la Cathédrale et fais-le taire. Rapporte la lumière qu'il a volée.",done:"(Dans tout Lanternfall, l'un après l'autre, les dormeurs commencent à se réveiller.) Tu entends ? Des portes qui s'ouvrent. Des gens qui appellent des noms. Onze ans de silence, et maintenant la ville est bruyante. C'est le plus beau son que j'aie jamais entendu."},
d_sanctum:{text:"Sous le Creux de Cristal se trouve le Sanctuaire de la Mère-Nuit. Elle tisse les cauchemars qui rendent folles des villes entières, et sa toile est la porte du Roi Creux vers chaque esprit endormi. Les chiens sont ses rêves. Les dormeurs sont ses mouches.\n\nTranche la toile. Descends dans le Sanctuaire et mets fin à la Mère-Nuit, et les dormeurs du monde rêveront de nouveau leurs propres rêves.",done:"J'ai dormi cette nuit. Vraiment dormi, pour la première fois depuis des années, et j'ai rêvé de la cuisine de ma mère. J'avais oublié sa couleur. Merci, Porteur de l'Aura. Vraiment."},
});

// ================= PROCEDURAL PIXEL ART =================
const TS=16;// tile size (world pixels)
const ART={cache:new Map()};
function shade(hex,f){let [r,g,b]=hexToRgb(hex);if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function cached(key,w,h,fn){let c=ART.cache.get(key);if(c)return c;const [cv,x]=mkCanvas(w,h);fn(x,w,h);ART.cache.set(key,cv);return cv;}
function line(x,x0,y0,x1,y1,col){x.fillStyle=col;const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy;for(let i=0;i<64;i++){x.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}}
// ---------- humanoid (players, npcs, human mobs) 16x24 ----------
// o: {skin,hair,helm,chest,legs,boots,robe,hood,cape,wpn,wcol,shield,f,beard,crown,eyes,horns,bones,wrap}
function drawHuman(x,o,f){const sk=o.skin||'#e0b088',ch=o.chest||'#6a5a4a',lg=o.legs||'#3a3a4a',bt=o.boots||'#2a1e16';const step=f%2;
 // cape
 if(o.cape){pRect(x,4,10,8,11,shade(o.cape,-.2));}
 // legs
 if(o.robe){pRect(x,4,15,8,7,o.robe);pRect(x,4,21,8,1,shade(o.robe,-.3));pRect(x,5+(step?1:0),22,2,2,bt);pRect(x,9-(step?1:0),22,2,2,bt);}
 else{pRect(x,5,16,3,6-(step?1:0),lg);pRect(x,8,16,3,6-(step?0:1),lg);pRect(x,5,21-(step?1:0),3,2,bt);pRect(x,8,21-(step?0:1),3,2,bt);pRect(x,7,16,2,1,shade(lg,-.3));}
 // torso
 pRect(x,4,10,8,6,ch);pRect(x,4,14,8,1,shade(ch,-.35));pRect(x,5,10,6,1,shade(ch,.25));
 if(o.belt)pRect(x,4,15,8,1,o.belt);
 // arms
 const ac=o.arms||ch;pRect(x,2,10,2,5,ac);pRect(x,12,10,2,5,ac);pRect(x,2,15,2,1,o.gloves||sk);pRect(x,12,15,2,1,o.gloves||sk);
 // head
 pRect(x,5,3,6,7,sk);pRect(x,6,6,1,1,o.eyes||'#1a1010');pRect(x,9,6,1,1,o.eyes||'#1a1010');
 if(o.bones){pRect(x,6,8,4,1,'#000');px(x,7,8,sk);}
 if(o.beard)pRect(x,5,8,6,2,o.beard);
 if(o.hair){pRect(x,5,2,6,2,o.hair);pRect(x,4,3,1,4,o.hair);pRect(x,11,3,1,4,o.hair);}
 if(o.hood){pRect(x,4,1,8,3,o.hood);pRect(x,4,3,1,6,o.hood);pRect(x,11,3,1,6,o.hood);pRect(x,5,1,6,1,shade(o.hood,.2));}

 return{id:uid(),kind:'mob',mid:id,name:opts.name||name,arch,pal,lvl,hp,maxHp:hp,dmg:mobDmgBase(lvl)*dmM,x,y,sx:x,sy:y,spd:(fast?3.6:2.5)*(opts.boss?1.05:1),ranged:flags.includes('R'),beast:flags.includes('B'),tough,elite:!!opts.elite,boss:!!opts.boss,

  if(s.mobs&&s.mobs.length){s.mobs=s.mobs.filter(m=>m.hp>0);if(!s.mobs.length){if(s.once){s.done=1;}else s.timer=rnd(30,55);}

  if(s.done)continue;if(s.timer>0){s.timer-=dt;continue;}if(d>(M.kind==='dungeon'?60:46))continue;if(d<9&&M.kind==='zone')continue;
  s.mobs=[];for(let k=0;k<s.n;k++){let m;const ox=k?rnd(-1.2,1.2):0,oy=k?rnd(-1.2,1.2):0;
   if(s.boss){const D=DUNGEON_BY_ID[M.d];m=makeMob(['boss',D.boss.n,D.boss.arch,D.boss.pal,0,'T'],s.lvl,s.x,s.y,{boss:1,dun:1});m.title=D.boss.t;}
   else if(s.dmob){const dm=s.dmob;m=makeMob(['d_'+dm[2],dm[2],dm[0],dm[1],0,dm[3]?'R':''],s.lvl,s.x+ox,s.y+oy,{dun:1,elite:s.elite&&k===0,name:s.elite&&k===0?'Champion '+dm[2]:dm[2]});}

 if(PE.stealth&&o.melee!==false&&P.cls==='thief'){d*=1.6*(PS.stealthDmg/100);crit=true;o.ambush=1;}
 if(o.behind&&P.cls==='thief'){const fx=m.fx;const behind=(PE.x-m.x)*fx<0;if(behind||o.ambush){d*=(o.behind+(PS.M.behind||0)/100);}}
 if(PE.next50){d*=1.5;PE.next50=false;}

 if(crit)d*=1+PS.critd/100;d*=rnd(.92,1.08);d=Math.max(1,Math.round(d));
 if(o.ambush){floater(m.x,m.y-.4,t('AMBUSH!'),'#c25cff',1);}
 if(PE.stealth&&o.melee!==false){breakStealth();}
 damageMob(m,d,crit,o.el);PE.lastHit=GAME.time;
 if(PS.lifesteal&&d>0){healPlayer(d*PS.lifesteal/100,true);}
 if(o.leech&&d>0){healPlayer(d*o.leech,true);}
 if(o.poisonable!==false&&GAME.abuffs.some(b=>b.id==='poison')){m.dots.push({dps:d*.12*(1+(PS.M.poison||0)/100),t:6,c:'#3cff5a'});}
 if(o.el==='fire'&&PS.M.burn){m.dots.push({dps:d*.04*PS.M.burn/15,t:4,c:'#ff8a1e'});}
 if(P.cls==='knight'&&!o.noGain)gainRes(6);
 return d;}

 if(m.state==='idle'||m.state==='return'){m.state='chase';m.tgt=PE;alertPack(m);}if(m.hp<=0)killMob(m);}
function alertPack(m){for(const o of GAME.mobs){if(o!==m&&o.state==='idle'&&((m.spawn&&o.spawn===m.spawn)||Math.hypot(o.x-m.x,o.y-m.y)<2.5)){o.state='chase';o.tgt=PE;}}}
function killMob(m){m.hp=0;sfx('die');burst(m.x,m.y,m.pal[0],12);GAME.mobs=GAME.mobs.filter(o=>o!==m);if(GAME.target===m)GAME.target=null;
 GAME.corpses.push({x:m.x,y:m.y,arch:m.arch,pal:m.pal,t:30,beast:m.beast,tier:tierOf(m.lvl),lvl:m.lvl,skinned:false,size:m.size,boss:m.boss});if(GAME.corpses.length>40)GAME.corpses.shift();
 // xp & gold
 const diff=m.lvl-P.lvl;let xm=diff<-10?.1:diff<-5?.5:diff>3?1.25:1;let xp=mobXP(m.lvl)*xm*(m.elite?3:1)*(m.boss?25:1)*(m.dun&&!m.boss?1.3:1);gainXP(xp);
 const g=Math.max(1,Math.round(goldDrop(m.lvl)*rnd(.6,1.4)*(m.elite?3:1)*(m.boss?30:1)*PS.gold));P.gold+=g;floater(m.x,m.y-.6,'+'+fmt(g)+'g','#ffd24a');sfx('gold');

 if(m.boss)onBossKilled();

function damagePlayer(d,src){if(PE.dead||d<=0)return;if(GAME.godmode)return;

 const tg=pickTarget(melee?range:range);const dir=aimDir(tg);PE.face={x:dir.x,y:dir.y};if(Math.abs(dir.x)>.2)PE.fx=dir.x>0?1:-1;

function shoot(o){GAME.projs.push(Object.assign({hit:new Set(),t:0},o));}
function updateProjs(dt){const M=GAME.map;for(const p of GAME.projs){p.t+=dt;if(p.homing&&p.tgt&&p.tgt.hp>0){const d=Math.hypot(p.tgt.x-p.x,p.tgt.y-.5-p.y)||1;p.dx=lerp(p.dx,(p.tgt.x-p.x)/d,.15);p.dy=lerp(p.dy,(p.tgt.y-.5-p.y)/d,.15);}
  p.x+=p.dx*p.spd*dt;p.y+=p.dy*p.spd*dt;if(Math.random()<.6)GAME.parts.push({x:p.x,y:p.y,vx:0,vy:0,c:p.c,life:.2,g:0});
  const ti=Math.floor(p.y+.5)*M.w+Math.floor(p.x);const g=M.ground[ti];if(M.solid[ti]&&g!==G_LIQ&&g!==G_VOID){p.dead=1;}if(p.t>p.life)p.dead=1;

function pathNext(M,fx,fy,tx,ty,max){const sx=Math.floor(fx),sy=Math.floor(fy),gx=Math.floor(tx),gy=Math.floor(ty);if(sx===gx&&sy===gy)return null;

  for(let i=0;i<4;i++){const nx=x+(i===0?1:i===1?-1:0),ny=y+(i===2?1:i===3?-1:0);if(nx<0||ny<0||nx>=W||ny>=M.h)continue;const nk=ny*W+nx;if(seen[nk]===gen||M.solid[nk]===1)continue;seen[nk]=gen;prev[nk]=k;q[qt++]=nk;}}

function npcName(id){for(const k in GAME.zoneMaps){const n=GAME.zoneMaps[k].npcs.find(n=>n.id===id);if(n)return n.n;}const m=id.match(/^z(\d+)_(\w+)$/);if(m&&m[2]==='elder')return ELDERS[+m[1]];return id;}
function qState(id){return P.quests.a[id];}
function qDone(id){return!!P.quests.d[id];}
function qAvailable(q){if(qDone(q.id)||qState(q.id))return false;if(q.pre&&!qDone(q.pre))return false;if(P.lvl<q.lvl-(q.dungeon?0:2))return false;return true;}
function qComplete(q){const st=qState(q.id);if(!st)return false;return q.obj.every((o,i)=>objProgress(q,o,i)>=objNeed(o));}
function objNeed(o){return o.n||1;}
function objProgress(q,o,i){const st=qState(q.id);if(!st)return 0;if(o.t==='collect'||o.t==='gather')return Math.min(o.n,invCount('q_'+o.item));if(o.t==='elite')return invCount('q_'+o.item)>0||st.p[i]>=1?1:0;return st.p[i]||0;}
function objText(q,o,i){const p=objProgress(q,o,i),n=objNeed(o);const Z=ZONES[q.z];const poi=(k)=>STORY[q.z].pois[k];
 switch(o.t){case'kill':{const d=mobDef(o.mob);return t('Slay {m}',{m:d?d[1]:o.mob})+' '+p+'/'+n;}case'collect':{const d=mobDef(o.mob);return tqi(o.item)+' ('+(d?d[1]:'')+') '+p+'/'+n;}
  case'gather':return tqi(o.item)+' @ '+poi(o.poi)+' '+p+'/'+n;case'elite':return t('Defeat {m} at {p}',{m:o.name,p:poi(o.poi)})+' '+p+'/1';case'talk':return t('Speak with {n}',{n:npcName(o.npc)})+(p?' ✓':'');
  case'explore':return t('Explore {p}',{p:poi(o.poi)})+(p?' ✓':'');case'dungeon':{const D=DUNGEON_BY_ID[o.d];return t('Defeat {b}',{b:D.boss.n})+(p?' ✓':'');}}return'';}
function acceptQuest(q){if(!qAvailable(q))return;P.quests.a[q.id]={p:q.obj.map(()=>0),t:Date.now()};sfx('quest');chat(t('Quest accepted: {q}',{q:qtitle(q)}),'#ffd24a');
 q.obj.forEach((o,i)=>{if(o.t==='talk'&&o.npc===q.giver&&!q.turn)P.quests.a[q.id].p[i]=1;});
 if(q.dungeon){chat(t('Dungeon unlocked in your Adventure Book: {d}',{d:DUNGEON_BY_ID[q.dungeon].n}),'#ff8a1e');}rebuildQuestObjects();UI.dirty=1;}
function abandonQuest(id){delete P.quests.a[id];const q=QUESTS[id];q.obj.forEach(o=>{if(o.item&&(o.t==='collect'||o.t==='gather'||o.t==='elite'))invRemove('q_'+o.item,999);});rebuildQuestObjects();UI.dirty=1;}
function turnInQuest(q){if(!qComplete(q))return;q.obj.forEach(o=>{if(o.item)invRemove('q_'+o.item,999);});delete P.quests.a[q.id];P.quests.d[q.id]=1;
 const g=Math.round(questGold(q)*PS.gold);P.gold+=g;sfx('quest');banner(t('Quest Complete'),qtitle(q),2400);chat(t('Quest complete: {q} (+{g} gold)',{q:qtitle(q),g:fmt(g)}),'#3cff5a');
 // item reward
 let it=null;if(q.dungeon)it=genGear(q.lvl,2,{cls:P.cls,arm:pick(CLASSES[P.cls].armor.filter(a=>a!=='plate'||P.plate))});else if(q.main&&q.obj[0].t!=='talk')it=genGear(Math.max(1,q.lvl),Math.random()<.25?2:1,{cls:P.cls,...(Math.random()<.5?{wt:pick(CLASSES[P.cls].weapons.filter(w=>w!=='shield'))}:{arm:pick(CLASSES[P.cls].armor.filter(a=>a!=='plate'||P.plate))})});
 else if(!q.main){const r=Math.random();if(r<.35)it=genGear(q.lvl,1,{cls:P.cls});else{it=mkPotion('hp',potTier(q.lvl));it.q=3;}}
 if(it){if(!invAdd(it))GAME.loot.push({x:PE.x,y:PE.y+.5,it,t:300,bob:0});}
 gainXP(questXP(q));
 if(q.next){/* next zone's chain continues automatically */}
 rebuildQuestObjects();UI.dirty=1;saveGame(true);}
function questOnKill(m){for(const id in P.quests.a){const q=QUESTS[id];const st=P.quests.a[id];q.obj.forEach((o,i)=>{
  if(o.t==='kill'&&m.mid===o.mob&&st.p[i]<o.n){st.p[i]++;if(st.p[i]===o.n)questProgressMsg(q);}

function questOnExplore(){const M=GAME.map;if(!M||M.kind!=='zone')return;for(const id in P.quests.a){const q=QUESTS[id];if(q.z!==M.z)continue;q.obj.forEach((o,i)=>{if(o.t!=='explore')return;const poi=M.pois[o.poi];const st=P.quests.a[id];if(!st.p[i]&&Math.hypot(poi.x-PE.x,poi.y-PE.y)<6){st.p[i]=1;toast(t('Explored {p}',{p:poi.n}),'#3cff5a');questProgressMsg(q);UI.dirty=1;}});}}

function npcQuests(npc){const give=QUEST_LIST.filter(q=>q.giver===npc.id&&qAvailable(q));const turn=QUEST_LIST.filter(q=>(q.turn||q.giver)===npc.id&&qState(q.id)&&qComplete(q));const act=QUEST_LIST.filter(q=>(q.turn||q.giver)===npc.id&&qState(q.id)&&!qComplete(q));return{give,turn,act};}
function npcMarker(npc){if(!['elder','board','villager'].includes(npc.role))return null;const Q=npcQuests(npc);if(Q.turn.length)return'?';if(Q.give.length)return'!';if(Q.act.length)return'.';return null;}

const PROF_MAX=400;

function profGain(tier){if(P.prof<PROF_MAX&&P.prof<profReq(tier)+40){P.prof++;if(P.prof%25===0)chat(t('{i} skill increased to {n}',{i:INTERESTS[P.interest].n,n:P.prof}),'#ffd24a');}}
function startChannel(label,dur,done){if(GAME.cast)return;if(inCombat()&&label!==t('Bandaging')){}GAME.cast={label,t:0,dur,done,x:PE.x,y:PE.y,interruptible:true};}
function harvestNode(n){const want=n.kind==='herb'?'cloth':'mining';if(P.interest!==want){toast(t(n.kind==='herb'?'Only Clothworkers can harvest herbs':'Only Miners can mine ore'));return;}
 if(P.prof<profReq(n.tier)){toast(t('Requires {i} skill {n}',{i:INTERESTS[P.interest].n,n:profReq(n.tier)}),'#ff4a5a');return;}
 startChannel(n.kind==='herb'?t('Harvesting'):t('Mining'),1.4,()=>{if(n.t>0)return;n.t=90;const q=ri(1,n.kind==='ore'&&n.tier>=10?2:3);invAdd(mkMat(n.kind,n.tier,q));profGain(n.tier);sfx(n.kind==='herb'?'harvest':'mine');
  if(Math.random()<.08){invAdd(n.kind==='herb'?mkMat('herb',Math.min(14,n.tier+1),1):mkMat('ore',Math.min(14,n.tier+1),1));}});}
function skinCorpse(c){if(P.interest!=='leather'){toast(t('Only Leatherworkers can skin beasts'));return;}if(!c.beast||c.skinned){toast(t('Nothing to skin'));return;}if(P.prof<profReq(c.tier)){toast(t('Requires {i} skill {n}',{i:INTERESTS.leather.n,n:profReq(c.tier)}),'#ff4a5a');return;}
 startChannel(t('Skinning'),1.2,()=>{if(c.skinned)return;c.skinned=true;invAdd(mkMat('hide',c.tier,ri(1,c.boss?6:2)));profGain(c.tier);sfx('harvest');});}

   [['head',3],['chest',5],['legs',4],['hands',2],['feet',2]].forEach(([s,q])=>out.push({t:t0,req,n:CLOTH_N[t0]+' '+ARMOR_FAM.cloth.names[s],mats:[['mat_cloth_'+t0,q,CLOTH_N[t0]+' Cloth']],make:()=>craftGear(L,{slot:s,arm:'cloth'}),icon:s,gear:1,lvl:L}));}

   [['head',3],['chest',5],['legs',4],['hands',2],['feet',2]].forEach(([s,q])=>out.push({t:t0,req,n:LEATHER_N[t0]+' '+ARMOR_FAM.leather.names[s],mats:[['mat_leather_'+t0,q,LEATHER_N[t0]]],make:()=>craftGear(L,{slot:s,arm:'leather'}),icon:s,gear:1,lvl:L}));

function craftGear(L,opt){const v=Math.random()*100;const rar=v<3?3:v<30?2:1;const cls=(CLASSES[P.cls].armor.includes(opt.arm))?P.cls:null;return genGear(L,rar,Object.assign({cls},opt));}
function canCraft(rc){if(P.prof<rc.req)return false;return rc.mats.every(([id,q])=>invCount(id)>=q);}

function shopStock(npc){const z=npc.z;const key=npc.id;GAME.shops=GAME.shops||{};let S=GAME.shops[key];const now=Date.now();if(S&&S.until>now&&S.lvl===P.lvl)return S.items;
 const L=clamp(P.lvl,ZONES[z].lvl[0],ZONES[z].lvl[1]+5);const items=[];const T=tierOf(L);
 switch(npc.role){

  case'weapons':for(let i=0;i<7;i++){const C=CLASSES[P.cls];items.push(genGear(L-ri(0,3),Math.random()<.3?1:0,{wt:pick(C.weapons),cls:P.cls}));}break;
  case'jeweler':for(let i=0;i<6;i++)items.push(genGear(L,Math.random()<.4?2:1,{slot:i%2?'ring':'amulet',cls:P.cls}));break;
  case'bags':items.push(mkBag(Math.max(0,T-1),1));items.push(mkBag(T,2));break;

 items.forEach(it=>{it.price=priceOf(it,npc.role);});GAME.shops[key]={items,until:now+10*60e3,lvl:P.lvl};return items;}
function priceOf(it,role){if(it.k==='mount')return MOUNTS[it.mid].cost;if(it.k==='bag')return it.val*8;if(it.k==='gear')return it.val*4;return it.val*3;}
function sellPrice(it){return it.k==='quest'?0:Math.max(1,Math.floor((it.val||1)*(it.q||1)));}
function buyItem(npc,it){const price=it.price;if(P.gold<price){toast(t('Not enough gold'),'#ff4a5a');sfx('err');return;}if(it.k==='mount'){if(P.lvl<it.req){toast(t('Requires level {n}',{n:it.req}));return;}if(P.mounts&&P.mounts.includes(it.mid)){toast(t('You already own this mount'));return;}}

function useItem(idx){const it=P.inv[idx];if(!it)return;if(it.req&&P.lvl<it.req&&it.k!=='gear'){toast(t('Requires level {n}',{n:it.req}));return;}

  case'scroll':{const S=SCROLLS[it.sc];if(S.recall){startChannel(t('Recalling'),3,()=>{enterZone(P.bind,null,null);});break;}P.buffs=P.buffs.filter(b=>b.id!==it.sc);P.buffs.push({id:it.sc,n:S.n,b:S.b,until:Date.now()+10*60e3});calcStats();sfx('heal');toast(S.n+' — '+S.d);break;}

const BAD_SUB=['fuck','fuk','shit','bitch','cunt','dick','pussy','asshole','nigg','faggot','slut','whore','rapist','nazi','hitler','penis','vagin','porn','twat','wank','retard','kike','chink','bastard','boob','jizz','dildo','molest','pedo','tits','semen','hentai','kkk','cumshot'];

function lbNormalize(s){return s.toLowerCase().replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t').replace(/8/g,'b').replace(/9/g,'g');}
function lbSlurNorm(s){const m={'1':'i','l':'i','!':'i','|':'i','y':'i','3':'e','4':'a','@':'a','0':'o','5':'s','$':'s','9':'g','6':'g','7':'t'};return String(s||'').toLowerCase().replace(/[1l!|y34@05$967]/g,c=>m[c]).replace(/[^a-z]/g,'').replace(/(.)\1+/g,'$1');}
function lbBlocked(s){return /nig(a|e?r|u[hr]|z|s|let)/.test(lbSlurNorm(s));}
function cleanName(raw){return String(raw||'').toUpperCase().replace(/[^A-Z0-9 _.\-]/g,'').replace(/\s+/g,' ').trim();}
function validateName(raw){const n=cleanName(raw);if(n.length<3)return{ok:false,err:t('Use 3-12 letters or numbers.')};if(n.length>12)return{ok:false,err:t('Max 12 characters.')};

 if(lbBlocked(raw)||lbBlocked(n))return{ok:false,err:t("That name isn't allowed")};
 if(BAD_SUB.some(w=>squash.includes(w)||dedup.includes(w)))return{ok:false,err:t('Please pick a friendlier name.')};
 const words=norm.split(/[^a-z]+/).filter(Boolean);if(words.some(w=>BAD_WORD.includes(w))||BAD_WORD.includes(squash))return{ok:false,err:t('Please pick a friendlier name.')};return{ok:true,name:n};}

 addEventListener('resize',()=>{resize();Object.values(UI.wins).forEach(W=>{if(W.e.classList.contains('on'))placeWin(W);});});}
function tapWorld(e){const w=canvasToWorld(e.clientX,e.clientY);const hm=GAME.mobs.find(m=>Math.hypot(m.x-w.x,m.y-.6*m.size-w.y-.3)<1*m.size);if(hm){GAME.target=hm;return;}
 const npc=GAME.map&&GAME.map.npcs.find(n=>Math.hypot(n.x-w.x,n.y-.7-w.y-.3)<1.2);if(npc){if(Math.hypot(npc.x-PE.x,npc.y-PE.y)<3)talkTo(npc);else toast(t('Too far away'));return;}
 if(GAME.interact&&Math.hypot(GAME.interact.x-w.x,GAME.interact.y-w.y)<1.5)doInteract();}
function cycleTarget(){const list=mobsNear(PE.x,PE.y,12).sort((a,b)=>Math.hypot(a.x-PE.x,a.y-PE.y)-Math.hypot(b.x-PE.x,b.y-PE.y));if(!list.length)return;const i=list.indexOf(GAME.target);GAME.target=list[(i+1)%list.length];}
// ---------- title ----------
const TB={t:0,x:null,c:null};
function titleFrame(dt){TB.t+=dt;const c=$('#titlebg');if(!TB.x){TB.c=c;TB.x=c.getContext('2d');}const w=Math.ceil(innerWidth/4),h=Math.ceil(innerHeight/4);if(c.width!==w){c.width=w;c.height=h;}const x=TB.x;
 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a0614');g.addColorStop(.6,'#1a1030');g.addColorStop(1,'#2a1a2a');x.fillStyle=g;x.fillRect(0,0,w,h);
 for(let i=0;i<60;i++){const sx=(hash2(i,1,1)*w+TB.t*2*(hash2(i,2,1)))%w,sy=hash2(i,3,1)*h*.55;x.fillStyle=hash2(i,4,1)<.2?'#ffd24a':'#8a7aaa';x.globalAlpha=.4+.6*Math.abs(Math.sin(TB.t+i));x.fillRect(sx|0,sy|0,1,1);}x.globalAlpha=1;
 x.fillStyle='#e8dcb5';x.beginPath();x.arc(w*.78,h*.22,10,0,6.28);x.fill();x.fillStyle='#0a0614';x.beginPath();x.arc(w*.78+4,h*.22-2,9,0,6.28);x.fill();
 for(let layer=0;layer<3;layer++){x.fillStyle=['#120c1e','#0d1a12','#08120c'][layer];const base=h*(.62+layer*.12);for(let i=0;i<w+16;i+=6+layer*2){const hh=14+layer*8+Math.sin(i*.13+layer)*6+hash2(i,layer,7)*10;x.beginPath();x.moveTo(i-6,base);x.lineTo(i,base-hh);x.lineTo(i+6,base);x.fill();}x.fillRect(0,base,w,h-base);}
 for(let i=0;i<14;i++){const fx=(hash2(i,9,2)*w+Math.sin(TB.t*.7+i)*8)|0,fy=(h*.6+hash2(i,8,2)*h*.35+Math.cos(TB.t+i)*4)|0;x.fillStyle='#ffd24a';x.globalAlpha=.5+.5*Math.sin(TB.t*3+i);x.fillRect(fx,fy,1,1);}x.globalAlpha=1;}
function showTitle(){showScreen('title');GAME.running=false;const L=$('#logo');L.innerHTML='';const lg=pixText(GAME_TITLE,Math.max(4,Math.min(9,Math.floor(innerWidth/70))),'#ffd24a','#ff8a1e');lg.style.maxWidth='94vw';L.appendChild(lg);
 $('#tsub').textContent=t(GAME_SUB)+' — '+t('a mythological online RPG');const B=$('#tbtns0');B.innerHTML='';const saves=allSaves();
 const b1=el('div',{class:'btn big gold'},saves.length?t('Continue'):t('New Adventure'));b1.onclick=()=>{ac();sfx('click');if(saves.length)startGame(saves[0]);else showCreate();};B.appendChild(el('div',{},''));B.lastChild.appendChild(b1);
 if(saves.length){const b2=el('div',{class:'btn'},t('Characters'));b2.onclick=()=>{ac();showSelect();};B.appendChild(b2);const b3=el('div',{class:'btn'},t('New Character'));b3.onclick=()=>{ac();showCreate();};B.appendChild(b3);}
 const lr=el('div',{class:'row',style:'justify-content:center;margin-top:10px'});LAG_LANGS.forEach(([c,n])=>{const b=el('div',{class:'btn sm'+(LANG===c?' sel':'')},n);b.onclick=()=>{setLang(c);};lr.appendChild(b);});B.appendChild(lr);
 const hb=el('div',{class:'btn sm'},t('Controls'));hb.onclick=showHelp;B.appendChild(hb);
 $('#credit').innerHTML=t('A Lost Aura Games production')+' · '+t('Private playtest build')+' · v0.9';startMusic('title');}
function showSelect(){showScreen('create');const B=$('#createbox');B.innerHTML='<div class="h1">'+t('Characters')+'</div>';const row=el('div',{class:'slotrow'});
 allSaves().forEach(s=>{const c=el('div',{class:'slotc'});const pv=document.createElement('canvas');pv.width=18;pv.height=26;pv.className='px';pv.style.cssText='width:54px;height:78px;float:right';try{pv.getContext('2d').drawImage(playerSprite(s,0),0,0);}catch(e){}
  c.appendChild(pv);c.insertAdjacentHTML('beforeend','<div class="gold" style="font-size:18px">'+esc(s.name)+'</div><div>'+t('Level {n}',{n:s.lvl})+' '+t(CLASSES[s.cls].n)+'</div><div class="grey">'+t(INTERESTS[s.interest].n)+'</div><div class="grey">'+esc(ZONES[s.zone]?ZONES[s.zone].n:'')+'</div>');
  c.onclick=()=>startGame(s);const del=el('div',{class:'btn sm red'},t('Delete'));del.onclick=ev=>{ev.stopPropagation();modal(t('Delete {n} forever?',{n:esc(s.name)}),[{t:t('Delete'),c:'red',f:()=>{deleteSave(s.id);showSelect();}},{t:t('Cancel')}]);};c.appendChild(del);row.appendChild(c);});
 B.appendChild(row);const bk=el('div',{class:'btn'},t('Back'));bk.onclick=showTitle;B.appendChild(bk);}
function showCreate(){showScreen('create');const B=$('#createbox');const st={cls:'knight',interest:'cloth',skin:'#e0b088',hair:'#5a3a1e'};
 const draw=()=>{B.innerHTML='<div class="h1">'+t('Create your hero')+'</div><div class="qtext grey">'+t('You wake in Hearthmoor, a village ringed by the enchanted Whisperwood. Giant ants are spilling from the forest... and a strange ember-mark glows on your palm.')+'</div>';
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Name')+'</div>');const nm=el('input',{class:'txt',maxlength:'12',placeholder:t('NAME'),id:'cname'});nm.value=st.name||'';nm.oninput=()=>{st.name=nm.value;$('#nerr').textContent='';};B.appendChild(nm);B.insertAdjacentHTML('beforeend','<div id="nerr" class="red" style="min-height:18px"></div>');
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Class')+'</div>');const cc=el('div',{class:'cards'});CLASS_KEYS.forEach(k=>{const C=CLASSES[k];const card=el('div',{class:'card'+(st.cls===k?' sel':''),'data-cls':k});const pv=document.createElement('canvas');pv.width=18;pv.height=26;pv.className='px';pv.style.cssText='width:54px;height:78px';
   const fake=newCharacter('X',k,'cloth',st);pv.getContext('2d').drawImage(playerSprite(fake,0),0,0);card.appendChild(pv);
   card.insertAdjacentHTML('beforeend','<div class="nm">'+t(C.n)+'</div><div class="ds">'+esc(t(C.d))+'</div><div class="ds"><b class="gold">'+t('Main stats')+':</b> '+t(STATS[C.main[0]].n)+' ★ / '+t(STATS[C.main[1]].n)+' ☆<br><b>'+t('Health')+':</b> '+(C.hp>=1.3?t('Highest'):C.hp<.8?t('Lowest'):t('Medium'))+'</div>');card.onclick=()=>{st.cls=k;draw();};cc.appendChild(card);});B.appendChild(cc);
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Interest')+' <span class="grey" style="font-size:12px">('+t('pick one — what you do when not questing')+')</span></div>');const ic=el('div',{class:'cards'});Object.keys(INTERESTS).forEach(k=>{const I=INTERESTS[k];const card=el('div',{class:'card'+(st.interest===k?' sel':''),'data-int':k});
   card.appendChild(canvasIcon(itemIcon({icon:I.icon==='herb'?'herb':I.icon==='hide'?'hide':'ore',k:'mat',tier:k==='mining'?12:0}),32));card.insertAdjacentHTML('beforeend','<div class="nm">'+t(I.n)+'</div><div class="ds">'+esc(t(I.d))+'</div>');card.onclick=()=>{st.interest=k;draw();};ic.appendChild(card);});B.appendChild(ic);
  B.insertAdjacentHTML('beforeend','<div class="h2">'+t('Appearance')+'</div>');const ap=el('div',{class:'row'});['#f0c8a0','#e0b088','#c08a5a','#8a5a3a','#6a4a2a'].forEach(c=>{const b=el('div',{class:'btn sm'+(st.skin===c?' sel':''),style:'background:'+c+';width:28px;height:24px'});b.onclick=()=>{st.skin=c;draw();};ap.appendChild(b);});
  ap.appendChild(el('span',{style:'width:12px'}));['#5a3a1e','#2a1a10','#d8c070','#a03a1a','#e8e8e8','#3a3a5a'].forEach(c=>{const b=el('div',{class:'btn sm'+(st.hair===c?' sel':''),style:'background:'+c+';width:28px;height:24px'});b.onclick=()=>{st.hair=c;draw();};ap.appendChild(b);});B.appendChild(ap);
  const row=el('div',{class:'row',style:'margin-top:16px'});const go=el('div',{class:'btn big gold',id:'cgo'},t('Begin the journey'));go.onclick=()=>{const v=validateName(st.name||'');if(!v.ok){$('#nerr').textContent=v.err;sfx('err');return;}const p=newCharacter(v.name,st.cls,st.interest,st);startGame(p,true);};row.appendChild(go);
  const bk=el('div',{class:'btn'},t('Back'));bk.onclick=showTitle;row.appendChild(bk);B.appendChild(row);};
 draw();}
// ---------- start / quit ----------
function startGame(save,isNew){P=fixSave(JSON.parse(JSON.stringify(save)));GAME.zoneMaps={};GAME.mobs=[];GAME.minions=[];GAME.abuffs=[];GAME.loot=[];GAME.dun=null;GAME.shops={};GAME.time=0;GAME.lastTown=-1;mkPlayerEntity();calcStats();
 if(isNew||!P.woke){const M=getZoneMap(0);P.zone=0;PE.x=M.town.cx+.5;PE.y=M.town.cy-3;PE.hp=1;}
 showScreen('game');closeAll();buildMenuBtns();buildHotbar();$('#chatlog').innerHTML='';
 const z=P.zone||0;enterZone(z,null,P.x?{x:P.x,y:P.y}:null);if(PE.hp<=0)PE.hp=PE.maxHp;
 if(isNew||!P.woke){P.woke=true;PE.hp=Math.round(PE.maxHp*.3);const elder=GAME.map.npcs.find(n=>n.role==='elder');PE.x=elder.x+1.5;PE.y=elder.y+1;unstick();
  setTimeout(()=>{banner(t('You wake...'),t('Hearthmoor, the Whisperwood'),3200);setTimeout(()=>{if(GAME.running&&!GAME.dun&&GAME.map&&GAME.map.z===0&&Math.hypot(PE.x-elder.x,PE.y-elder.y)<6)talkTo(elder);},1600);},300);saveGame(true);}
 updateTracker();net.start();net.updateMeta();chat(t('Welcome to {g}! Press H or the ☰ menu for controls.',{g:GAME_TITLE}),'#ffd24a');if(net.ok)net.track();}
function quitToTitle(){GAME.running=false;closeAll();net.joinZone(null);P=null;PE=null;showTitle();}
// ---------- boot ----------
function boot(){R.c=$('#gc');R.x=R.c.getContext('2d');resize();setupInput();if(OPT.touch!=null)setTouch(OPT.touch);else setTouch(matchMedia('(pointer:coarse)').matches);
 addEventListener('keydown',e=>{if(e.code==='KeyH'&&GAME.running&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))showHelp();});
 I18N_HOOKS.push(()=>{if(GAME.running){buildMenuBtns();buildHotbar();Object.keys(UI.wins).forEach(id=>{const W=UI.wins[id];W.e.remove();delete UI.wins[id];});UI.open.clear();updateTracker();}else if($('#s-title').classList.contains('on'))showTitle();else if($('#s-create').classList.contains('on'))showCreate();});
 addEventListener('beforeunload',()=>{if(P)saveGame(true);});document.addEventListener('visibilitychange',()=>{if(document.hidden&&P)saveGame(true);});
 showTitle();requestAnimationFrame(frame);
 window.DEBUG={GAME,get P(){return P;},get PE(){return PE;},PS,ZONES,DUNGEONS,QUESTS,AB,give:(it)=>invAdd(it),lvl:(n)=>{P.lvl=n;P.xp=0;calcStats();PE.hp=PE.maxHp;PE.res=PE.maxRes;UI.dirty=1;},gold:(n)=>{P.gold+=n;},
  tp:(z)=>enterZone(z,null,null),dun:(id)=>enterDungeon(id),learnAll:()=>{Object.values(AB).filter(a=>a.cls===P.cls&&a.lvl<=P.lvl).forEach(a=>P.abil[a.id]=Math.max(1,P.abil[a.id]||0));buildHotbar();},
  accept:(id)=>{const q=QUESTS[id];P.quests.a[id]={p:q.obj.map(()=>0),t:Date.now()};rebuildQuestObjects();},finishQuest:(id)=>{delete P.quests.a[id];P.quests.d[id]=1;},
  god:(v=true)=>{GAME.godmode=v;},legRate:(r)=>{GAME.debugLeg=r;},gear:(L,rar)=>{const C=CLASSES[P.cls];SLOTS.forEach(s=>{let it;if(s==='main')it=genGear(L,rar,{wt:C.weapons.find(w=>WEAPONS[w].h===2)||C.weapons[0],cls:P.cls});else if(s==='off')return;else if(s.startsWith('ring'))it=genGear(L,rar,{slot:'ring',cls:P.cls});else if(s==='amulet')it=genGear(L,rar,{slot:'amulet',cls:P.cls});else it=genGear(L,rar,{slot:s,arm:C.armor[C.armor.length-1]==='plate'&&L>=20&&P.plate?'plate':C.armor[0],cls:P.cls});P.eq[s]=it;});calcStats();PE.hp=PE.maxHp;}};}
boot();
