m9_6:{text:"La suma sacerdotisa Aelia guarda Zephyra, el último templo libre de las Islas del Cielo. Si los serafines han caído ante la Corona, ella sabrá cómo, y cómo subir hasta ellos.\n\nSube, Portador del Aura. Thunderhold defenderá la montaña. Y si alguna vez necesitas un martillo, ya sabes dónde vivimos.",done:"(La suma sacerdotisa Aelia toma la pluma, y le tiemblan las manos.) Es de Seraphiel. Nuestro guardián. Entonces es verdad. Les entregó nuestro cielo."},
d_thunder:{text:"Bajo la montaña, en las Profundidades de Thunderhold, Gorgrim Rompetormentas forja hierro de tormenta para la Corona Hueca. Es el Señor de la Guerra de los gigantes de la tormenta, el que rompió la vieja paz, y cada cadena que lleva la Corona salió de su yunque.\n\nBaja a las Profundidades y quiebra al Rompetormentas. Thunderhold defenderá las puertas a tu espalda.",done:"Las forjas bajo la montaña se han enfriado, y los gigantes que le servían han huido a las salas profundas. La vieja paz no está restaurada. Pero ahora puede estarlo. Thunderhold te debe una canción, y cantamos fuerte."},
m10_1:{text:"Seraphiel era nuestro guardián. Durante mil años permaneció en la Puerta de las Nubes y mantuvo la oscuridad bajo ellas. Entonces la Corona Hueca le susurró: que la humanidad destruiría el cielo como lo había destruido todo.\n\nLes creyó. Arrancó las alas a mis hermanas y entregó nuestro cielo al Rey Hueco. Zephyra es todo lo que queda.\n\nHas subido hasta aquí. Creo que al cielo aún le queda un poco de esperanza.",done:"El viento cambió cuando llegaste. Los viejos sacerdotes decían que eso significaba que había llegado un amigo. Yo había dejado de creerles. Gracias."},
m10_2:{text:"Los grifos eran las monturas sagradas de los sacerdotes del cielo. Sin sus jinetes se han vuelto salvajes, y ahora cazan a cualquiera que cruce los puentes entre las islas.\n\nEchálos de los puentes. Algún día, cuando el cielo vuelva a ser libre, los domaremos otra vez. Hoy necesitamos caminar.",done:"Los puentes están abiertos. Mis acólitas cruzaron al Santuario del Viento esta mañana y volvieron cantando. Hacía mucho que no pasaba."},
m10_3:{text:"Las guardas que mantenían la oscuridad bajo las nubes están rotas. Los textos antiguos dicen que se tejían con escamas de serpiente celeste, que retienen el viento como el cristal retiene la luz.\n\nTráeme escamas de serpiente celeste, y mis sacerdotisas empezarán a tejer de nuevo las guardas.",done:"La primera guarda está tejida, y resiste. Solo una pequeña, sobre Zephyra. Pero anoche la oscuridad no subió a través de las nubes."},
m10_4:{text:"Cuando Seraphiel cayó, los halos de los fieles se hicieron añicos en el Templo Roto. Sus fragmentos aún brillan, y la Corona Hueca los recoge, porque un halo roto es una puerta para lo que viene de abajo.\n\nRecoge los halos rotos antes de que la Corona pueda usarlos. Les daremos descanso.",done:"Los halos reposan en el altar de Zephyra. Están apagados, pero no a oscuras. La luz de mis hermanas no se ha ido del todo."},
m10_5:{text:"El exarca Valen era el segundo de Seraphiel. Fue Valen quien abrió la Puerta de las Nubes y dejó subir la oscuridad. Sigue allí, manteniéndola abierta para su señor.\n\nCierra la puerta. Derrota a Valen y tráeme lo que lleve.",done:"Un óbolo: una moneda de los muertos, fría como la tumba. Estaba destinada al Barquero de Hueso, que lleva a los muertos a través del Estigia.\n\nAsí que la Corona compra el cielo con mentiras y a los muertos con monedas. La oscuridad viene de abajo además de arriba, Portador del Aura."},
m10_6:{text:"Baja. Muy abajo, bajo las montañas, hasta el Pantano Estigio, donde corre el río de los muertos. Allí, en el Descanso de Caronte, vive un barquero: el que rechazó el trato de su hermano.\n\nLlévale el óbolo. Y cuando mires hacia arriba desde el pantano, recuerda que el cielo sigue aquí, y sigue siendo tuyo.",done:"(Un anciano de capa gris toma el óbolo y suspira.) La moneda de mi hermano. Bienvenido, vivo. Soy Caronte, el barquero que se negó. Siéntate. Tenemos mucho de qué hablar."},
d_aerie:{text:"Seraphiel el Caído aguarda en el Nido de los Caídos, el templo más alto de las Islas del Cielo. Era nuestro guardián, y ahora arranca las alas a los fieles y ofrece el cielo al Rey Hueco.\n\nNo te pido que lo odies. Te pido que lo detengas. Sube al Nido y acaba con el Traidor del Templo del Cielo.",done:"(Aelia guarda silencio un largo momento.) ¿No dijo nada al caer? No... creo que sintió alivio. El cielo está despejado, Portador del Aura. Mis hermanas volverán a volar."},
});

qadd('fr',{
m9_1:{text:"(Le thane Gorm fixe toujours l'entrave en fer-tempête d'un œil furieux.)\n\nThunderhold tient cette montagne depuis neuf cents ans. Mes ancêtres ont fait la paix avec les géants : à eux les salles profondes, à nous les hautes routes, et personne ne forge ce qu'il ne devrait pas. Maintenant les géants martèlent la foudre en chaînes chaque nuit, et les tempêtes sur le Stormspire n'ont pas cessé depuis un mois.\n\nQuelqu'un a rompu cette paix. Je veux savoir qui, et ensuite je veux le briser.",done:"Tu es venu de la jungle pour m'apporter de mauvaises nouvelles. C'est courageux ou stupide, et à Thunderhold on boit aux deux. Assieds-toi."},
m9_2:{text:"Les harpies des tempêtes descendent sur les hautes routes en chevauchant la foudre et déchiquettent tout ce qui bouge : marchands, bergers, mes propres patrouilles. Les tempêtes les nourrissent ; elles n'ont jamais été aussi nombreuses.\n\nDégage les routes autour de Thunderhold. Si nous ne pouvons pas voyager, nous ne pouvons pas combattre.",done:"Les marchands sont montés par la haute route ce matin sans perdre une seule mule. Les harpies hurlent sur les sommets, mais elles gardent leurs distances maintenant."},
m9_3:{text:"Les béliers-tonnerre étaient des bêtes paisibles ; nos bergers les montaient. Maintenant ils chargent tout ce qui bouge, des étincelles crépitant dans leurs cornes, comme si la tempête elle-même les rendait fous.\n\nRapporte-moi leurs cornes. Mes forgerons de runes peuvent y lire la tempête et me dire d'où on l'appelle.",done:"Les forgerons de runes ont fendu une corne et elle a vibré comme une cloche frappée. La tempête est bien appelée : depuis le Champ des Flèches, où les géants ont dressé leurs paratonnerres."},
m9_4:{text:"Dans le Champ des Flèches, les géants ont dressé des tiges de fer plus hautes que n'importe quel arbre. Elles arrachent la foudre au ciel et la mènent aux forges sous la montagne, où elle devient fer-tempête.\n\nAbats les tiges. Sans foudre, pas de fer-tempête. Sans fer-tempête, pas de chaînes pour la Couronne Creuse.",done:"Le ciel au-dessus du Stormspire est dégagé pour la première fois depuis un mois. Mon peuple est monté sur les remparts juste pour regarder les étoiles. C'est toi qui as fait ça."},
m9_5:{text:"Les géants obéissent à Fend-le-Ciel, le plus grand d'entre eux, qui se dresse sur le Pic du Tonnerre et réveille les tempêtes en hurlant. C'est lui qui a conclu le marché avec la Couronne Creuse : leur or et leurs promesses contre sa foudre.\n\nAbats-le. Et rapporte-moi ce avec quoi la Couronne l'a payé.",done:"Une plume d'un blanc et d'un or purs, tiède au toucher, venue des Îles Célestes au-dessus des nuages. La Couronne ne l'a pas payé en or. Elle l'a payé avec une plume de séraphin : la promesse d'une place parmi les dieux.\n\nLes séraphins de Zephyra sont avec le Roi Creux. Par le marteau et le tonnerre, même le ciel est tombé."},
m9_6:{text:"La grande prêtresse Aelia garde Zephyra, le dernier temple libre des Îles Célestes. Si les séraphins sont tombés aux mains de la Couronne, elle saura comment, et comment monter jusqu'à eux.\n\nMonte, Porteur de l'Aura. Thunderhold tiendra la montagne. Et si un jour tu as besoin d'un marteau, tu sais où nous trouver.",done:"(La grande prêtresse Aelia prend la plume, et ses mains tremblent.) C'est celle de Seraphiel. Notre gardien. C'est donc vrai. Il leur a donné notre ciel."},
d_thunder:{text:"Sous la montagne, dans les Profondeurs de Thunderhold, Gorgrim Brise-Tempête forge le fer-tempête pour la Couronne Creuse. C'est le Seigneur de guerre des géants des tempêtes, celui qui a rompu l'ancienne paix, et chaque chaîne que porte la Couronne est sortie de son enclume.\n\nDescends dans les Profondeurs et brise le Brise-Tempête. Thunderhold tiendra les portes derrière toi.",done:"Les forges sous la montagne se sont refroidies, et les géants qui le servaient ont fui dans les salles profondes. L'ancienne paix n'est pas rétablie. Mais elle peut l'être, maintenant. Thunderhold te doit une chanson, et nous chantons fort."},
m10_1:{text:"Seraphiel était notre gardien. Pendant mille ans, il s'est tenu à la Porte des Nuées et a maintenu les ténèbres sous les nuages. Puis la Couronne Creuse est venue lui murmurer que l'humanité détruirait le ciel comme elle avait détruit tout le reste.\n\nIl les a crus. Il a arraché les ailes de mes sœurs et donné notre ciel au Roi Creux. Zephyra est tout ce qui reste.\n\nTu es monté jusqu'ici. Je crois que le ciel garde encore un peu d'espoir.",done:"Le vent a tourné quand tu es arrivé. Les anciens prêtres disaient que cela signifiait l'arrivée d'un ami. J'avais cessé de les croire. Merci."},
m10_2:{text:"Les griffons étaient les montures sacrées des prêtres du ciel. Sans leurs cavaliers, ils sont redevenus sauvages, et maintenant ils chassent quiconque emprunte les ponts entre les îles.\n\nChasse-les des ponts. Un jour, quand le ciel sera libre, nous les apprivoiserons de nouveau. Aujourd'hui, nous avons besoin de marcher.",done:"Les ponts sont ouverts. Mes acolytes ont traversé jusqu'au Sanctuaire du Vent ce matin et sont revenues en chantant. Cela n'était pas arrivé depuis longtemps."},
m10_3:{text:"Les protections qui maintenaient les ténèbres sous les nuages sont brisées. Les anciens textes disent qu'elles étaient tissées d'écailles de serpent céleste, qui retiennent le vent comme le verre retient la lumière.\n\nRapporte-moi des écailles de serpent céleste, et mes prêtresses recommenceront à tisser les protections.",done:"La première protection est tissée, et elle tient. Une petite seulement, au-dessus de Zephyra. Mais cette nuit, les ténèbres ne sont pas montées à travers les nuages."},
m10_4:{text:"Quand Seraphiel est tombé, les auréoles des fidèles se sont brisées dans le Temple Brisé. Leurs éclats brillent encore, et la Couronne Creuse les ramasse, car une auréole brisée est une porte pour ce qui vient d'en bas.\n\nRamasse les auréoles brisées avant que la Couronne ne s'en serve. Nous leur donnerons le repos.",done:"Les auréoles reposent sur l'autel de Zephyra. Elles sont ternes, mais pas éteintes. La lumière de mes sœurs n'a pas entièrement disparu."},
m10_5:{text:"L'exarque Valen était le second de Seraphiel. C'est Valen qui a ouvert la Porte des Nuées et laissé monter les ténèbres. Il s'y tient encore, la maintenant ouverte pour son maître.\n\nFerme la porte. Vaincs Valen et rapporte-moi ce qu'il porte.",done:"Une obole : une pièce des morts, froide comme la tombe. Elle était destinée au Passeur d'Os, qui fait traverser le Styx aux morts.\n\nLa Couronne achète donc le ciel avec des mensonges et les morts avec des pièces. Les ténèbres viennent d'en bas autant que d'en haut, Porteur de l'Aura."},
m10_6:{text:"Descends. Très bas, sous les montagnes, jusqu'au Marais du Styx, où coule le fleuve des morts. Un passeur vit là-bas, au Repos de Charon : celui qui a refusé le marché de son frère.\n\nPorte-lui l'obole. Et quand tu lèveras les yeux depuis le marais, souviens-toi que le ciel est toujours là, et qu'il est toujours à toi.",done:"(Un vieil homme en cape grise prend l'obole et soupire.) La pièce de mon frère. Bienvenue, vivant. Je suis Charon, le passeur qui a refusé. Assieds-toi. Nous avons beaucoup à nous dire."},
d_aerie:{text:"Seraphiel le Déchu attend dans l'Aire des Déchus, le plus haut temple des Îles Célestes. Il était notre gardien, et maintenant il arrache les ailes des fidèles et offre le ciel au Roi Creux.\n\nJe ne te demande pas de le haïr. Je te demande de l'arrêter. Monte dans l'Aire et mets fin au Traître du Temple Céleste.",done:"(Aelia reste longtemps silencieuse.) Il n'a rien dit en tombant ? Non... je crois qu'il était soulagé. Le ciel est dégagé, Porteur de l'Aura. Mes sœurs voleront de nouveau."},
});

qadd('it',{
m9_1:{text:"(Il thane Gorm fissa ancora furioso il ceppo di ferro della tempesta.)\n\nThunderhold difende questa montagna da novecento anni. I miei antenati fecero pace con i giganti: loro tengono le sale profonde, noi le strade alte, e nessuno forgia ciò che non dovrebbe. Ora i giganti martellano fulmini in catene ogni notte, e le tempeste sopra Stormspire non si fermano da un mese.\n\nQualcuno ha rotto quella pace. Voglio sapere chi, e poi voglio spezzarlo.",done:"Sei venuto fin dalla giungla per portarmi cattive notizie. È coraggio o stupidità, e a Thunderhold brindiamo a entrambi. Siediti."},
m9_2:{text:"Le arpie della tempesta scendono cavalcando i fulmini sulle strade alte e fanno a pezzi tutto ciò che si muove: mercanti, pastori, le mie stesse pattuglie. Le tempeste le nutrono; non sono mai state così tante.\n\nLibera le strade attorno a Thunderhold. Se non possiamo viaggiare, non possiamo combattere.",done:"I mercanti sono saliti per la strada alta stamattina senza perdere un solo mulo. Le arpie strillano sulle vette, ma ora tengono le distanze."},
m9_3:{text:"Gli arieti del tuono erano bestie mansuete; i nostri pastori li cavalcavano. Ora caricano tutto ciò che si muove, con scintille che crepitano nelle corna, come se la tempesta stessa li facesse impazzire.\n\nPortami le loro corna. I miei fabbri runici sanno leggervi la tempesta e dirmi da dove viene chiamata.",done:"I fabbri runici hanno spaccato un corno e ha vibrato come una campana percossa. La tempesta viene chiamata, eccome: dal Campo delle Guglie, dove i giganti hanno eretto i loro parafulmini."},
m9_4:{text:"Nel Campo delle Guglie, i giganti hanno eretto aste di ferro più alte di qualsiasi albero. Strappano il fulmine al cielo e lo portano alle forge sotto la montagna, dove diventa ferro della tempesta.\n\nAbbatti le aste. Niente fulmini, niente ferro della tempesta. Niente ferro della tempesta, niente catene per la Corona Cava.",done:"Il cielo sopra Stormspire è sereno per la prima volta in un mese. La mia gente è salita sulle mura solo per guardare le stelle. L'hai fatto tu."},
m9_5:{text:"I giganti obbediscono a Squarciacieli, il più grande di loro, che sta sul Picco del Tuono e sveglia le tempeste a forza di urla. È lui che ha stretto il patto con la Corona Cava: il loro oro e le loro promesse in cambio dei suoi fulmini.\n\nAbbattilo. E portami ciò con cui la Corona lo ha pagato.",done:"Una piuma di bianco e oro puri, tiepida al tatto, dalle Isole del Cielo sopra le nubi. La Corona non lo ha pagato con l'oro. Lo ha pagato con una piuma di serafino: la promessa di un posto tra gli dèi.\n\nI serafini di Zephyra stanno con il Re Cavo. Per il martello e il tuono, perfino il cielo è caduto."},
m9_6:{text:"L'alta sacerdotessa Aelia custodisce Zephyra, l'ultimo tempio libero delle Isole del Cielo. Se i serafini sono caduti in mano alla Corona, lei saprà come, e come salire fino a loro.\n\nSali, Portatore dell'Aura. Thunderhold terrà la montagna. E se mai ti servirà un martello, sai dove abitiamo.",done:"(L'alta sacerdotessa Aelia prende la piuma, e le sue mani tremano.) È di Seraphiel. Il nostro guardiano. Dunque è vero. Ha dato loro il nostro cielo."},
d_thunder:{text:"Sotto la montagna, nelle Profondità di Thunderhold, Gorgrim Spezzatempeste forgia ferro della tempesta per la Corona Cava. È il Signore della Guerra dei giganti della tempesta, colui che ha rotto l'antica pace, e ogni catena che la Corona porta è uscita dalla sua incudine.\n\nScendi nelle Profondità e spezza lo Spezzatempeste. Thunderhold terrà i cancelli alle tue spalle.",done:"Le forge sotto la montagna si sono raffreddate, e i giganti che lo servivano sono fuggiti nelle sale profonde. L'antica pace non è ristabilita. Ma ora può esserlo. Thunderhold ti deve una canzone, e cantiamo forte."},
m10_1:{text:"Seraphiel era il nostro guardiano. Per mille anni rimase alla Porta delle Nubi e tenne l'oscurità sotto di esse. Poi la Corona Cava gli sussurrò che l'umanità avrebbe distrutto il cielo come aveva distrutto tutto il resto.\n\nLui ci credette. Strappò le ali alle mie sorelle e diede il nostro cielo al Re Cavo. Zephyra è tutto ciò che resta.\n\nSei salito fin quassù. Credo che al cielo resti ancora un po' di speranza.",done:"Il vento è cambiato quando sei arrivato. I vecchi sacerdoti dicevano che significava l'arrivo di un amico. Avevo smesso di crederci. Grazie."},
m10_2:{text:"I grifoni erano le cavalcature sacre dei sacerdoti del cielo. Senza i loro cavalieri sono tornati selvaggi, e ora cacciano chiunque attraversi i ponti tra le isole.\n\nScacciali dai ponti. Un giorno, quando il cielo sarà di nuovo libero, li addomesticheremo ancora. Oggi abbiamo bisogno di camminare.",done:"I ponti sono aperti. Le mie accolite hanno attraversato fino al Santuario del Vento stamattina e sono tornate cantando. Non accadeva da tanto tempo."},
m10_3:{text:"Le difese che tenevano l'oscurità sotto le nubi sono infrante. I testi antichi dicono che erano tessute con scaglie di serpente celeste, che trattengono il vento come il vetro trattiene la luce.\n\nPortami scaglie di serpente celeste, e le mie sacerdotesse ricominceranno a tessere le difese.",done:"La prima difesa è tessuta, e regge. Solo una piccola, sopra Zephyra. Ma stanotte l'oscurità non è salita attraverso le nubi."},
m10_4:{text:"Quando Seraphiel cadde, le aureole dei fedeli andarono in frantumi nel Tempio Infranto. I loro frammenti brillano ancora, e la Corona Cava li raccoglie, perché un'aureola infranta è una porta per ciò che viene dal basso.\n\nRaccogli le aureole infrante prima che la Corona possa usarle. Daremo loro riposo.",done:"Le aureole riposano sull'altare di Zephyra. Sono fioche, ma non spente. La luce delle mie sorelle non se n'è andata del tutto."},
m10_5:{text:"L'esarca Valen era il secondo di Seraphiel. Fu Valen ad aprire la Porta delle Nubi e a far salire l'oscurità. È ancora lì, a tenerla aperta per il suo signore.\n\nChiudi la porta. Sconfiggi Valen e portami ciò che ha con sé.",done:"Un obolo: una moneta dei morti, fredda come la tomba. Era destinata al Traghettatore d'Ossa, che porta i morti attraverso lo Stige.\n\nDunque la Corona compra il cielo con le menzogne e i morti con le monete. L'oscurità viene dal basso oltre che dall'alto, Portatore dell'Aura."},
m10_6:{text:"Scendi. Molto in basso, sotto le montagne, fino alla Palude dello Stige, dove scorre il fiume dei morti. Lì, al Riposo di Caronte, vive un traghettatore: quello che rifiutò il patto di suo fratello.\n\nPortagli l'obolo. E quando alzerai gli occhi dalla palude, ricorda che il cielo è ancora qui, ed è ancora tuo.",done:"(Un vecchio dal mantello grigio prende l'obolo e sospira.) La moneta di mio fratello. Benvenuto, vivente. Sono Caronte, il traghettatore che rifiutò. Siediti. Abbiamo molto di cui parlare."},
d_aerie:{text:"Seraphiel il Caduto attende nel Nido dei Caduti, il tempio più alto delle Isole del Cielo. Era il nostro guardiano, e ora strappa le ali ai fedeli e offre il cielo al Re Cavo.\n\nNon ti chiedo di odiarlo. Ti chiedo di fermarlo. Sali nel Nido e poni fine al Traditore del Tempio del Cielo.",done:"(Aelia resta in silenzio a lungo.) Non ha detto nulla cadendo? No... credo fosse sollevato. Il cielo è sereno, Portatore dell'Aura. Le mie sorelle voleranno di nuovo."},
});

qadd('pt',{
m9_1:{text:"(O thane Gorm ainda encara furioso o grilhão de ferro da tempestade.)\n\nThunderhold defende esta montanha há novecentos anos. Meus antepassados fizeram as pazes com os gigantes: eles ficam com os salões profundos, nós com as estradas altas, e ninguém forja o que não deve. Agora os gigantes martelam raios em correntes toda noite, e as tempestades sobre Stormspire não param há um mês.\n\nAlguém quebrou essa paz. Quero saber quem, e depois quero quebrá-lo.",done:"Você veio lá da selva para me trazer más notícias. Isso é coragem ou burrice, e em Thunderhold brindamos às duas. Sente-se."},
m9_2:{text:"As harpias da tempestade descem montadas no raio sobre as estradas altas e despedaçam tudo o que se move: mercadores, pastores, minhas próprias patrulhas. As tempestades as alimentam; nunca foram tantas.\n\nLimpe as estradas ao redor de Thunderhold. Se não podemos viajar, não podemos lutar.",done:"Os mercadores subiram a estrada alta esta manhã sem perder uma só mula. As harpias guincham nos picos, mas agora mantêm distância."},
m9_3:{text:"Os carneiros-trovão eram bichos mansos; nossos pastores os montavam. Agora atacam tudo o que se move, com faíscas estalando nos chifres, como se a própria tempestade os enlouquecesse.\n\nTraga-me os chifres deles. Meus ferreiros rúnicos conseguem ler a tempestade neles e me dizer de onde ela está sendo chamada.",done:"Os ferreiros rúnicos abriram um chifre e ele zumbiu como um sino batido. A tempestade está sendo chamada, sim: do Campo das Agulhas, onde os gigantes ergueram seus para-raios."},
m9_4:{text:"No Campo das Agulhas, os gigantes ergueram hastes de ferro mais altas que qualquer árvore. Elas puxam o raio do céu e o levam às forjas sob a montanha, onde vira ferro da tempestade.\n\nDerrube as hastes. Sem raio, não há ferro da tempestade. Sem ferro da tempestade, não há correntes para a Coroa Oca.",done:"O céu sobre Stormspire está limpo pela primeira vez em um mês. Meu povo subiu nas muralhas só para olhar as estrelas. Foi você."},
m9_5:{text:"Os gigantes obedecem a Rasga-Céus, o maior deles, que fica no Pico do Trovão e desperta as tempestades aos berros. Foi ele quem fez o acordo com a Coroa Oca: o ouro e as promessas deles pelo seu raio.\n\nDerrube-o. E traga-me aquilo com que a Coroa o pagou.",done:"Uma pena de branco e ouro puros, morna ao toque, das Ilhas do Céu acima das nuvens. A Coroa não o pagou com ouro. Pagou com uma pena de serafim: a promessa de um lugar entre os deuses.\n\nOs serafins de Zephyra estão com o Rei Oco. Pelo martelo e pelo trovão, até o céu caiu."},
m9_6:{text:"A suma sacerdotisa Aelia guarda Zephyra, o último templo livre das Ilhas do Céu. Se os serafins caíram diante da Coroa, ela saberá como, e como subir até eles.\n\nSuba, Portador da Aura. Thunderhold defenderá a montanha. E se um dia precisar de um martelo, você sabe onde moramos.",done:"(A suma sacerdotisa Aelia pega a pena, e suas mãos tremem.) É de Seraphiel. Nosso guardião. Então é verdade. Ele entregou a eles o nosso céu."},
d_thunder:{text:"Sob a montanha, nas Profundezas de Thunderhold, Gorgrim Quebra-Tempestades forja ferro da tempestade para a Coroa Oca. Ele é o Senhor da Guerra dos gigantes da tempestade, quem quebrou a velha paz, e cada corrente que a Coroa carrega saiu da sua bigorna.\n\nDesça às Profundezas e quebre o Quebra-Tempestades. Thunderhold defenderá os portões atrás de você.",done:"As forjas sob a montanha esfriaram, e os gigantes que o serviam fugiram para os salões profundos. A velha paz não foi restaurada. Mas agora pode ser. Thunderhold lhe deve uma canção, e cantamos alto."},
m10_1:{text:"Seraphiel era nosso guardião. Por mil anos ficou no Portão das Nuvens e manteve a escuridão abaixo delas. Então a Coroa Oca lhe sussurrou: que a humanidade destruiria o céu como tinha destruído todo o resto.\n\nEle acreditou. Arrancou as asas das minhas irmãs e entregou nosso céu ao Rei Oco. Zephyra é tudo o que resta.\n\nVocê subiu até aqui. Acho que o céu ainda tem um pouco de esperança.",done:"O vento mudou quando você chegou. Os velhos sacerdotes diziam que isso significava a chegada de um amigo. Eu tinha parado de acreditar neles. Obrigada."},
m10_2:{text:"Os grifos eram as montarias sagradas dos sacerdotes do céu. Sem seus cavaleiros, ficaram selvagens, e agora caçam qualquer um que atravesse as pontes entre as ilhas.\n\nExpulse-os das pontes. Um dia, quando o céu estiver livre, vamos domá-los de novo. Hoje precisamos caminhar.",done:"As pontes estão abertas. Minhas acólitas atravessaram até o Santuário do Vento esta manhã e voltaram cantando. Fazia muito tempo que isso não acontecia."},
m10_3:{text:"As proteções que mantinham a escuridão abaixo das nuvens estão quebradas. Os textos antigos dizem que eram tecidas com escamas de serpente celeste, que seguram o vento como o vidro segura a luz.\n\nTraga-me escamas de serpente celeste, e minhas sacerdotisas começarão a tecer as proteções de novo.",done:"A primeira proteção está tecida, e resiste. Só uma pequena, sobre Zephyra. Mas ontem à noite a escuridão não subiu pelas nuvens."},
m10_4:{text:"Quando Seraphiel caiu, as auréolas dos fiéis se partiram no Templo Quebrado. Os fragmentos ainda brilham, e a Coroa Oca os recolhe, porque uma auréola partida é uma porta para o que vem de baixo.\n\nRecolha as auréolas partidas antes que a Coroa possa usá-las. Vamos dar descanso a elas.",done:"As auréolas repousam no altar de Zephyra. Estão fracas, mas não apagadas. A luz das minhas irmãs não se foi de todo."},
m10_5:{text:"O exarca Valen era o segundo de Seraphiel. Foi Valen quem abriu o Portão das Nuvens e deixou a escuridão subir. Ele continua lá, mantendo-o aberto para seu senhor.\n\nFeche o portão. Derrote Valen e traga-me o que ele carregar.",done:"Um óbolo: uma moeda dos mortos, fria como o túmulo. Era destinada ao Barqueiro de Ossos, que leva os mortos através do Estige.\n\nEntão a Coroa compra o céu com mentiras e os mortos com moedas. A escuridão vem de baixo tanto quanto de cima, Portador da Aura."},
m10_6:{text:"Desça. Bem fundo, abaixo das montanhas, até o Pântano do Estige, onde corre o rio dos mortos. Lá, no Repouso de Caronte, vive um barqueiro: o que recusou o acordo do irmão.\n\nLeve o óbolo a ele. E quando olhar para cima lá do pântano, lembre-se de que o céu ainda está aqui, e ainda é seu.",done:"(Um velho de manto cinzento pega o óbolo e suspira.) A moeda do meu irmão. Bem-vindo, vivo. Sou Caronte, o barqueiro que recusou. Sente-se. Temos muito a conversar."},
d_aerie:{text:"Seraphiel, o Caído, espera no Ninho dos Caídos, o templo mais alto das Ilhas do Céu. Ele era nosso guardião, e agora arranca as asas dos fiéis e oferece o céu ao Rei Oco.\n\nNão peço que você o odeie. Peço que o detenha. Suba ao Ninho e acabe com o Traidor do Templo do Céu.",done:"(Aelia fica em silêncio por um longo momento.) Ele não disse nada ao cair? Não... acho que sentiu alívio. O céu está limpo, Portador da Aura. Minhas irmãs voltarão a voar."},
});

qadd('de',{
m11_1:{text:"(Charon dreht den Obolus zwischen seinen grauen Fingern.)\n\nMein Bruder und ich setzten die Toten über den Styx, noch bevor eure Königreiche Namen hatten. Eine Überfahrt in jede Richtung: Die Lebenden kehrten nie zurück, und das war das Gesetz. Dann kam die Hohle Krone mit einer Truhe voller dieser Münzen an den Anleger und bat ihn, in die andere Richtung zu rudern.\n\nEr nahm die Münze. Ich nicht. Jetzt bringt er die Toten zurück ans Ufer, und sie steigen heraus, um für den Hohlen König zu kämpfen. Ich blieb hier an meinem Feuer, damit sich jemand an das Gesetz erinnert.",done:"Du hast einem alten Fährmann bis zum Ende zugehört. Die meisten Lebenden tun das nicht. Bleib eine Weile. Der Sumpf ist grausam, aber mein Feuer ist warm."},
m11_2:{text:"Die Ghule waren die ersten, die mein Bruder zurückbrachte. Sie erinnern sich an den Hunger und an sonst nichts. Sie graben in den Ghulbauten und schleichen den Pfad der Trauernden hinauf, um die zu fressen, die noch ihre Toten besuchen.\n\nGib ihnen Ruhe. Hasse sie nicht; sie haben nicht gewählt zurückzukehren. Gib sie einfach dem Fluss zurück.",done:"Die Trauernden sind heute den Pfad gegangen, und niemand wurde geholt. Eine alte Frau hat eine Blume vor meine Tür gelegt. Sie ist für dich."},
m11_3:{text:"Die Schatten sind schlimmer. Sie sind leer, und um sich zu füllen, verschlingen sie die Seelen der frisch Verstorbenen, bevor diese den Fluss erreichen. Man sieht sie darin, kleine Lichter, gefangen wie Motten im Glas.\n\nZerbrich die Schatten und befreie die Seelenirrlichter. Bring sie mir, und ich setze sie auf die rechte Weise über: die letzte Fahrt eines ehrlichen Fährmanns.",done:"(Charon birgt die Irrlichter in den Händen und haucht sie an, und sie leuchten heller.) So. Heute Nacht setzen sie über. Irgendwo findet jemand endlich Frieden und kennt nicht einmal deinen Namen."},
m11_4:{text:"In den Laternengräbern hatte einst jedes Grab eine Laterne, damit die Toten den Weg zum Fluss fanden. Die Diener der Krone haben sie gelöscht. Nun irren die Seelen verloren durch den Sumpf, und das Boot meines Bruders sammelt sie ein wie Netze die Fische.\n\nEntzünde die Grablaternen wieder. Gib den Verlorenen einen Weg, der nicht zu ihm führt.",done:"Sieh über den Sumpf. Kleine Lichter, alle in einer Reihe, alle in die richtige Richtung. Zum ersten Mal seit einem Jahr kam das Boot meines Bruders leer zurück."},
m11_5:{text:"Am Anleger der Schwarzen Fähre steht ein Ritter, der weint, während er kämpft. Er war einer der Besten Aurelions, gefallen auf den Mauern der Verbrannten Lande, und mein Bruder brachte ihn in Ketten zurück. Er weiß, was er tut. Er kann nicht aufhören.\n\nEr bewacht den Anleger für die Legion. Befreie ihn, Träger der Aura, und bring mir die Befehle, die er bei sich trägt.",done:"(Charon liest die Befehle, und sein Gesicht verhärtet sich.) Marschbefehle für die Hohle Legion. Jede Seele, die mein Bruder zurückbringt, wird in die Obsidianwüste geschickt und in der Schmiede bewaffnet. Sie stellen ein Heer aus unseren eigenen Toten auf, und sie marschieren auf das Basalttor.\n\nDer Ritter hörte auf zu weinen, als er fiel. Er sagte danke."},
m11_6:{text:"Marschall Ignatius hält das Basalttor, die letzte Mauer zwischen der Obsidianwüste und der Welt der Lebenden. Er ist ein harter Mann, und es wird ihm nicht gefallen, woher du kommst. Zeig ihm die Befehle trotzdem.\n\nGeh, Lebender. Und wenn du den Fluss wieder überquerst, bezahl meinen Bruder nicht. Sag ihm, Charon sagt, das Gesetz gilt noch.",done:"(Marschall Ignatius liest die Befehle zweimal und zerdrückt sie dann in seinem Panzerhandschuh.) Sie sind in der Handschrift meines alten Kommandanten verfasst. Eines Mannes, den ich selbst begraben habe."},
d_styxgate:{text:"Mein Bruder wartet an den Toren des Styx. Den Knochenfährmann nennen sie ihn jetzt. Er hat die Tore der Toten geöffnet, und jede Nacht rudert er eine weitere Bootsladung Seelen zurück, um dem Hohlen König zu dienen.\n\nEr war nicht immer so. Früher sang er den Toten beim Rudern vor. Doch er nahm die Münze, und die Münze ist hohl, und nun ist er es auch.\n\nGeh durch die Tore. Zerbrich sein Ruder. Wenn noch etwas von meinem Bruder übrig ist, sag ihm, dass ich das Feuer am Brennen gehalten habe.",done:"(Charon schweigt lange.) Die Tore sind geschlossen. Der Fluss fließt wieder nur in eine Richtung. Danke. Die Nächsten rudere ich selbst hinüber, wie es sich gehört. Und ich werde ihnen vorsingen, für uns beide."},
d_ferry:{text:"Unter dem Sumpf liegt die Halle der Verlorenen Seelen, wo Morwen die Seelenweberin die Seelen, die mein Bruder stiehlt, zu Fäden spinnt und die Fäden zu Rüstungen für die Hohle Legion webt. Jede Platte, die die Legionäre tragen, ist aus jemandem gewoben, der geliebt wurde.\n\nZerschneide ihren Webstuhl. Löse ihr Werk auf. Lass sie gehen.",done:"(Ein warmer Wind zieht durch Charons Rast und trägt tausend leise Stimmen.) Hörst du das? Das sind alle Seelen, die sie gewoben hat, endlich auf der Überfahrt. Das warst du. Morgen werden die Rüstungen der Legion dünner sein."},
});
qadd('pt',{
m11_1:{text:"(Caronte gira o óbolo entre os dedos cinzentos.)\n\nEu e meu irmão levamos os mortos através do Estige desde antes de seus reinos terem nome. Uma passagem em cada sentido: os vivos nunca voltavam, e essa era a lei. Então a Coroa Oca chegou ao cais com um baú destas moedas e pediu que ele remasse no sentido contrário.\n\nEle aceitou a moeda. Eu não. Agora ele traz os mortos de volta à margem, e eles saem da água para lutar pelo Rei Oco. Eu fiquei aqui, junto ao meu fogo, para que alguém se lembrasse da lei.",done:"Você ouviu um velho barqueiro até o fim. A maioria dos vivos não faz isso. Fique um pouco. O pântano é cruel, mas meu fogo é quente."},
m11_2:{text:"Os carniçais foram os primeiros que meu irmão trouxe de volta. Lembram-se da fome e de mais nada. Cavam nas Tocas dos Carniçais e sobem o Caminho dos Enlutados para devorar quem ainda vem visitar seus mortos.\n\nDê descanso a eles. Não os odeie; eles não escolheram voltar. Apenas devolva-os ao rio.",done:"Os enlutados percorreram o caminho hoje, e ninguém foi levado. Uma velha deixou uma flor na minha porta. É para você."},
m11_3:{text:"As sombras são piores. São vazias, e para se encherem engolem as almas dos recém-mortos antes que cheguem ao rio. Dá para vê-las lá dentro, luzinhas presas como mariposas num frasco.\n\nQuebre as sombras e liberte os fogos-fátuos de alma. Traga-os para mim, e eu os farei atravessar como se deve: a última passagem de um barqueiro honesto.",done:"(Caronte acolhe os fogos-fátuos nas mãos e sopra sobre eles, e eles brilham mais.) Pronto. Esta noite eles atravessam. Em algum lugar, alguém finalmente descansa em paz, sem nem saber o seu nome."},
m11_4:{text:"Nos Túmulos das Lanternas, cada túmulo tinha uma lanterna para que os mortos encontrassem o caminho até o rio. Os servos da Coroa as apagaram. Agora as almas vagam perdidas pelo pântano, e o barco do meu irmão as recolhe como redes recolhem peixes.\n\nAcenda de novo as lanternas dos túmulos. Dê aos perdidos um caminho que não leve até ele.",done:"Olhe o pântano. Luzinhas, todas em fila, todas na direção certa. Pela primeira vez em um ano, o barco do meu irmão voltou vazio."},
m11_5:{text:"No Cais da Balsa Negra há um cavaleiro que chora enquanto luta. Era um dos melhores de Aurelion, morto nas muralhas das Terras Queimadas, e meu irmão o trouxe de volta acorrentado. Ele sabe o que está fazendo. Não consegue parar.\n\nEle guarda o cais para a Legião. Liberte-o, Portador da Aura, e traga-me as ordens que ele carregar.",done:"(Caronte lê as ordens e seu rosto endurece.) Ordens de marcha para a Legião Oca. Cada alma que meu irmão traz de volta é enviada aos Ermos de Obsidiana e armada na Forja. Estão formando um exército com nossos próprios mortos, e marcham sobre o Portão de Basalto.\n\nO cavaleiro parou de chorar ao cair. Disse obrigado."},
m11_6:{text:"O marechal Ignatius defende o Portão de Basalto, a última muralha entre os Ermos de Obsidiana e o mundo dos vivos. É um homem duro, e não vai gostar de saber de onde você veio. Mostre as ordens a ele mesmo assim.\n\nVá, vivo. E quando atravessar o rio de volta, não pague meu irmão. Diga a ele que Caronte diz que a lei ainda vale.",done:"(O marechal Ignatius lê as ordens duas vezes e depois as esmaga na manopla.) Estão escritas pela mão do meu antigo comandante. Um homem que eu mesmo enterrei."},
d_styxgate:{text:"Meu irmão espera nos Portões do Estige. Agora o chamam de Barqueiro de Ossos. Ele abriu os portões dos mortos, e toda noite rema com mais uma barca de almas de volta para servir ao Rei Oco.\n\nNem sempre foi assim. Antes ele cantava para os mortos enquanto remava. Mas aceitou a moeda, e a moeda é oca, e agora ele também é.\n\nAtravesse os Portões. Quebre o remo dele. Se restar algo do meu irmão, diga que mantive o fogo aceso.",done:"(Caronte fica em silêncio por muito tempo.) Os portões estão fechados. O rio voltou a correr num só sentido. Obrigado. Os próximos eu mesmo levarei, como deve ser. E cantarei para eles, por nós dois."},
d_ferry:{text:"Sob o pântano fica o Salão das Almas Perdidas, onde Morwen, a Tecelã de Almas, fia em linha as almas que meu irmão rouba, e tece com a linha armaduras para a Legião Oca. Cada placa que os legionários usam é tecida de alguém que foi amado.\n\nCorte o tear dela. Desfaça sua obra. Deixe-os partir.",done:"(Um vento morno atravessa o Repouso de Caronte, levando mil vozes tranquilas.) Está ouvindo? São todas as almas que ela teceu, atravessando enfim. Foi você. Amanhã as armaduras da Legião estarão mais finas."},
});
qadd('it',{
m11_1:{text:"(Caronte rigira l'obolo tra le dita grigie.)\n\nIo e mio fratello traghettavamo i morti attraverso lo Stige da prima che i vostri regni avessero un nome. Un passaggio per ogni verso: i vivi non tornavano mai, e quella era la legge. Poi la Corona Cava venne all'approdo con uno scrigno di queste monete e gli chiese di remare nell'altro senso.\n\nLui prese la moneta. Io no. Ora riporta i morti a riva, e loro escono dall'acqua per combattere per il Re Cavo. Io sono rimasto qui, al mio fuoco, perché qualcuno ricordasse la legge.",done:"Hai ascoltato un vecchio traghettatore fino alla fine. La maggior parte dei vivi non lo fa. Resta un po'. La palude è crudele, ma il mio fuoco è caldo."},
m11_2:{text:"I ghoul furono i primi che mio fratello riportò indietro. Ricordano la fame e nient'altro. Scavano nelle Tane dei Ghoul e strisciano sul Sentiero dei Dolenti per divorare chi ancora viene a trovare i propri morti.\n\nDai loro riposo. Non odiarli; non hanno scelto di tornare. Restituiscili soltanto al fiume.",done:"Oggi i dolenti hanno percorso il sentiero, e nessuno è stato preso. Una vecchia ha lasciato un fiore alla mia porta. È per te."},
m11_3:{text:"Le ombre sono peggio. Sono vuote, e per riempirsi inghiottono le anime dei morti recenti prima che raggiungano il fiume. Le vedi dentro di loro, piccole luci intrappolate come falene in un barattolo.\n\nSpezza le ombre e libera i fuochi fatui delle anime. Portameli, e li farò attraversare come si deve: l'ultimo passaggio di un traghettatore onesto.",done:"(Caronte raccoglie i fuochi fatui tra le mani e ci soffia sopra, e si fanno più luminosi.) Ecco. Stanotte attraversano. Da qualche parte, qualcuno trova finalmente pace, e non conosce nemmeno il tuo nome."},
m11_4:{text:"Nelle Tombe delle Lanterne, ogni tomba aveva un tempo una lanterna perché i morti trovassero la via del fiume. I servi della Corona le hanno spente. Ora le anime vagano perdute nella palude, e la barca di mio fratello le raccoglie come le reti raccolgono i pesci.\n\nRiaccendi le lanterne tombali. Dai ai perduti una strada che non porti a lui.",done:"Guarda la palude. Piccole luci, tutte in fila, tutte nella direzione giusta. Per la prima volta in un anno, la barca di mio fratello è tornata vuota."},
m11_5:{text:"All'Approdo del Traghetto Nero c'è un cavaliere che piange mentre combatte. Era uno dei migliori di Aurelion, ucciso sulle mura delle Terre Bruciate, e mio fratello lo ha riportato indietro in catene. Sa cosa sta facendo. Non riesce a fermarsi.\n\nSorveglia l'approdo per la Legione. Liberalo, Portatore dell'Aura, e portami gli ordini che ha con sé.",done:"(Caronte legge gli ordini e il suo volto si indurisce.) Ordini di marcia per la Legione Cava. Ogni anima che mio fratello riporta indietro viene mandata nelle Lande d'Ossidiana e armata alla Forgia. Stanno formando un esercito con i nostri stessi morti, e marciano sulla Porta di Basalto.\n\nIl cavaliere ha smesso di piangere quando è caduto. Ha detto grazie."},
m11_6:{text:"Il maresciallo Ignatius difende la Porta di Basalto, l'ultimo muro tra le Lande d'Ossidiana e il mondo dei vivi. È un uomo duro, e non gli piacerà sapere da dove vieni. Mostragli comunque gli ordini.\n\nVa', vivente. E quando riattraverserai il fiume, non pagare mio fratello. Digli che Caronte dice che la legge vale ancora.",done:"(Il maresciallo Ignatius legge gli ordini due volte, poi li stritola nel guanto d'arme.) Sono scritti di pugno dal mio vecchio comandante. Un uomo che ho sepolto io stesso."},
d_styxgate:{text:"Mio fratello aspetta alle Porte dello Stige. Ora lo chiamano il Traghettatore d'Ossa. Ha aperto le porte dei morti, e ogni notte rema con un'altra barca di anime per riportarle a servire il Re Cavo.\n\nNon è sempre stato così. Un tempo cantava ai morti mentre remava. Ma ha preso la moneta, e la moneta è cava, e ora lo è anche lui.\n\nAttraversa le Porte. Spezza il suo remo. Se resta qualcosa di mio fratello, digli che ho tenuto acceso il fuoco.",done:"(Caronte resta a lungo in silenzio.) Le porte sono chiuse. Il fiume scorre di nuovo in un solo senso. Grazie. I prossimi li traghetterò io, come si deve. E canterò per loro, per tutti e due."},
d_ferry:{text:"Sotto la palude si trova la Sala delle Anime Perdute, dove Morwen la Tessitrice d'Anime fila in fili le anime che mio fratello ruba, e con quei fili tesse armature per la Legione Cava. Ogni piastra che i legionari indossano è tessuta da qualcuno che è stato amato.\n\nTaglia il suo telaio. Disfa la sua opera. Lasciali andare.",done:"(Un vento tiepido attraversa il Riposo di Caronte, portando mille voci quiete.) Senti? Sono tutte le anime che ha tessuto, che attraversano finalmente. Sei stato tu. Domani le armature della Legione saranno più sottili."},
});

qadd('es',{
m11_1:{text:"(Caronte da vueltas al óbolo entre sus dedos grises.)\n\nMi hermano y yo llevamos a los muertos a través del Estigia desde antes de que vuestros reinos tuvieran nombre. Un pasaje en cada sentido: los vivos nunca volvían, y esa era la ley. Entonces la Corona Hueca llegó al embarcadero con un cofre de estas monedas y le pidió que remara en sentido contrario.\n\nÉl aceptó la moneda. Yo no. Ahora devuelve a los muertos a la orilla, y ellos salen del agua para luchar por el Rey Hueco. Yo me quedé aquí, junto a mi fuego, para que alguien recordara la ley.",done:"Has escuchado a un viejo barquero hasta el final. La mayoría de los vivos no lo hacen. Quédate un rato. El pantano es cruel, pero mi fuego es cálido."},
m11_2:{text:"Los necrófagos fueron los primeros que mi hermano trajo de vuelta. Recuerdan el hambre y nada más. Cavan en las Madrigueras de Necrófagos y suben por el Sendero de los Dolientes para devorar a quienes aún vienen a visitar a sus muertos.\n\nDales descanso. No los odies; no eligieron volver. Solo devuélvelos al río.",done:"Los dolientes recorrieron el sendero hoy y nadie fue arrebatado. Una anciana dejó una flor en mi puerta. Es para ti."},
m11_3:{text:"Las sombras son peores. Están vacías, y para llenarse se tragan las almas de los recién muertos antes de que lleguen al río. Puedes verlas dentro, lucecitas atrapadas como polillas en un frasco.\n\nRompe las sombras y libera los fuegos fatuos de alma. Tráemelos y los llevaré al otro lado como es debido: el último pasaje de un barquero honrado.",done:"(Caronte acuna los fuegos fatuos entre sus manos y sopla sobre ellos, y brillan más.) Ya está. Esta noche cruzan. En algún lugar, alguien por fin descansa en paz, y ni siquiera sabe tu nombre."},
m11_4:{text:"En las Tumbas de los Faroles, cada tumba tenía un farol para que los muertos encontraran el camino al río. Los siervos de la Corona los apagaron. Ahora las almas vagan perdidas por el pantano, y la barca de mi hermano las recoge como las redes recogen peces.\n\nVuelve a encender los faroles de las tumbas. Dales a los perdidos un camino que no lleve hasta él.",done:"Mira el pantano. Lucecitas, todas en fila, todas en la dirección correcta. Por primera vez en un año, la barca de mi hermano volvió vacía."},
m11_5:{text:"En el Embarcadero del Ferry Negro hay un caballero que llora mientras lucha. Fue uno de los mejores de Aurelion, muerto en las murallas de las Tierras Quemadas, y mi hermano lo trajo de vuelta encadenado. Sabe lo que hace. No puede detenerse.\n\nGuarda el embarcadero para la Legión. Libéralo, Portador del Aura, y tráeme las órdenes que lleve.",done:"(Caronte lee las órdenes y su rostro se endurece.) Órdenes de marcha para la Legión Hueca. Cada alma que mi hermano trae de vuelta es enviada a los Páramos de Obsidiana y armada en la Forja. Están formando un ejército con nuestros propios muertos, y marchan sobre la Puerta de Basalto.\n\nEl caballero dejó de llorar al caer. Dijo gracias."},
m11_6:{text:"El mariscal Ignatius defiende la Puerta de Basalto, la última muralla entre los Páramos de Obsidiana y el mundo de los vivos. Es un hombre duro y no le gustará saber de dónde vienes. Enséñale las órdenes de todos modos.\n\nVe, vivo. Y cuando vuelvas a cruzar el río, no le pagues a mi hermano. Dile que Caronte dice que la ley sigue en pie.",done:"(El mariscal Ignatius lee las órdenes dos veces y luego las aplasta en su guantelete.) Están escritas de puño y letra de mi antiguo comandante. Un hombre al que enterré yo mismo."},
d_styxgate:{text:"Mi hermano espera en las Puertas del Estigia. Ahora lo llaman el Barquero de Hueso. Abrió las puertas de los muertos, y cada noche rema con otra barcada de almas de vuelta para servir al Rey Hueco.\n\nNo siempre fue así. Antes cantaba a los muertos mientras remaba. Pero aceptó la moneda, y la moneda está hueca, y ahora él también.\n\nCruza las Puertas. Rompe su remo. Si queda algo de mi hermano, dile que mantuve el fuego encendido.",done:"(Caronte guarda silencio largo rato.) Las puertas están cerradas. El río vuelve a correr en un solo sentido. Gracias. Remaré yo mismo con los próximos, como debe hacerse. Y les cantaré, por los dos."},
d_ferry:{text:"Bajo el pantano está la Sala de las Almas Perdidas, donde Morwen la Tejedora de Almas hila en hebras las almas que roba mi hermano, y con las hebras teje armaduras para la Legión Hueca. Cada placa que llevan los legionarios está tejida con alguien que fue amado.\n\nCorta su telar. Deshaz su obra. Déjalos ir.",done:"(Un viento cálido atraviesa el Reposo de Caronte, cargado de mil voces tranquilas.) ¿Lo oyes? Son todas las almas que ella tejió, cruzando por fin. Lo has hecho tú. Mañana las armaduras de la Legión serán más finas."},
});
qadd('fr',{
m11_1:{text:"(Charon fait tourner l'obole entre ses doigts gris.)\n\nMon frère et moi faisions traverser le Styx aux morts avant même que vos royaumes aient un nom. Un passage dans chaque sens : les vivants ne revenaient jamais, et c'était la loi. Puis la Couronne Creuse est venue au débarcadère avec un coffre de ces pièces et lui a demandé de ramer dans l'autre sens.\n\nIl a pris la pièce. Pas moi. Maintenant il ramène les morts sur la rive, et ils sortent de l'eau pour combattre pour le Roi Creux. Moi, je suis resté ici, à mon feu, pour que quelqu'un se souvienne de la loi.",done:"Tu as écouté un vieux passeur jusqu'au bout. La plupart des vivants ne le font pas. Reste un peu. Le marais est cruel, mais mon feu est chaud."},
m11_2:{text:"Les goules furent les premières que mon frère ramena. Elles se souviennent de la faim, et de rien d'autre. Elles creusent dans les Terriers des Goules et rampent sur le Chemin des Endeuillés pour dévorer ceux qui viennent encore visiter leurs morts.\n\nRends-leur le repos. Ne les hais pas ; elles n'ont pas choisi de revenir. Rends-les simplement au fleuve.",done:"Les endeuillés ont parcouru le chemin aujourd'hui, et personne n'a été emporté. Une vieille femme a laissé une fleur à ma porte. Elle est pour toi."},
m11_3:{text:"Les ombres sont pires. Elles sont vides, et pour se remplir, elles avalent les âmes des nouveaux morts avant qu'elles n'atteignent le fleuve. On les voit à l'intérieur, de petites lumières piégées comme des papillons dans un bocal.\n\nBrise les ombres et libère les feux follets d'âme. Apporte-les-moi, et je leur ferai traverser comme il se doit : le dernier passage d'un passeur honnête.",done:"(Charon recueille les feux follets dans ses mains et souffle dessus ; ils brillent davantage.) Voilà. Cette nuit, ils traversent. Quelque part, quelqu'un trouve enfin la paix, sans même connaître ton nom."},
m11_4:{text:"Aux Tombes des Lanternes, chaque tombe avait jadis une lanterne pour que les morts trouvent le chemin du fleuve. Les serviteurs de la Couronne les ont éteintes. Maintenant les âmes errent perdues dans le marais, et la barque de mon frère les ramasse comme des filets ramassent les poissons.\n\nRallume les lanternes funéraires. Donne aux égarés un chemin qui ne mène pas à lui.",done:"Regarde le marais. De petites lumières, toutes alignées, toutes dans la bonne direction. Pour la première fois depuis un an, la barque de mon frère est revenue vide."},
m11_5:{text:"Au Débarcadère du Bac Noir, un chevalier pleure en combattant. C'était l'un des meilleurs d'Aurelion, tué sur les remparts des Terres Brûlées, et mon frère l'a ramené enchaîné. Il sait ce qu'il fait. Il ne peut pas s'arrêter.\n\nIl garde le débarcadère pour la Légion. Libère-le, Porteur de l'Aura, et rapporte-moi les ordres qu'il porte.",done:"(Charon lit les ordres et son visage se durcit.) Des ordres de marche pour la Légion Creuse. Chaque âme que mon frère ramène est envoyée dans les Terres d'Obsidienne et armée à la Forge. Ils lèvent une armée avec nos propres morts, et ils marchent sur la Porte de Basalte.\n\nLe chevalier a cessé de pleurer en tombant. Il a dit merci."},
m11_6:{text:"Le maréchal Ignatius tient la Porte de Basalte, le dernier rempart entre les Terres d'Obsidienne et le monde des vivants. C'est un homme dur, et il n'aimera pas savoir d'où tu viens. Montre-lui quand même les ordres.\n\nVa, vivant. Et quand tu retraverseras le fleuve, ne paie pas mon frère. Dis-lui que Charon affirme que la loi tient toujours.",done:"(Le maréchal Ignatius lit les ordres deux fois, puis les écrase dans son gantelet.) Ils sont de la main de mon ancien commandant. Un homme que j'ai enterré moi-même."},
d_styxgate:{text:"Mon frère attend aux Portes du Styx. On l'appelle maintenant le Passeur d'Os. Il a ouvert les portes des morts, et chaque nuit il ramène une nouvelle barque d'âmes pour servir le Roi Creux.\n\nIl n'a pas toujours été ainsi. Autrefois, il chantait pour les morts en ramant. Mais il a pris la pièce, et la pièce est creuse, et lui aussi maintenant.\n\nFranchis les Portes. Brise sa rame. S'il reste quelque chose de mon frère, dis-lui que j'ai gardé le feu allumé.",done:"(Charon reste longtemps silencieux.) Les portes sont closes. Le fleuve ne coule plus que dans un sens. Merci. Je ferai traverser les prochains moi-même, comme il se doit. Et je chanterai pour eux, pour nous deux."},
d_ferry:{text:"Sous le marais se trouve la Salle des Âmes Perdues, où Morwen la Tisseuse d'Âmes file en fils les âmes que vole mon frère, et tisse ces fils en armures pour la Légion Creuse. Chaque plaque que portent les légionnaires est tissée de quelqu'un qui fut aimé.\n\nTranche son métier. Défais son ouvrage. Laisse-les partir.",done:"(Un vent tiède traverse le Repos de Charon, porteur de mille voix paisibles.) Tu entends ? Ce sont toutes les âmes qu'elle a tissées, qui traversent enfin. C'est toi qui as fait ça. Demain, les armures de la Légion seront plus minces."},
});

qadd('de',{
m12_1:{text:"Kaelthas Ashborn. Lord-General von Aurelion, zwanzig Jahre lang mein Kommandant. Er fiel bei der Verteidigung der Mauern von Cinderwatch, als die Verbrannten Lande zum ersten Mal Feuer fingen, und ich trug ihn heim und begrub ihn unter dem Banner des Königs selbst.\n\nJetzt schreibt seine Hand Marschbefehle für die Hohle Legion. Was auch immer aus diesem Grab gekrochen ist, er ist es nicht. Aber es weiß alles, was er wusste, und er hat mir alles beigebracht, was ich über die Verteidigung dieses Tores weiß.\n\nDas Basalttor ist die letzte Mauer, Träger der Aura. Dahinter liegt jede lebende Stadt, die du gerettet hast. Ich brauche dich auf dieser Mauer.",done:"Charon schickt dich. Ein Fährmann der Toten bürgt für einen lebenden Helden. Mich überrascht gar nichts mehr. Willkommen am Basalttor. Such dir einen Schild."},
m12_2:{text:"Bevor die Legion marschiert, kommen ihre Golems. Magmagolems, gegossen in der Obsidianschmiede, treten jede Nacht aus der Glasschlucht und werfen sich gegen unsere Mauern. Jeder, der am Tor zerbricht, reißt den Basalt ein Stück weiter auf.\n\nZerbrich sie, bevor sie die Mauer erreichen. Triff die Risse in ihrer Kruste; geschmolzener Stein mag die Kälte einer Klinge nicht.",done:"Die Steinmetze sagen, das Tor hält jetzt noch einen Monat. Einen Monat! Hier ist das ein ganzes Leben. Gut gekämpft."},
m12_3:{text:"Legionsfeuer schmilzt Stahl. Ich habe gesehen, wie es vom Schild eines Soldaten lief wie Wasser, und dann vom Soldaten. Nur eines hält ihm stand: die Schuppen der Feuerdrachen, die im Drachenhorst nisten. Sie wurden in dieser Hitze geboren.\n\nBring mir Drachenschuppen, und meine Waffenschmiede beschlagen damit jeden Schild auf der Mauer.",done:"Die ersten Drachenschuppenschilde kamen heute Morgen auf die Mauer. Ein Feuerwirker der Legion gab sein Bestes gegen sie und zog mit verbrannten Händen ab. Meine Soldaten jubelten. Sie hatten lange nicht gejubelt."},
m12_4:{text:"Im Legionslager hissen sie Kriegsbanner: schwarzes Tuch, bestickt mit den Namen der Toten, die sie gewendet haben. Jeder Legionär marschiert unter dem Namen dessen, der er einmal war. So hält Kaelthas sie. Sie folgen ihren eigenen Namen.\n\nVerbrenne die Banner. Lass die Toten die Namen vergessen, die er gestohlen hat. Vielleicht hören sie dann auf, ihm zu folgen.",done:"Im Lager herrscht Chaos. Die Hälfte der Legionäre hat sich einfach in die Asche gesetzt, als die Banner brannten, und ist nicht wieder aufgestanden. Sie ruhen, glaube ich. Endlich. Danke."},
m12_5:{text:"Zenturio Vulkar hält das Magmator, das Tor der Legion in die Wüste. Er war ein Soldat der Verbrannten Lande wie ich, und er wählte die Krone, solange er noch lebte. Er wurde nicht gewendet. Er meldete sich freiwillig.\n\nEr empfängt die Botschaften der Legion aus dem Osten. Nimm ihm das Tor ab und bring mir, was man ihm geschickt hat.",done:"(Ignatius hebt eine Laterne. Ihre Flamme brennt schwarz, und das Licht um sie herum wird schwächer.) Eine Laterne, die dunkel brennt. Sie stammt aus dem Shadowfell, von den Priestern der Langen Nacht. Was immer sie dort tun, sie tun es für den Riss.\n\nDie Legion war nie das Ende. Sie war eine Mauer vor etwas Schlimmerem."},
m12_6:{text:"Geh nach Osten, ins Shadowfell. Laternenhüterin Wren hält Lanternfall, die einzige Stadt dort, die noch Licht hat. Sie kämpft länger gegen die Lange Nacht als irgendwer sonst. Sie wird wissen, was diese Laterne bedeutet.\n\nUnd, Träger der Aura... wenn du Kaelthas vor dem Ende begegnest, in der Zitadelle oder anderswo, zögere nicht meinetwegen. Er hätte das nicht sein wollen.",done:"(Laternenhüterin Wren hält die schwarze Laterne auf Armlänge von sich.) Steck das weg, bevor es das Licht hier drinnen frisst. Woher hast du das? Egal. Ich weiß, woher. Setz dich. Nicht ans Fenster."},
d_forge:{text:"Jede Hohle Klinge wird in der Obsidianschmiede geboren, tief unter der Wüste, wo Ignaroth der Schmiedefürst die Seelen der Toten zu Waffen hämmert. Die Golems, der Legionsstahl, die Ketten von Stormspire: alles begann auf seinem Amboss, in einem Feuer, das nie erlischt.\n\nLösche es. Steig in die Schmiede hinab und zerbrich Ignaroth. Ohne ihn bewaffnet sich die Legion mit Stöcken.",done:"Der Rauch über der Wüste lichtet sich. Die Späher sagen, die Schmiede ist kalt, zum ersten Mal, seit sich jemand erinnern kann. Du hast einem Heer die Schwerter aus den Händen genommen. Nie habe ich einen Satz lieber gesagt."},
d_citadel:{text:"Kaelthas Ashborn wartet in der Basaltzitadelle. Kriegsherr der Hohlen Legion nennen sie ihn jetzt. Er sammelt die Toten für den letzten Marsch auf Aurelion, und nichts, was ich habe, kann ihn aufhalten.\n\nIch kann nicht gehen. Wenn ich sein Gesicht sehe, senke ich mein Schwert, und das hätte er nie getan. Also musst du gehen.\n\nGeh in die Zitadelle. Mach meinem Kommandanten ein Ende. Und sag ihm... nein. Mach einfach ein Ende. Er wird es verstehen.",done:"(Ignatius nimmt das zerbrochene Abzeichen des Generals und schweigt lange.) Er hat mich gelehrt: Die letzte Pflicht eines Soldaten ist es, aufgehalten zu werden, wenn er im Unrecht ist. Du hast diese letzte Pflicht für ihn erfüllt. Ich werde ihn noch einmal begraben. Diesmal bleibt er dort."},
});
qadd('pt',{
m12_1:{text:"Kaelthas Ashborn. Lorde-General de Aurelion, meu comandante por vinte anos. Caiu defendendo as muralhas de Cinderwatch quando as Terras Queimadas pegaram fogo pela primeira vez, e eu o levei para casa e o enterrei sob o estandarte do próprio Rei.\n\nAgora a mão dele escreve ordens de marcha para a Legião Oca. Seja o que for que saiu daquele túmulo, não é ele. Mas sabe tudo o que ele sabia, e ele me ensinou tudo o que sei sobre defender este portão.\n\nO Portão de Basalto é a última muralha, Portador da Aura. Atrás dele está cada cidade viva que você salvou. Preciso de você nela.",done:"Caronte enviou você. Um barqueiro dos mortos responde por um herói vivo. Nada mais me surpreende. Bem-vindo ao Portão de Basalto. Arranje um escudo."},
m12_2:{text:"Antes de a Legião marchar, vêm os golens. Golens de magma, fundidos na Forja de Obsidiana, saem toda noite do Cânion de Vidro e se atiram contra nossas muralhas. Cada um que se quebra contra o portão racha o basalto um pouco mais.\n\nQuebre-os antes que cheguem à muralha. Golpeie as rachaduras da crosta; pedra derretida não gosta do frio de uma lâmina.",done:"Os pedreiros dizem que o portão aguenta mais um mês. Um mês! Neste lugar, isso é uma vida inteira. Bela luta."},
m12_3:{text:"O fogo da Legião derrete aço. Eu o vi escorrer pelo escudo de um soldado como água, e depois pelo soldado. Só uma coisa resiste a ele: as escamas dos dracos de fogo que fazem ninho no Ninho dos Dracos. Eles nasceram neste calor.\n\nTraga-me escamas de draco, e meus armeiros revestirão com elas cada escudo da muralha.",done:"Os primeiros escudos de escama de draco subiram à muralha esta manhã. Um piromante da Legião deu tudo de si contra eles e voltou com as mãos queimadas. Meus soldados vibraram. Fazia tempo que não vibravam."},
m12_4:{text:"No Acampamento da Legião, eles erguem estandartes de guerra: pano negro, bordado com os nomes dos mortos que converteram. Cada legionário marcha sob o nome de quem já foi. É assim que Kaelthas os controla. Eles seguem os próprios nomes.\n\nQueime os estandartes. Que os mortos esqueçam os nomes que ele roubou. Talvez então parem de segui-lo.",done:"O acampamento virou um caos. Metade dos legionários simplesmente se sentou nas cinzas quando os estandartes queimaram, e não se levantou mais. Estão descansando, acho. Enfim. Obrigado."},
m12_5:{text:"O centurião Vulkar guarda o Portão de Magma, a entrada da Legião nos Ermos. Era soldado das Terras Queimadas, como eu, e escolheu a Coroa ainda vivo. Não foi convertido. Foi voluntário.\n\nEle recebe as mensagens da Legião vindas do leste. Tome o portão dele e traga-me o que lhe enviaram.",done:"(Ignatius ergue uma lanterna. A chama arde negra, e a luz ao redor esmorece.) Uma lanterna que arde escura. Veio de Shadowfell, dos sacerdotes da Longa Noite. Seja o que for que estejam fazendo lá, fazem pela Fenda.\n\nA Legião nunca foi o fim. Era um muro diante de algo pior."},
m12_6:{text:"Vá para o leste, para Shadowfell. A guardiã das lanternas Wren defende Lanternfall, a única cidade de lá que ainda tem luz. Ela luta contra a Longa Noite há mais tempo que qualquer um. Vai saber o que esta lanterna significa.\n\nE, Portador da Aura... se encontrar Kaelthas antes do fim, na Cidadela ou em qualquer outro lugar, não hesite por minha causa. Ele não teria querido ser isto.",done:"(A guardiã Wren segura a lanterna negra com o braço esticado.) Guarde isso antes que coma a luz aqui dentro. Onde conseguiu isso? Deixa pra lá. Eu sei onde. Sente-se. Longe da janela."},
d_forge:{text:"Toda lâmina Oca nasce na Forja de Obsidiana, nas profundezas dos Ermos, onde Ignaroth, o Senhor da Forja, martela as almas dos mortos até virarem armas. Os golens, o aço da Legião, as correntes de Stormspire: tudo começou na bigorna dele, num fogo que nunca se apaga.\n\nApague-o. Desça à Forja e quebre Ignaroth. Sem ele, a Legião se arma com gravetos.",done:"A fumaça sobre os Ermos está se dissipando. Os batedores dizem que a Forja está fria pela primeira vez na memória de qualquer um. Você tirou as espadas das mãos de um exército. Nunca fiquei tão feliz em dizer uma frase."},
d_citadel:{text:"Kaelthas Ashborn espera na Cidadela de Basalto. Senhor da Guerra da Legião Oca, é como o chamam agora. Ele reúne os mortos para a marcha final sobre Aurelion, e nada do que tenho pode detê-la.\n\nEu não posso ir. Se eu vir o rosto dele, vou baixar a espada, e ele jamais faria isso. Então você deve ir.\n\nEntre na Cidadela. Acabe com meu comandante. E diga a ele... não. Apenas acabe. Ele saberá.",done:"(Ignatius pega a insígnia quebrada do general e fica em silêncio por um longo tempo.) Ele me ensinou que o último dever de um soldado é ser detido quando está errado. Você cumpriu esse último dever por ele. Vou enterrá-lo de novo. Desta vez, ele vai ficar."},
});
qadd('it',{
m12_1:{text:"Kaelthas Ashborn. Lord-Generale di Aurelion, il mio comandante per vent'anni. Cadde difendendo le mura di Cinderwatch quando le Terre Bruciate presero fuoco per la prima volta, e io lo riportai a casa e lo seppellii sotto lo stendardo del Re in persona.\n\nOra la sua mano scrive ordini di marcia per la Legione Cava. Qualunque cosa sia strisciata fuori da quella tomba, non è lui. Ma sa tutto ciò che lui sapeva, e lui mi ha insegnato tutto ciò che so sulla difesa di questa porta.\n\nLa Porta di Basalto è l'ultimo muro, Portatore dell'Aura. Dietro c'è ogni città viva che hai salvato. Ho bisogno di te lassù.",done:"Ti manda Caronte. Un traghettatore dei morti garantisce per un eroe vivo. Ormai non mi sorprende più niente. Benvenuto alla Porta di Basalto. Trovati uno scudo."},
m12_2:{text:"Prima che la Legione marci, arrivano i suoi golem. Golem di magma, colati alla Forgia d'Ossidiana, escono ogni notte dal Canyon di Vetro e si scagliano contro le nostre mura. Ognuno che si infrange sulla porta crepa il basalto un po' di più.\n\nSpezzali prima che raggiungano il muro. Colpisci le crepe nella loro crosta; la pietra fusa non ama il freddo di una lama.",done:"I muratori dicono che ora la porta reggerà un altro mese. Un mese! Qui è una vita intera. Ben combattuto."},
m12_3:{text:"Il fuoco della Legione scioglie l'acciaio. L'ho visto colare dallo scudo di un soldato come acqua, e poi dal soldato. Solo una cosa gli resiste: le scaglie dei draghi di fuoco che nidificano al Nido dei Draghi. Sono nati in questo calore.\n\nPortami scaglie di draco, e i miei armaioli ne rivestiranno ogni scudo sulle mura.",done:"I primi scudi di scaglie di draco sono saliti sulle mura stamattina. Un piromante della Legione ci ha provato con tutte le sue forze ed è tornato indietro con le mani bruciate. I miei soldati hanno esultato. Non esultavano da tanto tempo."},
m12_4:{text:"Nell'Accampamento della Legione issano stendardi di guerra: stoffa nera, cucita con i nomi dei morti che hanno rivoltato. Ogni legionario marcia sotto il nome di chi era un tempo. È così che Kaelthas li tiene. Seguono i loro stessi nomi.\n\nBrucia gli stendardi. Che i morti dimentichino i nomi che ha rubato. Forse allora smetteranno di seguirlo.",done:"L'accampamento è nel caos. Metà dei legionari si è semplicemente seduta nella cenere quando gli stendardi sono bruciati, e non si è più rialzata. Riposano, credo. Finalmente. Grazie."},
m12_5:{text:"Il centurione Vulkar tiene la Porta di Magma, l'ingresso della Legione nelle Lande. Era un soldato delle Terre Bruciate, come me, e scelse la Corona quando era ancora vivo. Non fu rivoltato. Si offrì volontario.\n\nÈ lui che riceve i messaggi della Legione dall'est. Strappagli la porta e portami ciò che gli hanno mandato.",done:"(Ignatius solleva una lanterna. La sua fiamma arde nera, e la luce intorno si affievolisce.) Una lanterna che arde scura. Viene da Shadowfell, dai sacerdoti della Lunga Notte. Qualunque cosa stiano facendo laggiù, lo fanno per la Faglia.\n\nLa Legione non è mai stata la fine. Era un muro davanti a qualcosa di peggio."},
m12_6:{text:"Va' a est, a Shadowfell. La custode delle lanterne Wren difende Lanternfall, l'unica città laggiù che abbia ancora luce. Combatte la Lunga Notte da più tempo di chiunque altro. Saprà cosa significa questa lanterna.\n\nE, Portatore dell'Aura... se incontrerai Kaelthas prima della fine, nella Cittadella o altrove, non esitare per causa mia. Lui non avrebbe voluto essere questo.",done:"(La custode Wren tiene la lanterna nera a distanza di braccio.) Metti via quella cosa prima che si mangi la luce qui dentro. Dove l'hai presa? Lascia stare. Lo so dove. Siediti. Non vicino alla finestra."},
d_forge:{text:"Ogni lama Cava nasce alla Forgia d'Ossidiana, nel profondo delle Lande, dove Ignaroth il Signore della Forgia martella le anime dei morti fino a farne armi. I golem, l'acciaio della Legione, le catene di Stormspire: tutto è cominciato sulla sua incudine, in un fuoco che non si spegne mai.\n\nSpegnilo. Scendi nella Forgia e spezza Ignaroth. Senza di lui, la Legione si armerà di bastoni.",done:"Il fumo sopra le Lande si dirada. Gli esploratori dicono che la Forgia è fredda per la prima volta a memoria d'uomo. Hai tolto le spade dalle mani di un esercito. Non sono mai stato così felice di pronunciare una frase."},
d_citadel:{text:"Kaelthas Ashborn attende nella Cittadella di Basalto. Signore della Guerra della Legione Cava, così lo chiamano ora. Sta radunando i morti per la marcia finale su Aurelion, e nulla di ciò che ho può fermarla.\n\nIo non posso andare. Se vedo il suo volto abbasserò la spada, e lui non l'avrebbe mai fatto. Quindi devi andare tu.\n\nEntra nella Cittadella. Poni fine al mio comandante. E digli... no. Poni fine e basta. Capirà.",done:"(Ignatius prende il distintivo spezzato del generale e resta a lungo in silenzio.) Mi ha insegnato che l'ultimo dovere di un soldato è essere fermato quando sbaglia. Hai compiuto quell'ultimo dovere per lui. Lo seppellirò di nuovo. Stavolta resterà lì."},
});

qadd('es',{
m12_1:{text:"Kaelthas Ashborn. Lord-General de Aurelion, mi comandante durante veinte años. Cayó defendiendo las murallas de Cinderwatch cuando las Tierras Quemadas ardieron por primera vez, y yo lo llevé a casa y lo enterré bajo el estandarte del propio Rey.\n\nAhora su mano escribe órdenes de marcha para la Legión Hueca. Lo que sea que salió de esa tumba, no es él. Pero sabe todo lo que él sabía, y él me enseñó todo lo que sé sobre defender esta puerta.\n\nLa Puerta de Basalto es la última muralla, Portador del Aura. Detrás está cada ciudad viva que has salvado. Te necesito en ella.",done:"Te envía Caronte. Un barquero de los muertos responde por un héroe vivo. Ya nada me sorprende. Bienvenido a la Puerta de Basalto. Búscate un escudo."},
m12_2:{text:"Antes de que la Legión marche, llegan sus gólems. Gólems de magma, vertidos en la Forja de Obsidiana, salen cada noche del Cañón de Cristal y se lanzan contra nuestras murallas. Cada uno que se rompe contra la puerta agrieta un poco más el basalto.\n\nRómpelos antes de que lleguen a la muralla. Golpea las grietas de su costra; a la piedra fundida no le gusta el frío de una hoja.",done:"Los canteros dicen que la puerta aguantará otro mes. ¡Un mes! En este lugar, eso es toda una vida. Bien luchado."},
m12_3:{text:"El fuego de la Legión derrite el acero. Lo he visto correr por el escudo de un soldado como agua, y luego por el soldado. Solo una cosa lo resiste: las escamas de los dracos de fuego que anidan en el Nido de Dracos. Nacieron en este calor.\n\nTráeme escamas de draco, y mis armeros forrarán con ellas cada escudo de la muralla.",done:"Los primeros escudos de escama de draco subieron a la muralla esta mañana. Un piromante de la Legión lo intentó con todas sus fuerzas y volvió a casa con las manos quemadas. Mis soldados vitorearon. Hacía mucho que no vitoreaban."},
m12_4:{text:"En el Campamento de la Legión izan estandartes de guerra: tela negra, cosida con los nombres de los muertos que han convertido. Cada legionario marcha bajo el nombre de quien fue. Así es como Kaelthas los domina. Siguen sus propios nombres.\n\nQuema los estandartes. Que los muertos olviden los nombres que él robó. Quizá entonces dejen de seguirlo.",done:"El campamento es un caos. La mitad de los legionarios simplemente se sentaron en la ceniza cuando ardieron los estandartes, y no se levantaron. Descansan, creo. Por fin. Gracias."},
m12_5:{text:"El centurión Vulkar defiende la Puerta de Magma, la entrada de la Legión a los Páramos. Fue soldado de las Tierras Quemadas, como yo, y eligió la Corona estando aún vivo. No lo convirtieron. Se ofreció.\n\nÉl recibe los mensajes de la Legión desde el este. Arrebátale la puerta y tráeme lo que le hayan enviado.",done:"(Ignatius levanta un farol. Su llama arde negra, y la luz a su alrededor se apaga.) Un farol que arde oscuro. Viene de Shadowfell, de los sacerdotes de la Larga Noche. Lo que sea que estén haciendo allí, lo hacen para la Grieta.\n\nLa Legión nunca fue el final. Era un muro delante de algo peor."},
m12_6:{text:"Ve al este, a Shadowfell. La guardiana de faroles Wren defiende Lanternfall, el único pueblo de allí que aún tiene luz. Ha luchado contra la Larga Noche más que nadie. Sabrá qué significa este farol.\n\nY, Portador del Aura... si te encuentras con Kaelthas antes del final, en la Ciudadela o en cualquier otro sitio, no dudes por mí. Él no habría querido ser esto.",done:"(La guardiana Wren sostiene el farol negro con el brazo extendido.) Guarda eso antes de que se coma la luz de aquí dentro. ¿De dónde lo has sacado? Da igual. Ya lo sé. Siéntate. Lejos de la ventana."},
d_forge:{text:"Cada hoja Hueca nace en la Forja de Obsidiana, en lo profundo de los Páramos, donde Ignaroth el Señor de la Forja martillea las almas de los muertos hasta convertirlas en armas. Los gólems, el acero de la Legión, las cadenas de Stormspire: todo empezó en su yunque, en un fuego que nunca se apaga.\n\nApágalo. Baja a la Forja y destruye a Ignaroth. Sin él, la Legión se arma con palos.",done:"El humo sobre los Páramos se disipa. Los exploradores dicen que la Forja está fría por primera vez en la memoria de cualquiera. Le has quitado las espadas de las manos a un ejército. Nunca me había alegrado tanto decir una frase."},
d_citadel:{text:"Kaelthas Ashborn espera en la Ciudadela de Basalto. Señor de la Guerra de la Legión Hueca, lo llaman ahora. Está reuniendo a los muertos para la marcha final sobre Aurelion, y nada de lo que tengo puede detenerla.\n\nYo no puedo ir. Si veo su rostro, bajaré la espada, y él nunca lo habría hecho. Así que debes ir tú.\n\nEntra en la Ciudadela. Acaba con mi comandante. Y dile... no. Solo acaba. Él lo sabrá.",done:"(Ignatius toma la insignia rota del general y guarda silencio un largo momento.) Él me enseñó que el último deber de un soldado es ser detenido cuando se equivoca. Cumpliste ese último deber por él. Lo enterraré otra vez. Esta vez se quedará."},
});
qadd('fr',{
m12_1:{text:"Kaelthas Ashborn. Seigneur-général d'Aurelion, mon commandant pendant vingt ans. Il est tombé en tenant les remparts de Cinderwatch quand les Terres Brûlées ont pris feu pour la première fois, et je l'ai ramené et enterré sous la bannière du Roi lui-même.\n\nAujourd'hui, sa main écrit des ordres de marche pour la Légion Creuse. Ce qui est sorti de cette tombe, ce n'est pas lui. Mais cela sait tout ce qu'il savait, et c'est lui qui m'a appris tout ce que je sais sur la défense de cette porte.\n\nLa Porte de Basalte est le dernier rempart, Porteur de l'Aura. Derrière elle se trouve chaque cité vivante que tu as sauvée. J'ai besoin de toi dessus.",done:"Charon t'envoie. Un passeur des morts se porte garant d'un héros vivant. Plus rien ne m'étonne. Bienvenue à la Porte de Basalte. Trouve-toi un bouclier."},
m12_2:{text:"Avant que la Légion ne marche, ses golems arrivent. Des golems de magma, coulés à la Forge d'Obsidienne, sortent chaque nuit du Canyon de Verre et se jettent sur nos murs. Chacun qui se brise contre la porte fissure un peu plus le basalte.\n\nBrise-les avant qu'ils n'atteignent le mur. Frappe les fissures de leur croûte ; la pierre en fusion n'aime pas le froid d'une lame.",done:"Les maçons disent que la porte tiendra encore un mois. Un mois ! Ici, c'est une vie entière. Bien combattu."},
m12_3:{text:"Le feu de la Légion fait fondre l'acier. Je l'ai vu couler sur le bouclier d'un soldat comme de l'eau, puis sur le soldat. Une seule chose y résiste : les écailles des drakes de feu qui nichent au Perchoir des Drakes. Ils sont nés dans cette chaleur.\n\nApporte-moi des écailles de drake, et mes armuriers en recouvriront chaque bouclier du rempart.",done:"Les premiers boucliers en écailles de drake sont montés sur le rempart ce matin. Un pyromancien de la Légion a fait de son mieux contre eux et est reparti les mains brûlées. Mes soldats ont acclamé. Ils n'avaient pas acclamé depuis longtemps."},
m12_4:{text:"Dans le Camp de la Légion, ils dressent des bannières de guerre : du tissu noir, brodé des noms des morts qu'ils ont retournés. Chaque légionnaire marche sous le nom de celui qu'il était. C'est ainsi que Kaelthas les tient. Ils suivent leurs propres noms.\n\nBrûle les bannières. Que les morts oublient les noms qu'il a volés. Peut-être cesseront-ils alors de le suivre.",done:"Le camp est en plein chaos. La moitié des légionnaires se sont simplement assis dans la cendre quand les bannières ont brûlé, et ne se sont pas relevés. Ils se reposent, je crois. Enfin. Merci."},
m12_5:{text:"Le centurion Vulkar tient la Porte de Magma, l'entrée de la Légion dans les Terres. C'était un soldat des Terres Brûlées, comme moi, et il a choisi la Couronne de son vivant. On ne l'a pas retourné. Il s'est porté volontaire.\n\nC'est lui qui reçoit les messages de la Légion venus de l'est. Prends-lui la porte et rapporte-moi ce qu'on lui a envoyé.",done:"(Ignatius brandit une lanterne. Sa flamme brûle noir, et la lumière autour faiblit.) Une lanterne qui brûle sombre. Elle vient du Shadowfell, des prêtres de la Longue Nuit. Quoi qu'ils fassent là-bas, ils le font pour la Faille.\n\nLa Légion n'a jamais été la fin. C'était un mur devant quelque chose de pire."},
m12_6:{text:"Va à l'est, au Shadowfell. La gardienne des lanternes Wren tient Lanternfall, la seule ville de là-bas qui ait encore de la lumière. Elle combat la Longue Nuit depuis plus longtemps que quiconque. Elle saura ce que signifie cette lanterne.\n\nEt, Porteur de l'Aura... si tu croises Kaelthas avant la fin, dans la Citadelle ou ailleurs, n'hésite pas à cause de moi. Il n'aurait pas voulu être ça.",done:"(La gardienne Wren tient la lanterne noire à bout de bras.) Range ça avant que ça mange la lumière ici. Où l'as-tu trouvée ? Peu importe. Je sais où. Assieds-toi. Pas près de la fenêtre."},
d_forge:{text:"Chaque lame Creuse naît à la Forge d'Obsidienne, sous les Terres, où Ignaroth le Seigneur de la Forge martèle les âmes des morts pour en faire des armes. Les golems, l'acier de la Légion, les chaînes de Stormspire : tout a commencé sur son enclume, dans un feu qui ne s'éteint jamais.\n\nÉteins-le. Descends dans la Forge et brise Ignaroth. Sans lui, la Légion s'armera de bâtons.",done:"La fumée au-dessus des Terres se dissipe. Les éclaireurs disent que la Forge est froide pour la première fois de mémoire d'homme. Tu as arraché les épées des mains d'une armée. Jamais une phrase ne m'a fait autant plaisir à dire."},
d_citadel:{text:"Kaelthas Ashborn attend dans la Citadelle de Basalte. Seigneur de guerre de la Légion Creuse, l'appelle-t-on maintenant. Il rassemble les morts pour la marche finale sur Aurelion, et rien de ce que j'ai ne peut l'arrêter.\n\nJe ne peux pas y aller. Si je vois son visage, je baisserai mon épée, et lui ne l'aurait jamais fait. Alors c'est à toi.\n\nEntre dans la Citadelle. Mets fin à mon commandant. Et dis-lui... non. Mets-y fin, simplement. Il comprendra.",done:"(Ignatius prend l'insigne brisé du général et reste longtemps silencieux.) Il m'a appris que le dernier devoir d'un soldat, c'est d'être arrêté quand il a tort. Tu as accompli ce dernier devoir pour lui. Je l'enterrerai à nouveau. Cette fois, il restera."},
});

qadd('de',{
m13_1:{text:"Diese Laterne wurde in der Schattenkathedrale entzündet. Die Priester der Langen Nacht nehmen eine Laterne aus Lanternfall, ein lebendiges Licht, das jemand gepflegt hat, und kehren es um. Für jede, die sie machen, erlischt eine von unseren.\n\nIm Shadowfell ist Licht Leben. Wo die Laternen erlöschen, wandeln die Albträume, und die Menschen wachen einfach nicht mehr auf. Halb Lanternfall schläft jetzt und lässt sich nicht wecken.\n\nIch bin die letzte Laternenhüterin. Seit elf Jahren hüte ich die Lichter allein. Hilfst du mir, sie noch ein wenig länger zu hüten?",done:"(Wren zündet eine kleine Kerze an und stellt sie zwischen euch.) So. Ein Licht mehr in der Welt und zwei Menschen, die es hüten. So fängt es an."},
m13_2:{text:"Die Albtraumhunde jagen auf der Laternenstraße. Sie bestehen aus den Träumen der Schläfer, und sie riechen Licht wie Wölfe Blut. Jeden Laternenträger, den ich losschicke, reißen sie vor der zweiten Meile.\n\nJag du sie zuerst. Bleib im Licht und sieh ihnen nicht zu lange in die Augen. Du wirst etwas sehen, das du fürchtest, und dann sind sie über dir.",done:"Die Laternenträger kamen von der zweiten Meile zurück, und von der dritten. Einer der Schläfer in der Halle ist heute Morgen aufgewacht und hat nach Frühstück gefragt. Kleine Dinge. Hier besteht alles aus kleinen Dingen."},
m13_3:{text:"Leerenspinnen spinnen Seide, die kein Licht zurückwirft. Die Hohlen Priester ersticken damit unsere Laternen. Doch andersherum, als Docht, trinkt Leerenseide die Dunkelheit und verbrennt sie: eine Flamme, die die Lange Nacht nicht löschen kann.\n\nBring mir Leerenseide. Ich mache Dochte für jede Laterne in Lanternfall.",done:"(Wren zündet einen neuen Docht an. Die Flamme ist blass silbern, und die Schatten in den Ecken weichen zurück.) Sieh dir das an. Sollen sie jetzt versuchen, sie auszublasen."},
m13_4:{text:"Der Weinende Wald war der letzte Abschnitt der alten Laternenlinie, der von Lanternfall zum Letzten Licht führte. Die Priester haben dort jede Laterne verdunkelt, und seitdem ist keine einzige Botschaft der Archontin mehr durchgekommen.\n\nEntzünde die erloschenen Laternen im Weinenden Wald mit den neuen Dochten. Wenn die Linie wieder leuchtet, wird das Letzte Licht sie sehen und wissen, dass wir noch hier sind.",done:"Siehst du das, weit hinter den Bäumen? Ein Licht, das unserem antwortet. Das Letzte Licht steht noch. Elf Jahre habe ich nach diesem Licht gesucht und es nicht gesehen. Gib mir einen Moment."},
m13_5:{text:"Am Mondlosen Übergang wartet etwas. Der Hohle Herold, die Stimme, die Vharos vorausgeht. Wo er spricht, folgt die Lange Nacht: Er war es, der den Priestern sagte, welche Laternen sie zuerst verdunkeln sollten.\n\nEr wartet auf dich. Er will, dass du kommst. Das gefällt mir nicht. Aber er hält den Übergang zum Letzten Licht, also gibt es keinen anderen Weg.",done:"(Wren nimmt den Splitter und lässt ihn beinahe fallen; er ist so kalt, dass er brennt.) Ein Splitter der Hohlen Krone selbst. Der Herold trug ihn wie eine heilige Reliquie. Er war ein Versprechen: dass der König kommt und dass der Riss offen ist.\n\nVor dem Ende bleibt nichts mehr zu säubern, Träger der Aura. Nur noch das Ende."},
m13_6:{text:"Bring den Splitter zu Archontin Solenne im Letzten Licht. Sie hält die letzte Festung am Rand des Risses des Ungeschaffenen, und sie hält sie länger, als ich die Laternen hüte. Wenn jemand weiß, was Vharos ist und wie man ihn aufhält, dann sie.\n\nFolge der Laternenlinie. Dank dir leuchtet sie jetzt bis zum Ende. Und wenn alles vorbei ist, komm zurück und erzähl es mir. Ich würde es gern von dir hören.",done:"(Ein Soldat in rissiger Rüstung nimmt dir wortlos den Splitter ab, betrachtet deine leuchtende Hand und führt dich hinein, an den Kriegstisch.)"},
