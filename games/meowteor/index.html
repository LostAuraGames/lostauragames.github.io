<script>
(()=>{"use strict";
const ENGINE_BUILD='ef9ea45e3b3-r1';
// ================= I18N (shared by Lost Aura Games titles) =================
// One language setting for the whole site and every game: localStorage "lag.lang".
// Strings are looked up by their English text: t('PLAY') -> 'JUGAR'. {name} placeholders are filled from vars.
// Missing translations fall back to English and are logged once (console.info + I18N_MISS) so tests can catch them.

function t(key,vars){let s=key;if(LANG!=='en'){const d=I18N[LANG];if(d&&Object.prototype.hasOwnProperty.call(d,key))s=d[key];else if(!I18N_MISS.has(LANG+'|'+key)){I18N_MISS.add(LANG+'|'+key);try{console.info('[i18n] missing '+LANG+': '+key);}catch(e){}}}
 if(vars)s=String(s).replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);return s;}

function langName(c){const l=LAG_LANGS.find(x=>x[0]===c);return l?l[1]:c;}
function setLang(c,fromStorage){if(!LAG_LANG_CODES.includes(c))return;const changed=c!==LANG;LANG=c;try{document.documentElement.lang=c;}catch(e){}
 if(!fromStorage){try{localStorage.setItem(LAG_LANG_KEY,c);}catch(e){}}
 if(changed)for(const f of I18N_HOOKS){try{f(c);}catch(e){console.error(e);}}}

  'Í':['I','acute'],'Ì':['I','grave'],'Î':['I','circ'],'Ï':['I','uml'],'Ó':['O','acute'],'Ò':['O','grave'],'Ô':['O','circ'],'Õ':['O','tilde'],'Ö':['O','uml'],

 for(const k in map){if(F[k])continue;const v=map[k];const g=mk(v[0],v[1],v[2]);if(g)F[k]=g;}
 if(!F['Ç']&&F.C)F['Ç']=[0,...F.C,4];

 if(!F[','])F[',']=[0,0,0,0,0,4,8];if(!F['/'])F['/']=[1,1,2,4,8,16,16];if(!F['('])F['(']=[2,4,8,8,8,4,2];if(!F[')'])F[')']=[8,4,2,2,2,4,8];
 if(!F['%'])F['%']=[24,25,2,4,8,19,3];if(!F['+'])F['+']=[0,4,4,31,4,4,0];if(!F['"'])F['"']=[10,10,0,0,0,0,0];if(!F['«'])F['«']=[0,5,10,20,10,5,0];if(!F['»'])F['»']=[0,20,10,5,10,20,0];

function noise(d,vol=.08,delay=0,hp=800){if(SAVE.muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const len=Math.max(1,Math.floor(a.sampleRate*d));const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);}

const MUSIC={track:null,want:null,timer:null,step:0,next:0,gain:null};
const TRACKS={title:{bpm:92,root:130.8,scale:[0,2,4,7,9],seed:7,lead:'square',dens:.5,drums:false},
 play:{bpm:150,root:110,scale:[0,2,3,5,7,8,10],seed:31,lead:'square',dens:.62,drums:true},
 menu:{bpm:108,root:146.8,scale:[0,2,4,5,7,9,11],seed:58,lead:'triangle',dens:.55,drums:true}};
function genPattern(tr){const r=mulberry(tr.seed);const mel=[];let deg=4;for(let i=0;i<64;i++){if(i%8===0||r()<tr.dens){deg=clamp(deg+Math.floor(r()*5)-2,0,10);mel.push(deg);}else mel.push(null);}
 const prog=[0,5,3,4];const bass=[];for(let i=0;i<64;i++)bass.push(i%2===0?prog[Math.floor(i/16)%4]:null);const arp=[];for(let i=0;i<64;i++)arp.push(prog[Math.floor(i/16)%4]+[0,2,4,7][i%4]);return{mel,bass,arp};}
function noteF(tr,deg,oct=0){const sc=tr.scale;const o=Math.floor(deg/sc.length),d=((deg%sc.length)+sc.length)%sc.length;return tr.root*Math.pow(2,(sc[d]+12*(o+oct))/12);}
function startMusic(name){MUSIC.want=name;if(SAVE.muted||!AC)return;if(MUSIC.track===name&&MUSIC.timer)return;stopMusic();const a=AC;MUSIC.track=name;const tr=TRACKS[name];const pat=genPattern(tr);MUSIC.step=0;MUSIC.next=a.currentTime+.08;
 MUSIC.gain=a.createGain();MUSIC.gain.gain.value=.55;MUSIC.gain.connect(MASTER);const g=MUSIC.gain;
 const play=(f,t,d,type,v)=>{const o=a.createOscillator(),e=a.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+.02);};
 MUSIC.timer=setInterval(()=>{if(SAVE.muted){stopMusic();return;}const sd=60/tr.bpm/4;while(MUSIC.next<a.currentTime+.25){const i=MUSIC.step%64,t=MUSIC.next;const m=pat.mel[i];if(m!==null)play(noteF(tr,m,1),t,sd*1.7,tr.lead,.02);
  const b=pat.bass[i];if(b!==null)play(noteF(tr,b,-1),t,sd*1.9,'triangle',.07);
  if(name==='play'&&i%2===1)play(noteF(tr,pat.arp[i],2),t,sd*.6,'square',.008);
  if(tr.drums){if(i%4===0)play(70,t,.08,'sine',.12);if(i%4===2){const len=Math.floor(a.sampleRate*.035);const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let k=0;k<len;k++)ch[k]=(Math.random()*2-1)*(1-k/len);const s=a.createBufferSource();s.buffer=buf;const e=a.createGain();e.gain.value=.03;s.connect(e);e.connect(g);s.start(t);}}
  if(i%16===0)play(noteF(tr,0,0),t,sd*8,'sine',.03);MUSIC.step++;MUSIC.next+=sd;}},50);}
function stopMusic(){if(MUSIC.timer)clearInterval(MUSIC.timer);MUSIC.timer=null;MUSIC.track=null;if(MUSIC.gain){try{MUSIC.gain.disconnect();}catch(e){}MUSIC.gain=null;}}
function setMuted(m){SAVE.muted=!!m;persist();if(MASTER)MASTER.gain.value=SAVE.muted?0:1;if(SAVE.muted)stopMusic();else{ac();if(MUSIC.want)startMusic(MUSIC.want);}drawMuteIcon();}

// Difficulty for the k-th obstacle (0-based). e ramps 0 -> 1 over the first ~100 obstacles, then stays maxed (infinite level).
// Cross-engine determinism: the server re-simulates every submitted run (V8) and must get bit-identical results to

function detSin(x){const TP=6.283185307179586,P=3.141592653589793,H=1.5707963267948966;x=x-TP*Math.floor(x/TP);if(x>P)x-=TP;

function difficulty(k){k=Math.max(0,Math.floor(k));const e=k>=100?1:DIFF_E[k];
 return{e,gap:Math.round(96-26*e)+Math.max(0,3-k)*5, // vertical opening: 96 -> 70 px (+15/+10/+5 warm-up on the first 3; cat hitbox is 10 px tall)
  speed:64+32*e,                               // scroll speed px/s: 64 -> 96
  spacing:Math.round(116-26*e),                // obstacle-to-obstacle distance: 116 -> 90 px
  maxDelta:Math.round(42+54*e),                // max change of gap centre between neighbours: 42 -> 96 px
  moveP:k<18?0:Math.min(.45,(k-18)*.012),       // chance the gap drifts up/down (from score ~18)
  moveAmp:7+11*e,moveHz:.35+.35*e,
  starP:.3};}
function zoneOf(score){return Math.floor(score/25);}
class World{
 constructor(seed){this.seed=seed>>>0;this.rng=mulberry(this.seed);this.t=0;this.frame=0;
  this.cat={y:150,vy:0,rot:0};this.dead=false;this.deathBy=null;this.obs=[];this.k=0;this.score=0;this.picked=0;this.flaps=0;this.log=[];
  this.lastGy=150;this.events=[];this.spawn(PHYS.FIRSTX);}
 spawn(x){const r=this.rng,d=difficulty(this.k);const lo=PHYS.TOPM+d.gap/2,hi=PHYS.GROUND-PHYS.BOTM-d.gap/2;
  let gy=this.k===0?150+(r()*40-20):this.lastGy+(r()*2-1)*d.maxDelta;
  // occasionally force a big swing later on (variation), still bounded by maxDelta
  if(this.k>25&&r()<.15)gy=this.lastGy+(this.lastGy<(lo+hi)/2?1:-1)*d.maxDelta*(.8+r()*.2);
  const moving=r()<d.moveP;const amp=moving?d.moveAmp:0;
  gy=clamp(gy,lo+amp,hi-amp);
  const o={k:this.k,x,w:PHYS.OBW,gap:d.gap,base:gy,amp,hz:d.moveHz*(.8+r()*.4),ph:r()*6.283,passed:false,star:null,zone:zoneOf(this.k)};
  if(this.k>1&&r()<d.starP)o.star={dy:0,got:false,gold:r()<.12};
  this.obs.push(o);this.lastGy=gy;this.k++;}
 gapY(o,t=this.t){return o.amp?o.base+o.amp*detSin(o.ph+6.2832*o.hz*t):o.base;}
 speed(){return difficulty(this.score).speed;}
 // advance obstacles only (independent of the cat => usable for reachability search)
 stepWorld(){const dt=PHYS.DT,sp=this.speed();this.t+=dt;this.frame++;
  for(const o of this.obs)o.x-=sp*dt;
  while(this.obs.length&&this.obs[0].x+this.obs[0].w<-20)this.obs.shift();
  const last=this.obs[this.obs.length-1];const d=difficulty(this.k);if(last.x<=PHYS.W+40-d.spacing||!last)this.spawn(last.x+d.spacing);
  for(const o of this.obs)if(!o.passed&&o.x+o.w<PHYS.CATX-PHYS.HBW/2){o.passed=true;this.score++;this.events.push({e:'score',o});}}
 // does a cat at height y collide at the current time?
 hits(y){const hx0=PHYS.CATX-PHYS.HBW/2,hx1=PHYS.CATX+PHYS.HBW/2,hy0=y-PHYS.HBH/2,hy1=y+PHYS.HBH/2;
  if(hy1>=PHYS.GROUND)return'ground';
  for(const o of this.obs){if(o.x>hx1||o.x+o.w<hx0)continue;const g=this.gapY(o);if(hy0<g-o.gap/2||hy1>g+o.gap/2)return'pillar';}
  return null;}
 static catStep(c,flap){if(flap)c.vy=-PHYS.JUMP;c.vy=Math.min(PHYS.MAXFALL,c.vy+PHYS.G*PHYS.DT);c.y+=c.vy*PHYS.DT;if(c.y<PHYS.HBH/2){c.y=PHYS.HBH/2;if(c.vy<0)c.vy=0;}}
 step(flap){if(this.dead)return;if(flap){this.flaps++;this.log.push(this.frame);}World.catStep(this.cat,flap);this.stepWorld();
  const c=this.cat;c.rot=clamp(c.vy/300,-.45,1.1);
  for(const o of this.obs)if(o.star&&!o.star.got){const sx=o.x+o.w/2,sy=this.gapY(o);if(Math.abs(sx-PHYS.CATX)<10&&Math.abs(sy-c.y)<11){o.star.got=true;this.picked+=o.star.gold?5:1;this.events.push({e:'star',gold:o.star.gold,x:sx,y:sy});}}
  const h=this.hits(c.y);if(h){this.dead=true;this.deathBy=h;this.events.push({e:'dead',by:h});}}
 nextObstacle(){for(const o of this.obs)if(o.x+o.w>=PHYS.CATX-PHYS.HBW/2)return o;return null;}
}

// ---------- name validation + simple profanity filter ----------
const BAD_SUB=['fuck','fuk','shit','bitch','cunt','dick','pussy','asshole','nigg','faggot','slut','whore','rapist','nazi','hitler','penis','vagin','porn','twat','wank','retard','kike','chink','bastard','boob','jizz','dildo','molest','pedo','tits','semen','hentai','kkk','cumshot'];
const BAD_WORD=['ass','cum','sex','fag','tit','xxx','hoe','fck','fk','stfu','piss','arse','kys','cock','rape','spic','anus','nazis','sexy','cocks'];
function lbNormalize(s){return s.toLowerCase().replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t').replace(/8/g,'b').replace(/9/g,'g');}
// Slur block (mirrors public.lb_name_blocked in supabase.sql): look-alikes -> letters, keep a-z, collapse repeats.
function lbSlurNorm(s){const m={'1':'i','l':'i','!':'i','|':'i','y':'i','3':'e','4':'a','@':'a','0':'o','5':'s','$':'s','9':'g','6':'g','7':'t'};return String(s||'').toLowerCase().replace(/[1l!|y34@05$967]/g,c=>m[c]).replace(/[^a-z]/g,'').replace(/(.)\1+/g,'$1');}
function lbBlocked(s){return /nig(a|e?r|u[hr]|z|s|let)/.test(lbSlurNorm(s));}
function cleanName(raw){return String(raw||'').toUpperCase().replace(/[^A-Z0-9 _.\-]/g,'').replace(/\s+/g,' ').trim();}
function validateName(raw){const n=cleanName(raw);if(n.length<3)return{ok:false,err:t('Use 3-12 letters or numbers.')};if(n.length>12)return{ok:false,err:t('Max 12 characters.')};
 const norm=lbNormalize(n);const squash=norm.replace(/[^a-z]/g,'');const dedup=squash.replace(/(.)\1+/g,'$1');
 if(lbBlocked(raw)||lbBlocked(n))return{ok:false,err:t("That name isn't allowed")};
 if(BAD_SUB.some(w=>squash.includes(w)||dedup.includes(w)))return{ok:false,err:t('Please pick a friendlier name.')};
 const words=norm.split(/[^a-z]+/).filter(Boolean);if(words.some(w=>BAD_WORD.includes(w))||BAD_WORD.includes(squash))return{ok:false,err:t('Please pick a friendlier name.')};

 _all(){try{const a=JSON.parse(localStorage.getItem(LB_LOCAL_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}},

// ---------- Supabase adapter (PostgREST RPC via fetch) ----------
// Requires supabase.sql (functions submit_score, get_top_scores, get_my_rank). New sb_publishable_ keys go in the
// `apikey` header; legacy JWT anon keys also need `Authorization: Bearer` (sent automatically for those).
function SupabaseAdapter(url,key){const base=url.replace(/\/+$/,'')+'/rest/v1/rpc/';

 async function rpc(fn,body,timeout=7000){const ctl=typeof AbortController!=='undefined'?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),timeout);
  try{const r=await fetch(base+fn,{method:'POST',headers,body:JSON.stringify(body),signal:ctl&&ctl.signal,cache:'no-store'});const txt=await r.text();if(!r.ok)throw new Error('LB '+fn+' HTTP '+r.status+' '+txt.slice(0,160));return txt?JSON.parse(txt):null;}
  finally{clearTimeout(tm);}}
 return{kind:'supabase',
  // New/higher scores go to the verifier (edge function meowteor-submit): it replays the run from the server seed and
  // the flap log, so only runs that really happen in the game count. Renames (same best) use the plain RPC.
  async submitScore(name,score,run){const body={p_player_id:lbPlayerId(),p_name:name,p_score:Math.floor(score)};
   if(run&&typeof run==='object'&&run.id&&Array.isArray(run.flaps)){Object.assign(body,{p_run_id:run.id,frames:run.frames,flaps:run.flaps,build:ENGINE_BUILD});
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),20000);let r,txt;
    try{r=await fetch(url.replace(/\/+$/,'')+'/functions/v1/meowteor-submit',{method:'POST',headers,body:JSON.stringify(body),signal:ctl&&ctl.signal,cache:'no-store'});txt=await r.text();}finally{clearTimeout(tm);}
    let v=null;try{v=txt?JSON.parse(txt):null;}catch(e){}
    if(r.status===400||r.status===403||r.status===409)return{ok:false,rejected:true,banned:r.status===403,outdated:r.status===409,msg:(v&&v.message)||'rejected'};if(!r.ok)throw new Error('LB verify HTTP '+r.status);
    return{ok:true,rank:v&&v.rank,verdict:v&&v.verdict};}
   let res;try{res=await rpc('submit_score',body);}catch(e){const m=String(e.message||e);if(/HTTP 400/.test(m)&&/run ticket|verified run|not plausible|slow down|banned|name taken/.test(m))return{ok:false,rejected:true,msg:m};throw e;}
   const row=Array.isArray(res)?res[0]:res;return{ok:true,rank:row&&row.rank};},
  async startRun(){const res=await rpc('start_run',{p_player_id:lbPlayerId()},5000);const row=Array.isArray(res)?res[0]:res;return row&&row.run_id?{id:row.run_id,seed:(+row.seed)>>>0}:null;},
  async fetchTop(limit=100){const rows=await rpc('get_top_scores',{p_limit:limit,p_player_id:lbPlayerId()});return(rows||[]).map(r=>({rank:+r.rank,name:r.name,score:+r.score,me:!!r.is_me})).filter(r=>!lbBlocked(r.name));},
  async fetchBanned(){const rows=await rpc('get_banned_players',{p_limit:50});return(rows||[]).map(r=>({name:r.name,score:+r.best_score||0,at:r.banned_at}));},
  async fetchMyRank(playerId){const res=await rpc('get_my_rank',{p_player_id:playerId});const r=Array.isArray(res)?res[0]:res;if(!r||r.rank==null||lbBlocked(r.name))return null;return{rank:+r.rank,name:r.name,score:+r.score,total:+r.total_players};}};}

  return this._tp=this.remote.startRun().then(t=>{this.ticket=t||null;return this.ticket;},()=>null).finally(()=>{this._tp=null;});},

function lbNoteRun(W){if(!(W&&W.runId&&W.dead))return;const ev=CHAMP.activeEvent();const pb=W.score>(SAVE.vBest||0);const evb=!!ev&&W.score>0&&!(SAVE.evRun&&SAVE.evRun.ev===ev&&SAVE.evRun.score>=W.score);

// Server-authoritative (get_champion_current): server time, the active event, the last winner and the next start.
// Each event has its own 1-of-1 pro skin (item id per event). The skin's look is NOT in this file: the server returns
// the drawing code only to the winning player id (get_my_champion_skins, legacy claim_champion_skin); the game caches
// every won skin in localStorage (meowteor.champion.v2, migrated from v1). Everyone else only sees a mystery box.
// ?champ=<event-id> switches to one fixed event via the legacy RPC (used by the automated tests).
// =====================================================================================
const CHAMP_LEGACY_EVENT='meowteor-2026-10-29',CHAMP_EVENT_DEFAULT=CHAMP_LEGACY_EVENT;
const CHAMP_KEY1='meowteor.champion.v1',CHAMP_KEY='meowteor.champion.v2',CHAMP_ITEM='skin_champion';
const CHAMP={event:null,cur:null,off:0,skins:{},newest:null,cache:{items:{}},busy:false,poll:null,timer:null,lastState:null,claiming:false,legacy:false,invAt:0,
 // compatibility view used by the banner code: the event the banner is about
 get st(){const c=this.cur;if(!c)return null;if(c.active)return Object.assign({decided:false},c.active);if(c.last)return c.last;return{event:null};},
 get skin(){return this.skins[SAVE.eq.skin]||this.skins[this.newest]||null;},
 init(){const m=/[?&]champ=([a-z0-9-]{3,48})\b/.exec(location.search);if(m)this.event=m[1];
  try{const c2=JSON.parse(localStorage.getItem(CHAMP_KEY)||'null');if(c2&&c2.items)this.cache=c2;}catch(e){}
  // migrate the v1 single-skin cache (v1 is left in place as a backup)
  try{const c1=JSON.parse(localStorage.getItem(CHAMP_KEY1)||'null');if(c1&&c1.code&&c1.item&&!this.cache.items[c1.item]){this.cache.items[c1.item]=c1;this.save();}}catch(e){}
  for(const k in this.cache.items)this.load(this.cache.items[k]);
  for(const k in this.skins)SAVE.owned[k]=1;
  if(SAVE.eq.skin&&SAVE.eq.skin!=='skin_none'&&!this.skins[SAVE.eq.skin])SAVE.eq.skin='skin_none';
  if(!SAVE.eq.skin)SAVE.eq.skin='skin_none';
  this.refresh();this.inventory();clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),1000);},
 save(){try{localStorage.setItem(CHAMP_KEY,JSON.stringify(this.cache));}catch(e){}},
 // run the server-provided drawing code (only the winner ever receives it)
 load(c){try{const api={mkCanvas,pEll,pRect,px,outline,OUTL};const sk=(new Function('A',c.code))(api);
   if(sk&&typeof sk.sprite==='function'){this.skins[c.item]=sk;this.newest=c.item;CAT_CACHE.clear();return true;}}catch(e){console.warn('[champion] skin failed to load',c&&c.item,e);}return false;},
 now(){return Date.now()+this.off;},
 // 'upcoming' (countdown to the next start) | 'pending' (event live) | 'deciding' | 'banner' (winner + next countdown) | 'over' | 'none'

  if(c.active)return n<Date.parse(c.active.deadline)?'pending':'deciding';
  if(c.last&&c.last.has_winner&&n<Date.parse(c.last.banner_until))return'banner';
  if(c.next&&n<Date.parse(c.next.starts_at))return'upcoming';return c.last?'over':'none';},

// ================= TRAILS =================
const TRAIL={parts:[],hist:[]};
const RAINBOW=['#ff3a4a','#ff9a2a','#ffe23a','#3cff5a','#3a9aff','#a04cff'];
function trailReset(){TRAIL.parts.length=0;TRAIL.hist.length=0;}
function trailPush(y,rot){TRAIL.hist.unshift({y,rot});if(TRAIL.hist.length>90)TRAIL.hist.pop();}
function emitTrail(id,cx,cy,t,speed,eq){const P=TRAIL.parts,r=Math.random;const ex=cx-11,ey=cy+1;
 const add=o=>{o.age=0;o.vx=(o.vx||0)-speed;P.push(o);};
 if(skinOn(eq)){try{skinOf(eq).emit(add,ex,ey,t,r);}catch(e){}return;}
 switch(id){
  case'trail_stardust':if(r()<.7)add({k:'dust',x:ex,y:ey+r()*6-3,vy:r()*10-5,life:.9,c:pick(['#fff6c2','#ffd24a','#bcd3ff','#ffffff'])});break;
  case'trail_fire':for(let i=0;i<2;i++)add({k:'fire',x:ex+r()*2,y:ey+r()*5-2.5,vy:-15-r()*20,life:.45+r()*.25,s:2+r()*2});break;
  case'trail_hearts':if(t%10<1)add({k:'heart',x:ex,y:ey,vy:-12,life:1.1,c:pick(['#ff4a8a','#ff7ac8','#ff3a4a'])});break;
  case'trail_glitch':if(r()<.5)add({k:'glitch',x:ex+r()*4,y:ey+r()*10-5,w:2+r()*8,h:1+(r()*2|0),life:.35,c:pick(['#00ffff','#ff00ff','#ffffff','#3cff5a'])});break;
  case'trail_bubbles':if(r()<.25)add({k:'bubble',x:ex,y:ey+r()*6-3,vy:-8-r()*8,life:1.2,s:1+(r()*3|0)});break;
  case'trail_notes':if(t%12<1)add({k:'note',x:ex,y:ey-2,vy:-10,life:1.2,c:pick(RAINBOW),n:r()<.5?0:1});break;
  case'trail_snow':if(r()<.3)add({k:'snow',x:ex,y:ey+r()*8-4,vy:8+r()*8,life:1.4,c:pick(['#ffffff','#cfe8ff','#9fd0ff'])});break;
  case'trail_confetti':for(let i=0;i<2;i++)add({k:'conf',x:ex,y:ey+r()*6-3,vy:-20+r()*40,life:1,c:pick(RAINBOW),sp:r()*10});break;
  case'trail_matrix':if(r()<.35)add({k:'mtx',x:ex+r()*4,y:ey+r()*12-6,vy:18,life:.9,g:(r()*4)|0});break;
  case'trail_coins':if(t%8<1)add({k:'coin',x:ex,y:ey,vy:-30+r()*20,ay:120,life:1,ph:r()*6});break;
  case'trail_fish':if(t%14<1)add({k:'fish',x:ex,y:ey,vy:r()*6-3,life:1.3});break;
  case'trail_void':for(let i=0;i<2;i++){const a=r()*6.283,d=8+r()*6;add({k:'void',x:ex-6+Math.cos(a)*d,y:ey+Math.sin(a)*d,cxo:ex-6,cyo:ey,life:.6,a,d,c:pick(['#b04cff','#5a24c4','#ff7ac8','#000000'])});}break;
  case'trail_comet':if(r()<.5)add({k:'dust',x:ex-2,y:ey+r()*4-2,vy:r()*8-4,life:.5,c:pick(['#ffffff','#9fd0ff'])});break;
  case'trail_bolt':break;case'trail_rainbow':break;case'trail_plasma':if(r()<.3)add({k:'dust',x:ex,y:ey+r()*6-3,vy:r()*10-5,life:.6,c:pick(['#ff7ac8','#b04cff'])});break;case'trail_ghost':break;}
}
function updateTrail(dt){const P=TRAIL.parts;for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;if(p.age>=p.life||p.x<-20){P.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=(p.vy||0)*dt;if(p.ay)p.vy+=p.ay*dt;if(p.k==='heart'||p.k==='bubble')p.x+=Math.sin(p.age*8)*.3;}}
const HEART=['.x.x.','xxxxx','xxxxx','.xxx.','..x..'],NOTE=[['..xx','..x.','..x.','xxx.','xx..'],['.xxx','.x.x','.x.x','xx.x','x.xx']];
const GLYPH=[[7,5,7,5,7],[2,6,2,2,7],[7,1,7,4,7],[5,5,7,1,1]];
const FISHB=['x.....x.','xx.x.x.xx','xxxxxxxxx','xx.x.x.xx','x.....x.'];
function drawRibbon(x,cx,cy,speed,cols,band,wave,alphaF,thick){const H=TRAIL.hist;const step=speed/60;for(let i=1;i<H.length&&i<60;i++){const xx=Math.round(cx-10-i*step);if(xx<-4)break;const a=alphaF?alphaF(i):1;if(a<=0)break;x.globalAlpha=a;
  const yy=H[i].y+(wave?Math.round(Math.sin((i+(H.length?FRAME:0))*.25)*wave):0);
  const n=cols.length;const bh=band;for(let k=0;k<n;k++){x.fillStyle=cols[k];x.fillRect(xx,Math.round(yy-n*bh/2+k*bh),Math.ceil(step)+1,thick?thick(i,k):bh);}}x.globalAlpha=1;}
function drawTrail(x,id,cx,cy,speed,eq){const H=TRAIL.hist;const SK=skinOn(eq)?skinOf(eq):null;
 if(SK){try{SK.drawUnder(x,cx,cy,speed,H,FRAME);}catch(e){}id='trail_none';}
 if(id==='trail_rainbow')drawRibbon(x,cx,cy,speed,RAINBOW,1,1,i=>i<40?1:1-(i-40)/20);
 if(id==='trail_comet'){const step=speed/60;for(let i=1;i<H.length&&i<45;i++){const xx=cx-10-i*step,w=Math.max(.5,5-i*.11);x.globalAlpha=Math.max(0,1-i/45);x.fillStyle=i<6?'#ffffff':(i<18?'#bfe4ff':'#3a7bff');x.fillRect(Math.round(xx),Math.round(H[i].y-w),Math.ceil(step)+1,Math.round(w*2));}x.globalAlpha=1;}
 if(id==='trail_plasma'){const step=speed/60;for(let i=1;i<H.length&&i<50;i++){const xx=Math.round(cx-10-i*step);const a=Math.max(0,1-i/50);for(const [ph,col] of [[0,'#ff7ac8'],[3.14,'#b04cff']]){x.globalAlpha=a;x.fillStyle=col;x.fillRect(xx,Math.round(H[i].y+Math.sin(i*.35+FRAME*.2+ph)*4),Math.ceil(step)+1,2);}}x.globalAlpha=1;}
 if(id==='trail_bolt'&&H.length>4&&FRAME%3!==0){const step=speed/60;x.fillStyle='#fff6a0';let py=H[1].y;for(let i=2;i<Math.min(H.length,40);i+=2){const xx=cx-10-i*step;const ny=H[i].y+(Math.random()*8-4);const y0=Math.min(py,ny),y1=Math.max(py,ny);x.globalAlpha=1-i/40;x.fillStyle=i%4===0?'#ffffff':'#ffe23a';x.fillRect(Math.round(xx),Math.round(y0),2,Math.max(1,Math.round(y1-y0)));x.fillRect(Math.round(xx),Math.round(ny),Math.round(step*2)+1,1);py=ny;}x.globalAlpha=1;}
 if(id==='trail_ghost'){const step=speed/60;for(const i of [24,16,8]){if(i>=H.length)continue;x.globalAlpha=.12+.1*(3-i/8);const s=catSprite(eq,0);x.save();x.translate(Math.round(cx-i*step),Math.round(H[i].y));x.rotate(H[i].rot);x.drawImage(s,-(s.ax||CAT_AX),-(s.ay||CAT_AY));x.restore();}x.globalAlpha=1;}
 if(id==='trail_glitch'&&FRAME%20<3&&H.length>3){x.globalAlpha=.5;const s=catSprite(eq,0);x.globalCompositeOperation='lighter';x.drawImage(s,Math.round(cx-CAT_AX-3),Math.round(cy-CAT_AY));x.globalCompositeOperation='source-over';x.globalAlpha=1;}
 for(const p of TRAIL.parts){const f=1-p.age/p.life;const X=Math.round(p.x),Y=Math.round(p.y);x.globalAlpha=Math.min(1,f*1.5);
  if(p.k[0]==='c'&&p.k[1]==='s'&&p.k[2]==='_'){if(SK){try{SK.drawPart(x,p,f,X,Y);}catch(e){}}continue;}
  switch(p.k){
   case'dust':x.fillStyle=p.c;if(f>.6){x.fillRect(X-1,Y,3,1);x.fillRect(X,Y-1,1,3);}else x.fillRect(X,Y,1,1);break;
   case'fire':{const s=Math.max(1,Math.round(p.s*f));x.fillStyle=f>.75?'#fff2a0':f>.5?'#ffb02a':f>.25?'#ff4a2a':'#5a1a1a';x.fillRect(X,Y,s,s);break;}
   case'heart':x.fillStyle=p.c;for(let j=0;j<5;j++)for(let i=0;i<5;i++)if(HEART[j][i]==='x')x.fillRect(X+i,Y+j,1,1);break;
   case'glitch':x.fillStyle=p.c;x.fillRect(X+(Math.random()*4-2|0),Y,Math.round(p.w),p.h);break;
   case'bubble':{x.fillStyle='#9fe0ff';const s=p.s;x.fillRect(X-s,Y,1,1);x.fillRect(X+s,Y,1,1);x.fillRect(X,Y-s,1,1);x.fillRect(X,Y+s,1,1);if(s>1){x.fillRect(X-s+1,Y-s+1,1,1);x.fillRect(X+s-1,Y+s-1,1,1);x.fillRect(X+s-1,Y-s+1,1,1);x.fillRect(X-s+1,Y+s-1,1,1);}px(x,X-1,Y-1,'#ffffff');break;}
   case'note':{x.fillStyle=p.c;const m=NOTE[p.n];for(let j=0;j<5;j++)for(let i=0;i<4;i++)if(m[j][i]==='x')x.fillRect(X+i,Y+j,1,1);break;}
   case'snow':x.fillStyle=p.c;x.fillRect(X-1,Y,3,1);x.fillRect(X,Y-1,1,3);if(f>.5){px(x,X-1,Y-1,p.c);px(x,X+1,Y+1,p.c);}break;
   case'conf':x.fillStyle=p.c;if(Math.sin(p.age*p.sp+p.sp)>0)x.fillRect(X,Y,2,1);else x.fillRect(X,Y,1,2);break;
   case'mtx':{x.fillStyle=f>.8?'#c8ffd0':'#3cff5a';const g=GLYPH[p.g];for(let j=0;j<5;j++)for(let i=0;i<3;i++)if(g[j]&(4>>i))x.fillRect(X+i,Y+j,1,1);break;}
   case'coin':{const w=Math.max(1,Math.round(Math.abs(Math.cos(p.age*10+p.ph))*3));x.fillStyle='#ffd24a';x.fillRect(X-Math.floor(w/2),Y-1,w,3);x.fillRect(X-Math.floor(w/2)+(w>2?0:0),Y-2,w,1);x.fillStyle='#b8861a';x.fillRect(X-Math.floor(w/2),Y+1,w,1);break;}
   case'fish':x.fillStyle='#d8dce8';for(let j=0;j<5;j++)for(let i=0;i<9;i++)if(FISHB[j][i]==='x')x.fillRect(X+i,Y+j-2,1,1);break;
   case'void':{const k=1-f;const d=p.d*(1-k*.9);const a=p.a+k*5;x.fillStyle=p.c;x.fillRect(Math.round(p.x+(p.cxo-p.x)*0+Math.cos(a)*d-Math.cos(p.a)*p.d),Math.round(p.y+Math.sin(a)*d-Math.sin(p.a)*p.d),2,2);break;}
  }}

// Broadcaster: while a run with a server ticket is played, every ~450 ms the new flap frames + current frame are
// pushed to meowteor_live_push (server checks consent, top 100, not banned, rate limit; the seed comes from the
// ticket). Display only: scores still go through meowteor-submit (Aura Anticheat).
// Viewer: watch_live is polled every second; the run is rebuilt with the same deterministic engine from seed + taps

// Full-body skins are never streamed: viewers see the broadcaster's normal cosmetics on the classic cat.

// and LAG_CONFIG.COMMERCE_ENABLED is true. Otherwise WALLET.avail() is false and the game is unchanged.

//   signed in  -> SAVE.stars mirrors the SERVER wallet; spending goes through the atomic spend() RPC,
//                 run rewards through earn() (server caps), and the local guest balance is kept aside
//                 (persist() always writes the guest balance to localStorage, never the server one).
//   first sign-in on an account -> the local guest balance is merged once (server cap) and recorded in the ledger.
var WALLET=(function(){
 const GAME='meowteor',FIELD='stars',ICON='&#9733;',QKEY='meowteor.pendingEarn';
 const A=()=>(window.LAGAccount&&window.LAGAccount.enabled)?window.LAGAccount:null;
 const W={on:false,guest:0,busy:false,syncing:null,
  avail(){return !!A();},
  persistView(s){if(!W.on)return s;const o=Object.assign({},s);o[FIELD]=W.guest;return o;},
  set(b){SAVE[FIELD]=Math.max(0,Math.floor(+b||0));W.ui();},
  ui(){try{refreshStars();if(CUR==='wardrobe'&&typeof renderGrid==='function')renderGrid();}catch(e){console.warn(e);}},
  sync(u){const run=async()=>{const AC=A();if(!AC)return;
   if(u){if(!W.on)W.guest=Math.max(0,Math.floor(+SAVE[FIELD]||0));
    try{let w=await AC.wallet.get(GAME);
     if(!w.guest_merged){const m=await AC.wallet.mergeGuest(GAME,W.guest);if(+m.credited>0)AC.toast(AC.t('{n} {cur} from this device were moved to your account.',{n:fmt(m.credited),cur:ICON_TXT}),4500);
      if(!m.already_merged)W.guest=0;w=await AC.wallet.get(GAME);}
     let q=0;try{q=+localStorage.getItem(QKEY)||0;localStorage.removeItem(QKEY);}catch(e){}
     if(q>0){try{const r=await AC.wallet.earn(GAME,q,'retry');w={balance:r.balance};}catch(e){}}
     W.on=true;SAVE[FIELD]=Math.max(0,+w.balance||0);persist();W.ui();}
    catch(e){console.warn('[wallet] server unavailable, staying in local mode',e);if(e&&e.status!==401)AC.toast(AC.t('Could not reach the server. Please try again.'));}}
   else if(W.on){W.on=false;SAVE[FIELD]=W.guest;persist();W.ui();}};
   W.syncing=(W.syncing||Promise.resolve()).then(run,run);return W.syncing;},
  // spend for an item; ok() runs only after the server accepted the debit (or locally when signed out)
  spend(cost,item,ok,fail){cost=Math.floor(cost);
   if(!W.on){if(!(cost>=0)||SAVE[FIELD]<cost){sfx('err');fail&&fail();return false;}SAVE[FIELD]-=cost;persist();ok();return true;}
   if(W.busy)return false;if(SAVE[FIELD]<cost){sfx('err');fail&&fail();return false;}
   W.busy=true;A().wallet.spend(GAME,cost,item).then(r=>{W.busy=false;SAVE[FIELD]=+r.balance;ok();W.ui();},
    e=>{W.busy=false;sfx('err');if(/insufficient/.test(String(e&&e.message))){fail&&fail();W.reload();}else A().toast(A().t('Could not reach the server. Please try again.'));});
   return true;},
  earned(n){n=Math.floor(n);if(!W.on||!(n>0))return;
   A().wallet.earn(GAME,n,'run').then(r=>{SAVE[FIELD]=+r.balance;if(r.capped)A().toast(A().t('Daily earning limit reached. Play again tomorrow to earn more {cur}.',{cur:ICON_TXT}),4500);W.ui();},
    e=>{try{localStorage.setItem(QKEY,String((+localStorage.getItem(QKEY)||0)+n));}catch(x){}});},
  replaced(){if(W.on){W.guest=Math.max(0,Math.floor(+SAVE[FIELD]||0));W.reload();}},
  reload(){if(!W.on)return;A().wallet.get(GAME).then(w=>{SAVE[FIELD]=+w.balance;W.ui();},()=>{});},
  openStore(){if(!A())return;sfx('click');A().openStore({game:GAME,icon:ICON,onBalance:b=>{if(W.on)W.set(b);}});},
  openAccount(){if(!A())return;sfx('click');A().open(A().user()?'account':'signin');},
  button(compact){const lbl=A()?A().t('Get Coins'):'';const b=el('div',{class:'btn gold sm lag-getcoins','title':lbl,'aria-label':lbl,role:'button'},compact?'+'+ICON:'+ '+lbl);b.onclick=e=>{e.stopPropagation();W.openStore();};return b;},
  init(){const AC=A();if(!AC)return;AC.onChange(u=>W.sync(u));
   const u=AC.user();(u?W.sync(u):Promise.resolve()).then(()=>AC.resumeCheckout({game:GAME,icon:ICON,onBalance:b=>{if(W.on)W.set(b);}}));}};
 const ICON_TXT=ICON.replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d));
 return W;})();

// ================= BOOT =================
let LAST=0;
function loop(now){const dt=Math.min(.1,(now-(LAST||now))/1000);LAST=now;
 try{if(FRAME%2===0)bgFrame();if(CUR==='wardrobe'){FRAME++;wardrobeFrame(dt);}else if(CUR!=='ranks')gameFrame(dt);else FRAME++;}catch(e){console.error(e);}
 requestAnimationFrame(loop);}
function unlockAudio(){ac();if(MUSIC.want&&!MUSIC.timer&&!SAVE.muted&&!document.hidden)startMusic(MUSIC.want);}
addEventListener('pointerdown',unlockAudio,{passive:true});addEventListener('keydown',unlockAudio);
window.addEventListener('load',()=>{loadSave();WALLET.init();LB.init();LB.prefetchTicket();CHAMP.init();fit();bgInit();gameInit();inputInit();drawMuteIcon();
 $('#mute').addEventListener('click',e=>{e.stopPropagation();setMuted(!SAVE.muted);sfx('click');});
 $('#pauseb').addEventListener('click',e=>{e.stopPropagation();if(G.paused)resumeGame();else pauseGame();});
 $('#pauseb').title=t('Pause');$('#mute').title=t('Mute / unmute (M)');
 show('title');requestAnimationFrame(loop);
 BC.refresh();const wm=/[?&]watch=([0-9a-f-]{36})(?:&|$)/i.exec(location.search);if(wm&&LB.remote)openWatch(wm[1],'','title');
 setTimeout(()=>{lbMaybeSubmit().catch(()=>{});},1500);});
window.MEOWTEOR_UI=Object.freeze({screen:()=>CUR,modal:()=>!!MODAL_OPEN});
})();
</script>
