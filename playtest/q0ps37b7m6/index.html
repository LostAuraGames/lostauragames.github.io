// ================= Hand-written main questline: Wyrmwood Jungle =================
Object.assign(STORY_RICH,{
m8_1:{text:"(Warden Okonkwo turns Kael's pearl in the green light, and his face hardens.)\n\nThe Wyrmwood is sick. You can smell it: sweet, like fruit going bad. Under the jungle sleeps Verdigrax, the green god, whose roots run through every tree from here to the sea. Someone is poisoning his roots, and as he weakens, the wyrms grow wild and breed faster than ever.\n\nThe Naga Queen traded pearls for wyrm eggs. So the Hollow Crown wants dragons. The jungle is listening to us now, Bearer of the Aura. Let us give it something worth hearing.",
 done:"You walk softly for a stranger; the vines did not move against you. Verdigrax has noticed you. That is a good sign. I think."},
m8_2:{text:"The jungle raptors used to hunt the deep green. Now packs of them circle Vinehollow at dusk, testing the palisade, and every night they come a little closer. Something has driven them out of their hunting grounds.\n\nThin the packs around the village. My hunters will hold the gate while you do.",
 done:"The raptors have pulled back into the trees. My hunters say they ran from the nesting grounds in the first place. Whatever lives there now frightens even them."},
m8_3:{text:"The shadow panthers are the god's own hunters. They should be loyal to Verdigrax. But look at their eyes: grey and dull. The poison runs through them first; they carry it in their fangs to every animal they bite.\n\nBring me their fangs. If I can find what the poison is made of, I can find who made it.",
 done:"(Okonkwo grinds a fang to dust and watches it smoke.) Titan-dust and Hollow ash. The same filth as the Burned Lands and the desert tombs. The Crown poisons the world with the bones of its own victims."},
m8_4:{text:"The Nesting Grounds were a sacred place, where wyrms laid one egg a century. Now the ground is covered with them, hundreds, each one warm and pulsing black. The Crown is breeding an army of dragons for its war.\n\nSmash the eggs. Every egg you break is a dragon that will never burn a city.",
 done:"The nests are broken. Verdigrax stirred last night; the whole jungle shivered at once, like a sleeper turning over. He is still sick. But he is not alone anymore."},
m8_5:{text:"Broodkeeper Zhal tends the eggs at the Serpent Stones: a lizard-priest who sold the Wyrm Mother to the Hollow Crown for a promise of wings. He feeds the god's poison into the soil there with his own claws.\n\nEnd him. And bring me whatever he carries; the Crown always leaves a trail.",
 done:"A shackle of storm-iron, still crackling. Storm-iron is forged only in one place: under Thunderhold, where the giants hammer lightning into blades.\n\nDragons from the jungle, chains from the mountain. The Crown is building something that can hold a dragon. Or a god."},
m8_6:{text:"Thane Gorm rules Thunderhold in the Stormspire Highlands. He is stubborn, loud and proud, and he would rather die than let giants under his mountain forge chains for the Hollow Crown. He must see this shackle.\n\nGo north, Bearer of the Aura. The jungle will remember that you listened to it.",
 done:"(Thane Gorm slams the shackle on his table so hard the ale jumps.) Storm-iron! From my mountain! Hammer and thunder, someone is going to answer for this."},
d_wyrmden:{text:"Deep beneath the Nesting Grounds lies the Den of the Wyrm Mother. Vyrnaxa was the oldest of the wyrms, the god's own guardian. The Hollow Crown poisoned her heart and fed her until she was swollen with their sorcery, and now she births dragons for their war.\n\nShe cannot be saved. But she can be freed. Go down into her Den and end the Wyrm Mother, so that Verdigrax can wake clean.",
 done:"Verdigrax woke at dawn. Every flower in the Wyrmwood opened at once, and the rain tasted sweet. The jungle bows to you, Bearer of the Aura. So do I."},
});

// ================= Hand-written main questline: Stormspire Highlands, Sky Isles of Zephyra =================
Object.assign(STORY_RICH,{
m9_1:{text:"(Thane Gorm is still glaring at the storm-iron shackle.)\n\nThunderhold has held this mountain for nine hundred years. My forefathers made peace with the giants: they keep the deep halls, we keep the high roads, and nobody forges anything they shouldn't. Now the giants hammer lightning into chains every night, and the storms over the Stormspire have not stopped for a month.\n\nSomebody broke that peace. I want to know who, and then I want to break them.",
 done:"You came all the way from the jungle to bring me bad news. That's either brave or stupid, and in Thunderhold we drink to both. Sit."},
m9_2:{text:"The storm harpies ride the lightning down onto the high roads and tear apart anything that moves: traders, shepherds, my own patrols. The storms feed them; they have never been so many.\n\nClear the roads around Thunderhold. If we cannot travel, we cannot fight.",
 done:"The traders came up the high road this morning without losing a single mule. The harpies are screeching at the peaks, but they keep their distance now."},
m9_3:{text:"The thunder rams used to be gentle beasts; our shepherds rode them. Now they charge anything that moves, sparks crackling in their horns, as if the storm itself were driving them mad.\n\nBring me their horns. My rune-smiths can read the storm in them and tell me where it is being called from.",
 done:"The rune-smiths cracked a horn open and it hummed like a struck bell. The storm is being called, all right: from the Spire Field, where the giants have raised their lightning rods."},
m9_4:{text:"In the Spire Field, the giants have raised iron rods taller than any tree. They pull the lightning down out of the sky and feed it into the forges under the mountain, where it becomes storm-iron.\n\nTopple the rods. No lightning, no storm-iron. No storm-iron, no chains for the Hollow Crown.",
 done:"The sky over the Stormspire is clear for the first time in a month. My people stood on the walls just to look at the stars. You did that."},
m9_5:{text:"The giants answer to Skyrender, the biggest of them, who stands on Thunder Peak and shouts the storms awake. He made the bargain with the Hollow Crown: their gold and their promises for his lightning.\n\nBring him down. And bring me whatever the Crown paid him with.",
 done:"A feather of pure white and gold, warm to the touch, from the Sky Isles above the clouds. The Crown did not pay him in gold. They paid him with a seraph's feather: a promise of a place among the gods.\n\nThe seraphs of Zephyra are with the Hollow King. Hammer and thunder, even the sky has fallen."},
m9_6:{text:"High Priestess Aelia keeps Zephyra, the last free temple of the Sky Isles. If the seraphs have fallen to the Crown, she will know how, and how to climb to them.\n\nGo up, Bearer of the Aura. Thunderhold will hold the mountain. And if you ever need a hammer, you know where we live.",
 done:"(High Priestess Aelia takes the feather, and her hands shake.) This is Seraphiel's. Our guardian. So it is true, then. He gave them our sky."},
d_thunder:{text:"Under the mountain, in the Thunderhold Depths, Gorgrim Stormbreaker forges storm-iron for the Hollow Crown. He is the Storm Giant Warlord, the one who broke the old peace, and every chain the Crown carries came from his anvil.\n\nGo down into the Depths and break the Stormbreaker. Thunderhold will hold the gates behind you.",
 done:"The forges under the mountain have gone cold, and the giants who served him have fled into the deep halls. The old peace is not restored. But it can be, now. Thunderhold owes you a song, and we sing loudly."},
m10_1:{text:"Seraphiel was our guardian. For a thousand years he stood at the Cloudgate and kept the darkness below the clouds. Then the Hollow Crown came to him with a whisper: that humanity would destroy the sky as it had destroyed everything else.\n\nHe believed them. He tore the wings from my sisters and gave the Hollow King our sky. Zephyra is all that is left.\n\nYou climbed all the way up here. I think the sky still has a little hope left in it.",
 done:"The wind changed when you arrived. The old priests used to say that meant a friend had come. I had stopped believing them. Thank you."},
m10_2:{text:"The griffins were the sacred mounts of the sky-priests. Without their riders, they have gone wild, and now they hunt anyone who walks the bridges between the isles.\n\nDrive them off the bridges. One day, when the sky is free again, we will tame them again. Today we need to walk.",
 done:"The bridges are open. My acolytes crossed to the Wind Shrine this morning and came back singing. That has not happened in a long time."},
m10_3:{text:"The wards that kept the darkness below the clouds are broken. The old texts say they were woven from sky serpent scales, which hold the wind the way glass holds light.\n\nBring me sky serpent scales, and my priestesses will begin to weave the wards again.",
 done:"The first ward is woven, and it holds. Only a small one, over Zephyra. But last night the dark did not come up through the clouds."},
m10_4:{text:"When Seraphiel fell, the halos of the faithful shattered in the Broken Temple. Their shards still glow, and the Hollow Crown gathers them, because a broken halo is a door for things from below.\n\nCollect the shattered halos before the Crown can use them. We will lay them to rest.",
 done:"The halos are laid on the altar of Zephyra. They are dim, but they are not dark. My sisters' light is not entirely gone."},
m10_5:{text:"Exarch Valen was Seraphiel's second. It was Valen who opened the Cloudgate, and let the darkness rise. He stands there still, holding it open for his master.\n\nClose the gate. Defeat Valen, and bring me whatever he carries.",
 done:"An obol: a coin of the dead, cold as the grave. It was meant for the Bone Ferryman, who rows the dead across the Styx.\n\nSo the Crown buys the sky with lies and the dead with coins. The darkness is coming from below as well as above, Bearer of the Aura."},
m10_6:{text:"Go down. Far down, below the mountains, to the Styx Mire, where the river of the dead runs. A ferryman lives there at Charon's Rest, the one who refused his brother's bargain.\n\nTake the obol to him. And when you look up from the mire, remember the sky is still here, and still yours.",
 done:"(An old man in a grey cloak takes the obol and sighs.) My brother's coin. Welcome, living one. I am Charon, the ferryman who refused. Sit. We have much to speak of."},
d_aerie:{text:"Seraphiel the Fallen waits in the Aerie of the Fallen, the highest temple of the Sky Isles. He was our guardian, and now he tears the wings from the faithful and offers the sky to the Hollow King.\n\nI do not ask you to hate him. I ask you to stop him. Go up into the Aerie and end the Betrayer of the Sky Temple.",
 done:"(Aelia stands in silence for a long moment.) He said nothing as he fell? No... I think he was relieved. The sky is clear, Bearer of the Aura. My sisters will fly again."},
});

// ================= Hand-written main questline: Styx Mire =================
Object.assign(STORY_RICH,{
m11_1:{text:"(Charon turns the obol over in his grey fingers.)\n\nMy brother and I rowed the dead across the Styx since before your kingdoms had names. One fare each way: the living never came back, and that was the law. Then the Hollow Crown came to the landing with a chest of these coins and asked him to row the other way.\n\nHe took the coin. I did not. Now he ferries the dead back to the shore, and they climb out to fight for the Hollow King. I stayed here, at my own fire, so that someone would remember the law.",
 done:"You listened to an old ferryman all the way to the end. Most of the living do not. Stay a while. The mire is cruel, but my fire is warm."},
m11_2:{text:"The ghouls were the first ones my brother brought back. They remember hunger and nothing else. They dig in the Ghoul Warrens and creep up the Mourner's Path to eat the mourners who still come to visit their dead.\n\nLay them to rest. Do not hate them; they did not choose to come back. Just give them back to the river.",
 done:"The mourners walked the path today, and no one was taken. One old woman left a flower at my door. It is meant for you."},
m11_3:{text:"The shades are worse. They are empty, and to fill themselves they swallow the souls of the newly dead before those souls can reach the river. You can see them inside, little lights, trapped like moths in a jar.\n\nBreak the shades and free the soul wisps. Bring them to me, and I will row them across the proper way, the last fare of an honest ferryman.",
 done:"(Charon cups the wisps in his hands and breathes on them, and they grow brighter.) There. Tonight they cross. Somewhere, someone is finally at peace, and does not even know your name."},
m11_4:{text:"In the Lantern Graves, every grave once had a lantern so that the dead could find the way to the river. The Crown's servants put them out. Now the souls wander the mire, lost, and my brother's boat gathers them up like nets gather fish.\n\nLight the grave lanterns again. Give the lost ones a road that does not lead to him.",
 done:"Look out over the mire. Little lights, all in a line, all going the right way. For the first time in a year, my brother's boat came back empty."},
m11_5:{text:"There is a knight at the Black Ferry Landing who weeps as he fights. He was one of Aurelion's best, killed on the walls of the Burned Lands, and my brother rowed him back in chains. He knows what he is doing. He cannot stop.\n\nHe guards the landing for the Legion. Free him, Bearer of the Aura, and bring me whatever orders he carries.",
 done:"(Charon reads the orders and his face hardens.) Marching orders for the Hollow Legion. Every soul my brother brings back is sent to the Obsidian Wastes and armed at the Forge. They are building an army of our own dead, and they are marching on the Basalt Gate.\n\nThe knight stopped weeping when he fell. He said thank you."},
m11_6:{text:"Marshal Ignatius holds the Basalt Gate, the last wall between the Obsidian Wastes and the living world. He is a hard man, and he will not like where you came from. Show him the orders anyway.\n\nGo, living one. And when you cross back over the river, do not pay my brother. Tell him Charon says the law still stands.",
 done:"(Marshal Ignatius reads the orders twice, then crushes them in his gauntlet.) These are written in the hand of my old commander. A man I buried myself."},
d_styxgate:{text:"My brother waits at the Gates of the Styx. The Bone Ferryman, they call him now. He opened the gates of the dead, and every night he rows another boatload of souls back to serve the Hollow King.\n\nHe was not always this. Once he sang to the dead while he rowed. But he took the coin, and the coin is hollow, and now so is he.\n\nGo through the Gates. Break his oar. If there is anything of my brother left, tell him I kept the fire lit.",
 done:"(Charon is quiet for a long time.) The gates are shut. The river runs one way again. Thank you. I will row the next ones myself, the way it should be done. And I will sing to them, for both of us."},
d_ferry:{text:"Beneath the mire lies the Hall of Lost Souls, where Morwen the Soul-Weaver spins the souls my brother steals into thread, and the thread into armor for the Hollow Legion. Every plate the legionnaires wear is woven from someone who was loved.\n\nCut her loom. Unravel her work. Let them go.",
 done:"(A wind passes through Charon's Rest, warm, carrying a thousand quiet voices.) You hear that? That is every soul she wove, crossing at last. You did that. The Legion's armor will be thinner tomorrow."},
});

// ================= Hand-written main questline: Obsidian Wastes =================
Object.assign(STORY_RICH,{
m12_1:{text:"Kaelthas Ashborn. Lord-General of Aurelion, my commander for twenty years. He fell holding the walls of Cinderwatch when the Burned Lands first caught fire, and I carried him home and buried him under the King's own banner.\n\nNow his hand writes marching orders for the Hollow Legion. Whatever crawled out of that grave, it is not him. But it knows everything he knew, and he taught me everything I know about holding this gate.\n\nThe Basalt Gate is the last wall, Bearer of the Aura. Behind it is every living city you have saved. I need you on it.",
 done:"Charon sent you. A ferryman of the dead vouches for a living hero. I have stopped being surprised by anything. Welcome to the Basalt Gate. Find a shield."},
m12_2:{text:"Before the Legion marches, its golems come. Magma golems, poured at the Obsidian Forge, walk out of the Glass Canyon every night and throw themselves at our walls. Every one that breaks against the gate cracks the basalt a little more.\n\nBreak them before they reach the wall. Strike the cracks in their crust; molten stone does not like the cold of a blade.",
 done:"The masons say the gate will hold another month now. A month! In this place, that is a lifetime. Well fought."},
m12_3:{text:"Legion fire melts steel. I have seen it run off a soldier's shield like water, and then off the soldier. Only one thing holds against it: the scales of the fire drakes that nest in the Drake Roost. They were born in this heat.\n\nBring me drake scales, and my armorers will face every shield on the wall with them.",
 done:"The first drake-scale shields went up on the wall this morning. A legion firecaster tried his best against them and went home with burned hands. My soldiers cheered. They have not cheered in a long time."},
m12_4:{text:"In the Legion Camp, they raise war banners: black cloth, sewn with the names of the dead they have turned. Every legionnaire marches under the name of who they used to be. That is how Kaelthas holds them. They follow their own names.\n\nBurn the banners. Let the dead forget the names he stole. Maybe then they will stop following him.",
 done:"The camp is in chaos. Half the legionnaires simply sat down in the ash when the banners burned, and did not get up. They are resting, I think. Finally. Thank you."},
m12_5:{text:"Centurion Vulkar holds the Magma Gate, the Legion's door into the Wastes. He was a soldier of the Burned Lands, like me, and he chose the Crown while he was still alive. He was not turned. He volunteered.\n\nHe receives the Legion's messages from the east. Take the gate from him, and bring me whatever he was sent.",
 done:"(Ignatius holds up a lantern. Its flame burns black, and the light around it dims.) A lantern that burns dark. This came from the Shadowfell, from the priests of the Long Night. Whatever they are doing there, they are doing it for the Rift.\n\nThe Legion was never the end of it. It was a wall in front of something worse."},
m12_6:{text:"Go east, to the Shadowfell. Lantern-Keeper Wren holds Lanternfall, the only town there that still has light. She has fought the Long Night longer than anyone. She will know what this lantern means.\n\nAnd Bearer of the Aura... if you meet Kaelthas before the end, in the Citadel or anywhere else, do not hesitate on my account. He would not have wanted to be this.",
 done:"(Lantern-Keeper Wren holds the black lantern at arm's length.) Put that thing away before it eats the light in here. Where did you get it? Never mind. I know where. Sit. Not near the window."},
d_forge:{text:"Every Hollow blade is born at the Obsidian Forge, deep under the Wastes, where Ignaroth the Forge-Lord hammers the souls of the dead into weapons. The golems, the legion steel, the chains in Stormspire: all of it started on his anvil, in fire that never goes out.\n\nPut it out. Go down into the Forge and break Ignaroth. Without him, the Legion arms itself with sticks.",
 done:"The smoke over the Wastes is thinning. Scouts say the Forge is cold for the first time anyone remembers. You have taken the swords out of an army's hands. I have never been so glad to say a sentence."},
d_citadel:{text:"Kaelthas Ashborn waits in the Basalt Citadel. Warlord of the Hollow Legion, they call him now. He is marshalling the dead for the final march on Aurelion, and nothing I have can stop it.\n\nI cannot go. If I see his face, I will lower my sword, and he never would have. So you must.\n\nGo into the Citadel. End my commander. And tell him... no. Just end it. He will know.",
 done:"(Ignatius takes the broken general's badge and is silent a long moment.) He taught me: a soldier's last duty is to be stopped when he is wrong. You did his last duty for him. I will bury him again. This time, he will stay."},
});

// ================= Hand-written main questline: The Shadowfell =================
Object.assign(STORY_RICH,{
m13_1:{text:"That lantern was lit in the Umbral Cathedral. The priests of the Long Night take a lantern of Lanternfall, a living light that someone tended, and they turn it inside out. Every one of those they make, one of ours goes dark.\n\nIn the Shadowfell, light is life. Where the lanterns go out, the nightmares walk, and people simply stop waking up. Half of Lanternfall sleeps now and cannot be woken.\n\nI am the last Lantern-Keeper. I have been keeping the lights alone for eleven years. Will you help me keep them a little longer?",
 done:"(Wren lights a small candle and sets it between you.) There. One more light in the world, and two people to keep it. That is how it starts."},
m13_2:{text:"The nightmare hounds hunt the Lantern Road. They are made of the dreams of the sleepers, and they smell light the way wolves smell blood. Every lantern-bearer I send out, they run down before the second mile.\n\nHunt them first. Keep to the light, and do not look into their eyes for long. You will see something you are afraid of, and they will be on you.",
 done:"The lantern-bearers came back from the second mile and the third. One of the sleepers in the hall woke this morning and asked for breakfast. Small things. Everything is small things, here."},
m13_3:{text:"Void spiders spin silk that does not reflect light. Hollow priests use it to smother our lanterns. But turned the other way, as a wick, void silk drinks the dark and burns it: a flame the Long Night cannot put out.\n\nBring me void silk. I will make wicks for every lantern in Lanternfall.",
 done:"(Wren lights a new wick. The flame is pale silver, and the shadows in the corners pull back from it.) Look at that. Let them try to snuff it now."},
m13_4:{text:"The Weeping Wood was the last stretch of the old lantern line, the one that led from Lanternfall to Last Light. The priests darkened every lantern there, and since then not a single message has come through from the Archon.\n\nRelight the darkened lanterns in the Weeping Wood with the new wicks. If the line is lit again, Last Light will see it, and will know we are still here.",
 done:"Do you see that, far off past the trees? A light answering ours. Last Light still stands. Eleven years I have looked for that light and not seen it. Give me a moment."},
m13_5:{text:"There is something waiting at the Moonless Crossing. The Hollow Herald, the voice that walks ahead of Vharos. Wherever it speaks, the Long Night follows: it is the one who told the priests which lanterns to darken first.\n\nIt is waiting for you. It wants you to come. I do not like that. But it holds the crossing to Last Light, so there is no other way.",
 done:"(Wren takes the shard and nearly drops it; it is cold enough to burn.) A shard of the Hollow Crown itself. The Herald carried it like a holy relic. It was a promise: that the King is coming, and that the Rift is open.\n\nThere is nothing left to clear before the end, Bearer of the Aura. Only the end."},
m13_6:{text:"Take the shard to Archon Solenne at Last Light. She holds the last fortress at the edge of the Rift of the Unmade, and she has held it longer than I have kept the lanterns. If anyone knows what Vharos is and how to stop him, it is her.\n\nFollow the lantern line. It is lit all the way now, thanks to you. And when it is over, come back and tell me. I would like to hear it from you.",
 done:"(A soldier in cracked armor takes the shard from you without a word, looks at your glowing hand, and leads you inside, to the war-table.)"},
d_cathedral:{text:"Archbishop Nocturne preaches from the Umbral Cathedral that the light was always a lie, and that the Long Night is a mercy: if no one wakes, no one suffers. Every lantern turned dark was turned on his altar. Every sleeper in Lanternfall is one of his converts, whether they chose it or not.\n\nGo into the Cathedral and silence him. Bring back the light he stole.",
 done:"(Across Lanternfall, one after another, the sleepers begin to wake.) Do you hear that? Doors opening. People calling names. Eleven years of quiet, and now the town is noisy. It is the best thing I have ever heard."},
d_sanctum:{text:"Below the Crystal Hollow is the Nightmother's Sanctum. She weaves the nightmares that drive whole cities mad, and her web is the Hollow King's door into every sleeping mind. The hounds are her dreams. The sleepers are her flies.\n\nCut the web. Go down into the Sanctum and end the Nightmother, and the sleepers of the world will dream their own dreams again.",
 done:"I slept last night. Properly, for the first time in years, and I dreamed of my mother's kitchen. I had forgotten its color. Thank you, Bearer of the Aura. Truly."},
});

QTR.de={
m0_1:{text:"Ruhig, du hast zwei Tage geschlafen. Jäger fanden dich am Waldrand, kalt wie ein Flussstein, und das Mal auf deiner Handfläche glühte wie Kohle.\n\nIch bin Maren, die Älteste von Hearthmoor. Antworten habe ich noch keine, nur Ärger: Der Flüsterwald hat sich gegen uns gewandt. Ameisen so groß wie Ponys strömen aus den Bäumen, und unsere Palisade wurde gegen Wölfe gebaut, nicht gegen so etwas.\n\nWer immer du vorher warst, Hearthmoor braucht dich jetzt.",done:"Du stehst sicherer, als du solltest. Gut. Das Mal an deiner Hand flammte auf, als du aufstandest; von solchen Dingen las ich in den alten Liedern. Bleib vorerst in der Nähe des Dorfes. Es gibt Arbeit, und wenig Zeit."},
m0_2:{text:"Sieh dir die Felder an: Die Arbeiterameisen räumen eine Gerstenreihe in einer Stunde ab und tragen sie in den Wald. So planen Ameisen nicht. Etwas füttert sie, treibt sie an.\n\nSchlag die Arbeiterinnen auf den Feldern und am Waldrand nieder. Jede, die du tötest, ist ein Maul weniger an unserem Kornspeicher.",done:"Sechs weniger, und der Rest hat sich in die Bäume zurückgezogen. Sie sind nicht geflohen... sie sind abgerückt, wie Soldaten. Das macht mir mehr Angst als der Schwarm selbst."},
m0_3:{text:"Die Soldatenameisen spucken eine Säure, die Eiche und Eisen gleichermaßen zerfrisst. Unser Osttor ist halb zerstört.\n\nDer alte Teodric, unser Alchemist, schwört, er könne eine Gegensalbe brauen, aber er braucht ihre Mandibeln, frisch, mit den Säuredrüsen darin. Bring ihm, was er braucht. Pass auf deine Hände auf.",done:"Teodric schnitt eine auf und wurde bleich. In den Drüsen ist Asche: schwarze Asche, aus keinem Feuer dieses Waldes. Jemand füttert den Schwarm mit etwas, das weit älter ist als Hunger."},
m0_4:{text:"Unsere Späher fanden ihre Brutstätte: die Ameisenhügelsenke, nördlich des Mondbrunnens. Der Boden ist ein Teppich aus Eiersäcken, jeder pulsiert mit derselben schwarzen Asche.\n\nVerbrenne sie. Schlüpft die nächste Brut, fällt Hearthmoor vor dem ersten Schnee.",done:"Die Jäger sahen den Rauch von der Mauer und jubelten. Aber sie sahen auch eine Gestalt auf dem Hohlen Altar, die das Feuer beobachtete. Groß. Falsch. Keine Ameise."},
m0_5:{text:"Der Hohle Altar: eine Ruine, älter als Hearthmoor. Kindern sagt man, sie sollen niemals dorthin gehen. Jetzt steht etwas darauf, und der Schwarm bewegt sich, wenn es sich bewegt.\n\nEs nennt sich Kzzrak, der Brutaufseher. Die Ameisen sind nicht seine Kinder; sie sind seine Waffe. Töte es und bring mir, was es bei sich trägt.",done:"Ein Siegel aus schwarzem Eisen: eine Krone, in der nichts ist.\n\nDie Hohle Krone. Meine Großmutter sang von ihnen: Männer und Frauen, die glauben, die Menschheit sei der große Fehler der Welt, und die einem herzlosen König namens Vharos dienen. Sie wollen jeden Herd kalt und jede Straße leer. Ich hielt sie für ein Märchen.\n\nUnd dein Mal... die Lieder nennen es die Verlorene Aura. Das letzte Licht, das antwortet, wenn die Krone sich erhebt."},
m0_6:{text:"Der Aufseher ist tot, aber die Königin unter dem Wald brütet weiter. Das ist ein Kampf für später, wenn du stärker bist.\n\nZuerst müssen Leute mit Schwertern und Mauern dieses Siegel sehen. Bring es nach Osten durch die Bäume zu Vogt Hollis in Briarford. Wenn die Hohle Krone sich hier regt, regt sie sich überall.\n\nGeh mit dem Licht, Kind. Hearthmoor wird sich an dich erinnern.",done:"(Vogt Hollis dreht das Siegel lange in seinen Händen.) Maren schickt dich? Dann ist es wahr, und ich war ein Narr, über die alten Lieder zu lachen."},
d_hive:{text:"Jetzt bist du bereit, es zu hören. Unter dem Flüsterwald, zwischen den Wurzeln des ältesten Baumes, liegt ein Stock. In seinem Herzen lebt Myrmexa, die Brutkönigin: einst eine gewöhnliche Ameisenkönigin, jetzt von hohler Zauberei aufgebläht bis zur Größe einer Scheune.\n\nSolange sie lebt, kehrt der Schwarm zurück, Jahreszeit um Jahreszeit, bis kein Dorf am Waldrand mehr steht. Die Krone hat sie hier gepflanzt, um uns langsam ausbluten zu lassen.\n\nSteig hinab in den Brutstock. Töte sie. Nimm Tränke mit, viele, und lass dich nicht von ihren Schlägen erwischen.",done:"Der Wald ist... still. Zum ersten Mal seit einem Jahr höre ich im Morgengrauen Vögel. Was immer sie dort unten bewachte, behalte es. Du hast es verdient, Held von Hearthmoor."},
m1_1:{text:"Marens Siegel. Eine leere Krone. (Vogt Hollis legt es auf den Tisch, als könnte es beißen.)\n\nAuch ich habe über die alten Lieder gelacht. Dann bezahlten die Banditen auf meinen Straßen ihr Bier mit schwarzen Münzen, geprägt mit genau dieser Krone. Briarford ist die letzte Station vor dem Königreich: Jeder Karren Korn und Eisen für Aurelion rollt hier durch, und in letzter Zeit kommt die Hälfte nie an.\n\nJemand will die Hauptstadt hungern lassen. Ich will wissen, wer.",done:"Gut. Wenn Maren dir vertraut, tue ich es auch. Thornvale steht dir offen; trau nur niemandem, der schwarze Münzen trägt."},
m1_2:{text:"Die Halsabschneider an der Oststraße nahmen früher Wegzoll und ließen die Leute ziehen. Jetzt verbrennen sie die Karren, töten die Fuhrleute und lassen die Ladung verrotten. Das ist kein Raub. Das ist eine Blockade.\n\nDünne sie aus. Jeder Bandit, den du niederstreckst, ist ein Wagen, der das Königreich erreicht.",done:"Drei Wagen haben heute Morgen die Hauptstadt erreicht. Zum ersten Mal seit einem Monat. Die Fuhrleute geben dir einen aus, ob du willst oder nicht."},
m1_3:{text:"Die Keiler kamen diesen Frühling mit roten Augen und Schaum an den Hauern aus den Hügeln. Sie fressen die Ernte nicht: Sie zertrampeln sie, Feld um Feld, als würden sie getrieben.\n\nBring mir ihre Hauer. Die Bauern zahlen eine Prämie, und ich lasse die Heckenhexe untersuchen, was sie wahnsinnig macht.",done:"Die Heckenhexe kochte einen Hauer, und das Wasser wurde schwarz. Dieselbe Asche, die Maren in ihren Ameisen fand. Was die Krone den Bestien gibt, breitet sich nach Osten aus."},
m1_4:{text:"Die Banditen haben vor zwei Nächten unseren Kornspeicher überfallen und jeden Sack Winterkorn in ihr Lager in den Hügeln geschleppt. Holen wir ihn nicht zurück, verhungert Briarford vor dem Frühling, und mit ihm die Familien an der Straße nach Aurelion.\n\nGeh ins Banditenlager und bring das Korn heim.",done:"Du hast die Säcke gefunden... und Befehle, an den Pfahl des Lagers genagelt. 'Verbrennt, was ihr nicht tragen könnt. Die Hauptstadt soll hungrig knien.' Unterzeichnet mit einer Krone, in der nichts ist."},
m1_5:{text:"Der Mann, der diese Befehle gibt, nennt sich Gallowsjack, der Banditenkönig. Er war Henker in Aurelion, bis der König den Mann begnadigte, den er hängen sollte. Seitdem hasst er die Krone, und jetzt hat er eine neue gefunden, der er dient.\n\nEr verschanzt sich in den Ruinen von Thornkeep. Mach ihm ein Ende und bring mir, was er bei sich trägt.",done:"Ein Beutel voller hohler Münzen und ein Brief mit schwarzem Wachssiegel. Er ist an jemanden am königlichen Hof gerichtet.\n\nDas ist größer als Banditen, größer als Briarford. Die Krone hat Freunde in der Halle des Königs selbst."},
m1_6:{text:"Ich kann das nicht per Bote schicken: Wer immer an diesem Hof sitzt, würde dafür sorgen, dass es 'verloren geht'. Es muss persönlich übergeben werden, dem König selbst.\n\nReite nach Aurelion. Bitte um Audienz bei König Aldric und leg diesen Beutel und diesen Brief in seine Hände, in niemandes sonst. Thornvale wird halten. Geh.",done:"(Die Palastwachen wollen dich abweisen, bis der König die schwarze Münze in deiner Hand sieht und dich selbst heranruft.)"},
m2_1:{text:"So kommt der Held des Flüsterwalds mit hohler Münze und den Befehlen eines Banditen. Knie, wenn du willst; ich bin der Zeremonien müde.\n\nIch bin Aldric, und dies ist mein Königreich, was davon übrig ist. Mein Vater sprach von der Hohlen Krone: einem Glauben, der lehrt, die Menschheit sei eine Krankheit und das Gnädigste sei, sie zu beenden. Ihre Priester predigen jetzt offen auf meinen Straßen, und meine eigenen Lords tun so, als hörten sie nichts.\n\nDieses Mal, das du trägst... meine Hofzauberin gäbe ihr linkes Auge, um es zu sehen. Ich sähe es lieber im Einsatz.",done:"Du hast nicht gezuckt, als ich sie nannte. Gut. Die meisten meines Hofes schon. Aurelion hat Mauern, Händler und zehntausend Seelen, die noch nicht wissen, was kommt. Hilf mir, dass es so bleibt."},
m2_2:{text:"Die Kultisten versammeln Menschenmengen an den Kreuzungen. Sie erzählen den Bauern, ihr König habe sie verlassen, die Krone werde ihnen Frieden geben: den Frieden des Grabes.\n\nIch sperre niemanden ein, weil er zuhört. Aber die Prediger tragen Dolche, und drei meiner Steuerreiter sind bereits tot. Brich den Griff des Kults um die Kronlande.",done:"Die Kreuzungen sind ruhig. Meine Wachen fanden Listen bei den Toten: Namen jeder Familie, die nicht zuhören wollte. Zur 'Auslöschung' markiert. Diese Listen sind jetzt Asche. Danke."},
m2_3:{text:"Grabräuber sind in den Alten Friedhof eingebrochen und haben die Siegelringe meiner Ahnen aus den Gräbern gestohlen. Kleiner Diebstahl, würdest du denken.\n\nAber ein Siegelring kann einen königlichen Befehl besiegeln. Mit den Siegeln von sieben Königen könnte die Krone die Hälfte meiner Garnisonen marschieren lassen, wohin sie will. Hol sie zurück.",done:"Sieben Siegel... und eines, das ich nie gesehen habe: das Siegel von Sir Varric, dem Streiter meines Großvaters, der ihn verriet und in Ketten unter der Stadt begraben wurde. Dieses Grab sollte für immer versiegelt sein."},
m2_4:{text:"Die Kultisten errichten Bildnisse auf dem Alten Friedhof: Strohkönige mit leeren Kronen, getränkt in Blut und Pech. Meine Priester sagen, jedes davon macht die Mauer zwischen den Lebenden und dem, was darunter liegt, dünner.\n\nReiß sie nieder. Verbrenne sie. Lass mein Volk sehen, dass die Götzen der Krone fallen wie jedes andere Stroh.",done:"Die Priester sagen, der Friedhof 'atme leichter'. Ich weiß nicht, was das bedeutet, und ich bin nicht sicher, ob ich es wissen will."},
m2_5:{text:"Alles führt zu einem Mann: Diakon Malvray, einst mein eigener Kaplan. Er hält Riten im Versunkenen Schrein unter dem alten Aquädukt, und er ist die Stimme, der die Kultisten gehorchen.\n\nEr hat meine Tochter getauft. Jetzt würde er das Königreich ertränken. Bring ihn zum Schweigen und bring mir, worin er schreibt.",done:"Sein Kassenbuch. Seiten voller Namen, Zahlungen in schwarzem Gold... und Befehle, in kalter, schöner Hand geschrieben und nur mit einer leeren Krone unterzeichnet.\n\nSie bauen etwas in den Verbrannten Landen. Eine Gießerei, heißt es. Cindermaws Schmiede. 'Um das Brot der Menschen zu vergiften.'"},
m2_6:{text:"Die Verbrannten Lande waren einst die Kornkammer meines Reiches. Jetzt wächst dort nichts mehr, und meine Späher kehren Blut hustend zurück. Wenn Malvrays Buch stimmt, vergiftet die Krone die Erde selbst, um uns auszuhungern und Ungeheuer aus der Schlacke zu züchten.\n\nHauptmann Sera Vex hält das Fort Cinderwatch mit dem, was von der Glutgarde übrig ist. Geh zu ihr. Sag ihr, der König hat sie nicht vergessen, und dass endlich Hilfe kommt.",done:"(Hauptmann Vex liest das Siegel des Königs und lacht kurz und hart.) 'Hilfe kommt.' Das sagt er seit zwei Jahren. Und sie schicken... dich. Nun ja. Du solltest besser so gut sein wie die Geschichten."},
d_crypt:{text:"Sir Varric der Eidlose. Der Streiter meines Großvaters, der Plünderern für einen Beutel Gold die Tore öffnete und lebendig unter dieser Stadt in silbernen Ketten begraben wurde.\n\nDie Kultisten haben diese Ketten gebrochen. Meine Wachen hören nachts Rüstungen in den Katakomben von Aurelion marschieren, und die königlichen Toten ruhen nicht. Varric erhebt eine Armee von Königen unter meinem eigenen Thron.\n\nSteig hinab. Leg ihn zurück in sein Grab, und sorg diesmal dafür, dass er dort bleibt.",done:"Die Glocken läuteten von selbst, als er fiel. Die Priester nennen es ein Wunder. Ich nenne es eine Schuld, eine, die Aurelion dir zurückzahlen wird."},
m3_1:{text:"Sieh dich um. Das war die Kornkammer des Reiches. Meine Großmutter baute Gerste an, wo jetzt dieser Schlackehaufen steht. Jetzt ist der Boden Rost, der Regen verbrennt die Haut, und die Brunnen schmecken nach Kupfer.\n\nAll das ist das Werk der hohlen Gießereien. Ihre Schlote stehen nie still. Sie vergiften das Land, damit die Städte hungern, und aus dem Gift züchten sie Soldaten.\n\nIch bin Sera Vex. Willkommen am Ende der Welt.",done:"Du bist gekommen. Das ist mehr, als die meisten tun. Die Glutgarde sind vierzig Seelen und drei funktionierende Armbrüste. Was immer du bist, du bist jetzt unsere beste Waffe."},
m3_2:{text:"Die Schlackegolems sind das Schlimmste. Sie kriechen aus den Schwarzen Schloten, geschmolzener Abfall, dem hohle Riten Beine gegeben haben, und laufen, bis sie erkalten, und verbrennen alles, was sie berühren.\n\nZerschlag sie, bevor sie die Höfe erreichen, die noch versuchen, etwas anzubauen. Ziel auf die Risse; dort brennen die Kerne am heißesten.",done:"Sie zerbrechen wie Töpferware, wenn sie erkaltet sind. Gut zu wissen. Die Garde nennt dich schon 'den Golembrecher'. Lass es dir nicht zu Kopf steigen."},
m3_3:{text:"Die Ascheteufel tragen brennende Kerne, kleine Herzen aus Gießereifeuer. Meine Schmiedin glaubt, sie könne daraus Brandbomben machen, und wir würden der Krone liebend gern ihren eigenen Rauch zu kosten geben.\n\nBring mir Kerne. Halte sie nicht zu lange; sie beißen zurück.",done:"Ha! Schmiedin Odda warf einen auf einen Schlackehaufen, und er ging hoch wie ein Festfeuer. Wir haben wieder Zähne."},
m3_4:{text:"Die Schlammgruben werden von Ventilen der Gießerei gespeist: Abwässer so faulig, dass Vögel sterben, die darüberfliegen. Jeder Tropfen, der in die Erde sickert, ist ein weiteres Feld, das für immer verloren ist.\n\nVersiegle diese Ventile. Alle. Heilen können wir das Land noch nicht, aber wir können die Blutung stillen.",done:"Der Brunnen des Aschenhofs lief heute Morgen klar. Klar. Der alte Haskin weinte in den Eimer. Das warst du."},
m3_5:{text:"Die Gießereisklaven sind Männer und Frauen aus Aurelions Dörfern, nachts verschleppt und an die Öfen gekettet. Aufseher Grakk lässt sie arbeiten, bis sie umfallen, und wirft sie dann in die Schlacke.\n\nEr hält die Schwarzen Schlote. Töte ihn, befreie, wen du kannst, und bring mir, was er bei sich trägt. Wenn wir die Gießerei selbst angreifen wollen, müssen wir wissen, wie sie funktioniert.",done:"Baupläne der Gießerei. Nicht für Waffen, sondern für Maschinen. Seuchenmaschinen, in Kisten verpackt und nach Süden in das Mirewood-Moor geschickt.\n\nSie wollen uns nicht nur aushungern. Sie wollen krank machen, wer übrig bleibt. Das war nie ein Krieg um Land. Es ist ein Krieg, um uns auszulöschen."},
m3_6:{text:"Diese Pläne müssen Mutter Ilse in Bogmere erreichen, bevor es die Seuchenmaschinen tun. Sie kennt das Moor und seine Hexen besser als irgendjemand sonst.\n\nIch würde selbst gehen, aber wenn ich gehe, fällt Cinderwatch. Also bist es wieder du. Es ist immer du, oder? Reite nach Süden. Und danke; das sage ich nicht oft.",done:"(Mutter Ilse nimmt die Pläne mit zitternden Händen.) Seuchenmaschinen... das also brauen die Hexen. Setz dich, Held. Das wird eine lange Nacht."},
d_foundry:{text:"Im Herzen der Verbrannten Lande steht die Schlackengießerei, und in ihrem Herzen Cindermaw der Kunstschmied: ein hohler Schmied, der die Golems schmiedete, die Flüsse vergiftete und die Seuchenmaschinen mit eigenen versengten Händen baute.\n\nSolange seine Öfen brennen, wird hier nie wieder etwas wachsen. Geh in die Schlackengießerei und lösche sein Feuer für immer.\n\nDie Glutgarde hält das Tor hinter dir. Komm zu uns zurück.",done:"Die Schlote wurden im Morgengrauen dunkel. Alle. Zum ersten Mal seit zwei Jahren sehe ich die Sterne über Cinderwatch. Trink heute Nacht mit uns, Held. Morgen beginnt das Land zu heilen."},
};

QTR.es={
m0_1:{text:"Tranquilo, has dormido dos días. Los cazadores te encontraron al borde del bosque, frío como piedra de río, y esa marca de tu palma brillaba como una brasa.\n\nSoy Maren, anciana de Hearthmoor. Aún no tengo respuestas, solo problemas: el Bosque Susurrante se ha vuelto contra nosotros. Hormigas del tamaño de ponis salen de entre los árboles, y nuestra empalizada se hizo para lobos, no para esto.\n\nSeas quien fueras antes, Hearthmoor necesita que seas alguien ahora.",done:"Te tienes en pie mejor de lo que deberías. Bien. La marca de tu mano resplandeció al levantarte; he leído de cosas así en las viejas canciones. Quédate cerca del pueblo por ahora. Hay trabajo, y poco tiempo."},
m0_2:{text:"Mira los campos: las hormigas obreras arrasan una hilera de cebada en una hora y se la llevan al bosque. Las hormigas no planean así. Algo las alimenta, las dirige.\n\nAbate a las obreras de los campos y del linde del bosque. Cada una que mates es una boca que no llega a nuestro granero.",done:"Seis menos, y el resto se ha retirado entre los árboles. No huyeron... se replegaron, como soldados. Eso me asusta más que el propio enjambre."},
m0_3:{text:"Las hormigas soldado escupen un ácido que corroe el roble y el hierro por igual. Nuestra puerta este está medio destruida.\n\nEl viejo Teodric, nuestro alquimista, jura que puede preparar un ungüento contrario, pero necesita sus mandíbulas, frescas, con las glándulas de ácido dentro. Tráele lo que necesita. Cuida tus manos.",done:"Teodric abrió una y se quedó pálido. Hay ceniza en las glándulas: ceniza negra, de ningún fuego de este bosque. Alguien ha alimentado al enjambre con algo mucho más antiguo que el hambre."},
m0_4:{text:"Nuestros exploradores hallaron dónde crían: la Hondonada del Hormiguero, al norte del Pozo Lunar. El suelo es una alfombra de sacos de huevos, cada uno latiendo con esa misma ceniza negra.\n\nQuémalos. Si eclosiona la próxima camada, Hearthmoor caerá antes de la primera nevada.",done:"Los cazadores vieron el humo desde la muralla y vitorearon. Pero también vieron una figura de pie sobre el Altar Hueco, observando el fuego. Alta. Antinatural. No era una hormiga."},
m0_5:{text:"El Altar Hueco: una ruina más antigua que Hearthmoor. A los niños se les dice que nunca vayan allí. Ahora algo se alza sobre él, y el enjambre se mueve cuando se mueve.\n\nSe hace llamar Kzzrak, el Capataz de la Cría. Las hormigas no son sus hijos; son su arma. Acaba con él y tráeme lo que lleve encima.",done:"Un sello de hierro negro: una corona sin nada dentro.\n\nLa Corona Hueca. Mi abuela cantaba sobre ellos: hombres y mujeres que creen que la humanidad fue el gran error del mundo, y sirven a un rey sin corazón llamado Vharos. Quieren cada hogar frío y cada camino vacío. Los creía un cuento.\n\nY tu marca... las canciones la llaman el Aura Perdida. La última luz que responde cuando la Corona se alza."},
m0_6:{text:"El Capataz ha muerto, pero la Reina bajo el bosque sigue criando. Esa es una batalla para más adelante, cuando seas más fuerte.\n\nPrimero, este sello debe verlo gente con espadas y murallas. Llévalo al este, entre los árboles, al Alguacil Hollis en Briarford. Si la Corona Hueca se mueve aquí, se mueve en todas partes.\n\nVe con la luz, criatura. Hearthmoor te recordará.",done:"(El Alguacil Hollis da vueltas al sello en sus manos durante un largo rato.) ¿Te envía Maren? Entonces es verdad, y fui un necio al reírme de las viejas canciones."},
d_hive:{text:"Ahora estás listo para oírlo. Bajo el Bosque Susurrante, entre las raíces del árbol más viejo, yace una Colmena. En su corazón vive Myrmexa, la Reina de la Cría: antes una simple reina hormiga, ahora hinchada de hechicería Hueca hasta el tamaño de un granero.\n\nMientras viva, el enjambre volverá, estación tras estación, hasta que no quede aldea en el linde del bosque. La Corona la plantó aquí para desangrarnos poco a poco.\n\nBaja a la Colmena de la Cría. Mátala. Lleva pociones, muchas, y no dejes que te alcancen sus golpes.",done:"El bosque está... en calma. Por primera vez en un año oigo pájaros al alba. Lo que ella guardara allí abajo, quédatelo. Te lo has ganado, campeón de Hearthmoor."},
m1_1:{text:"El sello de Maren. Una corona vacía. (El Alguacil Hollis lo deja sobre la mesa como si pudiera morder.)\n\nYo también me reía de las viejas canciones. Hasta que los bandidos de mis caminos empezaron a pagar la cerveza con monedas negras marcadas con esa misma corona. Briarford es la última parada antes del Reino: cada carro de grano y hierro para Aurelion pasa por aquí, y últimamente la mitad nunca llega.\n\nAlguien quiere hambrienta a la capital. Quiero saber quién.",done:"Bien. Si Maren confía en ti, yo también. Thornvale es tuyo para recorrerlo; solo no te fíes de nadie que lleve moneda negra."},
m1_2:{text:"Los degolladores del camino del este antes cobraban peaje y dejaban pasar. Ahora queman los carros, matan a los conductores y dejan pudrirse la carga. Eso no es robo. Es un bloqueo.\n\nRedúcelos. Cada bandido que abatas es un carro que llega al Reino.",done:"Tres carros llegaron a la capital esta mañana. La primera vez en un mes. Los carreteros te invitarán a beber quieras o no."},
m1_3:{text:"Los jabalíes bajaron de las colinas esta primavera con ojos rojos y espuma en los colmillos. No se comen las cosechas: las pisotean, campo tras campo, como si alguien los pastoreara.\n\nTráeme sus colmillos. Los granjeros pagarán una recompensa, y haré que la bruja del seto examine qué los vuelve locos.",done:"La bruja hirvió un colmillo y el agua se volvió negra. La misma ceniza que Maren halló en sus hormigas. Lo que la Corona da a las bestias se extiende hacia el este."},
m1_4:{text:"Los bandidos asaltaron nuestro granero hace dos noches y se llevaron cada saco de grano de invierno a su campamento en las colinas. Si no lo recuperamos, Briarford morirá de hambre antes de la primavera, y también las familias del camino a Aurelion.\n\nEntra en el Campamento Bandido y trae el grano a casa.",done:"Encontraste los sacos... y órdenes clavadas en el poste del campamento. 'Quemad lo que no podáis llevar. La capital debe arrodillarse hambrienta.' Firmado con una corona que no tiene nada dentro."},
m1_5:{text:"El hombre que da esas órdenes se hace llamar Gallowsjack, el Rey Bandido. Fue verdugo en Aurelion hasta que el Rey indultó al hombre que debía ahorcar. Desde entonces odia la corona, y ahora ha encontrado otra a la que servir.\n\nSe esconde en las Ruinas de Thornkeep. Acaba con él y tráeme lo que lleve.",done:"Una bolsa llena de moneda Hueca y una carta sellada con cera negra. Va dirigida a alguien dentro de la corte real.\n\nEsto es más grande que unos bandidos, más grande que Briarford. La Corona tiene amigos en la propia sala del Rey."},
m1_6:{text:"No puedo enviarlo con un mensajero: quien esté en esa corte se aseguraría de que 'se perdiera'. Tiene que ir en mano, al propio Rey.\n\nCabalga hacia Aurelion. Pide audiencia con el rey Aldric y pon esa bolsa y esa carta en sus manos, en las de nadie más. Thornvale resistirá. Ve.",done:"(Los guardias del palacio intentan echarte, hasta que el Rey ve la moneda negra en tu mano y te llama él mismo.)"},
m2_1:{text:"Así que el héroe del Bosque Susurrante llega con moneda Hueca y las órdenes de un bandido. Arrodíllate si quieres; estoy cansado de ceremonias.\n\nSoy Aldric, y este es mi reino, lo que queda de él. Mi padre hablaba de la Corona Hueca: una fe que enseña que la humanidad es una enfermedad, y que lo más compasivo es acabar con ella. Sus sacerdotes predican ya abiertamente en mis caminos, y mis propios señores fingen no oír.\n\nEsa marca que llevas... mi hechicera de la corte daría su ojo izquierdo por verla. Yo prefiero verla en acción.",done:"No te estremeciste cuando los nombré. Bien. La mayoría de mi corte sí. Aurelion tiene murallas, mercaderes y diez mil almas que aún no saben lo que se avecina. Ayúdame a que siga así."},
m2_2:{text:"Los sectarios reúnen multitudes en los cruces. Dicen a los granjeros que su rey los ha abandonado, que la Corona les dará paz: la paz de la tumba.\n\nNo encarcelaré a nadie por escuchar. Pero los predicadores llevan dagas, y tres de mis recaudadores ya han muerto. Rompe el dominio de la secta sobre las tierras de la corona.",done:"Los cruces están en calma. Mis guardias hallaron listas en los cuerpos: nombres de cada familia que se negó a escuchar. Marcadas para ser 'deshechas'. Esas listas ya son ceniza. Gracias."},
m2_3:{text:"Unos saqueadores de tumbas entraron en el Viejo Cementerio y robaron los anillos con sello de mis antepasados. Un hurto menor, pensarías.\n\nPero un sello puede validar una orden real. Con los sellos de siete reyes, la Corona podría ordenar a media guarnición marchar a donde quisiera. Recupéralos.",done:"Siete sellos... y uno más que nunca había visto: el de Sir Varric, campeón de mi abuelo, que lo traicionó y fue enterrado bajo la ciudad encadenado. Esa tumba debía permanecer sellada para siempre."},
m2_4:{text:"Los sectarios levantan efigies en el Viejo Cementerio: reyes de paja con coronas vacías, empapados en sangre y brea. Mis sacerdotes dicen que cada una adelgaza el muro entre los vivos y lo que yace debajo.\n\nDerríbalas. Quémalas. Que mi pueblo vea que los ídolos de la Corona caen como cualquier otra paja.",done:"Los sacerdotes dicen que el cementerio 'respira mejor'. No sé qué significa, y no estoy seguro de querer saberlo."},
m2_5:{text:"Todo conduce a un hombre: el diácono Malvray, antes mi propio capellán. Celebra ritos en el Santuario Hundido bajo el viejo acueducto, y es la voz a la que obedecen los sectarios.\n\nBautizó a mi hija. Ahora ahogaría al reino. Silénciale, y tráeme lo que escriba.",done:"Su libro de cuentas. Páginas de nombres, pagos en oro negro... y órdenes, escritas con una letra fría y hermosa, firmadas solo con una corona vacía.\n\nEstán construyendo algo en las Tierras Quemadas. Una fundición, dice. La forja de Cindermaw. 'Para envenenar el pan de los hombres.'"},
m2_6:{text:"Las Tierras Quemadas fueron el granero de mi reino. Ahora nada crece allí, y mis exploradores vuelven tosiendo sangre. Si el libro de Malvray dice verdad, la Corona envenena la tierra misma para matarnos de hambre y criar monstruos de la escoria.\n\nLa capitana Sera Vex defiende el fuerte de Cinderwatch con lo que queda de la Guardia de Ascuas. Ve con ella. Dile que el rey no la ha olvidado, y que por fin llega ayuda.",done:"(La capitana Vex lee el sello del rey y suelta una risa corta y dura.) 'Llega ayuda.' Lleva dos años diciéndolo. Y enviaron... a ti. Bueno. Más te vale ser tan bueno como cuentan."},
d_crypt:{text:"Sir Varric el Perjuro. El campeón de mi abuelo, que abrió las puertas a los saqueadores por una bolsa de oro y fue enterrado vivo bajo esta ciudad con cadenas de plata.\n\nLos sectarios rompieron esas cadenas. Mis guardias oyen armaduras marchando de noche en las Catacumbas de Aurelion, y los muertos reales no descansan. Varric alza un ejército de reyes bajo mi propio trono.\n\nBaja. Devuélvelo a su tumba, y esta vez asegúrate de que se quede.",done:"Las campanas sonaron solas cuando cayó. Los sacerdotes lo llaman milagro. Yo lo llamo deuda, una que Aurelion te pagará."},
m3_1:{text:"Mira a tu alrededor. Esto era el granero del reino. Mi abuela cultivaba cebada donde está ese montón de escoria. Ahora el suelo es óxido, la lluvia quema la piel y los pozos saben a cobre.\n\nTodo es obra de las fundiciones Huecas. Sus chimeneas nunca paran. Envenenan la tierra para que las ciudades pasen hambre, y del veneno crían soldados.\n\nSoy Sera Vex. Bienvenido al fin del mundo.",done:"Viniste. Eso es más que la mayoría. La Guardia de Ascuas son cuarenta almas y tres ballestas que funcionan. Seas lo que seas, ahora eres nuestra mejor arma."},
m3_2:{text:"Los gólems de escoria son lo peor. Salen arrastrándose de las Chimeneas Negras, desecho fundido con piernas gracias a ritos Huecos, y caminan hasta enfriarse, quemando todo lo que tocan.\n\nDestrózalos antes de que lleguen a las granjas que aún intentan cultivar algo. Apunta a las grietas; ahí arden más los núcleos.",done:"Se rompen como cerámica cuando se enfrían. Bueno saberlo. La Guardia ya te llama 'el rompególems'. Que no se te suba a la cabeza."},
m3_3:{text:"Los diablillos de ceniza llevan núcleos ardientes, pequeños corazones de fuego de fundición. Mi herrera cree que puede convertirlos en bombas, y nos encantaría que la Corona probara su propio humo.\n\nTráeme núcleos. No los sostengas mucho rato; muerden.",done:"¡Ja! La herrera Odda lanzó uno contra un montón de escoria y ardió como una fiesta. Volvemos a tener dientes."},
m3_4:{text:"Los Pozos de Lodo se alimentan de válvulas de la fundición: residuos tan inmundos que matan a los pájaros que vuelan encima. Cada gota que se filtra en la tierra es otro campo perdido para siempre.\n\nSella esas válvulas. Todas. Aún no podemos sanar la tierra, pero podemos detener la hemorragia.",done:"El pozo de la Granja Cenicienta salió limpio esta mañana. Limpio. El viejo Haskin lloró en el cubo. Eso lo hiciste tú."},
m3_5:{text:"Los esclavos de la fundición son hombres y mujeres de las aldeas de Aurelion, raptados de noche y encadenados a los hornos. El capataz Grakk los hace trabajar hasta que caen, y luego los echa a la escoria.\n\nDomina las Chimeneas Negras. Mátalo, libera a quien puedas y tráeme lo que lleve. Si vamos a atacar la fundición, necesitamos saber cómo funciona.",done:"Planos de la fundición. No para armas: para máquinas. Máquinas de plaga, embaladas y enviadas al sur, al Pantano de Mirewood.\n\nNo solo quieren matarnos de hambre. Quieren enfermar a los que queden. Esto nunca fue una guerra por tierras. Es una guerra para acabar con nosotros."},
m3_6:{text:"Estos planos deben llegar a la Madre Ilse en Bogmere antes que las máquinas de plaga. Ella conoce el pantano y a sus brujas mejor que nadie.\n\nIría yo misma, pero si me voy, Cinderwatch cae. Así que te toca otra vez. Siempre te toca a ti, ¿verdad? Cabalga al sur. Y gracias; no lo digo a menudo.",done:"(La Madre Ilse toma los planos con manos temblorosas.) Máquinas de plaga... así que eso preparan las brujas. Siéntate, campeón. Será una noche larga."},
d_foundry:{text:"En el corazón de las Tierras Quemadas se alza la Fundición de Escoria y, en su corazón, Cindermaw el Artífice: un herrero Hueco que forjó los gólems, envenenó los ríos y construyó las máquinas de plaga con sus propias manos chamuscadas.\n\nMientras ardan sus hornos, nada volverá a crecer aquí. Entra en la Fundición de Escoria y apaga su fuego para siempre.\n\nLa Guardia de Ascuas defenderá la puerta tras de ti. Vuelve con nosotros.",done:"Las chimeneas se apagaron al alba. Todas. Por primera vez en dos años veo las estrellas sobre Cinderwatch. Bebe con nosotros esta noche, campeón. Mañana la tierra empieza a sanar."},
};

QTR.fr={
m0_1:{text:"Doucement, tu as dormi deux jours. Les chasseurs t'ont trouvé à l'orée de la forêt, froid comme une pierre de rivière, et cette marque sur ta paume luisait comme une braise.\n\nJe suis Maren, l'ancienne de Hearthmoor. Je n'ai pas encore de réponses, seulement des ennuis : le Bois-Murmure s'est retourné contre nous. Des fourmis grandes comme des poneys surgissent des arbres, et notre palissade a été bâtie contre les loups, pas contre ça.\n\nQui que tu aies été avant, Hearthmoor a besoin que tu sois quelqu'un maintenant.",done:"Tu tiens debout mieux que tu ne le devrais. Bien. La marque de ta main a flamboyé quand tu t'es levé ; j'ai lu de telles choses dans les vieux chants. Reste près du village pour l'instant. Il y a du travail, et peu de temps."},
m0_2:{text:"Regarde les champs : les fourmis ouvrières dépouillent un rang d'orge en une heure et l'emportent dans la forêt. Les fourmis ne planifient pas ainsi. Quelque chose les nourrit, les pousse.\n\nAbats les ouvrières dans les champs et à l'orée du bois. Chacune que tu tues est une bouche qui n'atteindra pas notre grenier.",done:"Six de moins, et les autres se sont retirées sous les arbres. Elles n'ont pas fui... elles ont reculé, comme des soldats. Cela m'effraie plus que l'essaim lui-même."},
m0_3:{text:"Les fourmis soldats crachent un acide qui ronge le chêne comme le fer. Notre porte est est à moitié détruite.\n\nLe vieux Teodric, notre alchimiste, jure pouvoir préparer un contre-onguent, mais il lui faut leurs mandibules, fraîches, avec les glandes à acide. Apporte-lui ce qu'il demande. Attention à tes mains.",done:"Teodric en a ouvert une et a pâli. Il y a de la cendre dans les glandes : une cendre noire, qui ne vient d'aucun feu de cette forêt. Quelqu'un nourrit l'essaim de quelque chose de bien plus ancien que la faim."},
m0_4:{text:"Nos éclaireurs ont trouvé où elles se reproduisent : le Creux de la Fourmilière, au nord du Puits-de-Lune. Le sol y est un tapis de sacs d'œufs, chacun palpitant de cette même cendre noire.\n\nBrûle-les. Si la prochaine couvée éclot, Hearthmoor tombera avant la première neige.",done:"Les chasseurs ont vu la fumée depuis les remparts et ont crié de joie. Mais ils ont aussi vu une silhouette debout sur l'Autel Creux, qui regardait le feu. Grande. Anormale. Pas une fourmi."},
m0_5:{text:"L'Autel Creux : une ruine plus ancienne que Hearthmoor. On dit aux enfants de ne jamais y aller. Désormais quelque chose s'y dresse, et l'essaim bouge quand il bouge.\n\nIl se fait appeler Kzzrak, le Surveillant de la Couvée. Les fourmis ne sont pas ses enfants ; elles sont son arme. Tue-le, et rapporte-moi ce qu'il porte.",done:"Un sceau de fer noir : une couronne, sans rien à l'intérieur.\n\nLa Couronne Creuse. Ma grand-mère chantait sur eux : des hommes et des femmes qui croient que l'humanité fut la grande erreur du monde, et qui servent un roi sans cœur nommé Vharos. Ils veulent chaque foyer froid et chaque route vide. Je les croyais une légende.\n\nEt ta marque... les chants l'appellent l'Aura Perdue. La dernière lumière qui répond quand la Couronne se lève."},
m0_6:{text:"Le Surveillant est mort, mais la Reine sous la forêt continue de pondre. C'est un combat pour plus tard, quand tu seras plus fort.\n\nD'abord, ce sceau doit être vu par des gens qui ont des épées et des murailles. Porte-le vers l'est, à travers les arbres, au Prévôt Hollis à Briarford. Si la Couronne Creuse bouge ici, elle bouge partout.\n\nVa avec la lumière, mon enfant. Hearthmoor se souviendra de toi.",done:"(Le Prévôt Hollis retourne longuement le sceau entre ses mains.) C'est Maren qui t'envoie ? Alors c'est vrai, et j'ai été un sot de rire des vieux chants."},
d_hive:{text:"Maintenant tu es prêt à l'entendre. Sous le Bois-Murmure, parmi les racines du plus vieil arbre, se trouve une Ruche. En son cœur vit Myrmexa, la Reine de la Couvée : jadis une simple reine fourmi, désormais gonflée de sorcellerie Creuse jusqu'à la taille d'une grange.\n\nTant qu'elle vivra, l'essaim reviendra, saison après saison, jusqu'à ce qu'il ne reste plus un village à l'orée de la forêt. La Couronne l'a plantée ici pour nous saigner lentement.\n\nDescends dans la Ruche de la Couvée. Tue-la. Emporte des potions, beaucoup, et ne te laisse pas surprendre par ses coups.",done:"La forêt est... calme. Pour la première fois depuis un an, j'entends les oiseaux à l'aube. Ce qu'elle gardait là-dessous, garde-le. Tu l'as mérité, champion de Hearthmoor."},
m1_1:{text:"Le sceau de Maren. Une couronne vide. (Le Prévôt Hollis le pose sur la table comme s'il pouvait mordre.)\n\nMoi aussi je riais des vieux chants. Puis les brigands de mes routes ont commencé à payer leur bière avec des pièces noires frappées de cette même couronne. Briarford est la dernière étape avant le Royaume : chaque charrette de grain et de fer pour Aurelion passe par ici, et dernièrement, la moitié n'arrive jamais.\n\nQuelqu'un veut affamer la capitale. Je veux savoir qui.",done:"Bien. Si Maren te fait confiance, moi aussi. Thornvale t'est ouvert ; ne te fie simplement à personne qui porte de la monnaie noire."},
m1_2:{text:"Les coupe-jarrets de la route de l'est prélevaient un péage et laissaient passer. Maintenant ils brûlent les charrettes, tuent les cochers et laissent pourrir la cargaison. Ce n'est pas du vol. C'est un blocus.\n\nÉclaircis leurs rangs. Chaque brigand abattu, c'est un chariot qui atteint le Royaume.",done:"Trois chariots ont atteint la capitale ce matin. Une première depuis un mois. Les cochers te paieront à boire, que tu le veuilles ou non."},
m1_3:{text:"Les sangliers sont descendus des collines ce printemps, les yeux rouges et l'écume aux défenses. Ils ne mangent pas les récoltes : ils les piétinent, champ après champ, comme si on les menait.\n\nRapporte-moi leurs défenses. Les fermiers paieront une prime, et je ferai examiner par la sorcière des haies ce qui les rend fous.",done:"La sorcière a fait bouillir une défense et l'eau est devenue noire. La même cendre que Maren a trouvée dans ses fourmis. Ce que la Couronne donne aux bêtes se répand vers l'est."},
m1_4:{text:"Les brigands ont pillé notre grenier il y a deux nuits et emporté chaque sac de grain d'hiver dans leur camp des collines. Si nous ne le récupérons pas, Briarford mourra de faim avant le printemps, et les familles de la route d'Aurelion aussi.\n\nEntre dans le Camp des Brigands et ramène le grain.",done:"Tu as trouvé les sacs... et des ordres cloués au poteau du camp. « Brûlez ce que vous ne pouvez emporter. La capitale doit s'agenouiller affamée. » Signé d'une couronne qui n'a rien à l'intérieur."},
m1_5:{text:"L'homme qui donne ces ordres se fait appeler Gallowsjack, le Roi des Brigands. Il était bourreau à Aurelion jusqu'à ce que le Roi gracie l'homme qu'il devait pendre. Depuis, il hait la couronne, et il en a trouvé une nouvelle à servir.\n\nIl se terre dans les Ruines de Thornkeep. Mets fin à ses jours et rapporte-moi ce qu'il porte.",done:"Une bourse pleine de monnaie Creuse et une lettre scellée de cire noire. Elle est adressée à quelqu'un au sein de la cour royale.\n\nC'est plus grand que des brigands, plus grand que Briarford. La Couronne a des amis dans la salle même du Roi."},
m1_6:{text:"Je ne peux pas l'envoyer par coursier : celui qui se cache à la cour s'assurerait qu'elle « se perde ». Elle doit être remise en main propre, au Roi lui-même.\n\nPars pour Aurelion. Demande audience au roi Aldric et remets cette bourse et cette lettre entre ses mains, et celles de personne d'autre. Thornvale tiendra. Va.",done:"(Les gardes du palais tentent de te renvoyer, jusqu'à ce que le Roi voie la pièce noire dans ta main et t'appelle lui-même.)"},
m2_1:{text:"Ainsi le héros du Bois-Murmure arrive avec de la monnaie Creuse et les ordres d'un brigand. Agenouille-toi si tu veux ; je suis las des cérémonies.\n\nJe suis Aldric, et voici mon royaume, ce qu'il en reste. Mon père parlait de la Couronne Creuse : une foi qui enseigne que l'humanité est une maladie, et que le plus charitable est d'y mettre fin. Leurs prêtres prêchent désormais ouvertement sur mes routes, et mes propres seigneurs font mine de ne pas entendre.\n\nCette marque que tu portes... ma sorcière de cour donnerait son œil gauche pour la voir. Je préfère la voir servir.",done:"Tu n'as pas tressailli quand je les ai nommés. Bien. La plupart de ma cour, si. Aurelion a des murailles, des marchands, et dix mille âmes qui ne savent pas encore ce qui arrive. Aide-moi à ce que cela continue."},
m2_2:{text:"Les sectaires rassemblent les foules aux carrefours. Ils disent aux fermiers que leur roi les a abandonnés, que la Couronne leur donnera la paix : la paix de la tombe.\n\nJe n'emprisonnerai personne pour avoir écouté. Mais les prêcheurs portent des dagues, et trois de mes collecteurs sont déjà morts. Brise l'emprise du culte sur les terres de la couronne.",done:"Les carrefours sont calmes. Mes gardes ont trouvé des listes sur les corps : les noms de chaque famille qui a refusé d'écouter. Marquées pour être « défaites ». Ces listes ne sont plus que cendres. Merci."},
m2_3:{text:"Des pilleurs de tombes ont forcé le Vieux Cimetière et volé les chevalières de mes ancêtres. Un larcin mineur, penserais-tu.\n\nMais une chevalière peut sceller un ordre royal. Avec les sceaux de sept rois, la Couronne pourrait faire marcher la moitié de mes garnisons où bon lui semble. Récupère-les.",done:"Sept chevalières... et une autre que je n'avais jamais vue : le sceau de Sir Varric, champion de mon grand-père, qui le trahit et fut enterré sous la ville enchaîné. Cette tombe devait rester scellée à jamais."},
m2_4:{text:"Les sectaires dressent des effigies dans le Vieux Cimetière : des rois de paille aux couronnes vides, trempés de sang et de poix. Mes prêtres disent que chacune amincit le mur entre les vivants et ce qui gît dessous.\n\nAbats-les. Brûle-les. Que mon peuple voie que les idoles de la Couronne tombent comme n'importe quelle paille.",done:"Les prêtres disent que le cimetière « respire mieux ». Je ne sais pas ce que cela veut dire, et je ne suis pas sûr de vouloir le savoir."},
m2_5:{text:"Tout mène à un homme : le diacre Malvray, autrefois mon propre chapelain. Il célèbre des rites au Sanctuaire Englouti sous le vieil aqueduc, et c'est la voix à laquelle obéissent les sectaires.\n\nIl a baptisé ma fille. Aujourd'hui il noierait le royaume. Fais-le taire, et rapporte-moi ce dans quoi il écrit.",done:"Son registre. Des pages de noms, des paiements en or noir... et des ordres, d'une écriture froide et belle, signés seulement d'une couronne vide.\n\nIls construisent quelque chose dans les Terres Brûlées. Une fonderie, dit-il. La forge de Cindermaw. « Pour empoisonner le pain des hommes. »"},
m2_6:{text:"Les Terres Brûlées étaient le grenier de mon royaume. Rien n'y pousse plus, et mes éclaireurs reviennent en crachant du sang. Si le registre de Malvray dit vrai, la Couronne empoisonne la terre même pour nous affamer et faire naître des monstres du laitier.\n\nLa capitaine Sera Vex tient le fort de Cinderwatch avec ce qui reste de la Garde des Braises. Rejoins-la. Dis-lui que le roi ne l'a pas oubliée, et que l'aide arrive enfin.",done:"(La capitaine Vex lit le sceau du roi et rit, d'un rire bref et dur.) « L'aide arrive. » Ça fait deux ans qu'il le dit. Et ils ont envoyé... toi. Eh bien. Tu as intérêt à être aussi bon que le disent les histoires."},
d_crypt:{text:"Sir Varric le Parjure. Le champion de mon grand-père, qui ouvrit les portes aux pillards pour une bourse d'or et fut enterré vivant sous cette ville dans des chaînes d'argent.\n\nLes sectaires ont brisé ces chaînes. Mes gardes entendent des armures marcher la nuit dans les Catacombes d'Aurelion, et les morts royaux ne reposent plus. Varric lève une armée de rois sous mon propre trône.\n\nDescends. Renvoie-le dans sa tombe, et cette fois, assure-toi qu'il y reste.",done:"Les cloches ont sonné d'elles-mêmes quand il est tombé. Les prêtres parlent de miracle. Moi, je parle de dette, une dette qu'Aurelion te rendra."},
m3_1:{text:"Regarde autour de toi. C'était le grenier du royaume. Ma grand-mère cultivait l'orge là où se dresse ce tas de laitier. Maintenant le sol est rouille, la pluie brûle la peau et les puits ont un goût de cuivre.\n\nTout cela est l'œuvre des fonderies Creuses. Leurs cheminées ne s'arrêtent jamais. Elles empoisonnent la terre pour affamer les villes, et du poison, elles font naître des soldats.\n\nJe suis Sera Vex. Bienvenue à la fin du monde.",done:"Tu es venu. C'est plus que la plupart. La Garde des Braises, c'est quarante âmes et trois arbalètes qui fonctionnent. Quoi que tu sois, tu es désormais notre meilleure arme."},
m3_2:{text:"Les golems de laitier sont le pire. Ils rampent hors des Cheminées Noires, des déchets fondus dotés de jambes par des rites Creux, et marchent jusqu'à refroidir, brûlant tout ce qu'ils touchent.\n\nBrise-les avant qu'ils n'atteignent les fermes qui tentent encore de faire pousser quelque chose. Vise les fissures ; c'est là que les cœurs brûlent le plus.",done:"Ils se brisent comme de la poterie une fois refroidis. Bon à savoir. La Garde t'appelle déjà « le briseur de golems ». Que ça ne te monte pas à la tête."},
m3_3:{text:"Les diablotins de cendre portent des cœurs ardents, de petits cœurs de feu de fonderie. Ma forgeronne pense pouvoir en faire des bombes incendiaires, et nous aimerions faire goûter à la Couronne sa propre fumée.\n\nRapporte-moi des cœurs. Ne les tiens pas trop longtemps ; ils mordent.",done:"Ha ! La forgeronne Odda en a lancé un sur un tas de laitier et il a flambé comme un feu de fête. Nous avons de nouveau des crocs."},
m3_4:{text:"Les Fosses de Boue sont alimentées par des vannes de la fonderie : des rejets si immondes qu'ils tuent les oiseaux qui les survolent. Chaque goutte qui s'infiltre dans la terre est un champ perdu à jamais.\n\nFerme ces vannes. Toutes. Nous ne pouvons pas encore guérir la terre, mais nous pouvons arrêter l'hémorragie.",done:"Le puits de la Ferme Cendrée a coulé clair ce matin. Clair. Le vieux Haskin a pleuré dans le seau. C'est grâce à toi."},
m3_5:{text:"Les esclaves de la fonderie sont des hommes et des femmes des villages d'Aurelion, enlevés la nuit et enchaînés aux fourneaux. Le surveillant Grakk les fait travailler jusqu'à ce qu'ils tombent, puis les jette au laitier.\n\nIl tient les Cheminées Noires. Tue-le, libère qui tu peux et rapporte-moi ce qu'il porte. Si nous voulons frapper la fonderie, il nous faut savoir comment elle fonctionne.",done:"Des plans de la fonderie. Pas pour des armes : pour des machines. Des machines à peste, mises en caisses et envoyées au sud, vers le Marais de Mirewood.\n\nIls ne veulent pas seulement nous affamer. Ils veulent rendre malades ceux qui restent. Ce n'a jamais été une guerre pour des terres. C'est une guerre pour nous anéantir."},
m3_6:{text:"Ces plans doivent parvenir à Mère Ilse à Bogmere avant les machines à peste. Elle connaît le marais et ses sorcières mieux que quiconque.\n\nJ'irais moi-même, mais si je pars, Cinderwatch tombe. Alors c'est encore toi. C'est toujours toi, hein ? Chevauche vers le sud. Et merci, je ne le dis pas souvent.",done:"(Mère Ilse prend les plans d'une main tremblante.) Des machines à peste... voilà donc ce que brassent les sorcières. Assieds-toi, champion. La nuit sera longue."},
d_foundry:{text:"Au cœur des Terres Brûlées se dresse la Fonderie de Laitier, et en son cœur, Cindermaw l'Artificier : un forgeron Creux qui a forgé les golems, empoisonné les rivières et construit les machines à peste de ses propres mains brûlées.\n\nTant que ses fourneaux brûleront, rien ne repoussera ici. Entre dans la Fonderie de Laitier et éteins son feu pour de bon.\n\nLa Garde des Braises tiendra la porte derrière toi. Reviens-nous.",done:"Les cheminées se sont éteintes à l'aube. Toutes. Pour la première fois en deux ans, je vois les étoiles au-dessus de Cinderwatch. Bois avec nous ce soir, champion. Demain, la terre commence à guérir."},
};

QTR.it={
m0_1:{text:"Piano, hai dormito due giorni. I cacciatori ti hanno trovato al limitare del bosco, freddo come una pietra di fiume, e quel segno sul palmo brillava come una brace.\n\nSono Maren, anziana di Hearthmoor. Non ho ancora risposte, solo guai: il Bosco Sussurrante si è rivoltato contro di noi. Formiche grandi come pony escono dagli alberi, e la nostra palizzata era fatta per i lupi, non per questo.\n\nChiunque tu fossi prima, Hearthmoor ha bisogno che tu sia qualcuno adesso.",done:"Stai in piedi meglio di quanto dovresti. Bene. Il segno sulla tua mano si è acceso quando ti sei alzato; ho letto di cose simili nelle vecchie canzoni. Resta vicino al villaggio per ora. C'è lavoro, e poco tempo."},
m0_2:{text:"Guarda i campi: le formiche operaie divorano un filare d'orzo in un'ora e lo portano nel bosco. Le formiche non pianificano così. Qualcosa le nutre, le guida.\n\nAbbatti le operaie nei campi e al limitare del bosco. Ognuna che uccidi è una bocca in meno nel nostro granaio.",done:"Sei in meno, e le altre si sono ritirate tra gli alberi. Non sono fuggite... si sono ritirate, come soldati. Questo mi spaventa più dello sciame stesso."},
m0_3:{text:"Le formiche soldato sputano un acido che corrode quercia e ferro allo stesso modo. Il nostro cancello est è mezzo distrutto.\n\nIl vecchio Teodric, il nostro alchimista, giura di poter preparare un unguento contrario, ma gli servono le loro mandibole, fresche, con le ghiandole acide dentro. Portagli ciò che gli serve. Attento alle mani.",done:"Teodric ne ha aperta una ed è impallidito. C'è cenere nelle ghiandole: cenere nera, di nessun fuoco di questo bosco. Qualcuno nutre lo sciame con qualcosa di molto più antico della fame."},
m0_4:{text:"I nostri esploratori hanno trovato dove si riproducono: la Conca del Formicaio, a nord del Pozzo Lunare. Il terreno è un tappeto di sacche di uova, ognuna pulsante della stessa cenere nera.\n\nBruciale. Se la prossima covata si schiude, Hearthmoor cade prima della prima neve.",done:"I cacciatori hanno visto il fumo dalle mura e hanno esultato. Ma hanno anche visto una figura in piedi sull'Altare Cavo, che guardava il fuoco. Alta. Sbagliata. Non era una formica."},
m0_5:{text:"L'Altare Cavo: una rovina più antica di Hearthmoor. Ai bambini diciamo di non andarci mai. Ora qualcosa sta lassù, e lo sciame si muove quando si muove lui.\n\nSi fa chiamare Kzzrak, il Sorvegliante della Covata. Le formiche non sono i suoi figli; sono la sua arma. Finiscilo e portami ciò che ha con sé.",done:"Un sigillo di ferro nero: una corona, con niente dentro.\n\nLa Corona Cava. Mia nonna cantava di loro: uomini e donne convinti che l'umanità sia stata il grande errore del mondo, al servizio di un re senza cuore chiamato Vharos. Vogliono ogni focolare spento e ogni strada vuota. Credevo fossero una leggenda.\n\nE il tuo segno... le canzoni lo chiamano l'Aura Perduta. L'ultima luce che risponde quando la Corona si leva."},
m0_6:{text:"Il Sorvegliante è morto, ma la Regina sotto il bosco continua a covare. Quella è una battaglia per dopo, quando sarai più forte.\n\nPrima, questo sigillo deve vederlo gente con spade e mura. Portalo a est, tra gli alberi, al Balivo Hollis a Briarford. Se la Corona Cava si muove qui, si muove ovunque.\n\nVa' con la luce, figliolo. Hearthmoor si ricorderà di te.",done:"(Il Balivo Hollis rigira a lungo il sigillo tra le mani.) Ti manda Maren? Allora è vero, e sono stato uno sciocco a ridere delle vecchie canzoni."},
d_hive:{text:"Ora sei pronto ad ascoltare. Sotto il Bosco Sussurrante, tra le radici dell'albero più antico, c'è un Alveare. Nel suo cuore vive Myrmexa, la Regina della Covata: un tempo una semplice regina formica, ora gonfia di stregoneria Cava fino alla grandezza di un granaio.\n\nFinché vive, lo sciame tornerà, stagione dopo stagione, finché non resterà un villaggio al limitare del bosco. La Corona l'ha messa qui per dissanguarci lentamente.\n\nScendi nell'Alveare della Covata. Uccidila. Porta pozioni, tante, e non farti prendere dai suoi colpi.",done:"Il bosco è... quieto. Per la prima volta in un anno sento gli uccelli all'alba. Ciò che lei custodiva laggiù, tienilo. Te lo sei guadagnato, campione di Hearthmoor."},
m1_1:{text:"Il sigillo di Maren. Una corona vuota. (Il Balivo Hollis lo posa sul tavolo come se potesse mordere.)\n\nAnch'io ridevo delle vecchie canzoni. Finché i briganti delle mie strade hanno cominciato a pagare la birra con monete nere coniate con questa stessa corona. Briarford è l'ultima tappa prima del Regno: ogni carro di grano e ferro per Aurelion passa di qui, e ultimamente metà non arriva mai.\n\nQualcuno vuole la capitale affamata. Voglio sapere chi.",done:"D'accordo. Se Maren si fida di te, mi fido anch'io. Thornvale è tua da percorrere; solo non fidarti di nessuno che porti monete nere."},
m1_2:{text:"I tagliagole della strada est chiedevano un pedaggio e lasciavano passare. Ora bruciano i carri, uccidono i conducenti e lasciano marcire il carico. Questo non è brigantaggio. È un blocco.\n\nRiduci il loro numero. Ogni brigante abbattuto è un carro che raggiunge il Regno.",done:"Tre carri sono arrivati in capitale stamattina. La prima volta in un mese. I conducenti ti offriranno da bere, che tu voglia o no."},
m1_3:{text:"I cinghiali sono scesi dalle colline questa primavera con occhi rossi e schiuma sulle zanne. Non mangiano i raccolti: li calpestano, campo dopo campo, come se fossero guidati.\n\nPortami le zanne. I contadini pagheranno una taglia, e manderò la strega delle siepi a vedere cosa li fa impazzire.",done:"La strega ha bollito una zanna e l'acqua è diventata nera. La stessa cenere che Maren ha trovato nelle formiche. Ciò che la Corona dà alle bestie si sta diffondendo verso est."},
m1_4:{text:"I briganti hanno assaltato il nostro granaio due notti fa e hanno portato ogni sacco di grano invernale al loro accampamento sulle colline. Se non lo recuperiamo, Briarford farà la fame prima della primavera, e anche le famiglie lungo la strada per Aurelion.\n\nEntra nell'Accampamento dei Briganti e riporta a casa il grano.",done:"Hai trovato i sacchi... e degli ordini inchiodati al palo dell'accampamento. 'Bruciate ciò che non potete portare. La capitale deve inginocchiarsi affamata.' Firmato con una corona senza niente dentro."},
m1_5:{text:"L'uomo che dà quegli ordini si chiama Gallowsjack, il Re dei Briganti. Era boia ad Aurelion finché il Re non graziò l'uomo che doveva impiccare. Da allora odia la corona, e ora ne ha trovata un'altra da servire.\n\nSi è rintanato nelle Rovine di Thornkeep. Finiscilo e portami ciò che ha con sé.",done:"Una borsa piena di monete Cave e una lettera sigillata con cera nera. È indirizzata a qualcuno dentro la corte reale.\n\nQuesto è più grande dei briganti, più grande di Briarford. La Corona ha amici nella sala stessa del Re."},
m1_6:{text:"Non posso mandarla con un messaggero: chiunque sia in quella corte la farebbe 'smarrire'. Deve andare di persona, al Re in persona.\n\nCavalca verso Aurelion. Chiedi udienza a re Aldric e metti quella borsa e quella lettera nelle sue mani, di nessun altro. Thornvale resisterà. Va'.",done:"(Le guardie del palazzo cercano di mandarti via, finché il Re non vede la moneta nera nella tua mano e ti chiama lui stesso.)"},
